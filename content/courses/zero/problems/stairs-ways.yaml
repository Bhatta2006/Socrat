id: stairs-ways
title: Ways to climb
concepts: [recursion]
difficulty: medium
statement: |
  You climb a staircase of `n` steps, taking either **1 or 2** steps at a time. In how many
  different ways can you reach the top?

  The answer grows quickly, so print it modulo 1,000,000,007.
input_format: One whole number n.
output_format: The number of ways modulo 1000000007.
constraints:
  - 1 ≤ n ≤ 100000
examples:
  - input: "3"
    output: "3"
    explanation: 1+1+1, 1+2 and 2+1.
  - input: "5"
    output: "8"
hints:
  - Think about your very last move onto step n. Where could you have been just before it?
  - The ways to reach n combine the ways to reach two smaller steps. What are the base cases?
  - ways(n) = ways(n-1) + ways(n-2). For n up to 100000, compute it bottom-up in a loop (or memoize) to avoid deep recursion.
approach: |
  The last move is 1 or 2 steps, so ways(n) = ways(n−1) + ways(n−2) with ways(0) = ways(1) = 1.
  Compute iteratively from the bottom, keeping only the last two values, mod 1e9+7. A naive
  recursive version is exponential, and deep recursion overflows the stack at n = 100000.
reference: |
  n = int(input())
  MOD = 10**9 + 7
  a, b = 1, 1
  for _ in range(n - 1):
      a, b = b, (a + b) % MOD
  print(b)
generator: |
  def cases(rng):
      for value in [1, 2, 10, 50, 100000, 99999]:
          yield str(value)
      for _ in range(5):
          yield str(rng.randint(1, 100000))
