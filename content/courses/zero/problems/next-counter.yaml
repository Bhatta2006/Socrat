id: next-counter
title: One more visitor
concepts:
- variables-and-types
difficulty: easy
statement: The starter code has already read one sensor reading into n. Your only
  task is to update the counter for one new visitor and print the new value.
input_format: One integer n, already read by the starter code.
output_format: Print the requested integer followed by a newline.
constraints:
- 0 <= n <= 1000000
examples:
- input: '4

    '
  output: '5

    '
hints:
- The starter has already read the value into n.
- Use your language's output instruction.
approach: Use the scaffolded input value and print n after incrementing it by one.
reference: 'n=int(input())

  print(n+1)

  '
