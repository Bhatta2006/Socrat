id: club-entry
title: Who may join the coding club?
concepts: [boolean-logic]
difficulty: easy
statement: |
  The school coding club accepts a student when **all** of these hold:

  - the student is in grade 8 or higher, **or** a teacher has recommended them;
  - the student has finished the starter course;
  - the student is **not** already in more than two other clubs.

  For each student, print `YES` if they may join and `NO` otherwise.
input_format: |
  The first line has q, the number of students. Each of the next q lines has four values:
  grade, recommended (0 or 1), finished (0 or 1) and the number of other clubs.
output_format: q lines, each YES or NO.
constraints:
  - 1 ≤ q ≤ 1000
  - 5 ≤ grade ≤ 12
  - 0 ≤ other clubs ≤ 10
examples:
  - input: "3\n9 0 1 2\n6 1 1 0\n10 1 0 0"
    output: "YES\nYES\nNO"
hints:
  - Write each rule as a separate true-or-false expression first.
  - '"More than two" means 3 or more. Which comparison expresses "not more than two"?'
  - (grade >= 8 or recommended == 1) and finished == 1 and clubs <= 2
approach: |
  For each line combine the three conditions with and, using or inside the first one:
  (grade >= 8 or rec == 1) and fin == 1 and clubs <= 2.
reference: |
  import sys
  data = sys.stdin.read().split()
  q = int(data[0])
  out = []
  for i in range(q):
      grade, rec, fin, clubs = map(int, data[1 + 4 * i: 5 + 4 * i])
      ok = (grade >= 8 or rec == 1) and fin == 1 and clubs <= 2
      out.append("YES" if ok else "NO")
  print("\n".join(out))
brute: |
  q = int(input())
  for _ in range(q):
      grade, rec, fin, clubs = map(int, input().split())
      answer = "NO"
      if fin == 1:
          if clubs <= 2:
              if grade >= 8:
                  answer = "YES"
              elif rec == 1:
                  answer = "YES"
      print(answer)
generator: |
  def cases(rng):
      rows = [f"{g} {r} {f} {c}" for g in (7, 8) for r in (0, 1) for f in (0, 1) for c in (2, 3)]
      yield f"{len(rows)}\n" + "\n".join(rows)
      for _ in range(5):
          q = rng.randint(1, 1000)
          rows = [f"{rng.randint(5, 12)} {rng.randint(0, 1)} {rng.randint(0, 1)} {rng.randint(0, 10)}" for _ in range(q)]
          yield f"{q}\n" + "\n".join(rows)
