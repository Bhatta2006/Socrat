id: row-and-column-sums
title: Row and column totals
concepts: [grids]
difficulty: easy
statement: |
  A shop records daily sales in a grid: `r` rows (products) and `c` columns (days). Print the
  total of every row on one line, then the total of every column on the next line.
input_format: |
  The first line contains r and c. Each of the next r lines contains c whole numbers.
output_format: |
  Two lines: the r row totals, then the c column totals, each separated by spaces.
constraints:
  - 1 ≤ r, c ≤ 500
  - -10^6 ≤ value ≤ 10^6
examples:
  - input: "2 3\n1 2 3\n4 5 6"
    output: "6 15\n5 7 9"
hints:
  - Read the grid into a list of rows first. How do you get one row's total?
  - A column's total uses the same position j from every row.
  - Row totals are sum(row) for each row; column j's total is the sum of grid[i][j] over all rows i.
approach: |
  Store the grid as a list of lists. Row totals: sum each inner list. Column totals: for each j,
  sum grid[i][j] over i (or keep a running column total while reading). O(r·c).
reference: |
  import sys
  data = sys.stdin.buffer.read().split()
  r, c = int(data[0]), int(data[1])
  grid = [list(map(int, data[2 + i * c: 2 + (i + 1) * c])) for i in range(r)]
  rows = [sum(row) for row in grid]
  cols = [0] * c
  for row in grid:
      for j, value in enumerate(row):
          cols[j] += value
  print(" ".join(map(str, rows)))
  print(" ".join(map(str, cols)))
brute: |
  r, c = map(int, input().split())
  grid = [list(map(int, input().split())) for _ in range(r)]
  print(" ".join(str(sum(grid[i][j] for j in range(c))) for i in range(r)))
  print(" ".join(str(sum(grid[i][j] for i in range(r))) for j in range(c)))
generator: |
  def cases(rng):
      yield "1 1\n-7"
      yield "1 4\n1 2 3 4"
      yield "3 1\n1\n2\n3"
      r = c = 500
      yield f"{r} {c}\n" + "\n".join(" ".join(str(rng.randint(-10**6, 10**6)) for _ in range(c)) for _ in range(r))
      for _ in range(4):
          r, c = rng.randint(1, 30), rng.randint(1, 30)
          yield f"{r} {c}\n" + "\n".join(" ".join(str(rng.randint(-9, 9)) for _ in range(c)) for _ in range(r))
