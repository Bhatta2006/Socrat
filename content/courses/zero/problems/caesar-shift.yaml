id: caesar-shift
title: Caesar cipher
concepts: [strings]
difficulty: medium
statement: |
  Encrypt a message with a Caesar cipher: shift every **lowercase** letter forward by `k`
  positions in the alphabet, wrapping from `z` back to `a`. Leave every other character
  unchanged.

  With k = 3, `a` becomes `d`, `x` becomes `a`, and `hello, world` becomes `khoor, zruog`.
input_format: |
  The first line contains k. The second line contains the message (it may contain spaces).
output_format: The encrypted message.
constraints:
  - 0 ≤ k ≤ 1000
  - The message has 1 to 100000 characters.
examples:
  - input: "3\nhello, world"
    output: "khoor, zruog"
  - input: "27\nxyz"
    output: "yza"
    explanation: Shifting by 27 is the same as shifting by 1.
hints:
  - How can you turn a letter into a number from 0 to 25, and back again?
  - After adding k, what operation makes the number wrap around past 25?
  - "new position = (letter - 'a' + k) % 26; convert back by adding 'a'. Skip non-lowercase characters."
approach: |
  For each character c: if it is between 'a' and 'z', compute (c - 'a' + k) % 26 + 'a';
  otherwise keep c. Build the result with join (Python), StringBuilder (Java) or += (C++).
reference: |
  k = int(input())
  s = input()
  out = []
  for ch in s:
      if "a" <= ch <= "z":
          out.append(chr((ord(ch) - 97 + k) % 26 + 97))
      else:
          out.append(ch)
  print("".join(out))
generator: |
  def cases(rng):
      yield "0\nunchanged text"
      yield "26\nabc"
      yield "1000\nzebra Zebra 42"
      letters = "abcdefghijklmnopqrstuvwxyz ,.ABC"
      yield f"{rng.randint(0, 1000)}\n" + "".join(rng.choice(letters) for _ in range(100000)).strip() + "a"
      for _ in range(6):
          yield f"{rng.randint(0, 60)}\n" + "".join(rng.choice(letters) for _ in range(rng.randint(1, 50))).strip() + "z"
