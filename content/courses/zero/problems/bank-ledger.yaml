id: bank-ledger
title: Bank ledger
concepts: [classes-and-objects]
difficulty: medium
statement: |
  Model bank accounts with a class. Process `q` operations in order:

  - `open NAME` — create an account for NAME with balance 0 (names are unique; an existing
    name is ignored);
  - `deposit NAME X` — add X;
  - `withdraw NAME X` — subtract X **only if** the balance is at least X; otherwise print
    `insufficient NAME`;
  - `balance NAME` — print `NAME BALANCE`.

  Every operation refers to an account that has been opened.
input_format: |
  The first line contains q. Each of the next q lines contains one operation.
output_format: One line for every `balance` query and every rejected withdrawal, in order.
constraints:
  - 1 ≤ q ≤ 100000
  - 1 ≤ X ≤ 10^9
  - Names are 1 to 10 lowercase letters.
examples:
  - input: "6\nopen ada\ndeposit ada 50\nwithdraw ada 80\nwithdraw ada 20\nbalance ada\nopen ada"
    output: "insufficient ada\nada 30"
hints:
  - What data does one account need, and which operations must protect its rules?
  - How do you find the right account object quickly from its name?
  - Make an Account class with deposit and withdraw methods; keep a map from name to Account; parse each line and dispatch.
approach: |
  Account holds the balance; withdraw returns false (and does nothing) when funds are
  insufficient. A map from name to Account finds objects in O(1). Balances can reach about
  10^14, so use 64-bit integers.
reference: |
  import sys
  class Account:
      def __init__(self):
          self.balance = 0
      def deposit(self, x):
          self.balance += x
      def withdraw(self, x):
          if self.balance < x:
              return False
          self.balance -= x
          return True
  lines = sys.stdin.read().split("\n")
  q = int(lines[0])
  accounts = {}
  out = []
  for line in lines[1:1 + q]:
      parts = line.split()
      op, name = parts[0], parts[1]
      if op == "open":
          accounts.setdefault(name, Account())
      elif op == "deposit":
          accounts[name].deposit(int(parts[2]))
      elif op == "withdraw":
          if not accounts[name].withdraw(int(parts[2])):
              out.append(f"insufficient {name}")
      else:
          out.append(f"{name} {accounts[name].balance}")
  print("\n".join(out))
generator: |
  def cases(rng):
      yield "3\nopen x\nwithdraw x 1\nbalance x"
      yield "4\nopen a\nopen b\ndeposit b 5\nbalance a"
      def make(q, names):
          ops = [f"open {n}" for n in names]
          while len(ops) < q:
              name = rng.choice(names)
              kind = rng.random()
              if kind < 0.35:
                  ops.append(f"deposit {name} {rng.randint(1, 10**9)}")
              elif kind < 0.7:
                  ops.append(f"withdraw {name} {rng.randint(1, 10**9)}")
              else:
                  ops.append(f"balance {name}")
          return f"{len(ops)}\n" + "\n".join(ops)
      yield make(60000, ["ada", "alan", "grace", "linus", "barbara"])
      for _ in range(6):
          yield make(rng.randint(3, 25), ["ab", "cd", "ef"])
