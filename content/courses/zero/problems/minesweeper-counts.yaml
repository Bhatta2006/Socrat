id: minesweeper-counts
title: Minesweeper numbers
concepts: [grids]
difficulty: medium
statement: |
  You are given a Minesweeper board where `*` is a mine and `.` is a safe cell. Replace
  every safe cell with the number of mines among its **eight** neighbours (including
  diagonals). Mines stay as `*`.
input_format: |
  The first line contains r and c. Then r lines follow, each with c characters (`*` or `.`).
output_format: The r lines of the completed board.
constraints:
  - 1 ≤ r, c ≤ 300
examples:
  - input: "3 4\n*...\n..*.\n...."
    output: "*211\n12*1\n0111"
  - input: "1 1\n."
    output: "0"
hints:
  - For one safe cell, which cells do you need to look at, and how many are there?
  - Direction arrays with 8 entries let one small loop visit every neighbour. What must you check first?
  - For each safe cell, loop over the 8 directions, skip positions outside the grid, and count '*' cells.
approach: |
  Read the grid as strings. For every cell: if it is '*', output '*'; otherwise count mines
  among the 8 neighbours using dr/dc arrays with bounds checks. Build each output row as a
  string. Work is about r · c · 8.
reference: |
  import sys
  data = sys.stdin.read().split()
  r, c = int(data[0]), int(data[1])
  g = data[2:2 + r]
  out = []
  for i in range(r):
      row = []
      for j in range(c):
          if g[i][j] == "*":
              row.append("*")
              continue
          count = 0
          for di in (-1, 0, 1):
              for dj in (-1, 0, 1):
                  if (di or dj) and 0 <= i + di < r and 0 <= j + dj < c and g[i + di][j + dj] == "*":
                      count += 1
          row.append(str(count))
      out.append("".join(row))
  print("\n".join(out))
generator: |
  def cases(rng):
      yield "2 2\n**\n**"
      yield "1 5\n.*.*."
      for size, density in [(300, 0.2), (300, 0.5), (50, 0.1)]:
          yield f"{size} {size}\n" + "\n".join(
              "".join("*" if rng.random() < density else "." for _ in range(size)) for _ in range(size)
          )
      for _ in range(5):
          r, c = rng.randint(1, 8), rng.randint(1, 8)
          yield f"{r} {c}\n" + "\n".join(
              "".join("*" if rng.random() < 0.3 else "." for _ in range(c)) for _ in range(r)
          )
