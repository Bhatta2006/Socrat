id: time-convert
title: Minutes to hours
concepts: [input-and-arithmetic]
difficulty: easy
statement: |
  A learner studied for `m` minutes in total this week. Convert that into whole hours and
  remaining minutes.

  Print the result as `H M`, where `H` is the number of full hours and `M` is the minutes
  left over.
input_format: One whole number m.
output_format: Two whole numbers H and M separated by a space.
constraints:
  - 0 ≤ m ≤ 1000000
examples:
  - input: "135"
    output: "2 15"
    explanation: 135 minutes is 2 full hours (120 minutes) plus 15 minutes.
  - input: "59"
    output: "0 59"
hints:
  - How many minutes are in one hour, and how many complete hours fit into m?
  - One operator tells you how many whole groups fit; another tells you what is left over.
  - Whole-number division gives the hours; the remainder after dividing by 60 gives the minutes.
approach: |
  H = m divided by 60 using whole-number division (// in Python, / with ints in C++/Java),
  and M = m % 60. Print them separated by a space.
reference: |
  m = int(input())
  print(m // 60, m % 60)
generator: |
  def cases(rng):
      for value in [0, 60, 61, 119, 120, 1000000, 999999, 3600]:
          yield str(value)
      for _ in range(6):
          yield str(rng.randint(0, 1000000))
