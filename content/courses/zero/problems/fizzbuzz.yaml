id: fizzbuzz
title: FizzBuzz
concepts: [for-loops]
difficulty: easy
statement: |
  The classic warm-up. For every whole number `i` from 1 to `n`, print one line:

  - `FizzBuzz` if `i` is divisible by both 3 and 5;
  - `Fizz` if `i` is divisible by 3 only;
  - `Buzz` if `i` is divisible by 5 only;
  - otherwise the number `i` itself.
input_format: One whole number n.
output_format: n lines as described.
constraints:
  - 1 ≤ n ≤ 10000
examples:
  - input: "5"
    output: |
      1
      2
      Fizz
      4
      Buzz
  - input: "15"
    output: |
      1
      2
      Fizz
      4
      Buzz
      Fizz
      7
      8
      Fizz
      Buzz
      11
      Fizz
      13
      14
      FizzBuzz
hints:
  - Which loop runs once for every number from 1 to n?
  - Inside the loop you have four possible outputs. Which one must be checked first, and why?
  - Check divisibility by 15 (both 3 and 5) before checking 3 or 5 alone.
approach: |
  Loop i from 1 to n inclusive. Test i % 15 == 0 first, then i % 3 == 0, then i % 5 == 0,
  otherwise print i. Testing the combined case first prevents it from being caught by the
  "Fizz" branch.
reference: |
  n = int(input())
  out = []
  for i in range(1, n + 1):
      if i % 15 == 0:
          out.append("FizzBuzz")
      elif i % 3 == 0:
          out.append("Fizz")
      elif i % 5 == 0:
          out.append("Buzz")
      else:
          out.append(str(i))
  print("\n".join(out))
generator: |
  def cases(rng):
      for value in [1, 3, 30, 100, 10000]:
          yield str(value)
      for _ in range(4):
          yield str(rng.randint(1, 500))
