id: increasing-steps
title: Longest rising streak
concepts: [lists]
difficulty: medium
statement: |
  A learner records how many problems they solved each day for `n` days. Find the length
  of the longest run of **consecutive days** in which every day was strictly better than
  the day before.

  A single day counts as a run of length 1.
input_format: |
  The first line contains n. The second line contains n whole numbers.
output_format: The length of the longest strictly increasing run of consecutive days.
constraints:
  - 1 ≤ n ≤ 200000
  - 0 ≤ value ≤ 10^9
examples:
  - input: "7\n1 2 2 3 4 5 1"
    output: "4"
    explanation: Days 3–6 (2, 3, 4, 5) form the longest rising run.
  - input: "3\n5 4 3"
    output: "1"
hints:
  - When you move from one day to the next, what decides whether the current run continues?
  - Track two numbers as you scan — the length of the run you are in, and the best length seen.
  - For i from 1, if a[i] > a[i-1] increase the current run, otherwise reset it to 1; update the best each step.
approach: |
  Scan once. current = 1, best = 1. For each i ≥ 1: if a[i] > a[i − 1] then current += 1
  else current = 1; best = max(best, current). Print best. One pass, O(n).
reference: |
  import sys
  data = sys.stdin.read().split()
  n = int(data[0])
  a = list(map(int, data[1:1 + n]))
  best = cur = 1
  for i in range(1, n):
      cur = cur + 1 if a[i] > a[i - 1] else 1
      best = max(best, cur)
  print(best)
generator: |
  def cases(rng):
      yield "1\n7"
      yield "5\n1 2 3 4 5"
      yield "6\n3 3 3 3 3 3"
      n = 200000
      yield f"{n}\n" + " ".join(str(i) for i in range(n))
      yield f"{n}\n" + " ".join(str(rng.randint(0, 10)) for _ in range(n))
      for _ in range(6):
          n = rng.randint(1, 40)
          yield f"{n}\n" + " ".join(str(rng.randint(0, 6)) for _ in range(n))
