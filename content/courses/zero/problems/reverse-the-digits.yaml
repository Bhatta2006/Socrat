id: reverse-the-digits
title: Reverse the digits
concepts: [while-loops]
difficulty: easy
statement: |
  Given a positive whole number `n`, print the number you get by writing its digits in the
  opposite order. Leading zeros of the result are dropped, so 1200 becomes 21.

  Solve it with arithmetic, not by turning the number into text.
input_format: One whole number n.
output_format: The reversed number.
constraints:
  - 1 ≤ n ≤ 10^18
examples:
  - input: "4071"
    output: "1704"
  - input: "1200"
    output: "21"
hints:
  - Which operation gives you the last digit, and which removes it?
  - If you have built the reversed number r so far, how do you append one more digit d to its right?
  - Loop while n > 0 setting r = r * 10 + n % 10 and n = n // 10.
approach: |
  Start with r = 0. While n > 0: r = r * 10 + n % 10; n //= 10. Leading zeros vanish because r
  starts at 0. Every n below 10^18 has at most 18 digits, so its reverse is below 10^18 too, and
  10^18 reverses to 1: a 64-bit integer (long long / long) is enough in C++ and Java.
reference: |
  n = int(input())
  r = 0
  while n > 0:
      r = r * 10 + n % 10
      n //= 10
  print(r)
brute: |
  print(int(input().strip()[::-1]))
generator: |
  def cases(rng):
      for n in [1, 10, 1200, 10**18, 999999999999999999, 123456789012345678, 7]:
          yield str(n)
      for _ in range(6):
          yield str(rng.randint(1, 10**18))
small_generator: |
  def cases(rng):
      for n in range(1, 301):
          yield str(n)
