id: times-table
title: A times table
concepts: [for-loops]
difficulty: easy
statement: |
  Print the times table of `n` from `n x 1` up to `n x m`, one line each, in the form
  `n x i = product`.
input_format: Two whole numbers n and m on one line.
output_format: m lines, the i-th one is `n x i = n·i`.
constraints:
  - -1000 ≤ n ≤ 1000
  - 1 ≤ m ≤ 1000
examples:
  - input: "7 3"
    output: "7 x 1 = 7\n7 x 2 = 14\n7 x 3 = 21"
hints:
  - The number of lines is known before you start. Which kind of loop fits that?
  - Your loop variable should take the values 1, 2, …, m. What range gives exactly those?
  - for i in range(1, m + 1) print f"{n} x {i} = {n * i}".
approach: |
  Loop i from 1 to m inclusive (range(1, m + 1)) and print n, i and n * i in the required format.
reference: |
  n, m = map(int, input().split())
  for i in range(1, m + 1):
      print(f"{n} x {i} = {n * i}")
brute: |
  n, m = map(int, input().split())
  i = 1
  lines = []
  while i <= m:
      total = 0
      for _ in range(i):
          total += n
      lines.append(str(n) + " x " + str(i) + " = " + str(total))
      i += 1
  print("\n".join(lines))
generator: |
  def cases(rng):
      for n, m in [(1, 1), (0, 5), (-12, 4), (1000, 1000), (-1000, 1000)]:
          yield f"{n} {m}"
      for _ in range(6):
          yield f"{rng.randint(-1000, 1000)} {rng.randint(1, 1000)}"
small_generator: |
  def cases(rng):
      for _ in range(200):
          yield f"{rng.randint(-20, 20)} {rng.randint(1, 12)}"
