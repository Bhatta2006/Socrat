id: mirror-phrase
title: Mirror phrase
concepts: [strings]
difficulty: easy
statement: |
  A phrase is a *mirror phrase* if it reads the same forwards and backwards once you ignore
  everything except letters and digits, and ignore the difference between capital and small
  letters. "Was it a car or a cat I saw?" is one.

  Print `YES` if the line is a mirror phrase and `NO` otherwise. A line with no letters or
  digits counts as a mirror phrase.
input_format: One line of text.
output_format: YES or NO.
constraints:
  - The line has 1 to 10^5 printable ASCII characters.
examples:
  - input: "Was it a car or a cat I saw?"
    output: "YES"
  - input: "Step on no pets 2"
    output: "NO"
hints:
  - First make a cleaned-up version of the text that keeps only what matters.
  - Which string methods tell you whether a character is a letter or digit, and make it lower-case?
  - Build clean = [ch.lower() for ch in line if ch.isalnum()] and compare it with its reverse.
approach: |
  Keep only alphanumeric characters, lower-cased; the phrase is a mirror phrase exactly when this
  cleaned sequence equals its reverse. Two indices moving inward also work without extra memory.
reference: |
  line = input()
  clean = [ch.lower() for ch in line if ch.isascii() and ch.isalnum()]
  print("YES" if clean == clean[::-1] else "NO")
brute: |
  line = input()
  keep = "abcdefghijklmnopqrstuvwxyz0123456789"
  clean = ""
  for ch in line.lower():
      if ch in keep:
          clean += ch
  ok = True
  for i in range(len(clean)):
      if clean[i] != clean[len(clean) - 1 - i]:
          ok = False
  print("YES" if ok else "NO")
generator: |
  def cases(rng):
      yield "?!"
      yield "A man, a plan, a canal: Panama"
      yield "No lemon, no melon."
      half = "".join(rng.choice("abcXYZ019 ,.") for _ in range(50000))
      yield half + half[::-1]
      yield half + "q" + half[::-1].replace("a", "b")
      for _ in range(5):
          yield "".join(rng.choice("abAB 1!") for _ in range(rng.randint(1, 30)))
small_generator: |
  def cases(rng):
      for _ in range(300):
          s = "".join(rng.choice("aAbB1 ,") for _ in range(rng.randint(1, 6)))
          yield s if s.strip() else "a"
