id: vowel-count
title: Count the vowels
concepts: [strings]
difficulty: easy
statement: |
  Count how many vowels appear in a line of text. The vowels are `a e i o u`, in either
  upper or lower case. Other characters (letters, digits, spaces, punctuation) are not
  vowels.
input_format: One line of text (it may contain spaces).
output_format: The number of vowels.
constraints:
  - The line has between 1 and 100000 characters.
examples:
  - input: Hello World
    output: "3"
  - input: "Rhythm 123"
    output: "0"
hints:
  - How do you visit every character in the line exactly once?
  - What is a simple way to handle both "A" and "a" with one check?
  - Loop over the characters, convert each to lowercase, and count it if it is one of "aeiou".
approach: |
  Read the whole line, loop over its characters, lowercase each one and increase a counter
  when it is in the set of vowels. Remember to read the full line in C++ (getline) and Java
  (nextLine) because the text may contain spaces.
reference: |
  s = input()
  print(sum(1 for ch in s.lower() if ch in "aeiou"))
generator: |
  def cases(rng):
      yield "AEIOU aeiou"
      yield "xyz"
      yield "a"
      alphabet = "abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789 ,.!?"
      yield "".join(rng.choice(alphabet) for _ in range(100000)).strip() or "a"
      for _ in range(6):
          yield "".join(rng.choice(alphabet) for _ in range(rng.randint(1, 60))).strip() or "b"
