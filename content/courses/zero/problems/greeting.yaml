id: greeting
title: Personal greeting
concepts: [input-and-arithmetic]
difficulty: easy
statement: |
  Socrat wants to greet every new learner by name.

  Read the learner's name and print a greeting in exactly this format:

  `Hello, <name>! Welcome to Socrat.`
input_format: One line containing the name (letters and spaces only, 1 to 40 characters).
output_format: The greeting on a single line, exactly as shown.
constraints:
  - The name contains only letters and spaces.
examples:
  - input: Ada
    output: Hello, Ada! Welcome to Socrat.
  - input: Grace Hopper
    output: Hello, Grace Hopper! Welcome to Socrat.
hints:
  - What does your program need to remember after reading the input?
  - The output is three pieces glued together — fixed text, the name, more fixed text.
  - Read the whole line (names can contain spaces), then print the pieces joined in order.
approach: |
  Read the entire line into a variable, then print "Hello, " + name + "! Welcome to Socrat."
  In C++ use getline so names with spaces are read completely.
reference: |
  name = input().strip()
  print(f"Hello, {name}! Welcome to Socrat.")
generator: |
  def cases(rng):
      names = ["Linus", "Ada Lovelace", "X", "Margaret Hamilton", "Alan", "Katherine Johnson",
               "Bo", "Barbara Liskov", "Dennis Ritchie", "Tim"]
      for name in names:
          yield name
starter:
  python: |
    name = input()
    # Print the greeting
  cpp: |
    #include <iostream>
    #include <string>
    using namespace std;

    int main() {
        string name;
        getline(cin, name);
        // Print the greeting
        return 0;
    }
  java: |
    import java.util.Scanner;

    public class Solution {
        public static void main(String[] args) {
            Scanner in = new Scanner(System.in);
            String name = in.nextLine();
            // Print the greeting
        }
    }
