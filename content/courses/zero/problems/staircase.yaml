id: staircase
title: Right-aligned staircase
concepts: [nested-loops]
difficulty: easy
statement: |
  Print a staircase of height `n` made of `#` characters, aligned to the right. Row `i`
  (counting from 1) has `n - i` spaces followed by `i` hashes.

  For n = 4:

  ```text
     #
    ##
   ###
  ####
  ```
input_format: One whole number n.
output_format: n lines forming the staircase. Do not print trailing spaces.
constraints:
  - 1 ≤ n ≤ 100
examples:
  - input: "4"
    output: "   #\n  ##\n ###\n####"
  - input: "1"
    output: "#"
hints:
  - Look at one row at a time. What two things does row i contain?
  - How many spaces come before the hashes in row i, in terms of n and i?
  - For each row i from 1 to n, print n - i spaces, then i hashes, then a newline.
approach: |
  Outer loop over rows i = 1..n. Inside, print (n - i) spaces then i '#' characters using
  two inner loops (or string repetition in Python), then end the line.
reference: |
  n = int(input())
  print("\n".join(" " * (n - i) + "#" * i for i in range(1, n + 1)))
generator: |
  def cases(rng):
      for value in [2, 3, 10, 100]:
          yield str(value)
      for _ in range(4):
          yield str(rng.randint(1, 100))
