id: fix-the-average
title: Fix the average
concepts: [debugging]
difficulty: easy
statement: |
  A teammate wrote a program that prints the average of `n` whole numbers, rounded **down**
  to a whole number. It works on their examples but fails on hidden tests. Their Python
  version is:

  ```python
  n = int(input())
  nums = list(map(int, input().split()))
  total = 0
  for i in range(1, n):
      total += nums[i]
  print(total // n)
  ```

  Find the bug (there may be more than one when you think about all inputs), then submit a
  correct program in your language. "Rounded down" means towards negative infinity: the
  average of `-1 -2` is `-2`.
input_format: |
  The first line contains n. The second line contains n whole numbers.
output_format: The average rounded down (floor).
constraints:
  - 1 ≤ n ≤ 100000
  - -10^9 ≤ value ≤ 10^9
examples:
  - input: "3\n3 4 5"
    output: "4"
  - input: "2\n-1 -2"
    output: "-2"
    explanation: The average is -1.5; rounding down gives -2.
hints:
  - Trace the loop on the first example by hand. Which elements does it actually add?
  - Try n = 1. What does the teammate's program print, and what should it print?
  - "The loop skips index 0. Also, C++ and Java integer division rounds toward zero, not down, for negatives — and the total needs 64 bits."
approach: |
  Sum all elements (loop from index 0) into a 64-bit total. Floor division: Python's // is
  already floor. In C++/Java, total / n truncates toward zero, so subtract 1 when the total
  is negative and not divisible by n (or use Math.floorDiv in Java).
reference: |
  import sys
  data = sys.stdin.read().split()
  n = int(data[0])
  print(sum(map(int, data[1:1 + n])) // n)
generator: |
  def cases(rng):
      yield "1\n7"
      yield "1\n-7"
      yield "4\n-1 -1 -1 2"
      yield "3\n1000000000 1000000000 1000000000"
      n = 100000
      yield f"{n}\n" + " ".join(str(rng.randint(-10**9, 10**9)) for _ in range(n))
      for _ in range(6):
          n = rng.randint(1, 10)
          yield f"{n}\n" + " ".join(str(rng.randint(-20, 20)) for _ in range(n))
