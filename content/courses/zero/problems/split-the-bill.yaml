id: split-the-bill
title: Split the bill
concepts: [input-and-arithmetic]
difficulty: easy
statement: |
  `k` friends share a bill of `n` rupees. Everyone pays the same whole number of rupees, and
  whatever cannot be shared equally is covered by some friends paying one rupee more.

  Print how much each friend pays at least, and how many friends pay one rupee more.
input_format: Two whole numbers n and k on one line, separated by a space.
output_format: Two numbers on one line, the base share and the number of friends who pay one more.
constraints:
  - 1 ≤ n ≤ 10^12
  - 1 ≤ k ≤ 10^6
examples:
  - input: "1000 3"
    output: "333 1"
    explanation: 333 + 333 + 334 = 1000, so one friend pays one rupee more.
  - input: "90 9"
    output: "10 0"
hints:
  - Which arithmetic operator gives a whole-number share and which gives what is left over?
  - Every leftover rupee goes to a different friend.
  - The base share is n // k and the number of friends who pay one more is n % k.
approach: |
  Read both numbers from one line (split it), then print n // k and n % k. In C++ and Java use a
  64-bit type for n.
reference: |
  n, k = map(int, input().split())
  print(n // k, n % k)
brute: |
  n, k = map(int, input().split())
  base = 0
  while (base + 1) * k <= n:
      base += 1
  print(base, n - base * k)
generator: |
  def cases(rng):
      for n, k in [(1, 1), (1, 1000000), (10**12, 1), (10**12, 999983), (999999999999, 7)]:
          yield f"{n} {k}"
      for _ in range(7):
          yield f"{rng.randint(1, 10**12)} {rng.randint(1, 10**6)}"
small_generator: |
  def cases(rng):
      for _ in range(300):
          yield f"{rng.randint(1, 200)} {rng.randint(1, 20)}"
