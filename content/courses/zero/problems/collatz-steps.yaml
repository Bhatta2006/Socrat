id: collatz-steps
title: Collatz steps
concepts: [while-loops]
difficulty: medium
statement: |
  Start with a positive whole number `n` and repeat:

  - if `n` is even, divide it by 2;
  - if `n` is odd, multiply it by 3 and add 1.

  Stop when `n` becomes 1. Print how many steps it took. (Nobody has proven that this
  always reaches 1 — but it does for every number anyone has tried.)
input_format: One positive whole number n.
output_format: The number of steps needed to reach 1.
constraints:
  - 1 ≤ n ≤ 1000000
examples:
  - input: "6"
    output: "8"
    explanation: 6 → 3 → 10 → 5 → 16 → 8 → 4 → 2 → 1 is 8 steps.
  - input: "1"
    output: "0"
hints:
  - Do you know in advance how many rounds you need? Which loop fits that?
  - What must be true for the loop to keep going, and what changes each round?
  - Loop while n != 1, apply the even/odd rule, and add 1 to a step counter each round.
approach: |
  steps = 0; while n != 1: if n is even, n = n / 2, else n = 3n + 1; steps += 1. Values can
  exceed 32-bit limits along the way, so use long long / long in C++ and Java.
reference: |
  n = int(input())
  steps = 0
  while n != 1:
      n = n // 2 if n % 2 == 0 else 3 * n + 1
      steps += 1
  print(steps)
generator: |
  def cases(rng):
      for value in [2, 3, 27, 97, 871, 837799, 1000000]:
          yield str(value)
      for _ in range(6):
          yield str(rng.randint(1, 1000000))
