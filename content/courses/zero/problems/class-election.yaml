id: class-election
title: Class election
concepts: [maps]
difficulty: easy
statement: |
  Each ballot holds the name of one candidate. Print the winner and their number of votes. If
  several candidates share the most votes, the winner is the one whose name comes first in
  alphabetical order.
input_format: |
  The first line contains n, the number of ballots. Each of the next n lines contains one name.
output_format: The winner's name and vote count, separated by a space.
constraints:
  - 1 ≤ n ≤ 10^5
  - Names are 1 to 20 lowercase letters.
examples:
  - input: "5\nmeera\narjun\nmeera\nzoya\narjun"
    output: "arjun 2"
    explanation: arjun and meera both have 2 votes; arjun comes first alphabetically.
hints:
  - You need a count per name. Which data structure maps a name to a number?
  - After counting, how do you choose between names with the same count?
  - 'Count with a dict, then pick the name with the largest count, breaking ties by the smaller name, for example min(counts, key=lambda name: (-counts[name], name)).'
approach: |
  Count votes in a dictionary from name to count. The winner minimises (-count, name), which puts
  the highest count first and, among ties, the alphabetically smallest name.
reference: |
  import sys
  data = sys.stdin.read().split()
  n = int(data[0])
  counts = {}
  for name in data[1:1 + n]:
      counts[name] = counts.get(name, 0) + 1
  winner = min(counts, key=lambda name: (-counts[name], name))
  print(winner, counts[winner])
brute: |
  n = int(input())
  names = [input().strip() for _ in range(n)]
  best = None
  for name in sorted(set(names)):
      votes = names.count(name)
      if best is None or votes > best[1]:
          best = (name, votes)
  print(best[0], best[1])
generator: |
  def cases(rng):
      yield "1\nsolo"
      yield "4\nb\na\nb\na"
      pool = ["".join(rng.choice("abcdefghij") for _ in range(rng.randint(1, 20))) for _ in range(500)]
      n = 100000
      yield f"{n}\n" + "\n".join(rng.choice(pool) for _ in range(n))
      yield f"{n}\n" + "\n".join(f"{chr(97 + i % 26)}" for i in range(n))
      for _ in range(4):
          n = rng.randint(1, 500)
          yield f"{n}\n" + "\n".join(rng.choice(["asha", "ben", "chen", "dev"]) for _ in range(n))
