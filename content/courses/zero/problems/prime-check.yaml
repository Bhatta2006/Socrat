id: prime-check
title: Prime or not
concepts: [functions]
difficulty: easy
statement: |
  Write a function that decides whether a number is prime, then use it to answer `q`
  questions. A prime is a whole number greater than 1 whose only divisors are 1 and itself.

  For each number print `prime` or `not prime`.
input_format: |
  The first line contains q. Each of the next q lines contains one number n.
output_format: q lines, each `prime` or `not prime`.
constraints:
  - 1 ≤ q ≤ 50
  - 1 ≤ n ≤ 10^9
examples:
  - input: "4\n2\n1\n15\n97"
    output: "prime\nnot prime\nnot prime\nprime"
hints:
  - Which numbers are handled by a special rule before any loop?
  - You do not need to test every divisor up to n. Where can you stop, and why?
  - Return false for n < 2; test divisors d while d * d <= n; if none divides n, return true.
approach: |
  is_prime(n): if n < 2 return false; for d from 2 while d*d <= n, if n % d == 0 return
  false; return true. Each check is about √n ≤ 31623 steps, fine for 50 queries. Use a
  64-bit type for d*d in C++/Java.
reference: |
  import sys
  def is_prime(n):
      if n < 2:
          return False
      d = 2
      while d * d <= n:
          if n % d == 0:
              return False
          d += 1
      return True
  data = sys.stdin.read().split()
  q = int(data[0])
  print("\n".join("prime" if is_prime(int(x)) else "not prime" for x in data[1:1 + q]))
generator: |
  def cases(rng):
      yield "6\n1\n2\n3\n4\n999999937\n1000000000"
      yield "3\n999999929\n999999937\n999999893"
      yield "50\n" + "\n".join(str(rng.randint(10**8, 10**9)) for _ in range(50))
      for _ in range(5):
          q = rng.randint(1, 20)
          yield f"{q}\n" + "\n".join(str(rng.randint(1, 200)) for _ in range(q))
