id: runner-up-score
title: Runner-up score
concepts: [lists]
difficulty: easy
statement: |
  Given the scores of a quiz, print the second-highest **distinct** score. If every score is
  the same, there is no runner-up: print `NONE`.
input_format: |
  The first line contains n. The second line contains n whole-number scores.
output_format: The second-highest distinct score, or NONE.
constraints:
  - 1 ≤ n ≤ 10^5
  - -10^9 ≤ score ≤ 10^9
examples:
  - input: "5\n70 95 88 95 60"
    output: "88"
    explanation: 95 is the top score; the next different score is 88.
  - input: "3\n50 50 50"
    output: "NONE"
hints:
  - Is the runner-up simply the second element after sorting? What about ties at the top?
  - You can find it in one pass by remembering the best and the second-best different values seen so far.
  - Keep best and second (start as None). For each score s, if s > best then second = best and best = s; elif s != best and (second is None or s > second) then second = s.
approach: |
  One pass with two variables, best and second, both starting empty. A larger score pushes the
  old best down to second; a score different from best that beats second replaces second. Print
  second, or NONE if it was never set. (Sorting the distinct values also works in O(n log n).)
reference: |
  import sys
  data = sys.stdin.read().split()
  n = int(data[0])
  best = second = None
  for s in map(int, data[1:1 + n]):
      if best is None or s > best:
          if best is not None:
              second = best
          best = s
      elif s != best and (second is None or s > second):
          second = s
  print("NONE" if second is None else second)
brute: |
  n = int(input())
  values = sorted(set(map(int, input().split())), reverse=True)
  print(values[1] if len(values) > 1 else "NONE")
