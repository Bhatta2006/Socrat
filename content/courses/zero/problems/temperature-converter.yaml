id: temperature-converter
title: Celsius to Fahrenheit
concepts: [variables-and-types]
difficulty: easy
statement: |
  A weather station reports temperatures in whole degrees Celsius. Convert one reading to
  degrees Fahrenheit using F = C × 9 / 5 + 32 and print it with exactly one digit after the
  decimal point.
input_format: One whole number C.
output_format: The temperature in Fahrenheit with one decimal place.
constraints:
  - -100 ≤ C ≤ 100
examples:
  - input: "25"
    output: "77.0"
  - input: "-3"
    output: "26.6"
    explanation: -3 × 9 / 5 + 32 = -5.4 + 32 = 26.6
hints:
  - Is the input text or a number when you first read it? Which type do you need for arithmetic?
  - The result can have a fractional part, so a whole-number type is not enough for it.
  - Convert the input with int(), compute c * 9 / 5 + 32, and print it with f"{f:.1f}".
approach: |
  Read C as an integer, compute C * 9 / 5 + 32 as a floating-point value, and format it with one
  decimal place (f"{value:.1f}" in Python, printf("%.1f") in C++ and Java).
reference: |
  c = int(input())
  f = c * 9 / 5 + 32
  print(f"{f:.1f}")
brute: |
  c = int(input())
  tenths = c * 18 + 320  # F in tenths of a degree, exactly
  sign = "-" if tenths < 0 else ""
  tenths = abs(tenths)
  print(f"{sign}{tenths // 10}.{tenths % 10}")
generator: |
  def cases(rng):
      for c in [-100, -40, -18, 0, 37, 100]:
          yield str(c)
      for _ in range(6):
          yield str(rng.randint(-100, 100))
small_generator: |
  def cases(rng):
      for c in range(-100, 101):
          yield str(c)
