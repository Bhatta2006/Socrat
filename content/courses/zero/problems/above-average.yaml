id: above-average
title: Above the average
concepts: [lists]
difficulty: easy
statement: |
  A class has `n` test scores. Print how many scores are **strictly greater** than the
  class average.

  The average can be a fraction, so be careful not to lose precision.
input_format: |
  The first line contains n. The second line contains n whole numbers.
output_format: The count of scores strictly above the average.
constraints:
  - 1 ≤ n ≤ 100000
  - 0 ≤ score ≤ 100
examples:
  - input: "5\n50 60 70 80 90"
    output: "2"
    explanation: The average is 70; only 80 and 90 are above it.
  - input: "3\n1 2 2"
    output: "2"
    explanation: The average is 5/3 ≈ 1.67, so both 2s are above it.
hints:
  - You need the average before you can count. How many passes over the list does that take?
  - How can you compare a score with an average without ever dividing?
  - "score > total / n is the same as score * n > total — compare whole numbers to avoid rounding."
approach: |
  First pass: compute total. Second pass: count scores where score * n > total. Multiplying
  instead of dividing keeps everything in whole numbers and avoids precision bugs.
reference: |
  import sys
  data = sys.stdin.read().split()
  n = int(data[0])
  a = list(map(int, data[1:1 + n]))
  total = sum(a)
  print(sum(1 for x in a if x * n > total))
generator: |
  def cases(rng):
      yield "1\n50"
      yield "4\n10 10 10 10"
      yield "6\n0 0 0 0 0 100"
      n = 100000
      yield f"{n}\n" + " ".join(str(rng.randint(0, 100)) for _ in range(n))
      for _ in range(6):
          n = rng.randint(1, 50)
          yield f"{n}\n" + " ".join(str(rng.randint(0, 100)) for _ in range(n))
