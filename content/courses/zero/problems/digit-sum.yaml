id: digit-sum
title: Sum of digits
concepts: [while-loops]
difficulty: easy
statement: |
  Given a non-negative whole number `n`, print the sum of its digits.

  For example, the digits of 4071 add up to 4 + 0 + 7 + 1 = 12.
input_format: One whole number n.
output_format: The sum of the digits of n.
constraints:
  - 0 ≤ n ≤ 10^18
examples:
  - input: "4071"
    output: "12"
  - input: "0"
    output: "0"
hints:
  - How can arithmetic give you just the last digit of a number?
  - After using the last digit, how do you remove it so the next digit becomes last?
  - Loop while n > 0, adding n % 10 to a total and then dividing n by 10 (whole-number division).
approach: |
  Use an accumulator: total = 0; while n > 0, add n % 10 to total and set n to n // 10.
  Use a 64-bit integer (long long / long) in C++ and Java because n can be up to 10^18.
reference: |
  n = int(input())
  total = 0
  while n > 0:
      total += n % 10
      n //= 10
  print(total)
generator: |
  def cases(rng):
      for value in [9, 10, 99999, 1000000000000000000, 999999999999999999, 101010]:
          yield str(value)
      for _ in range(7):
          yield str(rng.randint(0, 10**18))
