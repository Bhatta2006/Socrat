id: sum-of-multiples
title: Sum of multiples
concepts: [for-loops]
difficulty: medium
statement: |
  Find the sum of all whole numbers from 1 to `n` (inclusive) that are divisible by `a`
  **or** by `b`.

  For n = 10, a = 3, b = 5 the numbers are 3, 5, 6, 9 and 10, which add up to 33.
input_format: Three whole numbers n, a and b.
output_format: The sum.
constraints:
  - 1 ≤ n ≤ 1000000
  - 1 ≤ a, b ≤ 1000
examples:
  - input: "10 3 5"
    output: "33"
  - input: "6 2 2"
    output: "12"
    explanation: 2 + 4 + 6 = 12. A number divisible by both is still counted only once.
hints:
  - Which numbers do you need to look at, and which loop visits each of them once?
  - For each number, what single condition says it should be added?
  - Loop i from 1 to n and add i to the total when i % a == 0 or i % b == 0. Use a 64-bit total.
approach: |
  Loop i = 1..n, add i when i % a == 0 or i % b == 0. The total can reach about 5·10^11, so
  use long long (C++) or long (Java). Using or (not two separate ifs) avoids double counting.
reference: |
  n, a, b = map(int, input().split())
  print(sum(i for i in range(1, n + 1) if i % a == 0 or i % b == 0))
generator: |
  def cases(rng):
      yield "1 1 1"
      yield "1000000 1 1000"
      yield "1000000 999 1000"
      yield "7 8 9"
      for _ in range(7):
          yield f"{rng.randint(1, 1000000)} {rng.randint(1, 1000)} {rng.randint(1, 1000)}"
