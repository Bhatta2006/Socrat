id: echo-reading
title: Echo a reading
concepts:
- programs-and-output
difficulty: easy
statement: The starter code has already read one sensor reading into n. (input() reads
  a line that is given to your program and int() turns it into a number; you will meet
  both properly soon.) Your only task is to print that reading unchanged.
input_format: One integer n, already read by the starter code.
output_format: Print the requested integer followed by a newline.
constraints:
- 0 <= n <= 1000000
examples:
- input: '4

    '
  output: '4

    '
hints:
- The starter has already read the value into n.
- Use your language's output instruction.
approach: Use the scaffolded input value and print n.
reference: 'n=int(input())

  print(n+0)

  '
