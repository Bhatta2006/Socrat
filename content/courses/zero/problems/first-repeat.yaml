id: first-repeat
title: First repeated number
concepts: [maps]
difficulty: medium
statement: |
  Read `n` numbers in order. Print the first number that appears for the **second time**
  while reading from left to right. If no number repeats, print `-1`.

  For `5 3 8 3 5` the answer is 3: when we reach the second 3, the 5 has not repeated yet.
input_format: |
  The first line contains n. The second line contains n whole numbers.
output_format: The first number whose second occurrence comes earliest, or -1.
constraints:
  - 1 ≤ n ≤ 200000
  - -10^9 ≤ value ≤ 10^9
examples:
  - input: "5\n5 3 8 3 5"
    output: "3"
  - input: "4\n1 2 3 4"
    output: "-1"
hints:
  - As you read each number, what single question do you need to answer about it?
  - Searching back through everything you've read is slow. Which structure answers "seen it?" instantly?
  - Keep a set of numbers seen so far; the first number already in the set is the answer.
approach: |
  Scan left to right with a set. For each value: if it is already in the set, print it and
  stop; otherwise add it. If the scan finishes, print -1. One pass, O(n) on average.
reference: |
  import sys
  data = sys.stdin.read().split()
  n = int(data[0])
  seen = set()
  answer = -1
  for x in map(int, data[1:1 + n]):
      if x in seen:
          answer = x
          break
      seen.add(x)
  print(answer)
generator: |
  def cases(rng):
      yield "1\n7"
      yield "2\n-5 -5"
      yield "6\n1 2 3 1 2 3"
      n = 200000
      yield f"{n}\n" + " ".join(str(i) for i in range(n))
      values = list(range(1, n))
      rng.shuffle(values)
      values.append(values[n // 2])
      yield f"{n}\n" + " ".join(map(str, values))
      for _ in range(6):
          n = rng.randint(1, 20)
          yield f"{n}\n" + " ".join(str(rng.randint(-15, 15)) for _ in range(n))
