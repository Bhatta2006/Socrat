id: power-recursive
title: Fast power
concepts: [recursion]
difficulty: medium
statement: |
  Compute `a^b mod m` for large `b`. Multiplying `a` by itself `b` times is far too slow
  when b can be 10^18, so use recursion on **halves**:

  - `a^0 = 1`
  - if b is even, `a^b = (a^(b/2))^2`
  - if b is odd, `a^b = a × a^(b−1)`

  Take everything modulo `m` as you go so the numbers stay small.
input_format: Three whole numbers a, b and m.
output_format: The value of a^b mod m.
constraints:
  - 0 ≤ a ≤ 10^9
  - 0 ≤ b ≤ 10^18
  - 1 ≤ m ≤ 10^9
examples:
  - input: "2 10 1000"
    output: "24"
    explanation: 2^10 = 1024, and 1024 mod 1000 = 24.
  - input: "3 0 7"
    output: "1"
hints:
  - What is the base case, and what smaller problem helps when b is even?
  - Computing a^(b/2) once and reusing it is the key — do not call the function twice.
  - "half = power(a, b // 2); result = half * half % m; if b is odd multiply by a once more (mod m)."
approach: |
  power(a, b): if b == 0 return 1 % m. half = power(a, b // 2); r = half * half % m;
  if b is odd, r = r * (a % m) % m. Depth is about log2(b) ≈ 60. Products need 64-bit
  integers (they stay below 10^18 because both factors are < m ≤ 10^9).
reference: |
  import sys
  sys.setrecursionlimit(1000)
  a, b, m = map(int, input().split())
  def power(a, b):
      if b == 0:
          return 1 % m
      half = power(a, b // 2)
      r = half * half % m
      if b % 2:
          r = r * (a % m) % m
      return r
  print(power(a, b))
generator: |
  def cases(rng):
      yield "0 0 1"
      yield "0 5 13"
      yield "1000000000 1000000000000000000 1000000000"
      yield "999999937 999999999999999999 999999929"
      yield "5 1 1"
      for _ in range(6):
          yield f"{rng.randint(0, 10**9)} {rng.randint(0, 10**18)} {rng.randint(1, 10**9)}"
