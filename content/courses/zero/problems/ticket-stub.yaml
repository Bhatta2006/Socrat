id: ticket-stub
title: Print a ticket stub
concepts: [programs-and-output]
difficulty: easy
statement: |
  A cinema prints a small stub for every ticket. Read the film title and the seat, and print
  the stub in exactly this shape (three lines):

  ```
  ADMIT ONE
  Film: <title>
  Seat: <seat>
  ```
input_format: |
  The first line is the film title. The second line is the seat, for example `G12`.
output_format: The three lines of the stub, exactly as shown.
constraints:
  - The title has 1 to 60 characters (letters, digits and spaces).
  - The seat is one capital letter followed by 1 to 2 digits.
examples:
  - input: "The Long Walk\nG12"
    output: "ADMIT ONE\nFilm: The Long Walk\nSeat: G12"
  - input: "Up\nA1"
    output: "ADMIT ONE\nFilm: Up\nSeat: A1"
hints:
  - How many separate print statements does the stub need?
  - The first line never changes; the other two combine a fixed label with what you read.
  - 'Read both lines with input(), then print "ADMIT ONE", then "Film: " + title, then "Seat: " + seat.'
approach: |
  Read the title and the seat with two input() calls (strip the line endings), then print the
  fixed first line and the two labelled lines.
reference: |
  title = input().strip()
  seat = input().strip()
  print("ADMIT ONE")
  print("Film: " + title)
  print("Seat: " + seat)
brute: |
  lines = [input().strip(), input().strip()]
  for line in ["ADMIT ONE", f"Film: {lines[0]}", f"Seat: {lines[1]}"]:
      print(line)
generator: |
  def cases(rng):
      words = ["Night", "Train", "River", "Blue", "Echo", "Garden", "Last", "Summer", "Code", "2049"]
      yield "A\nZ99"
      yield " ".join(["Long"] * 12)[:60] + "\nB7"
      for _ in range(8):
          title = " ".join(rng.choice(words) for _ in range(rng.randint(1, 5)))
          seat = rng.choice("ABCDEFGHIJ") + str(rng.randint(1, 99))
          yield f"{title}\n{seat}"
small_generator: |
  def cases(rng):
      for _ in range(50):
          title = "".join(rng.choice("ab cd") for _ in range(rng.randint(1, 8))).strip() or "x"
          yield f"{title}\n{rng.choice('ABC')}{rng.randint(1, 99)}"
