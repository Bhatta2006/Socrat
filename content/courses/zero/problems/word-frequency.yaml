id: word-frequency
title: Word frequency
concepts: [maps]
difficulty: easy
statement: |
  Given `n` words, print each **distinct** word with the number of times it appears,
  one per line, in **alphabetical order**.
input_format: |
  The first line contains n. The second line contains n lowercase words separated by spaces.
output_format: One line per distinct word, `word count`, sorted alphabetically.
constraints:
  - 1 ≤ n ≤ 100000
  - Each word has 1 to 10 lowercase letters.
examples:
  - input: "6\nthe cat saw the other cat"
    output: "cat 2\nother 1\nsaw 1\nthe 2"
  - input: "1\nsolo"
    output: "solo 1"
hints:
  - What structure lets you look up "how many times have I seen this word?" instantly?
  - Counting and ordering are two separate steps. Which comes first?
  - Count with a map (word → count), then sort the keys and print each with its count.
approach: |
  Build a map from word to count in one pass. Then sort the distinct words (or use C++ map /
  Java TreeMap, which keep keys sorted) and print "word count" for each.
reference: |
  import sys
  data = sys.stdin.read().split()
  n = int(data[0])
  counts = {}
  for w in data[1:1 + n]:
      counts[w] = counts.get(w, 0) + 1
  print("\n".join(f"{w} {counts[w]}" for w in sorted(counts)))
generator: |
  def cases(rng):
      yield "3\nb a b"
      yield "4\nz y x w"
      words = ["alpha", "beta", "gamma", "delta", "pi", "rho", "tau", "mu", "nu", "xi"]
      n = 100000
      yield f"{n}\n" + " ".join(rng.choice(words) for _ in range(n))
      for _ in range(6):
          n = rng.randint(1, 30)
          yield f"{n}\n" + " ".join(rng.choice(words[:4]) for _ in range(n))
