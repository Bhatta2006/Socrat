id: leap-year
title: Leap year
concepts: [boolean-logic]
difficulty: easy
statement: |
  In the Gregorian calendar a year is a **leap year** if it is divisible by 4, except that
  years divisible by 100 are not leap years — unless they are also divisible by 400.

  Print `YES` if the given year is a leap year and `NO` otherwise.
input_format: One whole number y.
output_format: YES or NO.
constraints:
  - 1 ≤ y ≤ 1000000
examples:
  - input: "2024"
    output: "YES"
  - input: "1900"
    output: "NO"
    explanation: 1900 is divisible by 100 but not by 400.
  - input: "2000"
    output: "YES"
hints:
  - Write the three rules as three separate true/false questions first.
  - Which years are the exceptions, and which are the exceptions to the exceptions?
  - Leap if (divisible by 4 and not by 100) or (divisible by 400).
approach: |
  A year is a leap year exactly when (y % 4 == 0 and y % 100 != 0) or y % 400 == 0.
  Test 2000, 1900, 2024 and 2023 to cover every branch.
reference: |
  y = int(input())
  print("YES" if (y % 4 == 0 and y % 100 != 0) or y % 400 == 0 else "NO")
generator: |
  def cases(rng):
      for value in [1, 4, 100, 400, 1600, 1700, 1996, 2023, 2100, 1000000]:
          yield str(value)
      for _ in range(4):
          yield str(rng.randint(1, 1000000))
