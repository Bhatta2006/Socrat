id: two-sum-exists
title: Does a pair exist?
concepts: [problem-solving]
difficulty: medium
statement: |
  Given `n` numbers and a target `t`, decide whether two numbers at **different positions**
  add up to exactly `t`. Print `YES` or `NO`.

  With n up to 200,000, checking every pair is too slow — apply the problem-solving process
  to find something better.
input_format: |
  The first line contains n and t. The second line contains n whole numbers.
output_format: YES or NO.
constraints:
  - 1 ≤ n ≤ 200000
  - -10^9 ≤ value, t ≤ 10^9
examples:
  - input: "4 9\n2 7 11 15"
    output: "YES"
  - input: "3 10\n5 1 2"
    output: "NO"
    explanation: 5 + 5 would be 10, but there is only one 5.
hints:
  - Solve the first example by hand. When you look at 7, what number are you hoping to have seen?
  - For each value x, you need to know whether t − x appeared earlier. Which structure answers "seen before?" quickly?
  - Scan once with a set; for each x check if t - x is in the set, then add x.
approach: |
  For each x in order: if t − x is in the set of values seen so far, the answer is YES.
  Otherwise add x. Checking before adding guarantees the two numbers come from different
  positions. O(n) on average.
reference: |
  import sys
  data = sys.stdin.read().split()
  n, t = int(data[0]), int(data[1])
  seen = set()
  ok = False
  for x in map(int, data[2:2 + n]):
      if t - x in seen:
          ok = True
          break
      seen.add(x)
  print("YES" if ok else "NO")
generator: |
  def cases(rng):
      yield "1 4\n2"
      yield "2 4\n2 2"
      yield "2 0\n-1000000000 1000000000"
      n = 150000
      values = [rng.randint(0, 10**8) * 2 for _ in range(n)]
      yield f"{n} 1\n" + " ".join(map(str, values))
      values[-1] = 1 - values[n // 3]
      yield f"{n} 1\n" + " ".join(map(str, values))
      for _ in range(6):
          n = rng.randint(1, 12)
          yield f"{n} {rng.randint(-10, 10)}\n" + " ".join(str(rng.randint(-8, 8)) for _ in range(n))
