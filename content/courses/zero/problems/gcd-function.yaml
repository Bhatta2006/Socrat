id: gcd-function
title: Greatest common divisor
concepts: [functions]
difficulty: medium
statement: |
  Write a function `gcd(a, b)` that returns the greatest whole number dividing both `a`
  and `b`. Then, for each pair, print the gcd and the least common multiple (lcm).

  Use Euclid's idea: `gcd(a, b) = gcd(b, a mod b)`, and `gcd(a, 0) = a`. The lcm is
  `a / gcd(a, b) * b`.
input_format: |
  The first line contains q. Each of the next q lines contains two numbers a and b.
output_format: q lines, each with the gcd and the lcm separated by a space.
constraints:
  - 1 ≤ q ≤ 100000
  - 1 ≤ a, b ≤ 10^9
examples:
  - input: "3\n12 18\n7 5\n10 10"
    output: "6 36\n1 35\n10 10"
hints:
  - Trying every possible divisor is too slow for 10^9. What does Euclid's rule let you do instead?
  - Repeatedly replace (a, b) with (b, a % b). When does it stop, and what is the answer then?
  - Loop while b != 0 with (a, b) = (b, a % b); the answer is a. For lcm, divide before multiplying.
approach: |
  gcd: while b != 0: a, b = b, a % b; return a. lcm = a / gcd * b — dividing first keeps the
  intermediate value small; the lcm itself can reach 10^18, so use 64-bit integers.
reference: |
  import sys
  def gcd(a, b):
      while b:
          a, b = b, a % b
      return a
  data = sys.stdin.read().split()
  q = int(data[0])
  out = []
  for i in range(q):
      a, b = int(data[1 + 2 * i]), int(data[2 + 2 * i])
      g = gcd(a, b)
      out.append(f"{g} {a // g * b}")
  print("\n".join(out))
generator: |
  def cases(rng):
