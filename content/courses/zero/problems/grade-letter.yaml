id: grade-letter
title: Letter grade
concepts: [conditionals]
difficulty: easy
statement: |
  Convert a test score from 0 to 100 into a letter grade:

  | Score | Grade |
  |---|---|
  | 90 – 100 | A |
  | 80 – 89 | B |
  | 70 – 79 | C |
  | 60 – 69 | D |
  | below 60 | F |

  Print only the letter.
input_format: One whole number s, the score.
output_format: A single letter A, B, C, D or F.
constraints:
  - 0 ≤ s ≤ 100
examples:
  - input: "93"
    output: A
  - input: "80"
    output: B
    explanation: 80 is the lowest B, so it is a boundary worth testing.
hints:
  - How many different outcomes are there, and which is the easiest to check first?
  - If you check from the top grade downward, each test only needs one comparison.
  - Use an if / else-if chain starting with s >= 90, then s >= 80, and so on, with F as the final else.
approach: |
  Check thresholds from highest to lowest: s >= 90 → A, else s >= 80 → B, else s >= 70 → C,
  else s >= 60 → D, else F. Because the first true branch wins, each branch only needs a
  lower bound.
reference: |
  s = int(input())
  if s >= 90:
      print("A")
  elif s >= 80:
      print("B")
  elif s >= 70:
      print("C")
  elif s >= 60:
      print("D")
  else:
      print("F")
generator: |
  def cases(rng):
      for value in [0, 59, 60, 69, 70, 79, 89, 90, 100]:
          yield str(value)
      for _ in range(4):
          yield str(rng.randint(0, 100))
