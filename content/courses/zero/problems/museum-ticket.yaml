id: museum-ticket
title: Museum ticket price
concepts: [conditionals]
difficulty: easy
statement: |
  A museum prices tickets by age:

  - under 5: free (0)
  - 5 to 17: 50 rupees
  - 18 to 59: 120 rupees
  - 60 and over: 60 rupees

  Students aged 18 to 25 get 40 rupees off the adult price. Given an age and whether the
  visitor is a student, print the price.
input_format: |
  One line with the age and the word `student` or `visitor`.
output_format: The ticket price in rupees.
constraints:
  - 0 ≤ age ≤ 120
examples:
  - input: "21 student"
    output: "80"
  - input: "21 visitor"
    output: "120"
  - input: "4 student"
    output: "0"
hints:
  - Order your checks so that each age falls into exactly one band.
  - The student discount applies only inside one band; check it there, not everywhere.
  - Use if / elif / else on the age bands, and inside the 18 to 59 band subtract 40 when the visitor is a student aged 25 or younger.
approach: |
  Read the age and the kind. If age < 5 the price is 0; elif age < 18 it is 50; elif age < 60 it
  is 120, minus 40 when the kind is student and age ≤ 25; else it is 60.
reference: |
  parts = input().split()
  age, kind = int(parts[0]), parts[1]
  if age < 5:
      price = 0
  elif age < 18:
      price = 50
  elif age < 60:
      price = 120
      if kind == "student" and age <= 25:
          price -= 40
  else:
      price = 60
  print(price)
brute: |
  parts = input().split()
  age, kind = int(parts[0]), parts[1]
  table = {}
  for a in range(0, 121):
      base = 0 if a < 5 else 50 if a < 18 else 120 if a < 60 else 60
      table[(a, "visitor")] = base
      table[(a, "student")] = base - 40 if 18 <= a <= 25 else base
  print(table[(age, kind)])
generator: |
  def cases(rng):
      for age in [0, 4, 5, 17, 18, 25, 26, 59, 60, 120]:
          yield f"{age} {rng.choice(['student', 'visitor'])}"
      yield "25 student"
      yield "26 student"
small_generator: |
  def cases(rng):
      for age in range(0, 121):
          for kind in ["student", "visitor"]:
              yield f"{age} {kind}"
