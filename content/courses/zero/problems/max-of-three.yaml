id: max-of-three
title: Largest of three
concepts: [conditionals]
difficulty: easy
statement: |
  Three friends compare their daily study streaks. Given the three streak lengths, print the
  largest one.

  Do not use a built-in max function — practise the decision yourself.
input_format: Three whole numbers a, b and c on one line.
output_format: The largest of the three numbers.
constraints:
  - -1000000000 ≤ a, b, c ≤ 1000000000
examples:
  - input: "4 9 2"
    output: "9"
  - input: "7 7 3"
    output: "7"
    explanation: Ties are fine — print the value once.
hints:
  - If you only had two numbers, how would you pick the larger one?
  - Can you keep a "best so far" and compare it with each remaining number?
  - Start with best = a; if b is bigger, replace best; then do the same with c.
approach: |
  Keep a running best: best = a; if b > best then best = b; if c > best then best = c;
  print best. This scales to any number of values and avoids long chains of comparisons.
reference: |
  a, b, c = map(int, input().split())
  best = a
  if b > best:
      best = b
  if c > best:
      best = c
  print(best)
generator: |
  def cases(rng):
      yield "1 2 3"
      yield "3 2 1"
      yield "-5 -2 -9"
      yield "0 0 0"
      yield "-1000000000 1000000000 0"
      for _ in range(8):
          yield " ".join(str(rng.randint(-1000, 1000)) for _ in range(3))
