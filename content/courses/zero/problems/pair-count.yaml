id: pair-count
title: Pairs that sum to a target
concepts: [nested-loops]
difficulty: medium
statement: |
  You are given `n` numbers and a target `t`. Count how many pairs of **positions**
  (i, j) with i < j have `a[i] + a[j] = t`.

  Each pair of positions counts once, even if the values repeat.
input_format: |
  The first line contains n and t. The second line contains n whole numbers.
output_format: The number of pairs.
constraints:
  - 2 ≤ n ≤ 2000
  - -10^6 ≤ a[i], t ≤ 10^6
examples:
  - input: "5 6\n1 5 3 3 2"
    output: "2"
    explanation: Positions (1,2) give 1+5 and (3,4) give 3+3.
  - input: "4 2\n1 1 1 1"
    output: "6"
    explanation: Every one of the 6 pairs of positions sums to 2.
hints:
  - How would you list every pair of positions by hand without repeating any?
  - Use two loops. Where must the inner loop start so that i < j?
  - For i from 0 to n-1 and j from i+1 to n-1, count the pair when a[i] + a[j] == t.
approach: |
  Read the numbers into a list/array. Use nested loops with j starting at i + 1 and count
  pairs whose sum equals t. With n ≤ 2000 there are at most about 2 million pairs, which is
  fast enough. (Later, hash maps solve this in one pass.)
reference: |
  import sys
  data = sys.stdin.read().split()
  n, t = int(data[0]), int(data[1])
  a = list(map(int, data[2:2 + n]))
  from collections import Counter
  seen = Counter()
  count = 0
  for value in a:
      count += seen[t - value]
      seen[value] += 1
  print(count)
generator: |
  def cases(rng):
      yield "2 0\n0 0"
      yield "3 10\n1 2 3"
      yield "2000 0\n" + " ".join("0" for _ in range(2000))
      for _ in range(7):
          n = rng.randint(2, 2000)
          t = rng.randint(-20, 20)
          yield f"{n} {t}\n" + " ".join(str(rng.randint(-10, 10)) for _ in range(n))
