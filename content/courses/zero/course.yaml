id: zero
title: Programming from Zero
tagline: Write real programs from your very first line of code.
description: >-
  A patient, practice-first path for complete beginners. You will learn how programs
  think, write and debug real code in Python, C++ or Java, and build the problem-solving
  habits every later skill depends on. No prior experience assumed.
version: 1.0.0
languages: [python, cpp, java]
levels:
  - id: brand-new
    label: I've never written code
    description: Start from the very first idea. No placement questions.
  - id: tried-a-bit
    label: I've tried a tutorial or two
    description: Variables and print feel familiar, loops are shaky.
    start_concept: conditionals
  - id: can-write-small-programs
    label: I can write small programs
    description: Loops and lists are fine; functions and structure are next.
    start_concept: lists
  - id: comfortable
    label: I'm comfortable with the basics
    description: Check what's left before moving on to data structures.
    start_concept: functions
modules:
  - id: first-steps
    title: First steps
    summary: What a program is, how it runs, and how it stores and computes values.
    concepts: [programs-and-output, variables-and-types, input-and-arithmetic]
  - id: control-flow
    title: Making decisions and repeating
    summary: Branches and loops — the two ideas that make programs powerful.
    concepts: [conditionals, boolean-logic, while-loops, for-loops, nested-loops]
  - id: collections
    title: Working with data
    summary: Store many values and look them up quickly.
    concepts: [lists, strings, maps, grids]
  - id: functions-module
    title: Functions and structure
    summary: Break programs into reusable, testable pieces.
    concepts: [functions, scope-and-mutation, recursion]
  - id: craft
    title: The programmer's craft
    summary: Debug calmly, solve unfamiliar problems, and model the world with objects.
    concepts: [debugging, problem-solving, classes-and-objects]
