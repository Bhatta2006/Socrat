quiz:
  - id: own-copy
    kind: mcq
    prompt: Two Account objects are created and money is deposited into the first. What happens to the second's balance?
    options: ["It is unchanged", "It increases too", "It becomes zero", "It causes an error"]
    answer: 0
    explanation: Each object has its own attributes.
    difficulty: 1
  - id: constructor
    kind: mcq
    prompt: What is a constructor for?
    options: ["Initialising a new object's data", "Deleting objects", "Printing objects", "Comparing two classes"]
    answer: 0
    explanation: The constructor runs when an object is created and sets its starting state.
    difficulty: 1
  - id: encapsulation
    kind: mcq
    prompt: Why route every balance change through a deposit method?
    options:
      - So the rule "deposits must be positive" is enforced in one place
      - Methods run faster than direct assignment
      - Fields cannot be changed otherwise in any language
      - It uses less memory
    answer: 0
    explanation: Encapsulation keeps the invariant in one place so no caller can break it.
    difficulty: 2
  - id: self-this
    kind: mcq
    prompt: Inside a method, what does self (Python) or this (C++/Java) refer to?
    options: ["The object the method was called on", "The class itself", "The first parameter passed in", "The program"]
    answer: 0
    explanation: a.deposit(50) runs deposit with self/this bound to a.
    difficulty: 1
problems: [bank-ledger]
