id: classes-and-objects
title: Classes and objects
summary: Bundle related data and the operations on it into your own types.
module: craft
prerequisites: [scope-and-mutation]
difficulty: 3
estimated_minutes: 50
lesson: |
  ## The big idea

  So far your data has been loose variables and lists. Real programs model *things* — a
  bank account, a student, a point on a map — and each thing has **data** (balance, name,
  coordinates) and **behaviour** (deposit, enroll, move). A **class** defines a new type
  that bundles both. An **object** is one instance of that class.

  ```python
  class Account:
      def __init__(self, owner, balance=0):
          self.owner = owner          # data (attributes)
          self.balance = balance

      def deposit(self, amount):     # behaviour (methods)
          if amount <= 0:
              raise ValueError("deposit must be positive")
          self.balance += amount

  a = Account("Ada")
  a.deposit(50)
  print(a.owner, a.balance)          # Ada 50
  ```

  ```cpp
  class Account {
  public:
      Account(string owner, long long balance = 0) : owner(owner), balance(balance) {}

      void deposit(long long amount) {
          if (amount <= 0) throw invalid_argument("deposit must be positive");
          balance += amount;
      }

      string owner;
      long long balance;
  };

  Account a("Ada");
  a.deposit(50);
  cout << a.owner << " " << a.balance << "\n";   // Ada 50
  ```

  ```java
  class Account {
      String owner;
      long balance;

      Account(String owner) {            // constructor
          this.owner = owner;
          this.balance = 0;
      }

      void deposit(long amount) {
          if (amount <= 0) throw new IllegalArgumentException("deposit must be positive");
          balance += amount;
      }
  }

  Account a = new Account("Ada");
  a.deposit(50);
  System.out.println(a.owner + " " + a.balance);  // Ada 50
  ```

  ## Key vocabulary

  - **Constructor** (`__init__`, or a method named like the class) sets up a new object.
  - **Attributes / fields** are the object's data.
  - **Methods** are functions that belong to the class and act on one object.
  - `self` (Python) / `this` (C++, Java) refers to the object the method was called on.

  Each object has its **own** copy of the attributes: two accounts have two balances.

  ## Why bother?

  **Encapsulation**: the class protects its rules. Here, no one can deposit a negative
  amount because every deposit goes through `deposit`. In larger programs, keeping data and
  the rules about it together prevents a whole category of bugs.

  **Readability**: `account.deposit(50)` says what it means. Compare with
  `balances[i] += 50` scattered across a program.

  ## In data structures

  You will use classes constantly: a linked-list **node** holds a value and a reference to
  the next node; a **tree node** holds a value and its children; a custom **comparator**
  sorts objects by a field. Learning to design small, focused classes now pays off in the
  next course.

  ## Keep classes small

  A good class has one clear responsibility. If you cannot describe it in a sentence, split
  it. Prefer methods that keep the object valid over code outside that edits fields
  directly.

  ## Worked walkthrough

  Create two counters, each starting at zero. Increment the first twice and the second once. Their states should be 2 and 1. Draw one object box per counter and put its fields inside that box. If both values change together, check whether you accidentally used shared class-level mutable state instead of instance state.

  ### Why this works

  A class defines a representation and the operations allowed on it; an object is one concrete instance. Keep representation invariants true after construction and every method. For a bounded counter, state what minimum and maximum values are legal and decide how invalid operations are reported.

  ### Boundary cases and cost

  Test independent instances, repeated method calls and invalid constructor inputs. A method should not expose a mutable internal collection if callers could use it to break the object's invariant.

  Object syntax does not determine algorithmic cost. A method that scans a stored list remains O(n), even if the call looks short.

  ### Check your understanding

  A rectangle object stores width and height. Should its area be a permanently stored number or computed from the current dimensions?

  Try it on paper before reading the reasoning below.

  > Computing area from dimensions avoids stale derived state when dimensions change. Storing it is justified only with a clear update rule or immutable dimensions.

key_points:
  - A class defines a type with data (attributes) and behaviour (methods).
  - An object is an instance with its own copy of the attributes.
  - Constructors initialise objects; self/this refers to the current object.
  - Encapsulation keeps data and its rules together, preventing invalid states.
pitfalls:
  - Forgetting self in Python method definitions or attribute access.
  - Sharing one mutable default (like a list) between all Python objects.
  - Huge classes that do everything instead of one clear job.
