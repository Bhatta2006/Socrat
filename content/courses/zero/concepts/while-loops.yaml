quiz:
  - id: rounds
    kind: output
    prompt: How many times does the body run?
    code:
      python: |
        i = 0
        while i < 10:
            i = i + 3
      cpp: |
        int i = 0;
        while (i < 10) i = i + 3;
      java: |
        int i = 0;
        while (i < 10) i = i + 3;
    options: ["4", "3", "10", "Forever"]
    answer: 0
    explanation: i goes 0 → 3 → 6 → 9 → 12. The body runs at i = 0, 3, 6 and 9, which is 4 times.
    difficulty: 2
  - id: infinite
    kind: mcq
    prompt: "Why does this loop never end? `n = 5; while n > 0: print(n)`"
    options:
      - n never changes, so n > 0 stays true
      - The condition is wrong syntax
      - print stops the loop
      - It ends after 5 rounds
    answer: 0
    explanation: Nothing moves n toward 0. Every loop needs progress.
    difficulty: 1
  - id: zero-input
    kind: mcq
    prompt: For the digit-sum loop `while n > 0`, what happens when n starts at 0?
    options:
      - The body never runs, and total stays 0 — still the right answer
      - The loop runs once
      - It crashes
      - It runs forever
    answer: 0
    explanation: The condition is checked first. 0 > 0 is false, so the loop is skipped and 0 is printed.
    difficulty: 2
  - id: accumulator
    kind: output
    prompt: What is printed?
    code:
      python: |
        n, total = 4, 0
        while n > 0:
            total += n
            n -= 1
        print(total)
      cpp: |
        int n = 4, total = 0;
        while (n > 0) { total += n; n -= 1; }
        cout << total;
      java: |
        int n = 4, total = 0;
        while (n > 0) { total += n; n -= 1; }
        System.out.println(total);
    options: ["10", "4", "6", "0"]
    answer: 0
    explanation: total absorbs 4 + 3 + 2 + 1 = 10.
    difficulty: 2
problems: [digit-sum, collatz-steps]
