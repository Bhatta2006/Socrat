id: variables-and-types
title: Variables and types
summary: Variables are named boxes that hold values; every value has a type that decides what you can do with it.
module: first-steps
prerequisites: [programs-and-output]
difficulty: 1
estimated_minutes: 35
lesson: |
  ## The big idea

  A **variable** is a name attached to a value, like a labelled box. You put a value in,
  and later you refer to it by name. Variables let a program *remember* things.

  ```python
  age = 17
  name = "Ada"
  print(name)
  print(age + 1)
  ```

  ```cpp
  int age = 17;
  std::string name = "Ada";
  std::cout << name << "\n";
  std::cout << age + 1 << "\n";
  ```

  ```java
  int age = 17;
  String name = "Ada";
  System.out.println(name);
  System.out.println(age + 1);
  ```

  ## `=` means "store", not "equals"

  `age = 17` does **not** claim that age equals 17 forever. It means: *evaluate the right
  side, then store the result in the box on the left.* That is why this is valid:

  ```python
  score = 10
  score = score + 5   # take the old score (10), add 5, store 15
  print(score)        # 15
  ```

  ```cpp
  int score = 10;
  score = score + 5;  // take the old score (10), add 5, store 15
  std::cout << score; // 15
  ```

  ```java
  int score = 10;
  score = score + 5;          // take the old score (10), add 5, store 15
  System.out.println(score);  // 15
  ```

  The box holds **one** value at a time. Assigning again replaces the old value.

  ## Types

  Every value has a **type**:

  | Idea | Python | C++ | Java |
  |---|---|---|---|
  | whole number | `int` | `int`, `long long` | `int`, `long` |
  | decimal number | `float` | `double` | `double` |
  | text | `str` | `std::string` | `String` |
  | true/false | `bool` | `bool` | `boolean` |

  Python figures out the type from the value. C++ and Java ask you to **declare** it
  (`int age`), and then the variable can only ever hold that type. Declaring types feels
  like extra work at first, but it catches many mistakes before the program runs.

  ## Naming

  Choose names that say what the value *means*: `total_price` beats `x`. Names cannot
  contain spaces or start with a digit, and they are case-sensitive (`Score` ≠ `score`).

  ## Tracing

  The best way to understand code is to **trace** it: keep a little table of each
  variable's current value and update it line by line. Programmers do this in their heads
  constantly — practise it now and every later topic gets easier.
key_points:
  - A variable is a named place that stores one value at a time.
  - "`=` evaluates the right side, then stores the result on the left."
  - Every value has a type (whole number, decimal, text, true/false).
  - C++ and Java require declaring a variable's type; Python infers it.
  - Trace code by tracking each variable's value line by line.
pitfalls:
  - Reading `x = x + 1` as a false equation instead of an update.
  - Using a variable before giving it a value.
  - Mixing text and numbers without converting (e.g. "5" + 3).
