quiz:
  - id: reassign
    kind: output
    prompt: What is printed?
    code:
      python: |
        x = 3
        x = x * 2
        x = x + 1
        print(x)
      cpp: |
        int x = 3;
        x = x * 2;
        x = x + 1;
        std::cout << x;
      java: |
        int x = 3;
        x = x * 2;
        x = x + 1;
        System.out.println(x);
    options: ["7", "3", "6", "4"]
    answer: 0
    explanation: x becomes 3, then 3*2 = 6, then 6+1 = 7. Each assignment replaces the old value.
    difficulty: 1
  - id: swap-trace
    kind: output
    prompt: Trace carefully. What are a and b at the end?
    code:
      python: |
        a = 5
        b = 9
        a = b
        b = a
      cpp: |
        int a = 5, b = 9;
        a = b;
        b = a;
      java: |
        int a = 5, b = 9;
        a = b;
        b = a;
    options: ["a = 9, b = 9", "a = 9, b = 5", "a = 5, b = 9", "a = 5, b = 5"]
    answer: 0
    explanation: After a = b, a is 9. Then b = a copies 9 into b. The original 5 is lost — swapping needs a temporary variable.
    difficulty: 2
  - id: type-of-text
    kind: mcq
    prompt: Which value is text (a string)?
    options: ['"42"', "42", "4.2", "true"]
    answer: 0
    explanation: Quotes make it text. "42" is two characters, not a number you can do arithmetic with.
    difficulty: 1
  - id: declared-type
    kind: mcq
    prompt: In C++ or Java you declared `int count`. What can count hold?
    options: ["Only whole numbers", "Any value", "Only text", "Only true or false"]
    answer: 0
    explanation: A declared type is a promise. An int variable can only store whole numbers.
    difficulty: 1
  - id: equals-meaning
    kind: mcq
    prompt: What does `total = total + price` do?
    options:
      - Adds price to the current total and stores the result in total
      - Checks whether total equals total plus price
      - Causes an error because total appears twice
      - Creates a second variable named total
    answer: 0
    explanation: The right side is evaluated using the old total, then the result replaces it.
    difficulty: 1
problems: []
