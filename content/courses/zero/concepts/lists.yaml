quiz:
  - id: last-index
    kind: mcq
    prompt: A list has 8 elements. What is the index of the last one?
    options: ["7", "8", "9", "-8"]
    answer: 0
    explanation: Indexes start at 0, so the last of n elements is at n − 1.
    difficulty: 1
  - id: neighbours
    kind: mcq
    prompt: You compare each element with the previous one using a[i] and a[i - 1]. Where should i start?
    options: ["1", "0", "-1", "n"]
    answer: 0
    explanation: At i = 0 there is no previous element; start at 1.
    difficulty: 2
  - id: list-output
    kind: output
    prompt: What is printed?
    code:
      python: |
        a = [3, 1, 4]
        a[0] = a[1] + a[2]
        print(a[0], len(a))
      cpp: |
        vector<int> a = {3, 1, 4};
        a[0] = a[1] + a[2];
        cout << a[0] << " " << a.size();
      java: |
        int[] a = {3, 1, 4};
        a[0] = a[1] + a[2];
        System.out.println(a[0] + " " + a.length);
    options: ["5 3", "4 3", "5 4", "8 3"]
    answer: 0
    explanation: a[1] + a[2] = 1 + 4 = 5 replaces a[0]. The length is still 3.
    difficulty: 1
  - id: best-so-far
    kind: mcq
    prompt: To find the maximum of a list, what should "best so far" start as?
    options: ["The first element", "0", "The last index", "The list length"]
    answer: 0
    explanation: Starting at 0 fails when every value is negative. The first element is always a real candidate.
    difficulty: 2
