quiz:
  - id: first-error
    kind: mcq
    prompt: The compiler reports 14 errors. Which should you read first?
    options: ["The first one", "The last one", "The longest one", "Any of them"]
    answer: 0
    explanation: Later errors are often caused by the first. Fix it and recompile.
    difficulty: 1
  - id: smallest-case
    kind: mcq
    prompt: Your solution fails on a hidden test. What is the most useful next step?
    options:
      - Construct the smallest input you can find that also fails
      - Rewrite the whole program
      - Submit again
      - Add more comments
    answer: 0
    explanation: A tiny failing case is easy to trace by hand and usually reveals the bug directly.
    difficulty: 1
  - id: logic-bug
    kind: mcq
    prompt: The program runs with no crash but prints 9 instead of 10. What kind of error is it?
    options: ["A logic error", "A syntax error", "A runtime error", "A compiler bug"]
    answer: 0
    explanation: It ran successfully but computed the wrong value — that is a logic error.
    difficulty: 1
  - id: edge-cases
    kind: mcq
    prompt: Which input is most likely to reveal an off-by-one bug in a loop over a list?
    options: ["A list with exactly one element", "A list with 50 random elements", "A list of positive numbers", "Any typical list"]
    answer: 0
    explanation: Boundary sizes like 1 (and 0 if allowed) expose loops that start or stop one place wrong.
    difficulty: 2
problems: [fix-the-average]
