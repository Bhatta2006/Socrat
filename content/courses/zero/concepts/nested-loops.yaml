id: nested-loops
title: Nested loops
summary: Put a loop inside a loop to handle rows and columns, pairs, and patterns.
module: control-flow
prerequisites: [for-loops]
difficulty: 2
estimated_minutes: 40
lesson: |
  ## The big idea

  A loop's body can contain *another* loop. For **each** round of the outer loop, the
  inner loop runs **all** of its rounds. This is how you walk through rows and columns,
  compare every pair of items, or draw patterns.

  ```python
  for row in range(1, 4):
      line = ""
      for col in range(1, 4):
          line += str(row * col) + " "
      print(line)
  ```

  ```cpp
  for (int row = 1; row <= 3; row++) {
      for (int col = 1; col <= 3; col++) {
          cout << row * col << " ";
      }
      cout << "\n";
  }
  ```

  ```java
  for (int row = 1; row <= 3; row++) {
      for (int col = 1; col <= 3; col++) {
          System.out.print(row * col + " ");
      }
      System.out.println();
  }
  ```

  Output — a multiplication table:

  ```text
  1 2 3
  2 4 6
  3 6 9
  ```

  ## Counting the work

  If the outer loop runs `n` times and the inner loop runs `m` times per outer round, the
  body runs `n × m` times. With n = m = 1000 that is a million rounds. This "multiply the
  loop sizes" habit is the seed of **time complexity**, which you will study in depth
  later.

  ## The inner loop can depend on the outer

  To print a staircase, the inner loop length grows with the row:

  ```python
  n = 4
  for row in range(1, n + 1):
      print("*" * row)
  ```

  ```cpp
  int n = 4;
  for (int row = 1; row <= n; row++) {
      for (int k = 0; k < row; k++) cout << '*';
      cout << "\n";
  }
  ```

  ```java
  int n = 4;
  for (int row = 1; row <= n; row++) {
      for (int k = 0; k < row; k++) System.out.print('*');
      System.out.println();
  }
  ```

  ```text
  *
  **
  ***
  ****
  ```

  ## Pairs

  To consider every pair (i, j) with i < j, start the inner loop just after the outer
  index: `for j in range(i + 1, n)`. That visits each unordered pair exactly once and
  never pairs an item with itself.

  ## Tips

  - Name your counters meaningfully (`row`, `col`) instead of `i`, `j`, `k` everywhere.
  - Know which loop "owns" each statement: the newline belongs after the inner loop.
  - `break` only exits the innermost loop.

  ## Worked walkthrough

  List every pair of indices with i < j for three items. For i=0, visit j=1 and j=2; for i=1, visit j=2; for i=2, visit none. There are three pairs, not nine. Draw the iteration grid and cross out the diagonal and lower triangle. This shows both the no-self-pair rule and the no-duplicate-pair rule.

  ### Why this works

  Inner-loop bounds determine what combinations mean. A full rectangular product visits ordered pairs, while starting j at i+1 visits each unordered pair once. Explain which one the problem requires before writing the loops.

  ### Boundary cases and cost

  Check n=0, n=1 and n=2. Reset a row accumulator at the start of each row, but keep a whole-grid accumulator outside both loops. Resetting at the wrong nesting level silently changes the result.

  The triangular loop is still O(n²); halving the work does not change the growth rate. A rows×columns traversal costs O(rows × columns).

  ### Check your understanding

  How many unordered pairs of distinct positions are there among n items? Count n=4 by hand.

  Try it on paper before reading the reasoning below.

  > There are n(n−1)/2 pairs. For four items the row counts are 3, 2, 1 and 0, totalling six. This counts positions, even when some item values are equal.

key_points:
  - For every outer round, the inner loop runs completely.
  - Total work is the product of the loop sizes.
  - Inner bounds may depend on the outer counter (triangles, pairs with i < j).
  - break exits only the innermost loop.
pitfalls:
  - Putting the newline inside the inner loop instead of after it.
  - Reusing the same counter name for both loops.
  - Not noticing that nested loops over large inputs are slow.
