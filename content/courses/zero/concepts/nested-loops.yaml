quiz:
  - id: body-count
    kind: mcq
    prompt: An outer loop runs 5 times and its inner loop runs 4 times each round. How many times does the inner body run?
    options: ["20", "9", "5", "4"]
    answer: 0
    explanation: Each of the 5 outer rounds runs the inner loop 4 times, so 5 × 4 = 20.
    difficulty: 1
  - id: triangle
    kind: output
    prompt: How many stars are printed in total?
    code:
      python: |
        for row in range(1, 4):
            print("*" * row)
      cpp: |
        for (int row = 1; row <= 3; row++) {
            for (int k = 0; k < row; k++) cout << '*';
            cout << "\n";
        }
      java: |
        for (int row = 1; row <= 3; row++) {
            for (int k = 0; k < row; k++) System.out.print('*');
            System.out.println();
        }
    options: ["6", "9", "3", "4"]
    answer: 0
    explanation: Rows have 1, 2 and 3 stars, so 1 + 2 + 3 = 6.
    difficulty: 2
  - id: pairs
    kind: mcq
    prompt: To visit every pair of different items exactly once, the inner loop index j should start at...
    options: ["i + 1", "0", "i", "n"]
    answer: 0
    explanation: Starting after i skips pairing an item with itself and avoids visiting (i, j) and (j, i) twice.
    difficulty: 2
  - id: break-inner
    kind: mcq
    prompt: A break inside the inner loop does what?
    options: ["Exits only the inner loop", "Exits both loops", "Ends the program", "Skips one inner round"]
    answer: 0
    explanation: break leaves the innermost loop that contains it; the outer loop continues.
    difficulty: 2
problems: [staircase, pair-count]
