quiz:
  - id: range-end
    kind: mcq
    prompt: "In Python, which numbers does range(2, 6) produce?"
    options: ["2, 3, 4, 5", "2, 3, 4, 5, 6", "3, 4, 5, 6", "2, 6"]
    answer: 0
    explanation: range includes the start and stops before the end.
    difficulty: 1
  - id: count-rounds
    kind: output
    prompt: How many lines are printed?
    code:
      python: |
        for i in range(0, 20, 5):
            print(i)
      cpp: |
        for (int i = 0; i < 20; i += 5) cout << i << "\n";
      java: |
        for (int i = 0; i < 20; i += 5) System.out.println(i);
    options: ["4", "5", "20", "3"]
    answer: 0
    explanation: i takes 0, 5, 10 and 15. At 20 the condition fails, so 4 lines.
    difficulty: 2
  - id: for-vs-while
    kind: mcq
    prompt: Which task suits a while loop better than a for loop?
    options:
      - Keep asking for a password until it is correct
      - Print the numbers 1 to 100
      - Add up every value in a list
      - Repeat a message 5 times
    answer: 0
    explanation: You cannot know in advance how many attempts it will take, so loop until the condition changes.
    difficulty: 1
  - id: break-meaning
    kind: mcq
    prompt: What does break do inside a loop?
    options: ["Leaves the loop immediately", "Skips to the next round", "Restarts the loop", "Ends the program"]
    answer: 0
    explanation: break exits the loop; continue skips to the next round.
    difficulty: 1
problems: [fizzbuzz, sum-of-multiples]
