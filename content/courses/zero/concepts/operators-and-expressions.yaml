quiz:
- id: split-seconds
  kind: mcq
  prompt: t = 3725. What does t % 3600 // 60 give?
  options:
  - '2'
  - '62'
  - '5'
  - '1'
  answer: 0
  explanation: 125 seconds are left after the hour, and 125 // 60 is 2.
  difficulty: 1
- id: minutes-from-total
  kind: mcq
  prompt: Why is m = t // 60 wrong for the minutes part of t seconds?
  options:
  - It also counts the minutes that are already inside the hours
  - It rounds the wrong way
  - It gives a decimal
  - It is not wrong
  answer: 0
  explanation: Take the minutes from what is left after the hours.
  difficulty: 2
- id: negative-floor
  kind: mcq
  prompt: What is -7 // 2 in Python?
  options:
  - '-4'
  - '-3'
  - '-3.5'
  - '3'
  answer: 0
  explanation: Python rounds down; C++ and Java would give -3.
  difficulty: 3
- id: average-brackets
  kind: mcq
  prompt: a = 4, b = 5, c = 9. What is a + b + c // 3 in Python?
  options:
  - '12'
  - '6'
  - '18'
  - '7'
  answer: 0
  explanation: Only c is divided, because // runs before +.
  difficulty: 2
- id: plus-equals
  kind: mcq
  prompt: total = 5, then total =+ 3. What is total?
  options:
  - '3'
  - '8'
  - '5'
  - An error
  answer: 0
  explanation: '=+ 3 means = (+3).'
  difficulty: 2
- id: guard-first
  kind: mcq
  prompt: d = 0. Which condition is safe?
  options:
  - d != 0 and n % d == 0
  - n % d == 0 and d != 0
  - Both
  - Neither
  answer: 0
  explanation: and stops at the first false, so the guard must come first.
  difficulty: 3
- id: round-up
  kind: mcq
  prompt: How many boxes of 12 hold 1000 eggs?
  options:
  - '84'
  - '83'
  - '85'
  - '4'
  answer: 0
  explanation: (1000 + 11) // 12 = 84.
  difficulty: 3
- id: round-up-trap
  kind: mcq
  prompt: Why is a // b + 1 not a safe way to round up?
  options:
  - It is one too many when b divides a
  - It is too slow
  - It gives a decimal
  - It only works for negative numbers
  answer: 0
  explanation: 8 // 2 + 1 is 5, but 8 / 2 is exactly 4.
  difficulty: 4
- id: float-root
  kind: mcq
  prompt: Why can int(math.sqrt(n)) be wrong for n near 10^16?
  options:
  - A decimal cannot store such a big n exactly, so it is rounded before the root is taken
  - math.sqrt only works on small numbers
  - int rounds up
  - It is never wrong
  answer: 0
  explanation: Use math.isqrt, or correct a decimal guess with whole numbers.
