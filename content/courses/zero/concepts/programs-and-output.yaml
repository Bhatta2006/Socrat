quiz:
  - id: order-of-output
    kind: output
    prompt: What does this program print?
    code:
      python: |
        print("B")
        print("A")
      cpp: |
        std::cout << "B" << "\n";
        std::cout << "A" << "\n";
      java: |
        System.out.println("B");
        System.out.println("A");
    options: ["B then A on separate lines", "A then B on separate lines", "BA on one line", "Nothing"]
    answer: 0
    explanation: Instructions run top to bottom, so B is printed first, then A, each on its own line.
    difficulty: 1
  - id: quotes-vs-math
    kind: output
    prompt: What is printed?
    code:
      python: print("4 * 2")
      cpp: std::cout << "4 * 2" << "\n";
      java: System.out.println("4 * 2");
    options: ["4 * 2", "8", "42", "An error"]
    answer: 0
    explanation: Everything inside quotes is text, printed exactly as written. No calculation happens.
    difficulty: 1
  - id: comment-ignored
    kind: mcq
    prompt: What does the computer do with a comment?
    options: ["Ignores it completely", "Prints it", "Runs it as code", "Saves it to a file"]
    answer: 0
    explanation: Comments exist only for human readers. The computer skips them.
    difficulty: 1
  - id: precise-instructions
    kind: mcq
    prompt: You wrote `prnt("hi")` instead of `print("hi")` in Python. What happens?
    options:
      - The program stops with an error because prnt is unknown
      - Python guesses you meant print
      - It prints hi anyway
      - It prints nothing but continues
    answer: 0
    explanation: Computers do exactly what you write. An unknown name is an error, not a guess.
    difficulty: 2
  - id: print-sep-end
    kind: output
    prompt: "What does this program print?"
    code:
      python: |
        print("a", "b", sep="-", end="!")
        print("c")
    options:
      - "a-b!c"
      - "a-b!\nc"
      - "a b!c"
      - "a-b\n!c"
    answer: 0
    explanation: "sep goes between the arguments and end replaces the newline, so the second print continues on the same line: a-b!c."
    difficulty: 4
  - id: print-order
    kind: output
    prompt: "What is the exact output?"
    code:
      python: |
        x = 3
        print("x", x, "x" * x)
    options:
      - "x 3 xxx"
      - "3 3 9"
      - "x3xxx"
      - "x 3 x3"
    answer: 0
    explanation: "print separates arguments with a space; \"x\" * 3 repeats the text three times."
    difficulty: 5
