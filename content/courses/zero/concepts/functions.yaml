id: functions
title: Functions
summary: Package a piece of logic under a name, give it inputs, and get a result back.
module: functions-module
prerequisites: [lists]
difficulty: 2
estimated_minutes: 45
lesson: |
  ## The big idea

  A **function** is a named, reusable piece of code. You give it **parameters** (inputs),
  it does its work, and it **returns** a result. Functions let you:

  - write logic once and use it many times;
  - give a complicated step a clear name (`is_prime(n)` reads better than ten lines);
  - test one piece at a time.

  ```python
  def area(width, height):
      return width * height

  print(area(3, 4))        # 12
  print(area(10, 2) + 1)   # 21
  ```

  ```cpp
  long long area(long long width, long long height) {
      return width * height;
  }

  int main() {
      cout << area(3, 4) << "\n";       // 12
      cout << area(10, 2) + 1 << "\n";  // 21
  }
  ```

  ```java
  public class Solution {
      static long area(long width, long height) {
          return width * height;
      }

      public static void main(String[] args) {
          System.out.println(area(3, 4));      // 12
          System.out.println(area(10, 2) + 1); // 21
      }
  }
  ```

  ## What happens on a call

  1. The arguments (3 and 4) are evaluated and copied into the parameters.
  2. The function body runs.
  3. `return` hands a value back **and immediately ends the function**.
  4. The call expression `area(3, 4)` is replaced by that value.

  C++ and Java declare the **return type** (`long long`, `long`) and the parameter types.
  A function that returns nothing has type `void` (C++/Java) or simply has no `return`
  value (Python returns `None`).

  ## print versus return

  This trips up almost everyone once. `print` shows text to a human; `return` gives a value
  back to the **code** that called the function. A function that prints its answer cannot
  be used in a larger calculation. Prefer functions that **return**, and print in one place.

  ## Early return

  `return` can appear in several places. As soon as one runs, the function is done:

  ```python
  def is_prime(n):
      if n < 2:
          return False
      d = 2
      while d * d <= n:
          if n % d == 0:
              return False
          d += 1
      return True
  ```

  ```cpp
  bool isPrime(long long n) {
      if (n < 2) return false;
      for (long long d = 2; d * d <= n; d++)
          if (n % d == 0) return false;
      return true;
  }
  ```

  ```java
  static boolean isPrime(long n) {
      if (n < 2) return false;
      for (long d = 2; d * d <= n; d++)
          if (n % d == 0) return false;
      return true;
  }
  ```

  Checking divisors only up to √n works because divisors come in pairs: if `d` divides `n`,
  so does `n / d`, and one of the two is at most √n.

  ## Designing good functions

  - Do **one** job and name it with a verb or question (`count_vowels`, `is_valid`).
  - Take what you need as parameters rather than reading global variables.
  - Keep them short enough to understand at a glance.
key_points:
  - Functions take parameters, run their body, and return a value.
  - return ends the function immediately and hands back a value.
  - print shows output; return gives a value to the caller — prefer return.
  - Small, single-purpose, well-named functions make programs readable and testable.
pitfalls:
  - Printing inside a function when the caller needed the value.
  - Forgetting to return on every path (C++ may return garbage; Java will not compile).
  - Calling a function without using its returned value.
