quiz:
  - id: return-ends
    kind: output
    prompt: What does f(5) return?
    code:
      python: |
        def f(n):
            if n > 3:
                return "big"
            return "small"
      cpp: |
        string f(int n) {
            if (n > 3) return "big";
            return "small";
        }
      java: |
        static String f(int n) {
            if (n > 3) return "big";
            return "small";
        }
    options: ["big", "small", "big then small", "Nothing"]
    answer: 0
    explanation: The first return runs and ends the function, so the second return is never reached.
    difficulty: 1
  - id: print-vs-return
    kind: mcq
    prompt: Why is `total = add(2, 3) * 10` broken if add prints its result instead of returning it?
    options:
      - add gives no value back to multiply
      - print is slower than return
      - add cannot take two parameters
      - It works fine either way
    answer: 0
    explanation: Printing only shows text. Without return, the caller gets no value (None / void) to use.
    difficulty: 2
  - id: sqrt-bound
    kind: mcq
    prompt: Why may a primality check stop testing divisors once d * d > n?
    options:
      - Any divisor above √n pairs with one below √n that was already tested
      - Larger divisors never exist
      - It is only an approximation
      - Because n is always even
    answer: 0
    explanation: Divisors come in pairs (d, n/d); one of each pair is at most √n.
    difficulty: 3
  - id: call-value
    kind: output
    prompt: What is printed?
    code:
      python: |
        def double(x):
            return x * 2
        print(double(double(3)) + 1)
      cpp: |
        int dbl(int x) { return x * 2; }
        // in main:
        cout << dbl(dbl(3)) + 1;
      java: |
        static int dbl(int x) { return x * 2; }
        // in main:
        System.out.println(dbl(dbl(3)) + 1);
    options: ["13", "7", "12", "10"]
    answer: 0
    explanation: The inner call gives 6, the outer call gives 12, plus 1 is 13.
    difficulty: 2
