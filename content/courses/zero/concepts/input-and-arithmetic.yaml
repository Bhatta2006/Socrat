quiz:
  - id: int-division
    kind: output
    prompt: What is printed?
    code:
      python: print(17 // 5, 17 % 5)
      cpp: std::cout << 17 / 5 << " " << 17 % 5;
      java: System.out.println(17 / 5 + " " + 17 % 5);
    options: ["3 2", "3.4 2", "3 0", "2 3"]
    answer: 0
    explanation: Five fits into 17 three whole times (15), leaving a remainder of 2.
    difficulty: 1
  - id: precedence
    kind: output
    prompt: What is the value of `10 - 2 * 3`?
    options: ["4", "24", "-4", "6"]
    answer: 0
    explanation: Multiplication first (2*3 = 6), then 10 - 6 = 4.
    difficulty: 1
  - id: last-digit
    kind: mcq
    prompt: Which expression gives the last digit of a positive whole number n?
    options: ["n % 10", "n / 10", "n - 10", "n * 10"]
    answer: 0
    explanation: Dividing by 10 leaves the last digit as the remainder.
    difficulty: 2
  - id: input-is-text
    kind: mcq
    prompt: "In Python, `x = input()` and the user types 5. What is `x + x`?"
    options: ['"55" — text joined together', "10", "An error", "25"]
    answer: 0
    explanation: input() returns text. Adding two strings joins them. Use int(input()) to get a number.
    difficulty: 2
  - id: even-check
    kind: mcq
    prompt: How do you check if n is even?
    options: ["n % 2 == 0", "n / 2 == 0", "n % 2 == 1", "n * 2 == n"]
    answer: 0
    explanation: Even numbers leave no remainder when divided by 2.
    difficulty: 1
