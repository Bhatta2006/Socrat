id: problem-solving
title: Solving unfamiliar problems
summary: A repeatable process for turning a problem statement you have never seen into working code.
module: craft
prerequisites: [debugging, maps]
difficulty: 3
estimated_minutes: 45
lesson: |
  ## The big idea

  Tutorial hell feels like this: you can follow along with any video, but a blank editor
  and a new problem leave you stuck. The way out is not more videos — it is a **process**
  you apply every time, until it becomes instinct.

  ## The process

  **1. Understand.** Restate the problem in your own words. What exactly is the input?
  What exactly must be printed? Work the given examples **by hand** and check you get the
  stated answers. Note the constraints (n ≤ 10? n ≤ 200,000?) — they hint at how fast your
  solution must be.

  **2. Make examples.** Invent small cases of your own, especially edges: smallest input,
  all equal, already sorted, negative values. Write the expected answers.

  **3. Solve by hand, then notice what you did.** Solve one example on paper as a human
  would. Then ask: *what steps did I take?* That sequence of steps is your algorithm.

  **4. Start simple.** Write the straightforward (even slow) solution first if you are not
  sure. A correct slow solution is a great stepping stone — and a checker for a faster one.

  **5. Plan in plain words (pseudocode).** Before typing code:

  ```text
  read n and the list
  best = first element
  for each remaining element x:
      if x > best: best = x
  print best
  ```

  **6. Code it**, translating one line of the plan at a time.

  **7. Test** with the examples and your own edge cases. If something fails, debug
  methodically (smallest failing input, find the first wrong value).

  **8. Reflect.** After solving (or reading a solution), ask: *what was the key insight?
  Where else would it apply?* This step turns one solved problem into a reusable pattern.

  ## Common moves when stuck

  - **Simplify**: solve it for n = 1, 2, 3 and look for the pattern.
  - **Work backwards** from what the output needs.
  - **Change representation**: count with a map, sort first, draw it as a grid.
  - **Ask what you would need to know** at each step, and store exactly that.
  - **Brute force first**, then ask which work is repeated and remember it.

  ## Reading constraints

  | n up to | Usually acceptable |
  |---|---|
  | 10 | try everything (2^n, n!) |
  | 1,000 | nested loops (n²) |
  | 200,000 | one pass or sorting (n, n log n) |

  You will learn this properly in time complexity, but start glancing at constraints now.

  ## Asking for help well

  When you ask Socrat (or anyone), share what you tried, a small failing case, and where
  your understanding stops. Good questions get you unstuck faster — and often answer
  themselves.
key_points:
  - Understand the input, output, examples and constraints before coding.
  - Solve small examples by hand and turn your own steps into an algorithm.
  - Write pseudocode, then code, then test edge cases.
  - A correct simple solution first; optimize after.
  - Reflect on the key insight so each problem teaches a reusable pattern.
pitfalls:
  - Coding before understanding the examples.
  - Never testing beyond the given examples.
  - Watching the solution immediately instead of struggling productively for a while.
