quiz:
  - id: first-step
    kind: mcq
    prompt: You open a brand-new problem. What should you do first?
    options:
      - Work through the given examples by hand to confirm you understand them
      - Start typing the solution immediately
      - Search for the answer online
      - Pick the fastest algorithm you know
    answer: 0
    explanation: If you cannot produce the example outputs by hand, any code you write is guesswork.
    difficulty: 1
  - id: constraints
    kind: mcq
    prompt: A problem has n up to 200,000. Which approach is most likely too slow?
    options: ["Checking every pair with nested loops", "One pass with a map", "Sorting then scanning", "Reading input once"]
    answer: 0
    explanation: 200,000² is 4·10^10 operations — far too many. One pass or sorting is fine.
    difficulty: 2
  - id: brute-force
    kind: mcq
    prompt: You see a slow but simple correct solution and are unsure of a fast one. Good move?
    options:
      - Write the simple one first, then look for repeated work to remove
      - Give up
      - Submit nothing until you know the optimal solution
      - Skip testing to save time
    answer: 0
    explanation: A correct baseline gives progress, confidence, and a checker for faster versions.
    difficulty: 1
  - id: reflect
    kind: mcq
    prompt: Why reflect after solving a problem?
    options:
      - To extract the key insight so you recognise it in future problems
      - To make the submission faster
      - It is required by the judge
      - To memorise the exact code
    answer: 0
    explanation: Patterns, not memorized code, transfer to new problems.
    difficulty: 1
problems: [two-sum-exists]
