quiz:
  - id: unique-keys
    kind: output
    prompt: What is printed?
    code:
      python: |
        d = {}
        d["x"] = 1
        d["y"] = 2
        d["x"] = 5
        print(len(d), d["x"])
      cpp: |
        unordered_map<string,int> d;
        d["x"] = 1; d["y"] = 2; d["x"] = 5;
        cout << d.size() << " " << d["x"];
      java: |
        HashMap<String,Integer> d = new HashMap<>();
        d.put("x", 1); d.put("y", 2); d.put("x", 5);
        System.out.println(d.size() + " " + d.get("x"));
    options: ["2 5", "3 5", "2 1", "3 1"]
    answer: 0
    explanation: Keys are unique; the second "x" replaces the value 1 with 5. There are two keys.
    difficulty: 2
  - id: which-structure
    kind: mcq
    prompt: You need to know how many times each word appears in a book. Best choice?
    options: ["A map from word to count", "A list of words searched each time", "A single integer", "A sorted list of counts"]
    answer: 0
    explanation: A map gives instant lookup and update per word — one pass over the book.
    difficulty: 1
  - id: set-use
    kind: mcq
    prompt: Which question is a set perfect for?
    options: ["Have I seen this value before?", "What is the 5th element?", "What is the sum?", "Which value is largest?"]
    answer: 0
    explanation: Sets answer membership questions quickly.
    difficulty: 1
  - id: order
    kind: mcq
    prompt: A problem says "print each word and its count in alphabetical order". What must you do with a hash map?
    options: ["Sort the keys before printing", "Nothing, hash maps are sorted", "Reverse the map", "Use a list instead"]
    answer: 0
    explanation: Hash maps have no guaranteed sorted order. Sort the keys (or use a sorted map such as C++ map or Java TreeMap).
    difficulty: 2
problems: [word-frequency, first-repeat]
