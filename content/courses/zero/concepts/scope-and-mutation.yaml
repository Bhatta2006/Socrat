id: scope-and-mutation
title: Scope, references and mutation
summary: Know where a variable lives, and when passing a list to a function lets it change the original.
module: functions-module
prerequisites: [functions]
difficulty: 3
estimated_minutes: 40
lesson: |
  ## The big idea

  Two questions cause a huge share of beginner bugs:

  1. **Scope** — where is a variable visible?
  2. **Mutation** — when a function changes something it received, does the caller see
     the change?

  ## Scope

  A variable created inside a function is **local**: it exists only while that function
  runs and is invisible outside it. Two functions can each have their own `count`
  without interfering. In C++ and Java, a variable declared inside `{ }` (a loop or an if)
  lives only inside those braces.

  ```python
  def f():
      secret = 42
      return secret + 1

  print(f())        # 43
  # print(secret)   # NameError: secret only existed inside f
  ```

  ```cpp
  int f() {
      int secret = 42;
      return secret + 1;
  }
  // cout << secret;  // compile error: secret is not visible here
  ```

  ```java
  static int f() {
      int secret = 42;
      return secret + 1;
  }
  // System.out.println(secret);  // compile error
  ```

  Pass what a function needs as **parameters** and get results back with **return**.
  Avoid relying on global variables — they make code hard to test and reason about.

  ## Mutation: numbers vs. lists

  **Numbers and strings** passed to a function behave like copies: reassigning the
  parameter does not affect the caller.

  **Lists, arrays and maps** are different in Python and Java: the function receives a
  *reference* to the same object. Changing its contents (`a[0] = 9`, `append`) changes the
  caller's list too.

  ```python
  def bump(nums):
      nums[0] += 100      # mutates the caller's list

  a = [1, 2, 3]
  bump(a)
  print(a)              # [101, 2, 3]
  ```

  ```cpp
  void bump(vector<int> nums) { nums[0] += 100; }   // works on a COPY
  void bumpRef(vector<int>& nums) { nums[0] += 100; } // & = the caller's vector

  vector<int> a = {1, 2, 3};
  bump(a);     // a is still {1, 2, 3}
  bumpRef(a);  // a is now {101, 2, 3}
  ```

  ```java
  static void bump(int[] nums) { nums[0] += 100; }   // arrays are references

  int[] a = {1, 2, 3};
  bump(a);
  System.out.println(java.util.Arrays.toString(a)); // [101, 2, 3]
  ```

  C++ is explicit: by default it **copies**, and `&` means "work on the original". Copying a
  big vector on every call is also slow, so C++ programmers often pass `const vector<int>&`
  — no copy, and no accidental changes.

  ## Aliasing

  In Python and Java, `b = a` for a list does **not** copy it. Both names point to the
  same list, so `b.append(4)` also changes `a`. To copy: Python `b = a[:]` or `list(a)`;
  Java `a.clone()` or `new ArrayList<>(a)`.

  ## Rule of thumb

  Decide deliberately: should this function **modify** its input or **return** a new
  value? Make the name say which (`sort_in_place` vs `sorted_copy`), and never mutate
  by accident.
key_points:
  - Local variables exist only inside their function or block.
  - Pass data in as parameters and send results out with return.
  - In Python and Java, functions receive references to lists/arrays and can mutate them.
  - C++ copies by default; & passes the original, const & avoids copies safely.
  - b = a aliases a list in Python/Java; copy explicitly when you need independence.
pitfalls:
  - Expecting a function to change a number variable of the caller.
  - Accidentally mutating a list passed in, surprising the caller.
  - Copying large vectors on every call in C++.
