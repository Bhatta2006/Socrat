quiz:
  - id: number-param
    kind: output
    prompt: What is printed?
    code:
      python: |
        def change(x):
            x = x + 10
        n = 5
        change(n)
        print(n)
      cpp: |
        void change(int x) { x = x + 10; }
        int n = 5;
        change(n);
        cout << n;
      java: |
        static void change(int x) { x = x + 10; }
        int n = 5;
        change(n);
        System.out.println(n);
    options: ["5", "15", "10", "An error"]
    answer: 0
    explanation: The parameter is a separate copy of the number. Changing it does not affect n.
    difficulty: 2
  - id: list-param
    kind: mcq
    prompt: In Python or Java, a function sets nums[0] = 0 on the list/array it received. What happens to the caller's list?
    options: ["Its first element becomes 0", "Nothing changes", "It is deleted", "It gets a new copy"]
    answer: 0
    explanation: The function received a reference to the same list, so content changes are visible to the caller.
    difficulty: 2
  - id: cpp-ref
    kind: mcq
    prompt: In C++, what does the & in `void f(vector<int>& v)` mean?
    options:
      - f works on the caller's vector, not a copy
      - v is a pointer that must be deleted
      - v is read-only
      - v is copied twice
    answer: 0
    explanation: "The & declares a reference parameter. Add const if the function should not modify it."
    difficulty: 2
  - id: alias
    kind: output
    prompt: "In Python: a = [1, 2]; b = a; b.append(3); print(len(a)). What is printed?"
    options: ["3", "2", "1", "An error"]
    answer: 0
    explanation: b = a does not copy; both names refer to one list, which now has three elements.
    difficulty: 3
problems: []
