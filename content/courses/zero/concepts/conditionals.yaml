quiz:
  - id: first-true-branch
    kind: output
    prompt: With x = 50, what is printed?
    code:
      python: |
        if x > 10:
            print("A")
        elif x > 40:
            print("B")
        else:
            print("C")
      cpp: |
        if (x > 10) cout << "A";
        else if (x > 40) cout << "B";
        else cout << "C";
      java: |
        if (x > 10) System.out.println("A");
        else if (x > 40) System.out.println("B");
        else System.out.println("C");
    options: ["A", "B", "A and B", "C"]
    answer: 0
    explanation: The first true condition wins. 50 > 10 is true, so A prints and the rest is skipped.
    difficulty: 2
  - id: equals-operator
    kind: mcq
    prompt: Which operator asks "are these two values equal?"
    options: ["==", "=", "!=", "=>"]
    answer: 0
    explanation: Double equals compares. Single equals assigns.
    difficulty: 1
  - id: boundary
    kind: mcq
    prompt: A rule says "passing score is 50 or more". Which condition is correct?
    options: ["score >= 50", "score > 50", "score == 50", "score <= 50"]
    answer: 0
    explanation: '"50 or more" includes 50 itself, so use >=. A score of exactly 50 is the boundary to test.'
    difficulty: 1
  - id: else-meaning
    kind: mcq
    prompt: When does the `else` block run?
    options:
      - When none of the conditions above it were true
      - Always, after the if block
      - Only when the if condition is true
      - Never, it is optional decoration
    answer: 0
    explanation: else is the fallback that catches every case the earlier conditions did not.
    difficulty: 1
  - id: elif-order
    kind: output
    prompt: "What does this print for score = 85?"
    code:
      python: |
        score = 85
        if score >= 50:
            print("pass")
        elif score >= 80:
            print("merit")
        else:
            print("fail")
    options:
      - "pass"
      - "merit"
      - "pass and merit"
      - "fail"
    answer: 0
    explanation: "Only the first true branch runs. 85 >= 50 is checked first, so the merit branch is never reached; put the stricter test first."
    difficulty: 4
  - id: dangling-if
    kind: mcq
    prompt: "A grading rule is: under 40 fail, 40 to 69 pass, 70 or more distinction. Which chain is correct for every whole-number score?"
    options:
      - "if s >= 70: D  elif s >= 40: P  else: F"
      - "if s >= 40: P  elif s >= 70: D  else: F"
      - "if s < 70: P  elif s < 40: F  else: D"
      - "if s > 40: P  elif s > 70: D  else: F"
    answer: 0
    explanation: "Test the highest band first so each score lands in exactly one band; the other chains misplace 70+ or 40."
    difficulty: 5
