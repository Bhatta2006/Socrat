id: conditionals
title: Making decisions with if
summary: Use if, else if and else to run different code depending on the situation.
module: control-flow
prerequisites: [input-and-arithmetic]
difficulty: 1
estimated_minutes: 40
lesson: |
  ## The big idea

  So far every line ran every time. Real programs **decide**: *if* the password is right,
  log in; *otherwise*, show an error. A **condition** is a question whose answer is true or
  false, and `if` runs a block of code only when the answer is true.

  ```python
  temperature = int(input())
  if temperature > 30:
      print("Hot day")
  elif temperature > 15:
      print("Nice day")
  else:
      print("Cold day")
  ```

  ```cpp
  int temperature;
  cin >> temperature;
  if (temperature > 30) {
      cout << "Hot day\n";
  } else if (temperature > 15) {
      cout << "Nice day\n";
  } else {
      cout << "Cold day\n";
  }
  ```

  ```java
  int temperature = in.nextInt();
  if (temperature > 30) {
      System.out.println("Hot day");
  } else if (temperature > 15) {
      System.out.println("Nice day");
  } else {
      System.out.println("Cold day");
  }
  ```

  ## How the chain is checked

  The conditions are tested **from top to bottom**, and only the **first** true branch
  runs. With temperature 35, "Hot day" prints and the rest is skipped — even though
  35 > 15 is also true. Order matters: put the most specific test first.

  `else` has no condition. It catches everything that did not match above.

  ## Comparison operators

  | Meaning | Symbol |
  |---|---|
  | equal to | `==` |
  | not equal to | `!=` |
  | less / greater | `<` `>` |
  | at most / at least | `<=` `>=` |

  Note the **double** equals. A single `=` stores a value; `==` *asks* whether two values
  are equal.

  ## Blocks

  Python groups the code inside an `if` by **indentation** (4 spaces). C++ and Java use
  **curly braces** `{ }`. In all three, indent consistently — it shows the structure to
  anyone reading.

  ## Worked example: the larger of two numbers

  ```python
  a, b = map(int, input().split())
  if a >= b:
      print(a)
  else:
      print(b)
  ```

  ```cpp
  int a, b;
  cin >> a >> b;
  if (a >= b) cout << a << "\n";
  else cout << b << "\n";
  ```

  ```java
  int a = in.nextInt(), b = in.nextInt();
  if (a >= b) System.out.println(a);
  else System.out.println(b);
  ```

  When you test a decision, test the **boundaries**: equal values, the smallest value, and
  values right at each threshold (exactly 30, exactly 15). Most bugs live at boundaries.

  ## Worked walkthrough

  Classify a score into high, medium or low. With thresholds 80 and 50, evaluate score 65: the first test fails, the second passes and the low branch is skipped. Compare this with three independent if statements: more than one may run. Trace scores 49, 50, 79 and 80 to settle whether each boundary belongs to the intended category.

  ### Why this works

  An if/else-if chain expresses mutually exclusive choices. Its order matters when predicates overlap: more specific or stricter cases must come first. Before implementation, describe what each branch guarantees and make sure the final else covers all remaining valid inputs.

  ### Things to watch for

  A condition can be logically valid but ordered incorrectly. Checking score >= 50 before score >= 80 makes the high branch unreachable. Also distinguish missing cases from impossible cases.

  A short if/elif chain is instant. If the number of cases keeps growing, a lookup table (you will meet maps soon) is easier than a very long chain.

  ### Check your understanding

  A number divisible by both 3 and 5 needs a special message. Which branch belongs first?

  Try it on paper before reading the reasoning below.

  > The combined condition belongs first; otherwise one of the individual conditions consumes the input before the combined branch is reached.

key_points:
  - "`if` runs a block only when its condition is true."
  - In an if / else-if / else chain, only the first true branch runs.
  - "`==` compares; `=` assigns."
  - Test boundary values — exactly at each threshold.
pitfalls:
  - Writing `=` instead of `==` inside a condition.
  - Putting a broad condition before a narrow one so the narrow branch never runs.
  - Forgetting braces (C++/Java) or indentation (Python), so the wrong lines are inside the if.
