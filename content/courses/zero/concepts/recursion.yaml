quiz:
  - id: base-case
    kind: mcq
    prompt: What happens if a recursive function has no reachable base case?
    options: ["Infinite recursion until a stack overflow", "It returns 0", "It runs once", "The compiler fixes it"]
    answer: 0
    explanation: Without a stopping point, calls pile up on the call stack until it overflows.
    difficulty: 1
  - id: trace
    kind: output
    prompt: What does f(4) return?
    code:
      python: |
        def f(n):
            if n == 0:
                return 0
            return n + f(n - 1)
      cpp: |
        int f(int n) {
            if (n == 0) return 0;
            return n + f(n - 1);
        }
      java: |
        static int f(int n) {
            if (n == 0) return 0;
            return n + f(n - 1);
        }
    options: ["10", "4", "24", "0"]
    answer: 0
    explanation: 4 + 3 + 2 + 1 + 0 = 10.
    difficulty: 2
  - id: order
    kind: output
    prompt: What is printed by g(3)?
    code:
      python: |
        def g(n):
            if n == 0:
                return
            g(n - 1)
            print(n)
      cpp: |
        void g(int n) {
            if (n == 0) return;
            g(n - 1);
            cout << n << "\n";
        }
      java: |
        static void g(int n) {
            if (n == 0) return;
            g(n - 1);
            System.out.println(n);
        }
    options: ["1 2 3 (one per line)", "3 2 1 (one per line)", "3", "Nothing"]
    answer: 0
    explanation: Each call recurses before printing, so the deepest call (n=1) prints first.
    difficulty: 3
  - id: memo
    kind: mcq
    prompt: Why is ways(n) = ways(n-1) + ways(n-2) slow without memoization?
    options:
      - The same subproblems are recomputed an exponential number of times
      - Addition is slow
      - Recursion is always slow
      - It uses too little memory
    answer: 0
    explanation: ways(n-2) is computed inside ways(n-1) and again directly; repeats multiply at every level.
    difficulty: 3
