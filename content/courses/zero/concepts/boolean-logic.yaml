id: boolean-logic
title: Combining conditions
summary: Use and, or and not to express exact rules, and reason about them precisely.
module: control-flow
prerequisites: [conditionals]
difficulty: 2
estimated_minutes: 35
lesson: |
  ## The big idea

  Real rules have several parts: "free shipping if the order is over $50 **and** the
  customer is a member", or "show a warning if the battery is low **or** the device is hot".
  **Boolean logic** combines true/false values into one precise answer.

  | Idea | Python | C++ / Java |
  |---|---|---|
  | both must be true | `and` | `&&` |
  | at least one is true | `or` | `\|\|` |
  | flip true/false | `not` | `!` |

  ```python
  age = 16
  has_permission = True
  if age >= 18 or has_permission:
      print("You may join")
  ```

  ```cpp
  int age = 16;
  bool hasPermission = true;
  if (age >= 18 || hasPermission) {
      cout << "You may join\n";
  }
  ```

  ```java
  int age = 16;
  boolean hasPermission = true;
  if (age >= 18 || hasPermission) {
      System.out.println("You may join");
  }
  ```

  ## Truth tables

  - `A and B` is true only when **both** are true.
  - `A or B` is true when **either** (or both) is true.
  - `not A` is the opposite of A.

  ## Ranges

  "x is between 1 and 10 inclusive" is `x >= 1 and x <= 10`. (Python also allows
  `1 <= x <= 10`, but C++ and Java do not — in C++, `1 <= x <= 10` compiles but means
  something different and is almost always a bug.)

  ## Short-circuiting

  With `and`, if the left side is false, the right side is **not even evaluated** — the
  answer is already false. With `or`, a true left side ends the check. This protects you:

  ```python
  if count > 0 and total / count > 10:
      print("high average")
  ```

  If count is 0, the division never happens, so there is no division-by-zero crash.

  ## De Morgan's laws

  Negating a combined condition flips the connector:

  - `not (A and B)` equals `(not A) or (not B)`
  - `not (A or B)` equals `(not A) and (not B)`

  "Not (sunny and warm)" means "not sunny, or not warm". Getting this wrong is one of the
  most common logic bugs — when you negate, flip **and** ↔ **or**.

  ## Worked example: leap years

  A year is a leap year if it is divisible by 4, **except** years divisible by 100 are not,
  **unless** they are also divisible by 400. As one condition:
  `(y % 4 == 0 and y % 100 != 0) or y % 400 == 0`. 2000 is a leap year; 1900 is not.

  ## Worked walkthrough

  A discount requires membership and a purchase of at least 100. Make four cases: member/small, member/large, non-member/small, non-member/large. Only member/large passes the AND rule. Compare a different rule, membership OR large purchase: now three cases pass. For each input, evaluate the comparisons first and then combine their true/false values.

  ### Why this works

  Translate the specification into a truth table before code. AND means every requirement holds; OR means at least one does. Negating a compound condition flips both the comparisons and the connective: not(A and B) equals not A or not B.

  ### Boundary cases and cost

  Test exact thresholds and values immediately below them. Short-circuiting can protect an operation, such as checking a list is nonempty before reading its first element. Put the guard first.

  A fixed number of boolean tests costs O(1); avoid repeatedly computing an expensive predicate inside a loop.

  ### Check your understanding

  An age must be between 13 and 19 inclusive. Does age >= 13 OR age <= 19 express this?

  Try it on paper before reading the reasoning below.

  > No: every age satisfies at least one side. The bounded interval needs AND. Ages 12, 13, 19 and 20 distinguish the wrong rule from the correct one.

key_points:
  - and/&& needs both sides true; or/|| needs at least one; not/! flips.
  - Express ranges as two comparisons joined by and.
  - Short-circuiting skips the right side when the answer is already known.
  - "De Morgan: not (A and B) = not A or not B, and vice versa."
pitfalls:
  - Writing `1 <= x <= 10` in C++ or Java.
  - Negating a compound condition without flipping and/or.
  - "Writing `x == 1 or 2` instead of `x == 1 or x == 2`."
