quiz:
  - id: and-or
    kind: mcq
    prompt: "If A is true and B is false, what are (A and B) and (A or B)?"
    options: ["false and true", "true and false", "true and true", "false and false"]
    answer: 0
    explanation: and needs both true (so false); or needs at least one (so true).
    difficulty: 1
  - id: de-morgan
    kind: mcq
    prompt: Which is equivalent to not (x > 5 and y > 5)?
    options: ["x <= 5 or y <= 5", "x <= 5 and y <= 5", "x > 5 or y > 5", "x < 5 and y < 5"]
    answer: 0
    explanation: Negate each part (> becomes <=) and flip and to or.
    difficulty: 3
  - id: range-check
    kind: mcq
    prompt: Which condition means "x is from 1 to 10 inclusive" in every language?
    options: ["x >= 1 and x <= 10", "x >= 1 or x <= 10", "x > 1 and x < 10", "1 <= x or x <= 10"]
    answer: 0
    explanation: Both bounds must hold, so join two comparisons with and, using >= and <= for inclusive.
    difficulty: 2
  - id: short-circuit
    kind: mcq
    prompt: "In `count != 0 and total / count > 2`, what happens when count is 0?"
    options:
      - The division is skipped and the whole condition is false
      - The program crashes dividing by zero
      - The condition is true
      - Both sides are evaluated anyway
    answer: 0
    explanation: Because the left side is false, and already knows the answer and never evaluates the right side.
    difficulty: 2
  - id: negate-both
    kind: mcq
    prompt: "Which expression is equivalent to not (a and b)?"
    options:
      - "(not a) or (not b)"
      - "(not a) and (not b)"
      - "not a and b"
      - "a or b"
    answer: 0
    explanation: "De Morgan's law: not (a and b) is true when at least one of a, b is false."
    difficulty: 4
  - id: guard-first
    kind: mcq
    prompt: "xs may be empty. Which condition is safe to evaluate?"
    options:
      - "len(xs) > 0 and xs[0] == 5"
      - "xs[0] == 5 and len(xs) > 0"
      - "xs[0] == 5 or len(xs) > 0"
      - "Both of the first two"
    answer: 0
    explanation: "and stops at the first false operand, so the length check must come first to protect xs[0]."
    difficulty: 5
problems: [leap-year, club-entry]
