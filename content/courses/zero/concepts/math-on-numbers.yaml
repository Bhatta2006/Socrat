quiz:
- id: digit-count-zero
  kind: mcq
  prompt: The loop `while n > 0` counts digits. What must you add for n = 0?
  options:
  - A special case, because 0 has one digit but the loop never runs
  - Nothing
  - Start the count at 1 for every n
  - Use while n >= 0
  answer: 0
  explanation: Starting at 1 would overcount every other number, and n >= 0 never stops.
  difficulty: 1
