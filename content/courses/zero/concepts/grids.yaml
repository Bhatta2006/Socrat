id: grids
title: Grids and 2D lists
summary: Represent boards, maps and tables as lists of rows, and move around them safely.
module: collections
prerequisites: [nested-loops, lists]
difficulty: 3
estimated_minutes: 45
lesson: |
  ## The big idea

  Many problems live on a **grid**: a game board, a maze, an image, a seating chart. Store
  a grid as a list of rows, where each row is itself a list. Then `grid[r][c]` is the cell
  in row `r`, column `c` — row first, column second.

  ```python
  rows, cols = 3, 4
  grid = [[0] * cols for _ in range(rows)]   # 3 rows of 4 zeros
  grid[1][2] = 7
  for r in range(rows):
      print(" ".join(map(str, grid[r])))
  ```

  ```cpp
  int rows = 3, cols = 4;
  vector<vector<int>> grid(rows, vector<int>(cols, 0));
  grid[1][2] = 7;
  for (int r = 0; r < rows; r++) {
      for (int c = 0; c < cols; c++) cout << grid[r][c] << " ";
      cout << "\n";
  }
  ```

  ```java
  int rows = 3, cols = 4;
  int[][] grid = new int[rows][cols];   // filled with 0
  grid[1][2] = 7;
  for (int r = 0; r < rows; r++) {
      StringBuilder line = new StringBuilder();
      for (int c = 0; c < cols; c++) line.append(grid[r][c]).append(' ');
      System.out.println(line.toString().trim());
  }
  ```

  **Python trap:** `[[0] * cols] * rows` creates `rows` references to the *same* row —
  changing one cell changes the whole column. Always build rows in a loop as above.

  ## Character grids

  Mazes usually arrive as lines of characters like `#..#`. Read each line as a string;
  `grid[r][c]` is then a character.

  ## Neighbours and bounds

  The four neighbours of `(r, c)` are up, down, left and right. A clean way to visit them
  is with **direction arrays**:

  ```python
  dr = [-1, 1, 0, 0]
  dc = [0, 0, -1, 1]
  for k in range(4):
      nr, nc = r + dr[k], c + dc[k]
      if 0 <= nr < rows and 0 <= nc < cols:
          ...  # (nr, nc) is a real neighbour
  ```

  ```cpp
  int dr[] = {-1, 1, 0, 0}, dc[] = {0, 0, -1, 1};
  for (int k = 0; k < 4; k++) {
      int nr = r + dr[k], nc = c + dc[k];
      if (nr >= 0 && nr < rows && nc >= 0 && nc < cols) { /* real neighbour */ }
  }
  ```

  ```java
  int[] dr = {-1, 1, 0, 0}, dc = {0, 0, -1, 1};
  for (int k = 0; k < 4; k++) {
      int nr = r + dr[k], nc = c + dc[k];
      if (nr >= 0 && nr < rows && nc >= 0 && nc < cols) { /* real neighbour */ }
  }
  ```

  **Always check bounds before reading a neighbour.** Cells on the edge have fewer than
  four neighbours, and reading outside the grid is the classic grid bug. For eight
  directions (including diagonals), extend the arrays to eight entries.

  ## Worked idea: counting around each cell

  In Minesweeper, each safe cell shows how many of its eight neighbours are mines. For every
  cell, loop over the eight directions, check bounds, and count `*` characters. That is a
  nested loop over cells with a small fixed loop over directions inside — about
  `rows × cols × 8` steps.
key_points:
  - A grid is a list of rows; access cells as grid[row][col].
  - In Python, build rows in a loop — never multiply a list of lists.
  - Direction arrays make neighbour loops short and uniform.
  - Check bounds before touching any neighbour.
pitfalls:
  - Swapping row and column (grid[c][r]).
  - Reading neighbours outside the grid on edge cells.
  - Python's shared-row bug from [[0] * cols] * rows.
