quiz:
  - id: index-order
    kind: mcq
    prompt: In grid[r][c], what does r select?
    options: ["The row", "The column", "The cell value", "The number of rows"]
    answer: 0
    explanation: The outer list holds rows, so the first index picks a row and the second a column within it.
    difficulty: 1
  - id: corner-neighbours
    kind: mcq
    prompt: How many of the 4 up/down/left/right neighbours does a corner cell have inside the grid?
    options: ["2", "4", "3", "1"]
    answer: 0
    explanation: A corner is on two edges, so two of its four directions leave the grid.
    difficulty: 2
  - id: python-shared-rows
    kind: mcq
    prompt: "In Python, g = [[0] * 3] * 2 and then g[0][0] = 5. What is g[1][0]?"
    options: ["5", "0", "An error", "3"]
    answer: 0
    explanation: Both rows are the same list object, so changing one changes the other.
    difficulty: 3
  - id: work
    kind: mcq
    prompt: For a 100 × 100 grid, checking all 8 neighbours of every cell takes about how many checks?
    options: ["80,000", "10,000", "800", "1,000,000"]
    answer: 0
    explanation: 100 × 100 cells × 8 directions = 80,000.
    difficulty: 2
