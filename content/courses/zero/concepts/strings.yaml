id: strings
title: Strings
summary: Text is a sequence of characters — index it, loop over it, compare it and build new text.
module: collections
prerequisites: [lists]
difficulty: 2
estimated_minutes: 45
lesson: |
  ## The big idea

  A **string** is a sequence of characters, so most list ideas carry straight over:
  length, indexes from 0, and looping over each character.

  ```python
  word = "socrat"
  print(len(word))        # 6
  print(word[0])          # s
  print(word[-1])         # t  (Python: negative index counts from the end)
  print(word.upper())     # SOCRAT
  for ch in word:
      print(ch)
  ```

  ```cpp
  #include <string>
  string word = "socrat";
  cout << word.size() << "\n";   // 6
  cout << word[0] << "\n";       // s
  cout << word.back() << "\n";   // t
  for (char ch : word) cout << ch << "\n";
  ```

  ```java
  String word = "socrat";
  System.out.println(word.length());      // 6
  System.out.println(word.charAt(0));     // s
  System.out.println(word.toUpperCase()); // SOCRAT
  for (char ch : word.toCharArray()) System.out.println(ch);
  ```

  ## Strings are (usually) immutable

  In Python and Java you cannot change a character in place — methods like `upper()`
  return a **new** string. C++ `std::string` *is* mutable (`word[0] = 'S'`). When you build
  a string piece by piece:

  - Python: collect pieces in a list, then `"".join(pieces)`.
  - Java: use `StringBuilder` and `append`, then `toString()`.
  - C++: `+=` on a `std::string` is fine.

  Repeatedly doing `s = s + piece` in Python or Java copies the whole string every time —
  slow for long text.

  ## Characters are numbers underneath

  Each character has a numeric code. Letters are consecutive, which enables tricks:

  - Python: `ord('c') - ord('a')` is 2; `chr(ord('a') + 2)` is `'c'`.
  - C++/Java: `'c' - 'a'` is 2; `(char)('a' + 2)` is `'c'`.

  This is how you count letters with an array of 26 slots or shift letters in a cipher.

  ## Comparing strings

  `==` compares contents in Python and C++. **In Java, always use `a.equals(b)`** — `==`
  checks whether two variables refer to the same object, which can be false for equal
  text.

  ## Worked example: is it a palindrome?

  A palindrome reads the same backwards ("level"). Compare the first and last characters,
  then move inward:

  ```python
  s = input().strip()
  i, j = 0, len(s) - 1
  ok = True
  while i < j:
      if s[i] != s[j]:
          ok = False
          break
      i += 1
      j -= 1
  print("YES" if ok else "NO")
  ```

  ```cpp
  string s; cin >> s;
  bool ok = true;
  for (int i = 0, j = (int)s.size() - 1; i < j; i++, j--)
      if (s[i] != s[j]) { ok = false; break; }
  cout << (ok ? "YES" : "NO") << "\n";
  ```

  ```java
  String s = in.next();
  boolean ok = true;
  for (int i = 0, j = s.length() - 1; i < j; i++, j--)
      if (s.charAt(i) != s.charAt(j)) { ok = false; break; }
  System.out.println(ok ? "YES" : "NO");
  ```

  Two indexes walking toward each other — remember this shape. It returns as the
  **two pointers** technique in data structures and algorithms.
key_points:
  - Strings behave like lists of characters with indexes from 0.
  - Python and Java strings are immutable; build text with join or StringBuilder.
  - Characters have numeric codes; 'c' - 'a' gives a letter's position.
  - In Java compare strings with equals, not ==.
pitfalls:
  - Using == for strings in Java.
  - Building long strings with repeated + in a loop (slow in Python/Java).
  - Forgetting that input lines may carry trailing spaces or newlines.
