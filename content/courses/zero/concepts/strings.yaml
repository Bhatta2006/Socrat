quiz:
  - id: char-math
    kind: mcq
    prompt: What is the value of 'e' - 'a' (C++/Java) or ord('e') - ord('a') (Python)?
    options: ["4", "5", "101", "An error"]
    answer: 0
    explanation: Letters are consecutive codes, and e is four letters after a.
    difficulty: 2
  - id: java-equals
    kind: mcq
    prompt: In Java, how should you check whether two strings have the same text?
    options: ["a.equals(b)", "a == b", "a = b", "a.compare(b)"]
    answer: 0
    explanation: == compares object identity in Java; equals compares the characters.
    difficulty: 1
  - id: immutability
    kind: mcq
    prompt: In Python, what does `name.upper()` do to the string stored in name?
    options:
      - Nothing — it returns a new uppercase string
      - Changes name to uppercase in place
      - Raises an error
      - Deletes name
    answer: 0
    explanation: Python strings are immutable. Assign the result (name = name.upper()) to keep it.
    difficulty: 2
  - id: string-index
    kind: output
    prompt: What is printed?
    code:
      python: |
        s = "algorithm"
        print(s[2] + s[len(s) - 1])
      cpp: |
        string s = "algorithm";
        cout << s[2] << s[s.size() - 1];
      java: |
        String s = "algorithm";
        System.out.println("" + s.charAt(2) + s.charAt(s.length() - 1));
    options: ["gm", "lm", "gh", "ga"]
    answer: 0
    explanation: Index 2 is g (a=0, l=1, g=2) and the last character is m.
    difficulty: 1
