quiz:
  - id: insert-order
    kind: mcq
    prompt: To insert node x after node p, which assignment must come first?
    options: ["x.next = p.next", "p.next = x", "p = x", "x = p.next"]
    answer: 0
    explanation: If you set p.next = x first, the reference to the rest of the list is lost.
    difficulty: 2
  - id: access-cost
    kind: mcq
    prompt: What does it cost to read the k-th element of a singly linked list?
    options: ["O(k)", "O(1)", "O(log k)", "O(n²)"]
    answer: 0
    explanation: You must follow k pointers from the head.
    difficulty: 1
  - id: cycle
    kind: mcq
    prompt: How do fast and slow pointers detect a cycle?
    options:
      - If a cycle exists, the fast pointer eventually meets the slow pointer
      - The slow pointer reaches null first
      - Both reach the middle at the same time
      - They count the nodes
    answer: 0
    explanation: Inside a cycle the gap shrinks by one each step, so they must meet.
    difficulty: 2
  - id: dummy
    kind: mcq
    prompt: Why use a dummy head node?
    options:
      - So operations at the front of the list need no special case
      - To make the list faster
      - To store the length
      - It is required in Java
    answer: 0
    explanation: Every real node then has a predecessor, so insert/delete logic is uniform.
    difficulty: 2
