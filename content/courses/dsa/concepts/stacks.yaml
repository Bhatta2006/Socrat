id: stacks
title: Stacks, queues and monotonic stacks
summary: Last-in-first-out and first-in-first-out containers, and the monotonic stack trick for "next greater" questions.
module: linear-patterns
prerequisites: [arrays-hashing]
difficulty: 3
estimated_minutes: 55
lesson: |
  ## The big idea

  A **stack** is last-in, first-out (LIFO): like a pile of plates, you push on top and pop
  from the top. A **queue** is first-in, first-out (FIFO): like a line at a shop. Both give
  O(1) push and pop, and the right choice often *is* the solution.

  | | Python | C++ | Java |
  |---|---|---|---|
  | stack | `list` (`append`, `pop`) | `stack<T>` / `vector<T>` | `ArrayDeque` (`push`, `pop`) |
  | queue | `collections.deque` (`append`, `popleft`) | `queue<T>` / `deque<T>` | `ArrayDeque` (`offer`, `poll`) |

  (Never use `list.pop(0)` in Python for a queue — it is O(n).)

  ## Stacks match "most recent unfinished thing"

  Balanced brackets: every closing bracket must match the **most recent unmatched**
  opening bracket — exactly what the top of a stack holds.

  ```python
  def balanced(s):
      pairs = {")": "(", "]": "[", "}": "{"}
      stack = []
      for ch in s:
          if ch in "([{":
              stack.append(ch)
          elif not stack or stack.pop() != pairs[ch]:
              return False
      return not stack            # leftovers are unmatched openers
  ```

  ```cpp
  bool balanced(const string& s) {
      vector<char> st;
      for (char ch : s) {
          if (ch == '(' || ch == '[' || ch == '{') { st.push_back(ch); continue; }
          char want = ch == ')' ? '(' : ch == ']' ? '[' : '{';
          if (st.empty() || st.back() != want) return false;
          st.pop_back();
      }
      return st.empty();
  }
  ```

  ```java
  static boolean balanced(String s) {
      ArrayDeque<Character> st = new ArrayDeque<>();
      for (char ch : s.toCharArray()) {
          if (ch == '(' || ch == '[' || ch == '{') { st.push(ch); continue; }
          char want = ch == ')' ? '(' : ch == ']' ? '[' : '{';
          if (st.isEmpty() || st.pop() != want) return false;
      }
      return st.isEmpty();
  }
  ```

  Other stack problems: undo history, evaluating expressions, simplifying paths, and
  turning recursion into iteration.

  ## The monotonic stack

  "For each day, how many days until a warmer temperature?" Brute force checks every later
  day: O(n²). Instead keep a stack of indexes whose answer is **still unknown**, with
  temperatures **decreasing** from bottom to top. When a warmer day arrives, it is the
  answer for every colder day on top — pop them all.

  ```python
  def next_greater(a):
      res = [-1] * len(a)
      stack = []                       # indexes, values decreasing
      for i, x in enumerate(a):
          while stack and a[stack[-1]] < x:
              res[stack.pop()] = x
          stack.append(i)
      return res
  ```

  ```cpp
  vector<long long> nextGreater(const vector<long long>& a) {
      vector<long long> res(a.size(), -1);
      vector<int> st;
      for (int i = 0; i < (int)a.size(); i++) {
          while (!st.empty() && a[st.back()] < a[i]) { res[st.back()] = a[i]; st.pop_back(); }
          st.push_back(i);
      }
      return res;
  }
  ```

  ```java
  static long[] nextGreater(long[] a) {
      long[] res = new long[a.length];
      java.util.Arrays.fill(res, -1);
      int[] st = new int[a.length];
      int top = 0;
      for (int i = 0; i < a.length; i++) {
          while (top > 0 && a[st[top - 1]] < a[i]) res[st[--top]] = a[i];
          st[top++] = i;
      }
      return res;
  }
  ```

  Each index is pushed once and popped at most once, so the total is **O(n)** even though
  there is a loop inside a loop. Variants answer "previous smaller", "largest rectangle in
  a histogram" and "stock span".

  ## Queues

  Queues process things **in arrival order**: simulations, task scheduling, and above all
  **breadth-first search**, which you will meet in graphs.
key_points:
  - Stack = LIFO, queue = FIFO; both O(1) per operation with the right container.
  - A stack holds the most recent unfinished item — perfect for matching brackets.
  - Monotonic stacks answer next/previous greater/smaller in O(n) total.
  - Amortised analysis — each element is pushed and popped at most once.
  - Use deque for queues in Python, never list.pop(0).
pitfalls:
  - Popping from an empty stack (check first).
  - Forgetting to check that the stack is empty at the end (unmatched openers).
  - Storing values instead of indexes when you need positions or distances.
