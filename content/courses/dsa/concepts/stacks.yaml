quiz:
  - id: lifo
    kind: mcq
    prompt: Push 1, push 2, push 3, pop, push 4, pop. What is on top?
    options: ["2", "4", "3", "1"]
    answer: 0
    explanation: After popping 3 and pushing then popping 4, the stack is [1, 2] with 2 on top.
    difficulty: 1
  - id: queue-structure
    kind: mcq
    prompt: Which structure processes items strictly in arrival order?
    options: ["Queue", "Stack", "Hash set", "Heap"]
    answer: 0
    explanation: A queue is first-in, first-out.
    difficulty: 1
  - id: amortized
    kind: mcq
    prompt: Why is the monotonic-stack "next greater element" O(n) despite a nested while loop?
    options:
      - Each index is pushed once and popped at most once overall
      - The while loop runs at most once per step
      - The array is sorted
      - It isn't — it's O(n²)
    answer: 0
    explanation: Total pops can't exceed total pushes (n), so the combined work is linear.
    difficulty: 3
  - id: brackets
    kind: mcq
    prompt: For "(]", what does the stack algorithm decide?
    options: ["Not balanced — ] does not match the top (", "Balanced", "Error: empty stack", "Balanced because the counts match"]
    answer: 0
    explanation: Types must match the most recent opener, not just the counts.
    difficulty: 2
