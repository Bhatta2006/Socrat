quiz:
  - id: pop-cost
    kind: mcq
    prompt: What does popping the minimum from a binary heap of n items cost?
    options: ["O(log n)", "O(1)", "O(n)", "O(n log n)"]
    answer: 0
    explanation: The replacement element sifts down one path of a complete tree, about log n levels.
    difficulty: 1
  - id: cpp-default
    kind: mcq
    prompt: In C++, std::priority_queue<int> by default returns...
    options: ["The largest element first", "The smallest element first", "Elements in insertion order", "A random element"]
    answer: 0
    explanation: C++ defaults to a max-heap; use greater<int> for a min-heap.
    difficulty: 2
  - id: topk
    kind: mcq
    prompt: To track the k largest values of a stream, which heap do you keep?
    options: ["A min-heap of size k", "A max-heap of all values", "A min-heap of all values", "A max-heap of size k"]
    answer: 0
    explanation: The min-heap's root is the weakest of the top k, so it's the one to evict.
    difficulty: 3
  - id: children
    kind: mcq
    prompt: In a 0-indexed array heap, where are the children of index 3?
    options: ["7 and 8", "6 and 7", "4 and 5", "1 and 2"]
    answer: 0
    explanation: Children are at 2i + 1 = 7 and 2i + 2 = 8.
    difficulty: 2
