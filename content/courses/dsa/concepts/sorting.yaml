id: sorting
title: Sorting
summary: How merge sort and quicksort reach O(n log n), how to sort by custom rules, and why sorting first simplifies problems.
module: ordering
prerequisites: [complexity, zero:recursion]
difficulty: 3
estimated_minutes: 60
lesson: |
  ## The big idea

  Sorting is the most useful preprocessing step in algorithms. Once data is sorted,
  duplicates are neighbours, ranges are contiguous, binary search works, two pointers work,
  and greedy choices become provable. Comparison sorts cannot beat **O(n log n)**, and the
  library sort already achieves it — so in practice you mostly need to **use** sorting
  well and **understand** how it works.

  ## Merge sort: divide and conquer

  Split the array in half, sort each half recursively, then **merge** two sorted halves by
  repeatedly taking the smaller front element.

  ```python
  def merge_sort(a):
      if len(a) <= 1:
          return a
      mid = len(a) // 2
      left, right = merge_sort(a[:mid]), merge_sort(a[mid:])
      out, i, j = [], 0, 0
      while i < len(left) and j < len(right):
          if left[i] <= right[j]:
              out.append(left[i]); i += 1
          else:
              out.append(right[j]); j += 1
      return out + left[i:] + right[j:]
  ```

  ```cpp
  void mergeSort(vector<int>& a, int lo, int hi, vector<int>& tmp) {  // sorts [lo, hi)
      if (hi - lo <= 1) return;
      int mid = (lo + hi) / 2;
      mergeSort(a, lo, mid, tmp);
      mergeSort(a, mid, hi, tmp);
      int i = lo, j = mid, k = lo;
      while (i < mid && j < hi) tmp[k++] = a[i] <= a[j] ? a[i++] : a[j++];
      while (i < mid) tmp[k++] = a[i++];
      while (j < hi) tmp[k++] = a[j++];
      for (int t = lo; t < hi; t++) a[t] = tmp[t];
  }
  ```

  ```java
  static void mergeSort(int[] a, int lo, int hi, int[] tmp) {        // sorts [lo, hi)
      if (hi - lo <= 1) return;
      int mid = (lo + hi) >>> 1;
      mergeSort(a, lo, mid, tmp);
      mergeSort(a, mid, hi, tmp);
      int i = lo, j = mid, k = lo;
      while (i < mid && j < hi) tmp[k++] = a[i] <= a[j] ? a[i++] : a[j++];
      while (i < mid) tmp[k++] = a[i++];
      while (j < hi) tmp[k++] = a[j++];
      System.arraycopy(tmp, lo, a, lo, hi - lo);
  }
  ```

  There are log n levels of splitting, and each level does O(n) merging work:
  **O(n log n)** always, with O(n) extra space. Merge sort is **stable** (equal elements
  keep their order). The merge step also counts **inversions** for free: when you take from
  the right half, every remaining left element forms an inversion with it.

  ## Quicksort and quickselect

  Quicksort picks a pivot, partitions into "smaller" and "larger", and recurses. Average
  O(n log n), worst O(n²) with bad pivots (random pivots fix this in practice).
  **Quickselect** recurses into only one side to find the k-th smallest in O(n) average.

  ## Sorting by your own rules

  Sort students by score descending, then name ascending:

  ```python
  students.sort(key=lambda s: (-s.score, s.name))
  ```

  ```cpp
  sort(v.begin(), v.end(), [](const Student& a, const Student& b) {
      if (a.score != b.score) return a.score > b.score;
      return a.name < b.name;
  });
  ```

  ```java
  list.sort(Comparator.comparingInt((Student s) -> -s.score).thenComparing(s -> s.name));
  ```

  A C++ comparator must be a **strict** "less than" (`a < b`, never `<=`), or `sort` may
  crash.

  ## Counting sort

  When values are small integers (ages, letters, scores 0–100), count each value and
  rebuild: **O(n + range)**, beating O(n log n).
key_points:
  - Comparison sorting is O(n log n) at best; library sorts already achieve it.
  - Merge sort - split, recurse, merge — stable, O(n log n), O(n) space; counts inversions.
  - Quicksort is fast on average; quickselect finds the k-th element in O(n) average.
  - Sort by tuples / comparators for multi-key ordering.
  - Sorting first often turns hard problems into easy scans.
pitfalls:
  - Non-strict comparators in C++ (using <=).
  - Forgetting tie-breaking rules required by the problem.
  - Sorting inside a loop, accidentally making O(n² log n).
