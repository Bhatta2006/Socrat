quiz:
  - id: merge-complexity
    kind: mcq
    prompt: Why is merge sort O(n log n)?
    options:
      - log n levels of splitting, each doing O(n) merge work
      - It compares every pair once
      - It sorts n numbers in log n steps
      - The merge step is O(log n)
    answer: 0
    explanation: Halving gives log n levels; merging all subarrays at one level touches n elements.
    difficulty: 2
  - id: stable
    kind: mcq
    prompt: What does it mean for a sort to be stable?
    options: ["Equal elements keep their original relative order", "It never crashes", "It uses O(1) space", "It is always O(n log n)"]
    answer: 0
    explanation: Stability matters when sorting by one key after another.
    difficulty: 2
  - id: quicksort-worst
    kind: mcq
    prompt: When does quicksort degrade to O(n²)?
    options: ["When pivots are consistently the smallest or largest element", "On random data", "When n is even", "Never"]
    answer: 0
    explanation: Unbalanced partitions make n levels of recursion; random pivots make this very unlikely.
    difficulty: 3
  - id: counting
    kind: mcq
    prompt: Sorting a million exam scores in 0..100 is fastest with...
    options: ["Counting sort", "Bubble sort", "Merge sort", "Binary search"]
    answer: 0
    explanation: With only 101 possible values, counting takes O(n + 101).
    difficulty: 2
