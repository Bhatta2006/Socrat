quiz:
  - id: two-sum-complexity
    kind: mcq
    prompt: Two Sum with a hash map runs in what time?
    options: ["O(n)", "O(n²)", "O(n log n)", "O(1)"]
    answer: 0
    explanation: One pass, with an O(1) average lookup per element.
    difficulty: 1
  - id: anagram-key
    kind: mcq
    prompt: To group anagrams, which key works for every word?
    options: ["The word's letters sorted", "The word's length", "The first letter", "The word reversed"]
    answer: 0
    explanation: Anagrams have exactly the same sorted letters, so they share that key.
    difficulty: 2
  - id: check-before-insert
    kind: mcq
    prompt: In Two Sum, why check for target − x before inserting x?
    options:
      - So an element is never paired with itself
      - Inserting is slower than checking
      - Maps cannot store duplicates
      - It makes no difference
    answer: 0
    explanation: If target = 2x, inserting first would let x match itself.
    difficulty: 2
  - id: counting-array
    kind: mcq
    prompt: You must count lowercase letters in a string. What is the simplest O(1)-space structure?
    options: ["An array of 26 counters", "A sorted list", "A hash map of strings", "A 2D grid"]
    answer: 0
    explanation: With a fixed small key range, index = letter − 'a' into a 26-slot array.
    difficulty: 2
problems: [valid-anagram, top-k-frequent]
