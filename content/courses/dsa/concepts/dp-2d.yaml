quiz:
  - id: lcs-match
    kind: mcq
    prompt: In LCS, if a[i−1] == b[j−1], then dp[i][j] equals...
    options: ["dp[i−1][j−1] + 1", "max(dp[i−1][j], dp[i][j−1])", "dp[i−1][j] + 1", "0"]
    answer: 0
    explanation: A matching character extends the LCS of both shorter prefixes.
    difficulty: 2
  - id: lcs-value
    kind: mcq
    prompt: What is the LCS length of "abcde" and "ace"?
    options: ["3", "2", "5", "1"]
    answer: 0
    explanation: '"ace" itself is a subsequence of both.'
    difficulty: 1
  - id: knapsack-direction
    kind: mcq
    prompt: In 1D 0/1 knapsack, why iterate capacity from high to low?
    options:
      - So each item is used at most once
      - It is faster
      - To find the minimum
      - Low-to-high causes overflow
    answer: 0
    explanation: Going upward would reuse the current item's own updated values — unbounded knapsack.
    difficulty: 3
  - id: grid-paths
    kind: mcq
    prompt: Moving only right or down, how many paths cross an open 3 × 3 grid of cells from corner to corner?
    options: ["6", "9", "3", "4"]
    answer: 0
    explanation: 2 rights and 2 downs in any order — C(4, 2) = 6.
    difficulty: 2
problems: [lcs-length, grid-paths]
