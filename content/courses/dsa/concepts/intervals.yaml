quiz:
  - id: overlap
    kind: mcq
    prompt: Do the closed intervals [1, 5] and [5, 9] overlap?
    options: ["Yes, they share the point 5", "No", "Only if sorted", "Only if open intervals"]
    answer: 0
    explanation: 1 ≤ 9 and 5 ≤ 5, so the closed intervals share point 5. Always confirm the convention.
    difficulty: 1
  - id: nested
    kind: mcq
    prompt: Merging sorted intervals [1, 10] then [2, 3], what is the merged result?
    options: ["[1, 10]", "[1, 3]", "[1, 10] and [2, 3]", "[2, 10]"]
    answer: 0
    explanation: The end is max(10, 3) = 10 — that's why merging uses max.
    difficulty: 2
  - id: rooms
    kind: mcq
    prompt: Which technique finds the minimum number of meeting rooms?
    options: ["Sweep line over start/end events tracking the maximum concurrent count", "Binary search on the answer only", "Sorting by length", "Hashing start times"]
    answer: 0
    explanation: The peak number of simultaneous meetings is the number of rooms needed.
    difficulty: 2
  - id: first-step
    kind: mcq
    prompt: What is almost always the first step in an interval problem?
    options: ["Sort the intervals", "Build a hash map", "Reverse the list", "Use recursion"]
    answer: 0
    explanation: Sorting (by start, or by end for greedy selection) makes a linear sweep possible.
    difficulty: 1
