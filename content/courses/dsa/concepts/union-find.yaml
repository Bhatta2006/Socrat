quiz:
  - id: same-group
    kind: mcq
    prompt: How does DSU decide whether a and b are in the same group?
    options: ["find(a) == find(b)", "parent[a] == parent[b]", "a == b", "size[a] == size[b]"]
    answer: 0
    explanation: Two elements share a group exactly when they have the same root.
    difficulty: 1
  - id: cycle
    kind: mcq
    prompt: Processing undirected edges with DSU, union(u, v) returns false. What does that mean?
    options: ["Edge (u, v) closes a cycle", "u and v are isolated", "The DSU is broken", "u equals v always"]
    answer: 0
    explanation: u and v were already connected, so adding the edge creates a cycle.
    difficulty: 2
  - id: components
    kind: mcq
    prompt: n nodes, then 5 successful unions. How many components remain?
    options: ["n − 5", "n", "5", "n + 5"]
    answer: 0
    explanation: Each successful union merges two components into one.
    difficulty: 1
  - id: optimisations
    kind: mcq
    prompt: Which pair of optimisations makes DSU nearly constant time?
    options: ["Path compression and union by size/rank", "Sorting and hashing", "Recursion and memoization", "Binary search and heaps"]
    answer: 0
    explanation: Together they bound the amortised cost by the inverse Ackermann function.
    difficulty: 2
