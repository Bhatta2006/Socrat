quiz:
  - id: which-moves
    kind: mcq
    prompt: Sorted array, a[i] + a[j] is greater than the target. Which pointer moves?
    options: ["j moves left", "i moves right", "Both move", "Neither — stop"]
    answer: 0
    explanation: The sum is too big; only decreasing j can reduce it while keeping the sorted guarantee.
    difficulty: 1
  - id: correctness
    kind: mcq
    prompt: Why is it safe to discard a[i] when a[i] + a[j] < target (sorted array, i < j)?
    options:
      - Every partner of a[i] at or before j is ≤ a[j], so all its sums are too small
      - Because a[i] is negative
      - Because i is the smaller index
      - It isn't safe; it's a heuristic
    answer: 0
    explanation: a[j] is the largest remaining partner; if even it is too small, a[i] has no valid partner.
    difficulty: 3
  - id: container
    kind: mcq
    prompt: In Container With Most Water, which pointer do you move?
    options: ["The one at the shorter line", "The one at the taller line", "Always the left", "The one with the smaller index"]
    answer: 0
    explanation: The area is limited by the shorter line; moving the taller one can only shrink width without raising the limit.
    difficulty: 2
  - id: three-sum
    kind: mcq
    prompt: Sort + fix one + two pointers solves 3Sum in what time?
    options: ["O(n²)", "O(n³)", "O(n log n)", "O(n)"]
    answer: 0
    explanation: n choices for the fixed element × an O(n) sweep each.
    difficulty: 2
  - id: dedupe-in-place
    kind: mcq
    prompt: "Removing duplicates from a sorted array in place with a slow pointer w and a fast pointer r, when do you write a[r] to a[w]?"
    options:
      - "When a[r] differs from a[w - 1] (the last kept value)"
      - "When a[r] differs from a[r + 1]"
      - "Every step"
      - "When r is even"
    answer: 0
    explanation: "Keep a value only if it differs from the last value already kept; both pointers move forward, so O(n)."
    difficulty: 4
  - id: pointer-invariant
    kind: mcq
    prompt: "Pair sum on a sorted array: which invariant justifies the two-pointer scan?"
    options:
      - "No valid pair uses an index outside [i, j]"
      - "a[i] + a[j] only increases"
      - "i and j always move together"
      - "The array has no duplicates"
    answer: 0
    explanation: "Each move discards an index that provably has no partner left, so a solution, if any, stays inside [i, j]."
    difficulty: 5
