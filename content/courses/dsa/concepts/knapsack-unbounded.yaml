  kind: mcq
  prompt: Pieces of length 1 2 3 4 sell for 1 5 8 9. A rod of length 4 can be cut freely. Greedy by price
    per length gets 9. What is the best?
  options:
  - '10'
  - '9'
  - '8'
  - '12'
  answer: 0
  explanation: Two pieces of length 2 give 5 + 5 = 10.
  difficulty: 2
- id: forward-why
  kind: mcq
  prompt: Why does the one-row unbounded knapsack loop capacity from w up to W?
  options:
  - So dp[c − w] may already include this item, allowing reuse
  - Because it is faster than going down
  - So each item is used at most once
  - So the answer ends up in dp[0]
  answer: 0
  explanation: Forwards reads cells already updated for this item, so it can be taken again.
  difficulty: 3
- id: backward-output
  kind: output
  prompt: Pieces of length 1 and 2 with prices 1 and 5, rod length 4. What does this print?
  code:
    python: |
      w, v, W = [1, 2], [1, 5], 4
      dp = [0] * (W + 1)
      for i in range(2):
          for c in range(W, w[i] - 1, -1):
              dp[c] = max(dp[c], dp[c - w[i]] + v[i])
      print(dp[W])
    cpp: |
      int w[] = {1, 2}, v[] = {1, 5}, W = 4;
      vector<int> dp(W + 1, 0);
      for (int i = 0; i < 2; i++)
          for (int c = W; c >= w[i]; c--)
              dp[c] = max(dp[c], dp[c - w[i]] + v[i]);
      cout << dp[W];
    java: |
      int[] w = {1, 2}, v = {1, 5};
      int W = 4;
      int[] dp = new int[W + 1];
      for (int i = 0; i < 2; i++)
          for (int c = W; c >= w[i]; c--)
              dp[c] = Math.max(dp[c], dp[c - w[i]] + v[i]);
      System.out.print(dp[W]);
  options:
  - '6'
  - '10'
  - '4'
  - '5'
