quiz:
- id: two-properties
  kind: mcq
  prompt: Which two properties tell you a recursive solution can become DP?
  options:
  - Overlapping subproblems and optimal substructure
  - Sorted input and a monotone answer
  - Unique subproblems and a greedy choice
  - Small input and many test cases
  answer: 0
  explanation: Subproblems must repeat, and the answer must be built from answers to subproblems.
  difficulty: 1
- id: naive-calls
  kind: mcq
  prompt: Plain recursive fib(n) makes 2·F(n+1) − 1 calls. Roughly how many is that for n = 50?
  options:
  - About 4 × 10^10
  - About 100
  - About 2,500
  - About 10^6
  answer: 0
  explanation: F(51) is about 2 × 10^10, so the call count is about 4 × 10^10.
  difficulty: 2
- id: memo-missing-store
  kind: bug
  prompt: This memoized fib is still exponential. Why?
  code:
    python: |
      memo = {}
      def fib(n):
          if n < 2:
              return n
          if n in memo:
              return memo[n]
          return fib(n - 1) + fib(n - 2)
    cpp: |
      map<int, long long> memo;
      long long fib(int n) {
          if (n < 2) return n;
          if (memo.count(n)) return memo[n];
          return fib(n - 1) + fib(n - 2);
      }
    java: |
      static Map<Integer, Long> memo = new HashMap<>();
      static long fib(int n) {
          if (n < 2) return n;
          if (memo.containsKey(n)) return memo.get(n);
          return fib(n - 1) + fib(n - 2);
      }
  options:
  - The result is never stored in memo
  - The base case is wrong
  - It should use a list instead of a dict
  - It recurses on n + 1
  answer: 0
  explanation: Nothing is ever written to memo, so the lookup never hits.
  difficulty: 2
- id: tab-output
  kind: output
  prompt: What does this print?
  code:
    python: |
      dp = [0, 1]
      for i in range(2, 7):
          dp.append(dp[-1] + dp[-2])
      print(dp[6])
    cpp: |
      vector<long long> dp = {0, 1};
      for (int i = 2; i < 7; i++) dp.push_back(dp[i - 1] + dp[i - 2]);
      cout << dp[6];
    java: |
      long[] dp = new long[7];
      dp[1] = 1;
      for (int i = 2; i < 7; i++) dp[i] = dp[i - 1] + dp[i - 2];
      System.out.print(dp[6]);
  options:
  - '8'
  - '13'
  - '5'
  - '6'
  answer: 0
  explanation: '0 1 1 2 3 5 8: dp[6] = 8.'
  difficulty: 2
- id: greedy-stairs
  kind: mcq
  prompt: Costs 1 2 100 3 (start on stair 0 or 1, top is stair 4). Greedy pays 6. What does DP pay?
  options:
  - '5'
  - '6'
  - '3'
  - '4'
  answer: 0
  explanation: 'Start on stair 1 (cost 2), jump to stair 3 (cost 3): 5.'
  difficulty: 3
- id: reconstruct-needs
  kind: mcq
  prompt: You must print the stairs used, not just the cost. What must you keep?
  options:
  - Which choice won at every cell
  - Only the last two dp values
  - Only the final answer
  - The input sorted by cost
  answer: 0
  explanation: Walking back from the answer needs the winning choice at every cell.
  difficulty: 3
- id: space-when
  kind: mcq
  prompt: When is it safe to replace the dp table with two variables?
  options:
  - Each cell reads only the previous two and no path is printed
  - Whenever the table is longer than 1000
  - Only for counting problems
  - Only when the input is sorted
  answer: 0
  explanation: Old cells can be dropped only if nothing reads them again.
  difficulty: 4
