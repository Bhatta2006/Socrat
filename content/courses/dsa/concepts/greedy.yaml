quiz:
  - id: activity-key
    kind: mcq
    prompt: To schedule the maximum number of non-overlapping meetings greedily, sort by...
    options: ["End time", "Start time", "Duration", "Number of attendees"]
    answer: 0
    explanation: Finishing earliest leaves the most room for the rest; the exchange argument proves it.
    difficulty: 2
  - id: coins-fail
    kind: mcq
    prompt: With coins {1, 3, 4}, the greedy "largest coin first" for amount 6 gives how many coins vs the optimum?
    options: ["3 vs 2", "2 vs 2", "6 vs 2", "3 vs 3"]
    answer: 0
    explanation: Greedy takes 4+1+1; optimal is 3+3. Greedy fails for this coin system.
    difficulty: 3
  - id: exchange
    kind: mcq
    prompt: What is an exchange argument?
    options:
      - Showing any optimal solution can be transformed into the greedy one without getting worse
      - Swapping two array elements
      - Trying all solutions
      - Exchanging time for memory
    answer: 0
    explanation: It proves greedy is at least as good as any optimal solution.
    difficulty: 3
  - id: jump
    kind: mcq
    prompt: In Jump Game, what single value do you track while scanning?
    options: ["The farthest index reachable so far", "The number of jumps", "The smallest element", "The sum of jumps"]
    answer: 0
    explanation: If the current index exceeds the farthest reachable index, the end cannot be reached.
    difficulty: 2
problems: [max-meetings, can-reach-end]
