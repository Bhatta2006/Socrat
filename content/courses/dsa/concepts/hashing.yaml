- id: lookup-first
  kind: mcq
  prompt: Counting pairs that sum to k in one pass, why look up k − x before inserting x?
  options:
  - So x never pairs with itself and each pair is counted once
  - It is faster
  - So the map stays sorted
  - It makes no difference
  answer: 0
