quiz:
  - id: steps
    kind: mcq
    prompt: About how many comparisons does binary search need for 1,000,000 sorted items?
    options: ["20", "1,000", "500,000", "1,000,000"]
    answer: 0
    explanation: 2^20 ≈ 10^6, so about 20 halvings.
    difficulty: 1
  - id: count-x
    kind: mcq
    prompt: How do you count occurrences of x in a sorted array with binary search?
    options:
      - (first index with a[i] > x) − (first index with a[i] >= x)
      - Find x once and return 1
      - Scan the whole array
      - (last index) − (first index)
    answer: 0
    explanation: The two bounds bracket exactly the block of x values.
    difficulty: 2
  - id: answer-search
    kind: mcq
    prompt: Binary search on the answer requires feasibility to be...
    options: ["Monotonic (false...false then true...true)", "Random", "Sorted by index", "Always true"]
    answer: 0
    explanation: Only a monotonic condition lets you discard half the candidates safely.
    difficulty: 2
  - id: overflow
    kind: mcq
    prompt: In Java, why write mid = lo + (hi - lo) / 2 instead of (lo + hi) / 2?
    options: ["lo + hi can overflow int", "It is faster", "It rounds up", "It avoids negative indexes"]
    answer: 0
    explanation: For large lo and hi their sum can exceed 2^31 − 1.
    difficulty: 2
