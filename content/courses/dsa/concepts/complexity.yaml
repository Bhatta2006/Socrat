quiz:
  - id: nested-cost
    kind: mcq
    prompt: A loop over n elements contains another loop over the same n elements. What is the time complexity?
    options: ["O(n²)", "O(n)", "O(2n)", "O(n log n)"]
    answer: 0
    explanation: The inner loop runs n times for each of the n outer rounds.
    difficulty: 1
  - id: halving
    kind: mcq
    prompt: "`while n > 1: n = n // 2` runs about how many times?"
    options: ["log₂ n", "n", "n / 2", "√n"]
    answer: 0
    explanation: Halving repeatedly reaches 1 after about log₂ n rounds.
    difficulty: 2
  - id: constraint-fit
    kind: mcq
    prompt: n can be 200,000. Which complexity is safe?
    options: ["O(n log n)", "O(n²)", "O(n³)", "O(2^n)"]
    answer: 0
    explanation: 200,000 × 18 ≈ 3.6·10^6 is fast; n² is 4·10^10.
    difficulty: 2
  - id: hidden-cost
    kind: mcq
    prompt: Inside a loop over n items you check `if x in my_list` (a Python list of size n). Total time?
    options: ["O(n²)", "O(n)", "O(1)", "O(log n)"]
    answer: 0
    explanation: List membership scans the list, O(n), inside an O(n) loop. A set would make it O(n) overall.
    difficulty: 3
  - id: drop-terms
    kind: mcq
    prompt: Simplify O(4n² + 100n + 7).
    options: ["O(n²)", "O(4n²)", "O(n² + n)", "O(100n)"]
    answer: 0
    explanation: Constants and lower-order terms are dropped; growth is dominated by n².
    difficulty: 1
