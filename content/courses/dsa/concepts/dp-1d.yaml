quiz:
  - id: components
    kind: mcq
    prompt: Which is NOT one of the four decisions of a DP solution?
    options: ["Choosing a sorting algorithm", "Defining the state", "Writing the transition", "Setting base cases"]
    answer: 0
    explanation: State, transition, base cases and the final answer define a DP.
    difficulty: 1
  - id: robber
    kind: mcq
    prompt: For house robber with a = [2, 7, 9, 3, 1], what is the maximum loot?
    options: ["12", "11", "10", "13"]
    answer: 0
    explanation: Rob houses with 2, 9 and 1 for 12.
    difficulty: 2
  - id: overlap
    kind: mcq
    prompt: What makes a problem a good fit for DP rather than plain recursion?
    options: ["Overlapping subproblems", "Sorted input", "A small alphabet", "Negative numbers"]
    answer: 0
    explanation: DP pays off when the same subproblems would otherwise be solved repeatedly.
    difficulty: 2
  - id: coins
    kind: mcq
    prompt: In min-coins DP, dp[x] = min over coins c of dp[x − c] + 1. What is dp[0]?
    options: ["0", "1", "∞", "−1"]
    answer: 0
    explanation: Zero coins make amount zero; it is the base case all others build on.
    difficulty: 1
