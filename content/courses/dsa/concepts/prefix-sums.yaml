quiz:
  - id: range-formula
    kind: mcq
    prompt: With p[0] = 0 and p[i+1] = p[i] + a[i], the sum of a[2..5] (inclusive) is...
    options: ["p[6] − p[2]", "p[5] − p[2]", "p[5] − p[1]", "p[6] − p[3]"]
    answer: 0
    explanation: Sum of a[l..r] is p[r+1] − p[l] with l = 2, r = 5.
    difficulty: 2
  - id: seed
    kind: mcq
    prompt: "When counting subarrays with sum k using a prefix-sum map, why start the map with {0: 1}?"
    options:
      - To count subarrays that start at index 0
      - To avoid division by zero
      - Because maps cannot be empty
      - To handle negative numbers
    answer: 0
    explanation: A subarray starting at 0 has sum equal to the current prefix, matching an earlier prefix of 0.
    difficulty: 3
  - id: query-cost
    kind: mcq
    prompt: After building prefix sums, what is the cost of each range-sum query?
    options: ["O(1)", "O(log n)", "O(n)", "O(r − l)"]
    answer: 0
    explanation: A single subtraction of two stored values.
    difficulty: 1
  - id: negatives
    kind: mcq
    prompt: Why does "count subarrays with sum k" use prefix sums + hashing rather than a sliding window?
    options:
      - Negative numbers break the sliding window's monotonic behaviour
      - Sliding windows are always slower
      - Hash maps use less memory
      - Prefix sums sort the array
    answer: 0
    explanation: With negatives, extending a window can decrease the sum, so you cannot decide when to shrink.
    difficulty: 3
