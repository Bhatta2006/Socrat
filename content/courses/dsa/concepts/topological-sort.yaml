quiz:
  - id: exists
    kind: mcq
    prompt: When does a directed graph have a topological order?
    options: ["Exactly when it has no directed cycle", "Always", "Only when it is connected", "Only when every node has an edge"]
    answer: 0
    explanation: A cycle would require some node to come before itself.
    difficulty: 1
  - id: start
    kind: mcq
    prompt: Kahn's algorithm starts with which nodes?
    options: ["Nodes with in-degree 0", "Nodes with out-degree 0", "Node 1 only", "The node with most edges"]
    answer: 0
    explanation: Nothing must come before an in-degree-0 node, so it can go first.
    difficulty: 1
  - id: cycle-detect
    kind: mcq
    prompt: Kahn's algorithm outputs 7 of 10 nodes and the queue empties. What does that mean?
    options: ["The remaining 3 nodes involve a cycle", "The graph is disconnected", "There is a bug", "Three nodes have no edges"]
    answer: 0
    explanation: Nodes on (or behind) a cycle never reach in-degree 0.
    difficulty: 2
  - id: lexi
    kind: mcq
    prompt: How do you get the lexicographically smallest topological order?
    options: ["Use a min-heap instead of a FIFO queue", "Sort the final order", "Use DFS", "Reverse the edges"]
    answer: 0
    explanation: Always choosing the smallest available node produces the smallest order; sorting afterwards breaks validity.
    difficulty: 3
