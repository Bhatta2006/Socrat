quiz:
  - id: xor-pairs
    kind: mcq
    prompt: What is 4 ^ 9 ^ 4?
    options: ["9", "17", "0", "4"]
    answer: 0
    explanation: The two 4s cancel (4 ^ 4 = 0), leaving 9.
    difficulty: 1
  - id: power-two
    kind: mcq
    prompt: For x > 0, what does (x & (x − 1)) == 0 test?
    options: ["x is a power of two", "x is even", "x is odd", "x is prime"]
    answer: 0
    explanation: Powers of two have a single set bit, which x − 1 clears entirely.
    difficulty: 2
  - id: subsets
    kind: mcq
    prompt: Looping mask from 0 to 2^n − 1 visits...
    options: ["Every subset of n items exactly once", "Every permutation", "Only subsets of size n", "n subsets"]
    answer: 0
    explanation: Each n-bit pattern corresponds to exactly one subset.
    difficulty: 2
  - id: and-value
    kind: mcq
    prompt: What is 12 & 10?
    options: ["8", "14", "6", "2"]
    answer: 0
    explanation: 1100 & 1010 = 1000, which is 8.
    difficulty: 2
