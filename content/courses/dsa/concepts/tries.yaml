quiz:
  - id: prefix-cost
    kind: mcq
    prompt: A trie holds a million words. How long does checking a prefix of length 5 take?
    options: ["O(5)", "O(1,000,000)", "O(log 1,000,000)", "O(5 × 1,000,000)"]
    answer: 0
    explanation: You follow one edge per character, regardless of how many words are stored.
    difficulty: 1
  - id: end-marker
    kind: mcq
    prompt: You insert "apple" only. Why does a search for the word "app" need an end marker?
    options:
      - The path for "app" exists, but no word ends there
      - Because "app" is shorter
      - Tries cannot store short words
      - To make search O(1)
    answer: 0
    explanation: Without end markers, every prefix of a stored word would look like a stored word.
    difficulty: 2
  - id: counts
    kind: mcq
    prompt: How do you count words starting with a prefix in O(length)?
    options:
      - Keep a counter on each node of how many words pass through it
      - Traverse the whole subtree each time
      - Store the words in a list
      - Hash every prefix
    answer: 0
    explanation: Increment counts during insertion; the count at the prefix's node is the answer.
    difficulty: 2
  - id: when-not
    kind: mcq
    prompt: When is a hash set a better choice than a trie?
    options: ["When you only need exact-word lookups", "When you need prefix counts", "For autocomplete", "For Word Search II"]
    answer: 0
    explanation: Tries earn their memory cost through prefix operations.
    difficulty: 2
