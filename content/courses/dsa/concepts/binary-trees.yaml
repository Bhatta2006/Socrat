quiz:
  - id: inorder
    kind: mcq
    prompt: Which traversal visits left subtree, then root, then right subtree?
    options: ["Inorder", "Preorder", "Postorder", "Level order"]
    answer: 0
    explanation: In-order puts the root in between its subtrees.
    difficulty: 1
  - id: bfs-structure
    kind: mcq
    prompt: Level-order traversal uses which data structure?
    options: ["A queue", "A stack", "A heap", "A hash set"]
    answer: 0
    explanation: Nodes are processed in the order they were discovered, level by level — FIFO.
    difficulty: 1
  - id: height-trace
    kind: mcq
    prompt: A tree is a single chain of 5 nodes (each has only a left child). Its height in nodes is...
    options: ["5", "1", "3", "4"]
    answer: 0
    explanation: The longest root-to-leaf path contains all 5 nodes.
    difficulty: 1
  - id: postorder-use
    kind: mcq
    prompt: To compute every subtree's size, which order is natural?
    options: ["Postorder — children before the node", "Preorder", "Inorder", "Any order works without recursion"]
    answer: 0
    explanation: A node's size is 1 + left size + right size, so children must be done first.
    difficulty: 2
