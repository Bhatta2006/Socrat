quiz:
  - id: bfs-shortest
    kind: mcq
    prompt: Why does BFS find shortest paths in an unweighted graph?
    options:
      - It visits nodes in order of increasing distance from the start
      - It explores the deepest path first
      - It sorts edges by weight
      - It visits every path
    answer: 0
    explanation: The queue processes all distance-d nodes before any distance-(d+1) node.
    difficulty: 2
  - id: complexity
    kind: mcq
    prompt: What is the time complexity of BFS with adjacency lists?
    options: ["O(V + E)", "O(V²)", "O(E log V)", "O(V × E)"]
    answer: 0
    explanation: Each node is dequeued once and each edge examined a constant number of times.
    difficulty: 1
  - id: components
    kind: mcq
    prompt: How do you count connected components?
    options:
      - Start a new BFS/DFS from each unvisited node and count the starts
      - Count the edges
      - Run BFS once from node 1
      - Count nodes with no neighbours
    answer: 0
    explanation: Each fresh start discovers exactly one new component.
    difficulty: 1
  - id: mark-time
    kind: mcq
    prompt: In BFS, when should a node be marked visited?
    options: ["When it is added to the queue", "When it is removed from the queue", "After all neighbours are processed", "Never"]
    answer: 0
    explanation: Marking on enqueue prevents the same node being queued multiple times.
    difficulty: 2
