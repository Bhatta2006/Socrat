quiz:
  - id: template
    kind: mcq
    prompt: What is the backtracking template?
    options: ["Choose, explore, un-choose", "Sort, scan, return", "Push, pop, peek", "Divide, sort, merge"]
    answer: 0
    explanation: Make a choice, recurse, then undo it before trying the next option.
    difficulty: 1
  - id: subset-count
    kind: mcq
    prompt: How many subsets does a set of 10 distinct elements have?
    options: ["1024", "100", "10", "3,628,800"]
    answer: 0
    explanation: Each element is in or out — 2^10 = 1024 (including the empty set).
    difficulty: 1
  - id: copy-bug
    kind: mcq
    prompt: "In Python, result.append(current) instead of result.append(current[:]) causes..."
    options:
      - Every saved subset to become the same (final) list
      - A syntax error
      - Faster execution
      - Duplicate elements in each subset
    answer: 0
    explanation: All entries reference the one mutable list, which ends up empty.
    difficulty: 2
  - id: queens-prune
    kind: mcq
    prompt: In N-Queens, which values identify the two diagonals of square (r, c)?
    options: ["r + c and r − c", "r and c", "r × c and r / c", "r + 1 and c + 1"]
    answer: 0
    explanation: Squares on one diagonal share r + c; on the other they share r − c.
    difficulty: 3
