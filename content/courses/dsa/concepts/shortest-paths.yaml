quiz:
  - id: negative
    kind: mcq
    prompt: Why does Dijkstra fail with negative edge weights?
    options:
      - A settled node might later be reached more cheaply through a negative edge
      - Heaps cannot store negative numbers
      - It runs forever
      - It only fails on undirected graphs
    answer: 0
    explanation: The "closest node is final" argument relies on detours never getting cheaper.
    difficulty: 3
  - id: structure
    kind: mcq
    prompt: Which data structure picks the next node in Dijkstra?
    options: ["A min-heap keyed by tentative distance", "A FIFO queue", "A stack", "A sorted array rebuilt each step"]
    answer: 0
    explanation: The heap gives the closest unsettled node in O(log V).
    difficulty: 1
  - id: stale
    kind: mcq
    prompt: Popped (d, u) has d > dist[u]. What should happen?
    options: ["Skip it — it's an outdated entry", "Update dist[u] = d", "Stop the algorithm", "Push it back"]
    answer: 0
    explanation: A shorter distance for u was already found and processed.
    difficulty: 2
  - id: unit-weights
    kind: mcq
    prompt: Every edge weighs exactly 1. What is the simplest correct algorithm?
    options: ["BFS", "Dijkstra with a heap", "Bellman–Ford", "Floyd–Warshall"]
    answer: 0
    explanation: Unit weights make BFS order equal to distance order — no heap needed.
    difficulty: 1
