quiz:
  - id: fixed-update
    kind: mcq
    prompt: A fixed window of size k moves one step right. How is its sum updated?
    options: ["Add the new element, subtract the element that left", "Recompute the sum of k elements", "Multiply by k", "Add the new element only"]
    answer: 0
    explanation: Only two elements change, so the update is O(1).
    difficulty: 1
  - id: negatives-fail
    kind: mcq
    prompt: Why can't a sliding window find "longest subarray with sum exactly k" when values can be negative?
    options:
      - Extending the window might decrease the sum, so you can't tell when to shrink
      - Windows only work on strings
      - Negative numbers overflow
      - It works fine
    answer: 0
    explanation: Validity must change monotonically with window size; negatives break that.
    difficulty: 3
  - id: complexity
    kind: mcq
    prompt: In the expand/shrink template, how many times can left move in total?
    options: ["At most n times", "n² times", "log n times", "k times"]
    answer: 0
    explanation: left only moves forward and never past n, so total work is O(n).
    difficulty: 2
  - id: unique-trace
    kind: mcq
    prompt: What is the length of the longest substring without repeating characters in "abcabcbb"?
    options: ["3", "2", "4", "8"]
    answer: 0
    explanation: '"abc" has length 3; every longer window repeats a character.'
    difficulty: 1
