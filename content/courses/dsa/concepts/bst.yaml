quiz:
  - id: inorder-sorted
    kind: mcq
    prompt: What does an inorder traversal of a BST produce?
    options: ["The keys in increasing order", "The keys level by level", "The keys in insertion order", "The root last"]
    answer: 0
    explanation: Left (smaller), node, right (larger) at every level gives sorted order.
    difficulty: 1
  - id: validate-trap
    kind: mcq
    prompt: Root 10, left child 5, and 5 has a right child 12. Is this a valid BST?
    options:
      - No — 12 is in 10's left subtree but larger than 10
      - Yes, because 12 > 5
      - Yes, every parent-child pair is ordered
      - It depends on insertion order
    answer: 0
    explanation: Every key in the left subtree of 10 must be less than 10.
    difficulty: 3
  - id: sorted-insert
    kind: mcq
    prompt: Inserting 1, 2, 3, ..., n into a plain BST makes search cost...
    options: ["O(n)", "O(log n)", "O(1)", "O(n log n)"]
    answer: 0
    explanation: Each key becomes the right child of the previous one, forming a chain.
    difficulty: 2
  - id: lca
    kind: mcq
    prompt: In a BST, both target keys are larger than the current node's key. Where is their lowest common ancestor?
    options: ["In the right subtree", "In the left subtree", "At the current node", "At the root always"]
    answer: 0
    explanation: Both keys live in the right subtree, so their split point is there too.
    difficulty: 2
