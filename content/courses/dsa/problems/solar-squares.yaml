  cpp: |
    #include <algorithm>
    #include <iostream>
    #include <string>
    #include <vector>
    using namespace std;

    int main() {
        int r, c, K;
        cin >> r >> c >> K;
        vector<int> dp(c + 1, 0);
        long long total = 0;
        for (int i = 0; i < r; i++) {
            string row;
            cin >> row;
            int diag = 0;
            for (int j = 1; j <= c; j++) {
                int up = dp[j];
                dp[j] = row[j - 1] == '1' ? 1 + min({up, dp[j - 1], diag}) : 0;
                if (dp[j] >= K) total += dp[j] - K + 1;
                diag = up;
            }
        }
        cout << total << "\n";
    }
  java: |
    import java.io.*;
    import java.util.*;

    public class Solution {
        public static void main(String[] args) throws IOException {
            BufferedReader in = new BufferedReader(new InputStreamReader(System.in));
            StringTokenizer st = new StringTokenizer(in.readLine());
            int r = Integer.parseInt(st.nextToken()), c = Integer.parseInt(st.nextToken()), K = Integer.parseInt(st.nextToken());
            int[] dp = new int[c + 1];
            long total = 0;
            for (int i = 0; i < r; i++) {
                String row = in.readLine().trim();
                int diag = 0;
                for (int j = 1; j <= c; j++) {
                    int up = dp[j];
                    dp[j] = row.charAt(j - 1) == '1' ? 1 + Math.min(up, Math.min(dp[j - 1], diag)) : 0;
                    if (dp[j] >= K) total += dp[j] - K + 1;
                    diag = up;
                }
            }
            System.out.println(total);
        }
    }
