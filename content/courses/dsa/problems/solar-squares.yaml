id: solar-squares
title: Solar panel plots
concepts: [dp-squares]
difficulty: medium
statement: |
  A roof is an r × c grid of cells; `1` marks a cell that can hold solar cells and `0` one
  that cannot. A square solar panel of side s covers an s × s block of cells, all of which
  must be `1`.

  Count the square blocks of side **at least K** that are made only of `1` cells. Blocks may
  overlap; two blocks are different if their position or size differs.
input_format: |
  The first line contains r, c and K. Each of the next r lines is a string of c characters,
  each 0 or 1.
output_format: The number of such square blocks.
constraints:
  - 1 ≤ r, c ≤ 500
  - 1 ≤ K ≤ 500
examples:
  - input: "3 3 2\n111\n111\n110"
    output: "3"
    explanation: "There are three 2 × 2 blocks of ones (top-left, top-right, bottom-left); the bottom-right one contains a 0, and no 3 × 3 block fits."
  - input: "2 2 3\n11\n11"
    output: "0"
hints:
  - "For each cell, what is the largest all-ones square whose bottom-right corner is that cell?"
  - "If that side is s, the cell ends exactly s squares: sides 1, 2, …, s."
  - "Of those, the ones with side at least K number max(0, s − K + 1). Add that over every cell."
approach: |
  Maximal-square DP: side[i][j] = 1 + min(up, left, up-left) on a 1 cell, 0 on a 0 cell. A
  cell with side s is the bottom-right corner of exactly one square of each side 1 … s, so it
  contributes max(0, s − K + 1) squares of side at least K. Summing over all cells counts
  every block once (by its bottom-right corner). O(r · c) time, O(c) memory with one row.
reference: |
  import sys
  data = sys.stdin.read().split()
  r, c, K = int(data[0]), int(data[1]), int(data[2])
  rows = data[3:3 + r]
  dp = [0] * (c + 1)
  total = 0
  for i in range(r):
      row = rows[i]
      diag = 0
      for j in range(1, c + 1):
          up = dp[j]
          if row[j - 1] == "1":
              left = dp[j - 1]
              s = up if up < left else left
              if diag < s:
                  s = diag
              s += 1
              dp[j] = s
              if s >= K:
                  total += s - K + 1
          else:
              dp[j] = 0
          diag = up
  print(total)
