id: pair-sum-sorted
title: Pair sum in a sorted array
concepts: [two-pointers]
difficulty: easy
statement: |
  The array is sorted in non-decreasing order. Find two different positions `i < j`
  (1-indexed) with `a[i] + a[j] = t`. If several pairs exist, print the one with the
  **smallest i**, and among those the **largest j**. If none exists, print `-1`.

  Solve it in O(n) time and O(1) extra space.
input_format: |
  The first line contains n and t. The second line contains n sorted integers.
output_format: Two indexes i j, or -1.
constraints:
  - 2 ≤ n ≤ 200000
  - -10^9 ≤ a[i], t ≤ 10^9
examples:
  - input: "5 9\n1 2 4 5 7"
    output: "2 5"
    explanation: Both (2, 5) with 2 + 7 and (3, 4) with 4 + 5 sum to 9; the value 1 has no partner, so the smallest i is 2.
  - input: "3 100\n1 2 3"
    output: "-1"
hints:
  - Start with the smallest and largest elements. If their sum is too small, which element can never be in any valid pair?
  - Moving pointers inward finds a pair — but does the first pair found have the smallest i and largest j?
  - Sweeping with i from the left and j from the right, the first match has the smallest possible i, and j is the largest partner for that i.
approach: |
  Opposite-end two pointers. If the sum is too small, i++; too big, j−−; equal, stop. The
  first match has the smallest i (no smaller i was ever discarded wrongly), and j is the
  largest index pairing with it because larger indexes were discarded only when they
  were too big for this or a smaller i. O(n), O(1) space.
reference: |
  import sys
  data = sys.stdin.buffer.read().split()
  n, t = int(data[0]), int(data[1])
  a = list(map(int, data[2:2 + n]))
  i, j = 0, n - 1
  ans = "-1"
  while i < j:
      s = a[i] + a[j]
      if s == t:
          ans = f"{i + 1} {j + 1}"
          break
      if s < t:
          i += 1
      else:
          j -= 1
  print(ans)
generator: |
  def cases(rng):
      yield "2 0\n0 0"
      yield "4 2\n1 1 1 1"
      yield "3 -3\n-2 -1 5"
      n = 150000
      a = sorted(rng.randint(-10**8, 10**8) for _ in range(n))
      yield f"{n} {a[10] + a[-20]}\n" + " ".join(map(str, a))
      yield f"{n} 1000000000\n" + " ".join(map(str, a))
      for _ in range(6):
          n = rng.randint(2, 12)
          a = sorted(rng.randint(-6, 6) for _ in range(n))
          yield f"{n} {rng.randint(-8, 8)}\n" + " ".join(map(str, a))
