id: koko-speed
title: Minimum reading speed
concepts: [binary-search]
difficulty: medium
statement: |
  You have `n` chapters to read; chapter `i` has `p[i]` pages. You read at a fixed speed of
  `k` pages per hour. Each hour you work on a single chapter: if it has fewer than `k`
  pages left, you finish it and rest for the remainder of that hour. So chapter `i` takes
  `ceil(p[i] / k)` hours.

  Find the **minimum** whole-number speed `k` that lets you finish everything within `h`
  hours.
input_format: |
  The first line contains n and h. The second line contains n page counts.
output_format: The minimum speed k.
constraints:
  - 1 ≤ n ≤ 100000
  - n ≤ h ≤ 10^9
  - 1 ≤ p[i] ≤ 10^9
examples:
  - input: "4 8\n3 6 7 11"
    output: "4"
    explanation: At k = 4 you need 1 + 2 + 2 + 3 = 8 hours; at k = 3 you need 10.
  - input: "5 5\n30 11 23 4 20"
    output: "30"
hints:
  - If speed k works, does speed k + 1 also work? What does that property let you do?
  - What are the smallest and largest speeds that could possibly be the answer?
  - Binary search k in [1, max(p)] for the first speed whose total hours sum(ceil(p/k)) ≤ h.
approach: |
  Feasibility is monotonic in k, so binary search the first feasible k in [1, max(p)].
  Each check computes sum((p + k − 1) // k) in O(n). Total O(n log max p). Use 64-bit
  integers for the hour total.
reference: |
  import sys
  data = sys.stdin.buffer.read().split()
  n, h = int(data[0]), int(data[1])
  p = list(map(int, data[2:2 + n]))
  lo, hi = 1, max(p)
  while lo < hi:
      mid = (lo + hi) // 2
      if sum((x + mid - 1) // mid for x in p) <= h:
          hi = mid
      else:
          lo = mid + 1
  print(lo)
generator: |
  def cases(rng):
      yield "1 1\n1000000000"
      yield "1 1000000000\n1000000000"
      yield "3 3\n1 1 1"
      n = 100000
      p = [rng.randint(1, 10**9) for _ in range(n)]
      yield f"{n} {n * 3}\n" + " ".join(map(str, p))
      yield f"{n} 1000000000\n" + " ".join(map(str, p))
      for _ in range(5):
          n = rng.randint(1, 8)
          p = [rng.randint(1, 40) for _ in range(n)]
          yield f"{n} {rng.randint(n, 3 * n + 5)}\n" + " ".join(map(str, p))
