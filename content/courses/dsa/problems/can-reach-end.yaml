id: can-reach-end
title: Jump to the end
concepts: [greedy]
difficulty: medium
statement: |
  You start at position 1 of an array of `n` non-negative integers. From position `i` you
  may jump forward by any number of steps from 0 to `a[i]`. Can you reach position `n`?
  Print `YES` or `NO`.
input_format: |
  The first line contains n. The second line contains n integers.
output_format: YES or NO.
constraints:
  - 1 ≤ n ≤ 200000
  - 0 ≤ a[i] ≤ 10^9
examples:
  - input: "5\n2 3 1 1 4"
    output: "YES"
  - input: "5\n3 2 1 0 4"
    output: "NO"
    explanation: Every path lands on position 4, whose value is 0.
hints:
  - Exploring every possible jump sequence explodes. What single number summarises everywhere you could be?
  - Scan left to right. When does standing at position i become impossible?
  - Track farthest = max(farthest, i + a[i]) while i ≤ farthest; you can reach the end iff farthest ≥ n − 1 (0-indexed).
approach: |
  Greedy reachability: farthest = 0. For each i while i ≤ farthest, update
  farthest = max(farthest, i + a[i]). If farthest reaches the last index, YES; if the scan
  passes farthest, NO. O(n).
reference: |
  import sys
  data = sys.stdin.buffer.read().split()
  n = int(data[0])
  far = 0
  ok = True
  for i in range(n):
      if i > far:
          ok = False
          break
      far = max(far, i + int(data[1 + i]))
  print("YES" if ok else "NO")
generator: |
  def cases(rng):
      yield "1\n0"
      yield "2\n0 5"
      yield "3\n1 0 0"
      n = 200000
      yield f"{n}\n" + " ".join("1" for _ in range(n))
      a = ["1"] * n
      a[n // 2] = "0"
      yield f"{n}\n" + " ".join(a)
      yield f"{n}\n" + " ".join(str(rng.randint(0, 3)) for _ in range(n))
      for _ in range(6):
          n = rng.randint(1, 10)
          yield f"{n}\n" + " ".join(str(rng.randint(0, 2)) for _ in range(n))
