id: tree-levels
title: Level sums
concepts: [binary-trees]
difficulty: easy
statement: |
  A binary tree has `n` nodes numbered 1 to `n`; node 1 is the root. Node `i` stores value
  `v[i]` and has children `l[i]` and `r[i]` (0 means no child). Print the sum of the
  values on each level, from the root level downwards.
input_format: |
  The first line contains n. The second line contains v[1..n]. Each of the next n lines
  contains l[i] and r[i].
output_format: The level sums, separated by spaces.
constraints:
  - 1 ≤ n ≤ 200000
  - -10^9 ≤ v[i] ≤ 10^9
  - The input describes a valid binary tree rooted at 1.
examples:
  - input: "5\n3 9 20 15 7\n2 3\n0 0\n4 5\n0 0\n0 0"
    output: "3 29 22"
    explanation: "Levels are {3}, {9, 20} and {15, 7}."
hints:
  - Which traversal naturally processes a tree one level at a time?
  - With a queue, how do you know where one level ends and the next begins?
  - BFS from node 1; at each step process exactly as many nodes as the queue held at the start of the level, summing their values.
approach: |
  Breadth-first search from the root with a queue. For each level, pop the current queue
  size number of nodes, add their values, and push their non-zero children. O(n). Iterative
  BFS avoids recursion-depth problems on chain-shaped trees; use 64-bit sums.
reference: |
  import sys
  data = sys.stdin.buffer.read().split()
  n = int(data[0])
  v = [0] + [int(x) for x in data[1:1 + n]]
  L = [0] * (n + 1); R = [0] * (n + 1)
  base = 1 + n
  for i in range(1, n + 1):
      L[i] = int(data[base + 2 * (i - 1)]); R[i] = int(data[base + 2 * (i - 1) + 1])
  out = []
  level = [1]
  while level:
      out.append(sum(v[x] for x in level))
      nxt = []
      for x in level:
          if L[x]: nxt.append(L[x])
          if R[x]: nxt.append(R[x])
      level = nxt
  print(" ".join(map(str, out)))
generator: |
  def cases(rng):
      def tree(n, chain=False):
          order = list(range(2, n + 1))
          rng.shuffle(order)
          slots = [(1, 0), (1, 1)]
          L = [0] * (n + 1); R = [0] * (n + 1)
          for node in order:
              if chain:
                  parent, side = slots[-1]
                  slots.pop()
              else:
                  idx = rng.randrange(len(slots))
                  parent, side = slots[idx]
                  slots[idx] = slots[-1]; slots.pop()
              (L if side == 0 else R)[parent] = node
              slots += [(node, 0), (node, 1)]
          vals = " ".join(str(rng.randint(-10**9, 10**9)) for _ in range(n))
          return f"{n}\n{vals}\n" + "\n".join(f"{L[i]} {R[i]}" for i in range(1, n + 1))
      yield "1\n-5\n0 0"
      yield tree(60000)
      yield tree(60000, chain=True)
      for _ in range(6):
          yield tree(rng.randint(2, 9))
