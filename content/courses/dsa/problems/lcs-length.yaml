id: lcs-length
title: Longest common subsequence
concepts: [dp-2d]
difficulty: medium
statement: |
  Given two strings, print the length of their longest common subsequence: the longest
  sequence of characters that appears in both strings in the same order (not necessarily
  contiguously).
input_format: Two lines, each containing one string of lowercase letters.
output_format: The LCS length.
constraints:
  - 1 ≤ |a|, |b| ≤ 1000
examples:
  - input: "abcde\nace"
    output: "3"
  - input: "abc\ndef"
    output: "0"
hints:
  - Compare the last characters of both strings. What happens to the problem if they match? If they don't?
  - Let dp[i][j] be the answer for the first i characters of a and the first j of b. Which neighbouring cells does it depend on?
  - If a[i−1] == b[j−1], dp[i][j] = dp[i−1][j−1] + 1, else max(dp[i−1][j], dp[i][j−1]); keep only two rows.
approach: |
  Classic LCS DP over prefixes with rolling rows: O(|a|·|b|) ≤ 10^6 time, O(|b|) memory.
reference: |
  import sys
  a, b = sys.stdin.read().split()[:2]
  prev = [0] * (len(b) + 1)
  for ch in a:
      cur = [0] * (len(b) + 1)
      for j, cb in enumerate(b, 1):
          if ch == cb:
              cur[j] = prev[j - 1] + 1
          else:
              cur[j] = prev[j] if prev[j] > cur[j - 1] else cur[j - 1]
      prev = cur
  print(prev[-1])
generator: |
  def cases(rng):
      yield "a\na"
      yield "a\nb"
      yield "aaaa\naa"
      yield "".join(rng.choice("abcd") for _ in range(1000)) + "\n" + "".join(rng.choice("abcd") for _ in range(1000))
      yield "".join(rng.choice("abcdefghijklmnopqrstuvwxyz") for _ in range(800)) + "\n" + "".join(rng.choice("abcdefghijklmnopqrstuvwxyz") for _ in range(1000))
      for _ in range(6):
          yield "".join(rng.choice("ab") for _ in range(rng.randint(1, 8))) + "\n" + "".join(rng.choice("ab") for _ in range(rng.randint(1, 8)))
