id: shortest-fundraiser
title: Shortest stretch to reach a goal
concepts: [sliding-window]
difficulty: medium
statement: |
  A fundraiser records positive donations day by day. Find the length of the shortest run of
  consecutive days whose donations add up to at least `s`. Print `0` if no run reaches `s`.
input_format: |
  The first line contains n and s. The second line contains n positive donations.
output_format: The length of the shortest run, or 0.
constraints:
  - 1 ≤ n ≤ 2·10^5
  - 1 ≤ s ≤ 10^15
  - 1 ≤ donation ≤ 10^9
examples:
  - input: "6 7\n2 3 1 2 4 3"
    output: "2"
    explanation: 4 + 3 = 7.
  - input: "3 100\n1 2 3"
    output: "0"
hints:
  - Because every donation is positive, what happens to a window's sum when you extend it or shrink it?
  - For each right end, the best left end only moves to the right as the right end grows.
  - Grow the window on the right; while its sum is at least s, record its length and drop the leftmost day.
approach: |
  Sliding window with positive values: add a[r]; while the window sum ≥ s, update the best length
  and remove a[l++]. Each index enters and leaves once, O(n). Sums need 64 bits.
reference: |
  import sys
  data = sys.stdin.buffer.read().split()
  n, s = int(data[0]), int(data[1])
  a = list(map(int, data[2:2 + n]))
  best = n + 1
  total = 0
  left = 0
  for right, x in enumerate(a):
      total += x
      while total >= s:
          best = min(best, right - left + 1)
          total -= a[left]
          left += 1
  print(0 if best == n + 1 else best)
brute: |
  n, s = map(int, input().split())
  a = list(map(int, input().split()))
  best = 0
  for length in range(1, n + 1):
      if any(sum(a[i:i + length]) >= s for i in range(n - length + 1)):
          best = length
          break
  print(best)
