id: valid-anagram
title: Anagram check
concepts: [arrays-hashing]
difficulty: easy
statement: |
  Two words are **anagrams** if one is a rearrangement of the other's letters ("listen" and
  "silent"). For each of `q` pairs of lowercase words, print `YES` if they are anagrams and
  `NO` otherwise.
input_format: |
  The first line contains q. Each of the next q lines contains two words.
output_format: q lines, each YES or NO.
constraints:
  - 1 ≤ q ≤ 10000
  - Each word has 1 to 1000 lowercase letters; total length ≤ 10^6.
examples:
  - input: "3\nlisten silent\nrat car\naab abb"
    output: "YES\nNO\nNO"
hints:
  - What is true about the letters of two words that are anagrams?
  - Sorting works in O(k log k). Can you compare letter counts in O(k) instead?
  - Count each letter of the first word up and the second word down in a 26-slot array; anagrams leave every slot at 0.
approach: |
  If lengths differ, NO. Otherwise use a 26-element count array: +1 for each letter of the
  first word, −1 for each letter of the second; the words are anagrams exactly when all
  counts end at zero. O(k) per pair.
reference: |
  import sys
  from collections import Counter
  data = sys.stdin.read().split()
  q = int(data[0])
  out = []
  for i in range(q):
      a, b = data[1 + 2 * i], data[2 + 2 * i]
      out.append("YES" if Counter(a) == Counter(b) else "NO")
  print("\n".join(out))
generator: |
  def cases(rng):
      yield "2\na a\na b"
      yield "1\nab abc"
      letters = "abcde"
      pairs = []
      for _ in range(1000):
          k = rng.randint(1, 500)
          a = "".join(rng.choice(letters) for _ in range(k))
          b = list(a)
          rng.shuffle(b)
          if rng.random() < 0.5:
              b[rng.randrange(k)] = rng.choice(letters)
          pairs.append(f"{a} {''.join(b)}")
      yield f"{len(pairs)}\n" + "\n".join(pairs)
      for _ in range(5):
          q = rng.randint(1, 6)
          rows = []
          for _ in range(q):
              a = "".join(rng.choice("ab") for _ in range(rng.randint(1, 4)))
              b = "".join(rng.choice("ab") for _ in range(rng.randint(1, 4)))
              rows.append(f"{a} {b}")
          yield f"{q}\n" + "\n".join(rows)
