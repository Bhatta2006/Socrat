  cpp: |
    #include <algorithm>
    #include <iostream>
    #include <string>
    #include <vector>
    using namespace std;

    int main() {
        int r, c;
        cin >> r >> c;
        vector<int> h(c + 1, 0), st;
        long long best = 0;
        for (int i = 0; i < r; i++) {
            string row;
            cin >> row;
            for (int j = 0; j < c; j++) h[j] = row[j] == '1' ? h[j] + 1 : 0;
            st.clear();
            for (int j = 0; j <= c; j++) {
                while (!st.empty() && h[st.back()] >= h[j]) {
                    int height = h[st.back()];
                    st.pop_back();
                    int left = st.empty() ? -1 : st.back();
                    if (height) best = max(best, 2LL * (height + j - left - 1));
                }
                st.push_back(j);
            }
        }
        cout << best << "\n";
    }
  java: |
    import java.io.*;
    import java.util.*;

    public class Solution {
        public static void main(String[] args) throws IOException {
            BufferedReader in = new BufferedReader(new InputStreamReader(System.in));
            StringTokenizer tk = new StringTokenizer(in.readLine());
            int r = Integer.parseInt(tk.nextToken()), c = Integer.parseInt(tk.nextToken());
            int[] h = new int[c + 1], st = new int[c + 1];
            long best = 0;
            for (int i = 0; i < r; i++) {
                String row = in.readLine().trim();
                for (int j = 0; j < c; j++) h[j] = row.charAt(j) == '1' ? h[j] + 1 : 0;
                int top = 0;
                for (int j = 0; j <= c; j++) {
                    while (top > 0 && h[st[top - 1]] >= h[j]) {
                        int height = h[st[--top]];
                        int left = top > 0 ? st[top - 1] : -1;
                        if (height > 0) best = Math.max(best, 2L * (height + j - left - 1));
                    }
                    st[top++] = j;
                }
            }
            System.out.println(best);
        }
    }
