id: meadow-fence
title: Fence around the meadow
concepts: [dp-squares]
difficulty: medium
statement: |
  A farm is an r × c grid of cells; `1` marks meadow and `0` marks rock. The farmer will fence
  one **rectangle** made only of meadow cells, and wants the fence to be as long as possible.
  A rectangle of h rows and w columns needs a fence of length 2 · (h + w).

  Print the longest possible fence, or 0 if there is no meadow cell.
input_format: |
  The first line contains r and c. Each of the next r lines is a string of c characters, each
  0 or 1.
output_format: The longest fence length.
constraints:
  - 1 ≤ r, c ≤ 500
examples:
  - input: "3 4\n1110\n0111\n0110"
    output: "10"
    explanation: "Columns 2–3 are meadow in all three rows, a 3 × 2 rectangle with fence 2 · (3 + 2) = 10. The 1 × 3 strip in row 2 only needs 8."
  - input: "1 1\n0"
    output: "0"
hints:
  - "Every meadow rectangle has its bottom edge on some row. What does the meadow above each cell of that row look like?"
  - "Keep, for each column, the number of consecutive meadow cells ending at the current row: a histogram."
  - "For each bar popped from the monotonic stack, its height h and maximal width w give a candidate fence 2 · (h + w). Taking the maximal width for each bar never misses the best rectangle."
approach: |
  Histogram per row plus a monotonic stack, as for the maximal rectangle, but scoring
  perimeter instead of area. For each row, update the column heights, then for every bar
  popped with height h (> 0) and maximal width w, consider 2 · (h + w). Any meadow rectangle
  fits under some popped bar's height and maximal width on its bottom row, and enlarging a
  rectangle never shortens its fence, so the maximum over candidates is the answer.
  O(r · c) time, O(c) memory.
reference: |
  import sys
  data = sys.stdin.read().split()
  r, c = int(data[0]), int(data[1])
  h = [0] * (c + 1)
  best = 0
  for i in range(r):
      row = data[2 + i]
      for j in range(c):
          h[j] = h[j] + 1 if row[j] == "1" else 0
      st = []
      for j in range(c + 1):
          while st and h[st[-1]] >= h[j]:
              height = h[st.pop()]
              left = st[-1] if st else -1
              if height:
                  p = 2 * (height + j - left - 1)
                  if p > best:
                      best = p
          st.append(j)
  print(best)
