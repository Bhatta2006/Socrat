id: library-shelf
title: The popular shelf
concepts: [design-data-structures]
difficulty: hard
statement: |
  A library keeps a small "popular" shelf with room for `c` books. Readers ask for books one
  at a time. For each request for book `x`:

  - If x is on the shelf, print `HIT`. The request counts as one more read of x.
  - Otherwise print `MISS` and put x on the shelf with a read count of 1. If the shelf was
    already full, first remove the book with the **smallest read count**; among books with
    that count, remove the one whose most recent read is **oldest**.

  Read counts start again from 1 whenever a book comes back after being removed.
input_format: |
  The first line contains c and q. The second line contains the q requested book numbers.
output_format: One line, HIT or MISS, for every request.
constraints:
  - 1 ≤ c ≤ 10^5
  - 1 ≤ q ≤ 10^5
  - 1 ≤ x ≤ 10^6
examples:
  - input: "2 6\n1 2 1 3 2 1"
    output: "MISS\nMISS\nHIT\nMISS\nMISS\nHIT"
    explanation: "When 3 arrives, book 1 has 2 reads and book 2 has 1, so 2 leaves. When 2 comes back, books 1 (2 reads) and 3 (1 read) are on the shelf, so 3 leaves. Book 1 is still there at the end."
  - input: "1 3\n5 5 6"
    output: "MISS\nHIT\nMISS"
hints:
  - "Removing the book with the fewest reads, ties by oldest read, is a least-frequently-used cache."
  - "Group the books by read count. Inside each group, keep them in the order of their latest read, so the oldest is at the front."
  - "Track the smallest read count in use. A new book always has count 1, so after an insertion the smallest count is 1; a hit only changes it when it empties that group."
approach: |
  An LFU cache with O(1) operations. Keep count[x] for the books on the shelf, and for each
  count an ordered set of the books with that count, in order of their latest read (an ordered
  dictionary, or a linked list per count). A hit moves x from group count[x] to the end of group
  count[x] + 1, and if group count[x] was the smallest and is now empty, the smallest count
  goes up by one. A miss on a full shelf removes the front book of the smallest group, then x
  joins group 1 at the end and the smallest count becomes 1. Every request is O(1) expected.
reference: |
  import sys
  from collections import OrderedDict
  def main():
      data = sys.stdin.buffer.read().split()
      c, q = int(data[0]), int(data[1])
      count = {}
      groups = {}
      low = 0
      out = []
      for i in range(q):
          x = int(data[2 + i])
          k = count.get(x)
          if k is not None:
              g = groups[k]
              del g[x]
              if not g:
                  del groups[k]
                  if low == k:
                      low = k + 1
              count[x] = k + 1
              groups.setdefault(k + 1, OrderedDict())[x] = None
              out.append("HIT")
              continue
          out.append("MISS")
          if len(count) == c:
              g = groups[low]
              old, _ = g.popitem(last=False)
              if not g:
                  del groups[low]
              del count[old]
          count[x] = 1
          groups.setdefault(1, OrderedDict())[x] = None
          low = 1
      sys.stdout.write("\n".join(out) + "\n")
  main()
