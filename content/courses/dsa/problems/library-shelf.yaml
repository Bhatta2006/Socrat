  cpp: |
    #include <cstdio>
    #include <list>
    #include <string>
    #include <unordered_map>
    using namespace std;

    int main() {
        int c, q;
        if (scanf("%d %d", &c, &q) != 2) return 0;
        unordered_map<int, list<int>> groups;
        unordered_map<int, pair<int, list<int>::iterator>> book;
        book.reserve(2 * c + 1);
        int low = 0;
        string out;
        for (int i = 0; i < q; i++) {
            int x;
            scanf("%d", &x);
            auto it = book.find(x);
            if (it != book.end()) {
                int k = it->second.first;
                auto& g = groups[k];
                g.erase(it->second.second);
                if (g.empty()) {
                    groups.erase(k);
                    if (low == k) low = k + 1;
                }
                auto& h = groups[k + 1];
                h.push_back(x);
                it->second = {k + 1, prev(h.end())};
                out += "HIT\n";
                continue;
            }
            out += "MISS\n";
            if ((int)book.size() == c) {
                auto& g = groups[low];
                int old = g.front();
                g.pop_front();
                if (g.empty()) groups.erase(low);
                book.erase(old);
            }
            auto& h = groups[1];
            h.push_back(x);
            book[x] = {1, prev(h.end())};
            low = 1;
        }
        fputs(out.c_str(), stdout);
    }
  java: |
    import java.io.*;
    import java.util.*;

    public class Solution {
        public static void main(String[] args) throws IOException {
            DataInputStream in = new DataInputStream(new BufferedInputStream(System.in, 1 << 16));
            int c = next(in), q = next(in);
            HashMap<Integer, Integer> count = new HashMap<>();
            HashMap<Integer, LinkedHashSet<Integer>> groups = new HashMap<>();
            int low = 0;
            StringBuilder out = new StringBuilder();
            for (int i = 0; i < q; i++) {
                int x = next(in);
                Integer k = count.get(x);
                if (k != null) {
                    LinkedHashSet<Integer> g = groups.get(k);
                    g.remove(x);
                    if (g.isEmpty()) {
                        groups.remove(k);
                        if (low == k) low = k + 1;
                    }
                    count.put(x, k + 1);
                    groups.computeIfAbsent(k + 1, z -> new LinkedHashSet<>()).add(x);
                    out.append("HIT\n");
                    continue;
                }
                out.append("MISS\n");
                if (count.size() == c) {
                    LinkedHashSet<Integer> g = groups.get(low);
                    Iterator<Integer> first = g.iterator();
                    int old = first.next();
                    first.remove();
                    if (g.isEmpty()) groups.remove(low);
                    count.remove(old);
                }
                count.put(x, 1);
                groups.computeIfAbsent(1, z -> new LinkedHashSet<>()).add(x);
                low = 1;
            }
            System.out.print(out);
        }

        static int next(DataInputStream in) throws IOException {
            int ch = in.read();
            while (ch < '0' || ch > '9') ch = in.read();
            int v = 0;
            while (ch >= '0' && ch <= '9') { v = v * 10 + (ch - '0'); ch = in.read(); }
            return v;
        }
    }
