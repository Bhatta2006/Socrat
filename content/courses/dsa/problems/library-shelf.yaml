  c, q = map(int, input().split())
  xs = list(map(int, input().split()))
  shelf = {}
  for t, x in enumerate(xs):
      if x in shelf:
          shelf[x][0] += 1
          shelf[x][1] = t
          print("HIT")
          continue
      print("MISS")
      if len(shelf) == c:
          old = min(shelf, key=lambda b: (shelf[b][0], shelf[b][1]))
          del shelf[old]
      shelf[x] = [1, t]
