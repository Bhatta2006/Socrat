id: balance-point
title: Balance point
concepts: [prefix-sums]
difficulty: easy
statement: |
  An index `i` (0-based) is a *balance point* of an array when the sum of the elements to its
  left equals the sum of the elements to its right (the element at `i` itself is in neither).
  An empty side sums to 0.

  Print the smallest balance point, or `-1` if there is none.
input_format: |
  The first line contains n. The second line contains n whole numbers.
output_format: The smallest balance point, or -1.
constraints:
  - 1 ≤ n ≤ 10^5
  - -10^9 ≤ a_i ≤ 10^9
examples:
  - input: "6\n1 7 3 6 5 6"
    output: "3"
    explanation: 1 + 7 + 3 = 11 = 5 + 6.
  - input: "3\n1 2 3"
    output: "-1"
hints:
  - Recomputing both sums for every index is O(n^2). Which total can you compute once?
  - If you know the total and the sum to the left of i, what is the sum to the right of i?
  - With total = sum(a) and a running left sum, index i balances when left == total - left - a[i].
approach: |
  Compute the total once. Scan left to right with a running prefix sum `left`; index i is a
  balance point when left == total - left - a[i]. Add a[i] to left after the check. O(n), and use
  64-bit sums.
reference: |
  import sys
  data = sys.stdin.buffer.read().split()
  n = int(data[0])
  a = list(map(int, data[1:1 + n]))
  total = sum(a)
  left = 0
  answer = -1
  for i, x in enumerate(a):
      if left == total - left - x:
          answer = i
          break
      left += x
  print(answer)
brute: |
  n = int(input())
  a = list(map(int, input().split()))
  print(next((i for i in range(n) if sum(a[:i]) == sum(a[i + 1:])), -1))
generator: |
  def cases(rng):
      yield "1\n42"
      yield "2\n0 0"
      yield "3\n-1 5 -1"
      n = 100000
      a = [rng.randint(-10**9, 10**9) for _ in range(n)]
      yield f"{n}\n" + " ".join(map(str, a))
      half = [rng.randint(-1000, 1000) for _ in range((n - 1) // 2)]
      b = half + [rng.randint(-10**9, 10**9)] + half[::-1]
      yield f"{len(b)}\n" + " ".join(map(str, b))
      yield f"{n}\n" + " ".join(["0"] * n)
      for _ in range(4):
          n = rng.randint(1, 100)
          yield f"{n}\n" + " ".join(str(rng.randint(-3, 3)) for _ in range(n))
