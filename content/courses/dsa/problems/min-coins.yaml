id: min-coins
title: Fewest coins
concepts: [dp-1d]
difficulty: medium
statement: |
  Given `k` coin denominations (unlimited supply of each) and an amount `x`, print the
  minimum number of coins whose values sum to exactly `x`, or `-1` if it is impossible.
input_format: |
  The first line contains k and x. The second line contains the k coin values.
output_format: The minimum number of coins, or -1.
constraints:
  - 1 ≤ k ≤ 20
  - 0 ≤ x ≤ 50000
  - 1 ≤ coin ≤ 50000
examples:
  - input: "3 6\n1 3 4"
    output: "2"
    explanation: 3 + 3. Greedy (4 + 1 + 1) would use 3 coins.
  - input: "1 3\n2"
    output: "-1"
hints:
  - Why does always taking the largest coin fail on the first example?
  - "If the last coin used is c, what smaller problem is left?"
  - dp[0] = 0; dp[v] = min over coins c ≤ v of dp[v − c] + 1, with unreachable amounts marked as infinity.
approach: |
  Unbounded-knapsack DP over amounts: dp[0] = 0, others ∞; for v = 1..x, dp[v] =
  min(dp[v − c] + 1) over coins c ≤ v. Answer dp[x] or −1. O(k · x) ≤ 10^6.
reference: |
  import sys
  data = sys.stdin.read().split()
  k, x = int(data[0]), int(data[1])
  coins = sorted(set(int(c) for c in data[2:2 + k]))
  INF = 10**9
  dp = [0] + [INF] * x
  for v in range(1, x + 1):
      best = INF
      for c in coins:
          if c > v:
              break
          t = dp[v - c] + 1
          if t < best:
              best = t
      dp[v] = best
  print(dp[x] if dp[x] < INF else -1)
generator: |
  def cases(rng):
      yield "1 0\n5"
      yield "2 7\n2 4"
      yield "3 50000\n1 25000 49999"
      yield "10 50000\n" + " ".join(str(rng.randint(2, 500)) for _ in range(10))
      yield "4 49997\n6 10 15 35"
