id: next-greater
title: Days until warmer
concepts: [stacks]
difficulty: medium
statement: |
  Given daily temperatures for `n` days, print for each day how many days you must wait
  until a **strictly warmer** day. If there is no warmer day later, print 0 for that day.
input_format: |
  The first line contains n. The second line contains n temperatures.
output_format: n numbers separated by spaces.
constraints:
  - 1 ≤ n ≤ 200000
  - -100 ≤ t ≤ 100
examples:
  - input: "8\n73 74 75 71 69 72 76 73"
    output: "1 1 4 2 1 1 0 0"
  - input: "3\n30 30 30"
    output: "0 0 0"
hints:
  - For each day, scanning forward is O(n) — too slow overall. Which days are still "waiting" for an answer at any moment?
  - The waiting days, from oldest to newest, have temperatures in what order?
  - Keep a stack of indexes with decreasing temperatures; when a warmer day i arrives, pop each colder index j and set answer[j] = i − j.
approach: |
  Monotonic stack of unresolved indexes (temperatures strictly decreasing from bottom to
  top is not required — non-increasing). For each day i, while the top is colder than
  t[i], pop j and set ans[j] = i − j; then push i. Remaining indexes get 0. O(n) amortised.
reference: |
  import sys
  data = sys.stdin.buffer.read().split()
  n = int(data[0])
  t = list(map(int, data[1:1 + n]))
  ans = [0] * n
  st = []
  for i, x in enumerate(t):
      while st and t[st[-1]] < x:
          j = st.pop()
          ans[j] = i - j
      st.append(i)
  print(" ".join(map(str, ans)))
generator: |
  def cases(rng):
      yield "1\n-100"
      yield "5\n1 2 3 4 5"
      yield "5\n5 4 3 2 1"
      n = 200000
      yield f"{n}\n" + " ".join(str(rng.randint(-100, 100)) for _ in range(n))
      yield f"{n}\n" + " ".join(str(100 - i % 200) for i in range(n))
      for _ in range(6):
          n = rng.randint(1, 12)
          yield f"{n}\n" + " ".join(str(rng.randint(-3, 3)) for _ in range(n))
