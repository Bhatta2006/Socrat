  cpp: |
    #include <cstdio>
    #include <vector>
    using namespace std;

    int main() {
        int n;
        if (scanf("%d", &n) != 1) return 0;
        vector<long long> val(n + 1, 0), total(n + 1, 0);
        vector<int> left(n + 1), right(n + 1), order = {1};
        for (int i = 1; i <= n; i++) scanf("%lld", &val[i]);
        for (int i = 1; i <= n; i++) scanf("%d %d", &left[i], &right[i]);
        for (size_t k = 0; k < order.size(); k++) {
            int x = order[k];
            if (left[x]) order.push_back(left[x]);
            if (right[x]) order.push_back(right[x]);
        }
        int count = 0;
        for (int k = (int)order.size() - 1; k >= 0; k--) {
            int x = order[k];
            long long a = total[left[x]], b = total[right[x]];
            if (a == b) count++;
            total[x] = val[x] + a + b;
        }
        printf("%d\n", count);
    }
  java: |
    import java.io.*;
    import java.util.*;

    public class Solution {
        public static void main(String[] args) throws IOException {
            StreamTokenizer st = new StreamTokenizer(new BufferedReader(new InputStreamReader(System.in)));
            st.resetSyntax();
            st.wordChars('-', '-');
            st.wordChars('0', '9');
            st.whitespaceChars(0, ' ');
            st.nextToken();
            int n = Integer.parseInt(st.sval);
            long[] val = new long[n + 1], total = new long[n + 1];
            int[] left = new int[n + 1], right = new int[n + 1], order = new int[n];
            for (int i = 1; i <= n; i++) { st.nextToken(); val[i] = Long.parseLong(st.sval); }
            for (int i = 1; i <= n; i++) {
                st.nextToken(); left[i] = Integer.parseInt(st.sval);
                st.nextToken(); right[i] = Integer.parseInt(st.sval);
            }
            int size = 0;
            order[size++] = 1;
            for (int k = 0; k < size; k++) {
                int x = order[k];
                if (left[x] != 0) order[size++] = left[x];
                if (right[x] != 0) order[size++] = right[x];
            }
            int count = 0;
            for (int k = size - 1; k >= 0; k--) {
                int x = order[k];
                long a = total[left[x]], b = total[right[x]];
                if (a == b) count++;
                total[x] = val[x] + a + b;
            }
            System.out.println(count);
        }
    }
generator: |
  def tree(rng, n, lo, hi, shape):
      left, right = [0] * (n + 1), [0] * (n + 1)
      for node in range(2, n + 1):
          if shape == "chain":
              parent = node - 1
              (left if rng.random() < 0.5 else right)[parent] = node
              continue
          while True:
              parent = rng.randint(max(1, node - 50), node - 1) if shape == "deep" else rng.randint(1, node - 1)
              side = left if rng.random() < 0.5 else right
              if side[parent] == 0:
                  side[parent] = node
                  break
      vals = " ".join(str(rng.randint(lo, hi)) for _ in range(n))
      return f"{n}\n{vals}\n" + "\n".join(f"{left[i]} {right[i]}" for i in range(1, n + 1))

  def cases(rng):
      yield "1\n-5\n0 0"
      yield "3\n0 0 0\n2 3\n0 0\n0 0"
      yield tree(rng, 100000, -10**9, 10**9, "random")
      yield tree(rng, 100000, -2, 2, "random")
      yield tree(rng, 100000, 0, 0, "chain")
      yield tree(rng, 100000, -10**9, 10**9, "deep")
      yield tree(rng, 100000, -1, 1, "chain")
      for _ in range(4):
          yield tree(rng, rng.randint(1, 60), -3, 3, "random")
