id: whole-square-root
title: Whole-number square root
concepts: [binary-search]
difficulty: medium
statement: |
  For each query `x`, print the largest whole number `r` with `r · r ≤ x`. Do not use
  floating-point square roots: at this size they round incorrectly. Search for the answer.
input_format: |
  The first line contains q. Each of the next q lines contains one whole number x.
output_format: q lines, each the whole-number square root of x.
constraints:
  - 1 ≤ q ≤ 10^4
  - 0 ≤ x ≤ 10^18
examples:
  - input: "4\n0\n15\n16\n1000000000000000000"
    output: "0\n3\n4\n1000000000"
hints:
  - If r works (r·r ≤ x), does every smaller number work too? What does that let you do?
  - Search r in the range [0, 10^9 + 1]. What does each comparison tell you about the half you can drop?
  - Binary search for the last r with r * r ≤ x, using lo = 0 and hi = 10^9 + 1 and the invariant lo·lo ≤ x < hi·hi.
approach: |
  The predicate r·r ≤ x is monotone in r, so binary search the last true value in [0, 10^9]. Keep
  lo·lo ≤ x < hi·hi with hi = 10^9 + 1 and halve the interval. In C++/Java the product of two
  values up to 10^9 + 1 fits in a signed 64-bit integer. O(log x) per query.
reference: |
  import sys
  data = sys.stdin.buffer.read().split()
  q = int(data[0])
  out = []
  for x in map(int, data[1:1 + q]):
      lo, hi = 0, 10**9 + 1
      while hi - lo > 1:
          mid = (lo + hi) // 2
          if mid * mid <= x:
              lo = mid
          else:
              hi = mid
      out.append(lo)
  print("\n".join(map(str, out)))
brute: |
  import math
  q = int(input())
  for _ in range(q):
      print(math.isqrt(int(input())))
generator: |
  def cases(rng):
      special = [0, 1, 2, 3, 4, 10**18, 10**18 - 1, 999999999 ** 2, 999999999 ** 2 - 1, (10**9 - 1) ** 2 + 1]
      yield f"{len(special)}\n" + "\n".join(map(str, special))
      q = 10000
      yield f"{q}\n" + "\n".join(str(rng.randint(0, 10**18)) for _ in range(q))
      squares = [rng.randint(0, 10**9) for _ in range(q)]
      yield f"{q}\n" + "\n".join(str(max(0, r * r + rng.choice([-1, 0, 1]))) for r in squares)
