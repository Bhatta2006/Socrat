      yield f"{n} {n - 1}\n" + "\n".join(f"{i} {i + 1}" for i in range(1, n))
      for _ in range(6):
          n = rng.randint(1, 7)
          m = rng.randint(1, 7)
          yield f"{n} {m}\n" + "\n".join(f"{rng.randint(1, n)} {rng.randint(1, n)}" for _ in range(m))
