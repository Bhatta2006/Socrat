id: online-components
title: Growing friend groups
concepts: [union-find]
difficulty: medium
statement: |
  There are `n` learners and no friendships at first. `m` friendships form one at a time.
  After each one, print the number of separate friend groups and the size of the largest
  group.
input_format: |
  The first line contains n and m. Each of the next m lines contains a and b, a new
  friendship between learners a and b (it may repeat an existing connection).
output_format: m lines, each with the group count and the largest group size.
constraints:
  - 1 ≤ n ≤ 100000
  - 1 ≤ m ≤ 200000
examples:
  - input: "5 3\n1 2\n1 3\n4 5"
    output: "4 2\n3 3\n2 3"
hints:
  - Re-running BFS after each friendship is far too slow. What structure merges groups and answers "same group?" quickly?
  - When a friendship joins two different groups, how do the count and the largest size change?
  - Use DSU with union by size; on a successful union, decrement the group count and update the max with the new root's size.
approach: |
  Disjoint Set Union with path compression and union by size. Start with groups = n,
  largest = 1. For each edge, if the roots differ, merge (groups −= 1, largest =
  max(largest, merged size)). Print after every edge. Near O(m).
reference: |
  import sys
  data = sys.stdin.buffer.read().split()
  n, m = int(data[0]), int(data[1])
  parent = list(range(n + 1))
  size = [1] * (n + 1)
  def find(x):
      while parent[x] != x:
          parent[x] = parent[parent[x]]
          x = parent[x]
      return x
  groups, largest = n, 1
  out = []
  for i in range(m):
      a, b = find(int(data[2 + 2 * i])), find(int(data[3 + 2 * i]))
      if a != b:
          if size[a] < size[b]:
              a, b = b, a
          parent[b] = a
          size[a] += size[b]
          groups -= 1
          if size[a] > largest:
              largest = size[a]
      out.append(f"{groups} {largest}")
  print("\n".join(out))
generator: |
