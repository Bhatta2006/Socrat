id: sum-queries
title: Triangle number queries
concepts: [complexity]
difficulty: easy
statement: |
  Answer `q` queries. Each query gives `n`; print `1 + 2 + ... + n` modulo 1,000,000,007.

  `n` can be as large as 10^18, so a loop is far too slow. Find an O(1) answer per query.
input_format: |
  The first line contains q. Each of the next q lines contains one number n.
output_format: q lines, each the sum modulo 1000000007.
constraints:
  - 1 ≤ q ≤ 100000
  - 1 ≤ n ≤ 10^18
examples:
  - input: "3\n1\n4\n100"
    output: "1\n10\n5050"
hints:
  - How many steps would a loop take for n = 10^18? What does that tell you?
  - Pair the first and last terms, the second and second-to-last... what does each pair sum to?
  - "The sum is n(n+1)/2. Reduce modulo 1e9+7 carefully: in C++/Java, take n % MOD first and handle the division by 2 before reducing (one of n, n+1 is even)."
approach: |
  Use n(n+1)/2. Divide the even factor by 2 first (one of n and n+1 is even), then reduce
  both factors modulo 1e9+7 and multiply — this avoids overflow in C++/Java. Python can use
  big integers directly. O(1) per query.
reference: |
  import sys
  MOD = 10**9 + 7
  data = sys.stdin.read().split()
  q = int(data[0])
  print("\n".join(str(n * (n + 1) // 2 % MOD) for n in map(int, data[1:1 + q])))
generator: |
  def cases(rng):
      yield "4\n1000000000000000000\n999999999999999999\n2\n3"
      yield "1\n1000000006"
      yield "60000\n" + "\n".join(str(rng.randint(1, 10**18)) for _ in range(60000))
      for _ in range(5):
          q = rng.randint(1, 10)
          yield f"{q}\n" + "\n".join(str(rng.randint(1, 1000)) for _ in range(q))
