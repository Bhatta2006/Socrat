id: max-meetings
title: Most mentoring sessions
concepts: [greedy]
difficulty: medium
statement: |
  A mentor receives `n` session requests, each from minute `s` to minute `e` (`s < e`).
  Sessions cannot overlap, but one may start exactly when another ends. What is the
  maximum number of sessions the mentor can accept?
input_format: |
  The first line contains n. Each of the next n lines contains s and e.
output_format: The maximum number of sessions.
constraints:
  - 1 ≤ n ≤ 200000
  - 0 ≤ s < e ≤ 10^9
examples:
  - input: "4\n1 4\n3 5\n0 6\n5 7"
    output: "2"
    explanation: For example [1, 4] then [5, 7].
  - input: "3\n1 2\n2 3\n3 4"
    output: "3"
hints:
  - Try a few greedy rules on small examples — shortest first, earliest start first. Can you break them?
  - Which session, if accepted first, leaves the most time free for the others?
  - Sort by end time; accept a session if it starts at or after the end of the last accepted one.
approach: |
  Sort by end. Keep last_end; accept a session when s ≥ last_end and update last_end = e.
  The exchange argument shows earliest-end-first is optimal. O(n log n).
reference: |
  import sys
  data = sys.stdin.buffer.read().split()
  n = int(data[0])
  v = sorted(((int(data[1 + 2 * i]), int(data[2 + 2 * i])) for i in range(n)), key=lambda x: x[1])
  count = 0
  last = -1
  for s, e in v:
      if s >= last:
          count += 1
          last = e
  print(count)
generator: |
  def cases(rng):
      yield "1\n0 1"
      yield "3\n0 10\n1 2\n3 4"
      yield "4\n1 3\n1 3\n1 3\n3 5"
      n = 100000
      rows = []
      for _ in range(n):
          s = rng.randint(0, 10**9 - 1)
          rows.append(f"{s} {min(10**9, s + rng.randint(1, 10**6))}")
      yield f"{n}\n" + "\n".join(rows)
      for _ in range(6):
          n = rng.randint(1, 8)
          rows = []
          for _ in range(n):
              s = rng.randint(0, 10)
              rows.append(f"{s} {s + rng.randint(1, 5)}")
          yield f"{n}\n" + "\n".join(rows)
