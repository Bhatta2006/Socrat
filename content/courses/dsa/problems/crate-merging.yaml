id: crate-merging
title: Merging crate stacks
concepts: [dp-partition]
difficulty: medium
statement: |
  `n` stacks of crates stand in a row; stack i holds `w_i` crates. A forklift can merge two
  **neighbouring** stacks into one stack, which takes their place in the row. Merging costs
  the total number of crates in the new stack.

  Keep merging until one stack is left. Print the smallest total cost.
input_format: |
  The first line contains n. The second line contains w_1 … w_n.
output_format: The smallest total cost.
constraints:
  - 1 ≤ n ≤ 200
  - 1 ≤ w_i ≤ 10^9
examples:
  - input: "4\n10 20 30 40"
    output: "190"
    explanation: "Merge 10+20 (30), then 30+30 (60), then 60+40 (100): 30 + 60 + 100 = 190."
  - input: "1\n5"
    output: "0"
hints:
  - "The last merge joins a left block and a right block, each of which was merged on its own. Which state describes a block?"
  - "dp[i][j] = cheapest cost to merge stacks i..j into one. The last merge splits it after some k."
  - "dp[i][j] = min over k of dp[i][k] + dp[k + 1][j], plus the crates in i..j (a prefix sum). Fill by length."
approach: |
  Interval DP like matrix chain. dp[i][j] is the cheapest cost to merge stacks i..j; a single
  stack costs 0. The final merge of i..j joins i..k and k+1..j and costs the total weight of
  i..j, which a prefix sum gives in O(1). Fill ranges by length. O(n³) time, O(n²) memory;
  costs need 64-bit integers.
reference: |
  n = int(input())
  w = list(map(int, input().split()))
  pre = [0]
  for x in w:
      pre.append(pre[-1] + x)
  dp = [[0] * n for _ in range(n)]
  for length in range(2, n + 1):
      for i in range(n - length + 1):
          j = i + length - 1
          row, best = dp[i], None
          for k in range(i, j):
              c = row[k] + dp[k + 1][j]
              if best is None or c < best:
                  best = c
          dp[i][j] = best + pre[j + 1] - pre[i]
  print(dp[0][n - 1])
brute: |
  from functools import lru_cache
  n = int(input())
  w = tuple(map(int, input().split()))

  @lru_cache(maxsize=None)
  def go(stacks):
      if len(stacks) == 1:
          return 0
      best = None
      for k in range(len(stacks) - 1):
          merged = stacks[k] + stacks[k + 1]
          c = merged + go(stacks[:k] + (merged,) + stacks[k + 2:])
          best = c if best is None or c < best else best
      return best

  print(go(w))
