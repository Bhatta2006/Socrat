id: balanced-brackets
title: Balanced brackets
concepts: [stacks]
difficulty: easy
statement: |
  For each of `q` strings made of the characters `()[]{}`, print `YES` if the brackets are
  balanced and `NO` otherwise. A string is balanced when every opening bracket is closed by
  the same type of bracket, in the correct order.
input_format: |
  The first line contains q. Each of the next q lines contains one non-empty string.
output_format: q lines, each YES or NO.
constraints:
  - 1 ≤ q ≤ 1000
  - Total length of all strings ≤ 10^6
examples:
  - input: "4\n()[]{}\n([)]\n{[]}\n(("
    output: "YES\nNO\nYES\nNO"
hints:
  - When you see a closing bracket, which opening bracket must it match?
  - Which data structure always gives you the most recent unmatched opener?
  - Push openers on a stack; for a closer, the stack must be non-empty and its top must be the matching opener. At the end, the stack must be empty.
approach: |
  Stack of openers. For each closer, fail if the stack is empty or the top is not its
  matching opener; otherwise pop. Balanced iff the stack is empty at the end. O(length).
reference: |
  import sys
  lines = sys.stdin.read().split()
  q = int(lines[0])
  pairs = {")": "(", "]": "[", "}": "{"}
  out = []
  for s in lines[1:1 + q]:
      st = []
      ok = True
      for ch in s:
          if ch in "([{":
              st.append(ch)
          elif not st or st.pop() != pairs[ch]:
              ok = False
              break
      out.append("YES" if ok and not st else "NO")
  print("\n".join(out))
generator: |
  def cases(rng):
      yield "3\n)\n(\n[]"
      def balanced(k):
          out, st = [], []
          for _ in range(k):
              if st and rng.random() < 0.5:
                  out.append({"(": ")", "[": "]", "{": "}"}[st.pop()])
              else:
                  ch = rng.choice("([{")
                  st.append(ch)
                  out.append(ch)
          while st:
              out.append({"(": ")", "[": "]", "{": "}"}[st.pop()])
          return "".join(out)
      rows = []
      for _ in range(200):
          s = balanced(rng.randint(1, 2000))
          if rng.random() < 0.5:
              i = rng.randrange(len(s))
              s = s[:i] + rng.choice("()[]{}") + s[i + 1:]
          rows.append(s)
      yield f"{len(rows)}\n" + "\n".join(rows)
      for _ in range(6):
          q = rng.randint(1, 5)
          yield f"{q}\n" + "\n".join("".join(rng.choice("()[]") for _ in range(rng.randint(1, 8))) for _ in range(q))
