id: tree-diameter
title: Binary tree diameter
concepts: [binary-trees]
difficulty: medium
statement: |
  The **diameter** of a binary tree is the number of **edges** on the longest path between
  any two nodes (the path does not have to pass through the root). The tree has `n` nodes
  numbered 1 to `n`, rooted at node 1; node `i` has children `l[i]` and `r[i]` (0 = none).
input_format: |
  The first line contains n. Each of the next n lines contains l[i] and r[i].
output_format: The diameter in edges.
constraints:
  - 1 ≤ n ≤ 200000
examples:
  - input: "5\n2 3\n4 5\n0 0\n0 0\n0 0"
    output: "3"
    explanation: The path 4 → 2 → 1 → 3 has 3 edges.
  - input: "1\n0 0"
    output: "0"
hints:
  - For a path whose highest point is some node x, how is its length related to x's subtrees?
  - If every node knows the height of its left and right subtrees, what is the longest path that bends at that node?
  - Compute heights bottom-up; at each node update best = max(best, height(left) + height(right)) in edges. Avoid deep recursion — process nodes in reverse BFS order.
approach: |
  The longest path bending at node x has length depth(left subtree) + depth(right
  subtree), measured in edges where an empty subtree contributes 0 and a child contributes
  1 + its height. Compute heights bottom-up (reverse BFS order avoids recursion limits on
  chains) and take the maximum over all nodes. O(n).
reference: |
  import sys
  data = sys.stdin.buffer.read().split()
  n = int(data[0])
  L = [0] * (n + 1); R = [0] * (n + 1)
  for i in range(1, n + 1):
      L[i] = int(data[2 * i - 1]); R[i] = int(data[2 * i])
  order = [1]
  for x in order:
      if L[x]: order.append(L[x])
      if R[x]: order.append(R[x])
  h = [0] * (n + 1)  # height in edges of the subtree, counting down to deepest leaf
  best = 0
  for x in reversed(order):
      a = h[L[x]] + 1 if L[x] else 0
      b = h[R[x]] + 1 if R[x] else 0
      h[x] = max(a, b)
      best = max(best, a + b)
  print(best)
generator: |
  def cases(rng):
      def tree(n, chain=False):
          order = list(range(2, n + 1))
          rng.shuffle(order)
          slots = [(1, 0), (1, 1)]
          L = [0] * (n + 1); R = [0] * (n + 1)
          for node in order:
              if chain:
                  parent, side = slots[-2] if rng.random() < 0.5 else slots[-1]
                  slots = []
              else:
                  idx = rng.randrange(len(slots))
                  parent, side = slots[idx]
                  slots[idx] = slots[-1]; slots.pop()
              (L if side == 0 else R)[parent] = node
              slots += [(node, 0), (node, 1)]
          return f"{n}\n" + "\n".join(f"{L[i]} {R[i]}" for i in range(1, n + 1))
      yield "2\n0 2\n0 0"
      yield tree(150000)
      yield tree(150000, chain=True)
      for _ in range(6):
          yield tree(rng.randint(2, 10))
