id: grid-paths
title: Grid paths with obstacles
concepts: [dp-2d]
difficulty: medium
statement: |
  An `n × m` grid has open cells `.` and blocked cells `#`. Starting at the top-left cell
  and moving only **right** or **down**, how many paths reach the bottom-right cell?
  Print the answer modulo 1,000,000,007. If the start or end is blocked, the answer is 0.
input_format: |
  The first line contains n and m. Then n lines follow, each with m characters.
output_format: The number of paths modulo 1000000007.
constraints:
  - 1 ≤ n, m ≤ 1000
examples:
  - input: "3 3\n...\n.#.\n..."
    output: "2"
  - input: "2 2\n.#\n#."
    output: "0"
hints:
  - Which cells can a path come from just before reaching cell (r, c)?
  - Define ways(r, c). What is it for a blocked cell, and for the start?
  - dp[r][c] = 0 if blocked, else dp[r−1][c] + dp[r][c−1] (mod 1e9+7), with dp[0][0] = 1 when open; fill row by row.
approach: |
  dp over the grid row by row: blocked cells are 0; the start is 1 if open; every other
  open cell sums its top and left neighbours modulo 1e9+7. A single rolling row suffices.
  O(n·m).
reference: |
  import sys
  data = sys.stdin.read().split()
  n, m = int(data[0]), int(data[1])
  g = data[2:2 + n]
  MOD = 10**9 + 7
  dp = [0] * m
  for r in range(n):
      row = g[r]
      for c in range(m):
          if row[c] == "#":
              dp[c] = 0
          elif r == 0 and c == 0:
              dp[c] = 1
          elif c > 0:
              dp[c] = (dp[c] + dp[c - 1]) % MOD
  print(dp[m - 1])
generator: |
  def cases(rng):
      yield "1 1\n."
      yield "1 1\n#"
      yield "1 5\n....."
      yield "1000 1000\n" + "\n".join("." * 1000 for _ in range(1000))
      yield "800 900\n" + "\n".join("".join("#" if rng.random() < 0.08 else "." for _ in range(900)) for _ in range(800))
      for _ in range(6):
          n, m = rng.randint(1, 5), rng.randint(1, 5)
          yield f"{n} {m}\n" + "\n".join("".join("#" if rng.random() < 0.2 else "." for _ in range(m)) for _ in range(n))
