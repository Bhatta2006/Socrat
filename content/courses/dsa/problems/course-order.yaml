id: course-order
title: Course order
concepts: [topological-sort]
difficulty: medium
statement: |
  There are `n` lessons numbered 1 to `n` and `m` requirements `a b`, meaning lesson `a`
  must be completed before lesson `b`. Print an order in which all lessons can be taken. If
  several orders exist, print the **lexicographically smallest** (at each position, the
  smallest available lesson). If no order exists, print `IMPOSSIBLE`.
input_format: |
  The first line contains n and m. Each of the next m lines contains a and b.
output_format: The order separated by spaces, or IMPOSSIBLE.
constraints:
  - 1 ≤ n ≤ 100000
  - 0 ≤ m ≤ 200000
examples:
  - input: "5 3\n1 2\n3 1\n4 5"
    output: "3 1 2 4 5"
  - input: "3 3\n1 2\n2 3\n3 1"
    output: "IMPOSSIBLE"
hints:
  - Which lessons can be taken right now, at the very beginning?
  - After taking a lesson, which other lessons might become available, and how do you track that cheaply?
  - Kahn's algorithm with in-degrees, but use a min-heap of available lessons; if fewer than n are output, there is a cycle.
approach: |
  Count in-degrees, push all in-degree-0 lessons into a min-heap, repeatedly pop the
  smallest, output it, and decrement its successors (push those reaching 0). If fewer than n
  lessons are output, a cycle exists. O((n + m) log n).
reference: |
  import sys, heapq
  data = sys.stdin.buffer.read().split()
  n, m = int(data[0]), int(data[1])
  adj = [[] for _ in range(n + 1)]
  indeg = [0] * (n + 1)
  for i in range(m):
      a, b = int(data[2 + 2 * i]), int(data[3 + 2 * i])
      adj[a].append(b)
      indeg[b] += 1
  h = [v for v in range(1, n + 1) if indeg[v] == 0]
  heapq.heapify(h)
  order = []
  while h:
      u = heapq.heappop(h)
      order.append(u)
      for v in adj[u]:
          indeg[v] -= 1
          if indeg[v] == 0:
              heapq.heappush(h, v)
  print(" ".join(map(str, order)) if len(order) == n else "IMPOSSIBLE")
generator: |
  def cases(rng):
      yield "1 0"
      yield "2 1\n2 1"
      yield "3 2\n1 2\n2 1"
      n, m = 60000, 90000
      perm = list(range(1, n + 1))
      rng.shuffle(perm)
      pos = {v: i for i, v in enumerate(perm)}
      edges = []
      while len(edges) < m:
          a, b = rng.randint(1, n), rng.randint(1, n)
          if pos[a] < pos[b]:
              edges.append(f"{a} {b}")
      yield f"{n} {m}\n" + "\n".join(edges)
      edges.append(f"{perm[-1]} {perm[0]}")
      edges.append(f"{perm[0]} {perm[-1]}")
      yield f"{n} {len(edges)}\n" + "\n".join(edges)
      for _ in range(6):
          n = rng.randint(1, 7)
          m = rng.randint(0, 6)
          yield f"{n} {m}\n" + "\n".join(f"{rng.randint(1, n)} {rng.randint(1, n)}" for _ in range(m))
