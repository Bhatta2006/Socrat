id: single-number
title: The unpaired badge
concepts: [bit-manipulation]
difficulty: easy
statement: |
  Every learner badge ID in a list appears exactly **twice**, except one that appears only
  once. Find it using O(1) extra memory.
input_format: |
  The first line contains n (odd). The second line contains n badge IDs.
output_format: The ID that appears once.
constraints:
  - 1 ≤ n < 200000, n odd
  - 0 ≤ ID ≤ 10^18
examples:
  - input: "5\n4 1 2 1 2"
    output: "4"
  - input: "1\n7"
    output: "7"
hints:
  - A hash set works but uses O(n) memory. Which operation makes two equal values cancel out?
  - What is x ^ x? What is x ^ 0? Does the order of XOR operations matter?
  - XOR all the IDs together; every pair cancels and the unpaired ID remains. Use 64-bit integers.
approach: |
  XOR is associative and commutative with a ^ a = 0 and a ^ 0 = a, so XOR-ing everything
  cancels every pair and leaves the single ID. O(n) time, O(1) space.
reference: |
  import sys
  data = sys.stdin.buffer.read().split()
  n = int(data[0])
  r = 0
  for i in range(n):
      r ^= int(data[1 + i])
  print(r)
generator: |
  def cases(rng):
      yield "1\n0"
      yield "3\n1000000000000000000 5 5"
      def make(pairs, high):
          values = []
          for _ in range(pairs):
              v = rng.randint(0, high)
              values += [v, v]
          values.append(rng.randint(0, high))
          rng.shuffle(values)
          return f"{len(values)}\n" + " ".join(map(str, values))
      yield make(40000, 10**18)
      for _ in range(6):
          yield make(rng.randint(0, 5), 20)
