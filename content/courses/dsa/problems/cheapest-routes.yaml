id: cheapest-routes
title: Cheapest routes
concepts: [shortest-paths]
difficulty: medium
statement: |
  There are `n` cities and `m` one-way flights; a flight from `a` to `b` costs `c`. For
  every city, print the cheapest total cost to reach it from city 1, or `-1` if it is
  unreachable.
input_format: |
  The first line contains n and m. Each of the next m lines contains a, b and c.
output_format: n numbers separated by spaces (the first is always 0).
constraints:
  - 1 ≤ n ≤ 100000
  - 0 ≤ m ≤ 200000
  - 1 ≤ c ≤ 10^9
examples:
  - input: "4 5\n1 2 5\n1 3 1\n3 2 2\n2 4 1\n3 4 10"
    output: "0 3 1 4"
    explanation: "Going 1 → 3 → 2 costs 3, cheaper than the direct flight costing 5."
  - input: "3 1\n2 3 4"
    output: "0 -1 -1"
hints:
  - BFS assumes every flight costs the same. Which city should you finalise next when costs differ?
  - What structure always gives you the city with the smallest known cost so far?
  - Dijkstra with a min-heap of (cost, city); skip popped entries whose cost is worse than the recorded one; use 64-bit costs.
approach: |
  Dijkstra from city 1 with a min-heap of (distance, node) and lazy deletion. Costs are
  positive, so popped distances are final. Distances can reach about 10^14, so use 64-bit
  integers; print −1 for unreachable cities. O((n + m) log n).
reference: |
  import sys, heapq
  data = sys.stdin.buffer.read().split()
  n, m = int(data[0]), int(data[1])
  adj = [[] for _ in range(n + 1)]
  for i in range(m):
      a, b, c = int(data[2 + 3 * i]), int(data[3 + 3 * i]), int(data[4 + 3 * i])
      adj[a].append((b, c))
  INF = float("inf")
  dist = [INF] * (n + 1)
  dist[1] = 0
  h = [(0, 1)]
  while h:
      d, u = heapq.heappop(h)
      if d > dist[u]:
          continue
      for v, w in adj[u]:
          nd = d + w
          if nd < dist[v]:
              dist[v] = nd
              heapq.heappush(h, (nd, v))
  print(" ".join(str(x) if x != INF else "-1" for x in dist[1:]))
generator: |
  def cases(rng):
      yield "1 0"
      yield "2 1\n2 1 5"
      n, m = 40000, 60000
      edges = [f"{rng.randint(1, n)} {rng.randint(1, n)} {rng.randint(1, 10**9)}" for _ in range(m)]
      edges += [f"1 {rng.randint(2, n)} {rng.randint(1, 10**9)}" for _ in range(20)]
      yield f"{n} {len(edges)}\n" + "\n".join(edges)
      n = 30000
      edges = [f"{i} {i + 1} 1000000000" for i in range(1, n)]
      yield f"{n} {len(edges)}\n" + "\n".join(edges)
      for _ in range(6):
          n = rng.randint(1, 6)
          m = rng.randint(0, 8)
          yield f"{n} {m}\n" + "\n".join(f"{rng.randint(1, n)} {rng.randint(1, n)} {rng.randint(1, 9)}" for _ in range(m))
