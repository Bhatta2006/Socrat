id: max-window-sum
title: Best k-day streak
concepts: [sliding-window]
difficulty: easy
statement: |
  You logged the number of minutes you studied on each of `n` days. Find the largest total
  over any `k` **consecutive** days.
input_format: |
  The first line contains n and k. The second line contains n integers (they may be
  negative, representing corrections).
output_format: The maximum sum of k consecutive values.
constraints:
  - 1 ≤ k ≤ n ≤ 200000
  - -10^9 ≤ value ≤ 10^9
examples:
  - input: "6 3\n2 1 5 1 3 2"
    output: "9"
    explanation: Days 2–4 give 1 + 5 + 1 = 7; days 3–5 give 5 + 1 + 3 = 9.
  - input: "3 3\n-1 -2 -3"
    output: "-6"
hints:
  - When the k-day window moves one day later, which values change?
  - You never need to add up k numbers again after the first window.
  - Start with the sum of the first k values; for each next day add the new value and subtract the value k days earlier; track the maximum.
approach: |
  Fixed-size sliding window: s = sum of first k; best = s; for right in k..n−1:
  s += a[right] − a[right − k]; best = max(best, s). O(n). Initialise best from the first
  window (not 0) because all values may be negative; use 64-bit sums.
reference: |
  import sys
  data = sys.stdin.buffer.read().split()
  n, k = int(data[0]), int(data[1])
  a = list(map(int, data[2:2 + n]))
  s = sum(a[:k])
  best = s
  for r in range(k, n):
      s += a[r] - a[r - k]
      if s > best:
          best = s
  print(best)
generator: |
  def cases(rng):
      yield "1 1\n-1000000000"
      yield "5 1\n3 -1 4 -1 5"
      n = 100000
      yield f"{n} 1000\n" + " ".join(str(rng.randint(-10**9, 10**9)) for _ in range(n))
      yield f"{n} {n}\n" + " ".join(str(rng.randint(-10**9, 10**9)) for _ in range(n))
      for _ in range(6):
          n = rng.randint(1, 12)
          yield f"{n} {rng.randint(1, n)}\n" + " ".join(str(rng.randint(-9, 9)) for _ in range(n))
