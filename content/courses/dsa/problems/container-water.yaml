id: container-water
title: Container with most water
concepts: [two-pointers]
difficulty: medium
statement: |
  You are given `n` vertical lines; line `i` has height `h[i]`. Choose two lines that,
  together with the x-axis, hold the most water. The water held between lines `i < j` is
  `(j − i) × min(h[i], h[j])`. Print the maximum.
input_format: |
  The first line contains n. The second line contains n heights.
output_format: The maximum amount of water.
constraints:
  - 2 ≤ n ≤ 200000
  - 0 ≤ h[i] ≤ 10^9
examples:
  - input: "9\n1 8 6 2 5 4 8 3 7"
    output: "49"
    explanation: Lines 2 and 9 (heights 8 and 7) are 7 apart; 7 × 7 = 49.
  - input: "2\n1 1"
    output: "1"
hints:
  - Start with the widest container. Which of the two lines is limiting the water?
  - If you move the taller line inward, can the area ever increase? What about the shorter one?
  - Keep pointers at both ends; record the area, then move the pointer at the shorter line inward.
approach: |
  Two pointers at both ends. The shorter line limits the height, and moving the taller one
  only reduces the width, so it can never help — move the shorter one. Track the best area.
  O(n). The area can reach about 2·10^14: use 64-bit integers.
reference: |
  import sys
  data = sys.stdin.buffer.read().split()
  n = int(data[0])
  h = list(map(int, data[1:1 + n]))
  i, j = 0, n - 1
  best = 0
  while i < j:
      best = max(best, (j - i) * min(h[i], h[j]))
      if h[i] < h[j]:
          i += 1
      else:
          j -= 1
  print(best)
generator: |
  def cases(rng):
      yield "2\n0 0"
      yield "3\n1000000000 0 1000000000"
      yield "5\n1 2 3 4 5"
      n = 200000
      yield f"{n}\n" + " ".join(str(rng.randint(0, 10**9)) for _ in range(n))
      for _ in range(6):
          n = rng.randint(2, 12)
          yield f"{n}\n" + " ".join(str(rng.randint(0, 9)) for _ in range(n))
