id: subset-sum-count
title: Subsets with target sum
concepts: [backtracking]
difficulty: medium
statement: |
  Count how many subsets of `n` positive integers have a sum of exactly `t`. Elements at
  different positions are different even if their values are equal. The empty subset has
  sum 0.
input_format: |
  The first line contains n and t. The second line contains n positive integers.
output_format: The number of subsets with sum t.
constraints:
  - 1 ≤ n ≤ 18
  - 1 ≤ a[i] ≤ 10^6
  - 0 ≤ t ≤ 1.8·10^7
examples:
  - input: "4 5\n1 2 3 4"
    output: "2"
    explanation: "{1, 4} and {2, 3}."
  - input: "3 2\n1 1 1"
    output: "3"
hints:
  - For each element there are exactly two choices. How many subsets is that, and is it small enough here?
  - Write a recursive function that decides element i, then the rest. What does it need to remember?
  - go(i, sum) = go(i+1, sum + a[i]) + go(i+1, sum); count when i == n and sum == t. Prune when sum > t (all values positive).
approach: |
  Backtracking over include/exclude decisions with the running sum. Base case at i == n
  counts sum == t. Because values are positive, prune once sum exceeds t. Worst case
  O(2^n) ≈ 2.6·10^5 for n = 18.
reference: |
  import sys
  data = sys.stdin.read().split()
  n, t = int(data[0]), int(data[1])
  a = list(map(int, data[2:2 + n]))
  from collections import Counter
  sums = Counter({0: 1})
  for x in a:
      nxt = Counter(sums)
      for s, c in sums.items():
          if s + x <= t:
              nxt[s + x] += c
      sums = nxt
  print(sums[t])
generator: |
  def cases(rng):
      yield "1 0\n5"
      yield "1 5\n5"
      yield "18 10\n" + " ".join("1" for _ in range(18))
      yield "18 18000000\n" + " ".join("1000000" for _ in range(18))
      a = [rng.randint(1, 50) for _ in range(18)]
      yield f"18 {sum(a) // 2}\n" + " ".join(map(str, a))
      for _ in range(6):
          n = rng.randint(1, 10)
          a = [rng.randint(1, 6) for _ in range(n)]
          yield f"{n} {rng.randint(0, sum(a))}\n" + " ".join(map(str, a))
