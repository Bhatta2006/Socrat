id: longest-unique-substring
title: Longest substring without repeats
concepts: [sliding-window]
difficulty: medium
statement: |
  Given a string of lowercase letters, print the length of the longest contiguous substring
  in which no character repeats.
input_format: One line with the string s.
output_format: The length of the longest substring without repeating characters.
constraints:
  - 1 ≤ |s| ≤ 200000
examples:
  - input: abcabcbb
    output: "3"
  - input: bbbbb
    output: "1"
  - input: pwwkew
    output: "3"
    explanation: '"wke" — note that "pwke" is not contiguous.'
hints:
  - Checking every substring is O(n²) or worse. What could you keep track of as you extend a substring to the right?
  - When the new character already appears in your current window, where must the window's left edge move to?
  - Store each character's last index; when s[right] was last seen at or after left, set left = last + 1. Track right − left + 1.
approach: |
  Sliding window with a last-seen table. For each right: if last[s[right]] ≥ left, move
  left to last[s[right]] + 1; update last[s[right]] = right; best = max(best, right − left + 1).
  O(n) time, O(alphabet) space.
reference: |
  s = input().strip()
  last = {}
  left = best = 0
  for right, ch in enumerate(s):
      if last.get(ch, -1) >= left:
          left = last[ch] + 1
      last[ch] = right
      best = max(best, right - left + 1)
  print(best)
generator: |
  def cases(rng):
      yield "a"
      yield "abcdefghijklmnopqrstuvwxyz"
      yield "abba"
      yield "".join(rng.choice("abcdefghijklmnopqrstuvwxyz") for _ in range(200000))
      yield "".join(rng.choice("ab") for _ in range(200000))
      for _ in range(6):
          yield "".join(rng.choice("abcd") for _ in range(rng.randint(1, 15)))
