id: house-robber
title: Non-adjacent picks
concepts: [dp-1d]
difficulty: medium
statement: |
  You have `n` practice problems in a row; problem `i` is worth `a[i]` points. To stay
  fresh you never solve two **adjacent** problems. What is the maximum total you can earn?
input_format: |
  The first line contains n. The second line contains n non-negative integers.
output_format: The maximum total.
constraints:
  - 1 ≤ n ≤ 200000
  - 0 ≤ a[i] ≤ 10^9
examples:
  - input: "5\n2 7 9 3 1"
    output: "12"
    explanation: Take 2, 9 and 1.
  - input: "4\n2 1 1 2"
    output: "4"
hints:
  - Look at the last problem. What are your two options, and what does each leave you with?
  - "Define best(i) as the best total using problems 1..i. How does best(i) relate to best(i−1) and best(i−2)?"
  - best(i) = max(best(i−1), best(i−2) + a[i]); keep only the last two values.
approach: |
  dp[i] = max(dp[i − 1], dp[i − 2] + a[i]) — skip problem i or take it. Iterate keeping two
  variables. O(n) time, O(1) space, 64-bit totals.
reference: |
  import sys
  data = sys.stdin.buffer.read().split()
  n = int(data[0])
  p2 = p1 = 0
  for i in range(n):
      x = int(data[1 + i])
      p2, p1 = p1, max(p1, p2 + x)
  print(p1)
generator: |
  def cases(rng):
      yield "1\n0"
      yield "1\n1000000000"
      yield "3\n5 100 5"
      n = 200000
      yield f"{n}\n" + " ".join(str(rng.randint(0, 10**9)) for _ in range(n))
      for _ in range(6):
          n = rng.randint(1, 10)
          yield f"{n}\n" + " ".join(str(rng.randint(0, 9)) for _ in range(n))
