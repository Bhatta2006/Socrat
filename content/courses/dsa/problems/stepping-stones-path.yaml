  cpp: |
    #include <cstdlib>
    #include <iostream>
    #include <vector>
    using namespace std;

    int main() {
        int n;
        cin >> n;
        vector<long long> h(n), best(n, 0);
        for (auto& x : h) cin >> x;
        for (int i = n - 2; i >= 0; i--) {
            best[i] = llabs(h[i] - h[i + 1]) + best[i + 1];
            if (i + 2 < n) best[i] = min(best[i], llabs(h[i] - h[i + 2]) + best[i + 2]);
        }
        cout << best[0] << "\n" << 1;
        int i = 0;
        while (i < n - 1) {
            i += (llabs(h[i] - h[i + 1]) + best[i + 1] == best[i]) ? 1 : 2;
            cout << " " << i + 1;
        }
        cout << "\n";
    }
  java: |
    import java.io.*;
    import java.util.*;

    public class Solution {
        public static void main(String[] args) throws IOException {
            BufferedReader in = new BufferedReader(new InputStreamReader(System.in));
            int n = Integer.parseInt(in.readLine().trim());
            StringTokenizer st = new StringTokenizer(in.readLine());
            long[] h = new long[n], best = new long[n];
            for (int i = 0; i < n; i++) h[i] = Long.parseLong(st.nextToken());
            for (int i = n - 2; i >= 0; i--) {
                best[i] = Math.abs(h[i] - h[i + 1]) + best[i + 1];
                if (i + 2 < n) best[i] = Math.min(best[i], Math.abs(h[i] - h[i + 2]) + best[i + 2]);
            }
            StringBuilder out = new StringBuilder().append(best[0]).append("\n1");
            int i = 0;
            while (i < n - 1) {
                i += (Math.abs(h[i] - h[i + 1]) + best[i + 1] == best[i]) ? 1 : 2;
                out.append(' ').append(i + 1);
            }
            System.out.println(out);
        }
    }
