id: rank-students
title: Leaderboard
concepts: [sorting]
difficulty: easy
statement: |
  Print a leaderboard of `n` learners. Order by **score descending**; when scores tie,
  order by **name ascending** (alphabetical). Print each as `name score`.
input_format: |
  The first line contains n. Each of the next n lines contains a name and a score.
output_format: n lines in leaderboard order.
constraints:
  - 1 ≤ n ≤ 100000
  - Names are 1 to 12 lowercase letters and are unique.
  - 0 ≤ score ≤ 10^9
examples:
  - input: "4\nbob 90\nann 95\ncal 90\ndee 80"
    output: "ann 95\nbob 90\ncal 90\ndee 80"
hints:
  - What two keys decide the order, and which one matters first?
  - How do you make one key descending and the other ascending in your language's sort?
  - Sort by the tuple (−score, name) in Python, or a comparator that compares scores first (larger first) then names.
approach: |
  Read pairs and sort with a composite key: score descending, then name ascending. Python
  key=(−score, name); C++ comparator returning a.score > b.score or (equal and
  a.name < b.name); Java Comparator.comparingLong(−score).thenComparing(name). O(n log n).
reference: |
  import sys
  data = sys.stdin.read().split()
  n = int(data[0])
  rows = [(data[1 + 2 * i], int(data[2 + 2 * i])) for i in range(n)]
  rows.sort(key=lambda r: (-r[1], r[0]))
  print("\n".join(f"{name} {score}" for name, score in rows))
generator: |
  def cases(rng):
      yield "1\nsolo 0"
      yield "3\nc 5\nb 5\na 5"
      import string
      names = set()
      while len(names) < 65000:
          names.add("".join(rng.choice(string.ascii_lowercase) for _ in range(rng.randint(3, 12))))
      names = sorted(names)
      rng.shuffle(names)
      yield f"{len(names)}\n" + "\n".join(f"{nm} {rng.randint(0, 1000)}" for nm in names)
      for _ in range(5):
          k = rng.randint(1, 8)
          picked = rng.sample(["ann", "bob", "cal", "dee", "eve", "fay", "gus", "hal"], k)
          yield f"{k}\n" + "\n".join(f"{nm} {rng.randint(0, 3)}" for nm in picked)
