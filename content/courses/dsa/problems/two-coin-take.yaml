id: two-coin-take
title: Take one or two
concepts: [dp-advanced-patterns]
difficulty: medium
statement: |
  `n` coins lie in a row with values `a_1 … a_n`; values may be negative (debts). Two players
  take turns, starting with Ana. On each turn a player takes **one or two** coins from the
  **left end** of the row and adds their values to their score. The game ends when the row is
  empty. Both players play to maximise their own final score.

  Print Ana's final score.
input_format: |
  The first line contains n. The second line contains a_1 … a_n.
output_format: Ana's final score.
constraints:
  - 1 ≤ n ≤ 10^5
  - −10^9 ≤ a_i ≤ 10^9
examples:
  - input: "4\n1 2 3 7"
    output: "8"
    explanation: "Ana takes 1. If Bob takes only 2, Ana takes 3 and 7 (11); so Bob takes 2 and 3, and Ana takes 7: 1 + 7 = 8. Taking 1 and 2 first would leave Bob 3 and 7, and Ana only 3."
  - input: "3\n-5 10 1"
    output: "5"
    explanation: "Ana takes −5 and 10 together (5); Bob gets 1. Taking −5 alone would let Bob take 10 and 1."
hints:
  - "Both players face the same kind of position: the coins from index i to the end. What single number describes a position for whoever moves?"
  - "Let diff[i] = the best (mover's score − other's score) on the coins i..n−1, with diff[n] = 0."
  - "diff[i] = max(a[i] − diff[i+1], a[i] + a[i+1] − diff[i+2]). Ana's score is (total + diff[0]) / 2."
approach: |
  Minimax on suffixes. diff[i] is the best score difference the player to move can force on
  the coins from i to the end. Taking one coin leaves the opponent the suffix i + 1, taking two
  leaves i + 2, so diff[i] = max(a[i] − diff[i + 1], a[i] + a[i + 1] − diff[i + 2]). Since
  Ana's and Bob's scores add up to the total and differ by diff[0], Ana gets
  (total + diff[0]) / 2. O(n) time; values need 64-bit integers.
reference: |
  n = int(input())
  a = list(map(int, input().split()))
  diff = [0] * (n + 2)
  for i in range(n - 1, -1, -1):
      best = a[i] - diff[i + 1]
      if i + 1 < n:
          two = a[i] + a[i + 1] - diff[i + 2]
          if two > best:
              best = two
      diff[i] = best
  print((sum(a) + diff[0]) // 2)
brute: |
  from functools import lru_cache
  n = int(input())
  a = list(map(int, input().split()))

  @lru_cache(maxsize=None)
  def go(i, ana_turn):
      if i >= n:
          return 0, 0
      best = None
      for k in (1, 2):
          if i + k > n:
              continue
          got = sum(a[i:i + k])
          x, y = go(i + k, not ana_turn)
          if ana_turn:
              cand = (x + got, y)
              if best is None or cand[0] > best[0]:
                  best = cand
          else:
              cand = (x, y + got)
              if best is None or cand[1] > best[1]:
                  best = cand
      return best

  print(go(0, True)[0])
references:
  cpp: |
    #include <algorithm>
    #include <iostream>
    #include <vector>
    using namespace std;

    int main() {
        int n;
        cin >> n;
        vector<long long> a(n), diff(n + 2, 0);
        long long total = 0;
        for (auto& x : a) cin >> x, total += x;
        for (int i = n - 1; i >= 0; i--) {
            diff[i] = a[i] - diff[i + 1];
            if (i + 1 < n) diff[i] = max(diff[i], a[i] + a[i + 1] - diff[i + 2]);
        }
        cout << (total + diff[0]) / 2 << "\n";
    }
  java: |
    import java.io.*;
    import java.util.*;

    public class Solution {
        public static void main(String[] args) throws IOException {
            BufferedReader in = new BufferedReader(new InputStreamReader(System.in));
            int n = Integer.parseInt(in.readLine().trim());
            StringTokenizer st = new StringTokenizer(in.readLine());
            long[] a = new long[n], diff = new long[n + 2];
            long total = 0;
            for (int i = 0; i < n; i++) { a[i] = Long.parseLong(st.nextToken()); total += a[i]; }
            for (int i = n - 1; i >= 0; i--) {
                diff[i] = a[i] - diff[i + 1];
                if (i + 1 < n) diff[i] = Math.max(diff[i], a[i] + a[i + 1] - diff[i + 2]);
            }
            System.out.println((total + diff[0]) / 2);
        }
    }
