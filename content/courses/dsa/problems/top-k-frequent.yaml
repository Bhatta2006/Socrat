id: top-k-frequent
title: Top K frequent
concepts: [arrays-hashing]
difficulty: medium
statement: |
  Given `n` integers, print the `k` values that occur most often, from most to least
  frequent. When two values have the same frequency, print the **smaller value first**.
input_format: |
  The first line contains n and k. The second line contains n integers.
  k is at most the number of distinct values.
output_format: The k values on one line separated by spaces.
constraints:
  - 1 ≤ n ≤ 200000
  - -10^9 ≤ value ≤ 10^9
examples:
  - input: "6 2\n1 1 1 2 2 3"
    output: "1 2"
  - input: "5 2\n4 4 7 7 5"
    output: "4 7"
    explanation: 4 and 7 both appear twice; the smaller, 4, comes first.
hints:
  - Before you can rank values, what do you need to know about each one?
  - Once you have counts, how do you order values by count, breaking ties by value?
  - Count with a hash map, then sort distinct values by (count descending, value ascending) and take the first k.
approach: |
  Count frequencies with a hash map (O(n)), then sort the distinct values by
  (−count, value) and output the first k. O(n + d log d). A bucket sort by frequency gives
  O(n) if needed.
reference: |
  import sys
  from collections import Counter
  data = sys.stdin.read().split()
  n, k = int(data[0]), int(data[1])
  counts = Counter(map(int, data[2:2 + n]))
  order = sorted(counts, key=lambda v: (-counts[v], v))
  print(" ".join(map(str, order[:k])))
generator: |
  def cases(rng):
      yield "1 1\n5"
      yield "4 4\n-1 -2 -3 -4"
      n = 100000
      yield f"{n} 10\n" + " ".join(str(rng.randint(-50, 50)) for _ in range(n))
      yield f"{n} 3\n" + " ".join(str(rng.randint(-10**9, 10**9)) for _ in range(n))
      for _ in range(6):
          n = rng.randint(1, 20)
          values = [rng.randint(-5, 5) for _ in range(n)]
          k = rng.randint(1, len(set(values)))
          yield f"{n} {k}\n" + " ".join(map(str, values))
