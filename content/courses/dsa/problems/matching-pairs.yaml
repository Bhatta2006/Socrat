id: matching-pairs
title: Matching sock pairs
concepts: [complexity]
difficulty: easy
statement: |
  A drawer holds `n` socks; sock `i` has colour code `a_i`. Count the pairs of positions
  `i < j` with the same colour code.

  With n up to 10^5, checking every pair is far too slow. Find a way that looks at each sock once.
input_format: |
  The first line contains n. The second line contains n colour codes.
output_format: The number of pairs i < j with a_i = a_j.
constraints:
  - 1 ≤ n ≤ 10^5
  - 1 ≤ a_i ≤ 10^9
examples:
  - input: "5\n3 1 3 3 1"
    output: "4"
    explanation: Colour 3 appears 3 times (3 pairs) and colour 1 twice (1 pair).
hints:
  - How many comparisons does the two-nested-loops solution make when n = 10^5?
  - If a colour has appeared c times before the current sock, how many new pairs does this sock make?
  - Keep a count per colour; for each sock add count[colour] to the answer, then increase count[colour]. The answer can exceed 2^31.
approach: |
  Each sock forms a pair with every earlier sock of the same colour, so add the number of earlier
  equal colours as you scan, using a hash map of counts. O(n) time instead of O(n^2). The total
  can reach about 5·10^9, so use a 64-bit integer.
reference: |
  import sys
  data = sys.stdin.buffer.read().split()
  n = int(data[0])
  seen = {}
  pairs = 0
  for x in data[1:1 + n]:
      c = seen.get(x, 0)
      pairs += c
      seen[x] = c + 1
  print(pairs)
brute: |
  n = int(input())
  a = list(map(int, input().split()))
  print(sum(1 for i in range(n) for j in range(i + 1, n) if a[i] == a[j]))
generator: |
  def cases(rng):
      yield "1\n5"
      yield "2\n7 7"
      n = 100000
      yield f"{n}\n" + " ".join(["1000000000"] * n)
      yield f"{n}\n" + " ".join(str(rng.randint(1, 10**9)) for _ in range(n))
      yield f"{n}\n" + " ".join(str(rng.randint(1, 50)) for _ in range(n))
      for _ in range(4):
          n = rng.randint(1, 1000)
          yield f"{n}\n" + " ".join(str(rng.randint(1, 10)) for _ in range(n))
small_generator: |
  def cases(rng):
      for _ in range(300):
          n = rng.randint(1, 10)
          yield f"{n}\n" + " ".join(str(rng.randint(1, 4)) for _ in range(n))
