  def line(n, m, values):
      return f"{n} {m}\n" + " ".join(map(str, values))

  def cases(rng):
      yield "1 1\n-5"
      yield "1 7\n3"
      yield "2 1000000000\n1000000000 -1000000000"
      n = 100000
      yield line(n, 1, [rng.randint(-10**9, 10**9) for _ in range(n)])
      yield line(n, 1000000000, [rng.randint(1, 1000) for _ in range(n)])
      yield line(n, 999999937, [rng.randint(-10**9, 10**9) for _ in range(n)])
      yield line(n, 7, [rng.randint(-10**9, 10**9) for _ in range(n)])
      yield line(n, 100000, [rng.randint(-10**9, -1) for _ in range(n)])
      yield line(n, 2, [rng.choice([1, 3]) for _ in range(n)])
      for _ in range(4):
          k = rng.randint(1, 50)
          yield line(k, rng.randint(1, 12), [rng.randint(-20, 20) for _ in range(k)])
