id: count-islands
title: Count the islands
concepts: [graph-traversal]
difficulty: medium
statement: |
  A map has `r` rows and `c` columns; `#` is land and `.` is water. An **island** is a group
  of land cells connected horizontally or vertically (not diagonally). Count the islands.
input_format: |
  The first line contains r and c. Then r lines follow, each with c characters.
output_format: The number of islands.
constraints:
  - 1 ≤ r, c ≤ 700
examples:
  - input: "4 5\n##..#\n#...#\n..#..\n.....\n"
    output: "3"
  - input: "1 1\n."
    output: "0"
hints:
  - Treat each land cell as a node. Which cells are its neighbours?
  - Every time you find land you haven't visited, how much of the map should you mark before continuing?
  - Scan all cells; for each unvisited '#', increase the count and flood-fill its island with BFS or an explicit-stack DFS.
approach: |
  Grid as an implicit graph. Scan cells; each unvisited land cell starts a new island —
  flood fill it (BFS with a queue or DFS with an explicit stack) marking every reachable
  land cell. Count the starts. O(r·c). Avoid recursive DFS: an island can contain a million
  cells.
reference: |
  import sys
  data = sys.stdin.read().split()
  r, c = int(data[0]), int(data[1])
  g = [bytearray(row, "ascii") for row in data[2:2 + r]]
  count = 0
  for i in range(r):
      row = g[i]
      for j in range(c):
          if row[j] == 35:
              count += 1
              row[j] = 46
              stack = [(i, j)]
              while stack:
                  x, y = stack.pop()
                  for nx, ny in ((x + 1, y), (x - 1, y), (x, y + 1), (x, y - 1)):
                      if 0 <= nx < r and 0 <= ny < c and g[nx][ny] == 35:
                          g[nx][ny] = 46
                          stack.append((nx, ny))
  print(count)
generator: |
  def cases(rng):
      yield "1 1\n#"
      yield "3 3\n#.#\n.#.\n#.#"
      yield "2 3\n###\n###"
      for size, p in [(700, 0.45), (700, 0.7), (500, 0.2)]:
          yield f"{size} {size}\n" + "\n".join(
              "".join("#" if rng.random() < p else "." for _ in range(size)) for _ in range(size)
          )
      for _ in range(5):
          r, c = rng.randint(1, 7), rng.randint(1, 7)
          yield f"{r} {c}\n" + "\n".join("".join(rng.choice("#..") for _ in range(c)) for _ in range(r))
