id: tidy-shelf
title: Tidy shelf
concepts: [dp-lis]
difficulty: medium
statement: |
  A shelf holds `n` books in a row; book i has height `h_i`. You may take books off the shelf,
  but you may not reorder the books that stay. Afterwards, the remaining heights must never go
  **down** from left to right (equal neighbours are fine).

  Print the fewest books you must remove.
input_format: |
  The first line contains n. The second line contains h_1 … h_n.
output_format: The fewest removals.
constraints:
  - 1 ≤ n ≤ 1.5 · 10^5
  - 1 ≤ h_i ≤ 10^9
examples:
  - input: "6\n3 1 2 2 5 4"
    output: "2"
    explanation: "Remove 3 and 4 (or 3 and 5) to keep 1 2 2 5. Equal heights may stand side by side."
  - input: "3\n7 7 7"
    output: "0"
hints:
  - "The books that stay form a subsequence whose heights never decrease. To remove the fewest, keep the longest such subsequence."
  - "n is up to 1.5·10^5, so the O(n²) table is too slow. Use patience sorting: tails[L] is the smallest last height of a valid row of length L + 1."
  - "Equal heights may follow each other, so search for the first tail strictly greater than h (upper bound). Print n − len(tails)."
approach: |
  Removals = n − (longest non-decreasing subsequence). Compute that length with patience
  sorting: for each height h, find the first tail strictly greater than h (upper bound) and
  replace it, or append h if none is greater. Upper bound, not lower bound, because equal
  heights may follow each other. O(n log n) time, O(n) memory.
reference: |
  from bisect import bisect_right
  n = int(input())
  h = list(map(int, input().split()))
  tails = []
  for x in h:
      k = bisect_right(tails, x)
      if k == len(tails):
          tails.append(x)
      else:
          tails[k] = x
  print(n - len(tails))
brute: |
  from itertools import combinations
  n = int(input())
  h = list(map(int, input().split()))
  best = 0
  for size in range(n, 0, -1):
      if any(all(h[a] <= h[b] for a, b in zip(keep, keep[1:])) for keep in combinations(range(n), size)):
          best = size
          break
  print(n - best)
references:
  cpp: |
    #include <algorithm>
    #include <iostream>
    #include <vector>
    using namespace std;

    int main() {
        int n;
        cin >> n;
        vector<long long> tails;
        for (int i = 0; i < n; i++) {
            long long x;
            cin >> x;
            auto it = upper_bound(tails.begin(), tails.end(), x);
            if (it == tails.end()) tails.push_back(x);
            else *it = x;
        }
        cout << n - (int)tails.size() << "\n";
    }
  java: |
    import java.io.*;
    import java.util.*;

    public class Solution {
        public static void main(String[] args) throws IOException {
            BufferedReader in = new BufferedReader(new InputStreamReader(System.in));
            int n = Integer.parseInt(in.readLine().trim());
            StringTokenizer st = new StringTokenizer(in.readLine());
            long[] tails = new long[n];
            int size = 0;
            for (int i = 0; i < n; i++) {
                long x = Long.parseLong(st.nextToken());
                int lo = 0, hi = size;
                while (lo < hi) {
                    int mid = (lo + hi) / 2;
                    if (tails[mid] <= x) lo = mid + 1;
                    else hi = mid;
                }
                tails[lo] = x;
                if (lo == size) size++;
            }
            System.out.println(n - size);
        }
    }
