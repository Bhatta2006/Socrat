  cpp: |
    #include <algorithm>
    #include <cstdio>
    #include <vector>
    using namespace std;

    int main() {
        int n;
        if (scanf("%d", &n) != 1) return 0;
        const long long INF = (long long)4e18;
        vector<long long> cost(n + 1, 0), lamp(n + 1, INF), lit(n + 1, 0), dark(n + 1, INF);
        vector<int> left(n + 1), right(n + 1), order = {1};
        for (int i = 1; i <= n; i++) scanf("%lld", &cost[i]);
        for (int i = 1; i <= n; i++) scanf("%d %d", &left[i], &right[i]);
        for (size_t k = 0; k < order.size(); k++)
            for (int c : {left[order[k]], right[order[k]]}) if (c) order.push_back(c);
        for (int k = n - 1; k >= 0; k--) {
            int x = order[k];
            long long lampX = cost[x], base = 0, extra = INF, darkX = 0;
            for (int c : {left[x], right[x]}) {
                if (!c) continue;
                lampX += min({lamp[c], lit[c], dark[c]});
                long long best = min(lamp[c], lit[c]);
                base += best;
                extra = min(extra, lamp[c] - best);
                darkX = (lit[c] >= INF || darkX >= INF) ? INF : darkX + lit[c];
            }
            lamp[x] = lampX;
            lit[x] = extra >= INF ? INF : base + extra;
            dark[x] = darkX;
        }
        printf("%lld\n", min(lamp[1], lit[1]));
    }
  java: |
    import java.io.*;
    import java.util.*;

    public class Solution {
        public static void main(String[] args) throws IOException {
            StreamTokenizer st = new StreamTokenizer(new BufferedReader(new InputStreamReader(System.in)));
            st.nextToken();
            int n = (int) st.nval;
            final long INF = (long) 4e18;
            long[] cost = new long[n + 1], lamp = new long[n + 1], lit = new long[n + 1], dark = new long[n + 1];
            int[] left = new int[n + 1], right = new int[n + 1], order = new int[n];
            for (int i = 1; i <= n; i++) { st.nextToken(); cost[i] = (long) st.nval; }
            for (int i = 1; i <= n; i++) {
                st.nextToken(); left[i] = (int) st.nval;
                st.nextToken(); right[i] = (int) st.nval;
            }
            lamp[0] = INF;
            dark[0] = INF;
            int size = 1;
            order[0] = 1;
            for (int k = 0; k < size; k++)
                for (int c : new int[] {left[order[k]], right[order[k]]}) if (c != 0) order[size++] = c;
            for (int k = n - 1; k >= 0; k--) {
                int x = order[k];
                long lampX = cost[x], base = 0, extra = INF, darkX = 0;
                for (int c : new int[] {left[x], right[x]}) {
                    if (c == 0) continue;
                    lampX += Math.min(lamp[c], Math.min(lit[c], dark[c]));
                    long best = Math.min(lamp[c], lit[c]);
                    base += best;
                    extra = Math.min(extra, lamp[c] - best);
                    darkX = (lit[c] >= INF || darkX >= INF) ? INF : darkX + lit[c];
                }
                lamp[x] = lampX;
                lit[x] = extra >= INF ? INF : base + extra;
                dark[x] = darkX;
            }
            System.out.println(Math.min(lamp[1], lit[1]));
        }
    }
generator: |
  def tree(rng, n, lo, hi, shape):
      left, right = [0] * (n + 1), [0] * (n + 1)
      for node in range(2, n + 1):
          if shape == "chain":
              (left if rng.random() < 0.5 else right)[node - 1] = node
              continue
          while True:
              parent = rng.randint(max(1, node - 50), node - 1) if shape == "deep" else rng.randint(1, node - 1)
              side = left if rng.random() < 0.5 else right
              if side[parent] == 0:
                  side[parent] = node
                  break
      costs = " ".join(str(rng.randint(lo, hi)) for _ in range(n))
      return f"{n}\n{costs}\n" + "\n".join(f"{left[i]} {right[i]}" for i in range(1, n + 1))

  def cases(rng):
      yield "1\n5\n0 0"
      yield "2\n1000000000 1\n2 0\n0 0"
      yield "3\n1 10 10\n2 3\n0 0\n0 0"
      yield tree(rng, 100000, 1, 10**9, "random")
      yield tree(rng, 100000, 1, 10**9, "chain")
      yield tree(rng, 100000, 1, 3, "deep")
      yield tree(rng, 100000, 10**9, 10**9, "random")
      yield tree(rng, 100000, 1, 10**9, "deep")
      for _ in range(4):
          yield tree(rng, rng.randint(1, 60), 1, 20, "random")
