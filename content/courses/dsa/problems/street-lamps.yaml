id: street-lamps
title: Street lamps on a tree
concepts: [dp-on-trees]
difficulty: hard
statement: |
  A village has `n` crossings joined by streets that form a binary tree rooted at crossing 1.
  A lamp at crossing i costs `c_i` and lights crossing i and every crossing joined to it by a
  street (its parent and its children). Every crossing must be lit.

  Print the smallest total cost of the lamps.
input_format: |
  The first line contains n. The second line contains c_1 … c_n. Each of the next n lines
  contains the left and right child of crossing i (0 = none).
output_format: The smallest total cost.
constraints:
  - 1 ≤ n ≤ 10^5
  - 1 ≤ c_i ≤ 10^9
  - the input describes a binary tree rooted at crossing 1
examples:
  - input: "4\n3 2 5 5\n2 0\n3 4\n0 0\n0 0"
    output: "2"
    explanation: "A lamp at crossing 2 lights 1, 2, 3 and 4 for 2."
  - input: "3\n1 10 10\n2 3\n0 0\n0 0"
    output: "1"
hints:
  - "A crossing can be lit by its own lamp, by a child's lamp, or by its parent's lamp. Which three situations should each subtree report?"
  - "Keep lamp[x] (a lamp at x), lit[x] (no lamp at x, lit by a child) and dark[x] (no lamp at x, not lit yet; the parent must light it). Everything below x is lit in all three."
  - "lamp[x] = c_x + Σ min(lamp, lit, dark); lit[x] = Σ min(lamp, lit) plus the cheapest way to force one child to have a lamp; dark[x] = Σ lit. The root cannot be dark."
approach: |
  Three-state tree DP, as for binary tree cameras but with prices. lamp[x] pays c_x and lets
  each child be in any state. lit[x] needs every child already lit without x's help
  (min(lamp, lit)) and at least one child with a lamp, which costs the smallest
  lamp − min(lamp, lit) among the children (infinite with no children). dark[x] needs every
  child lit without a lamp at x or at the child: Σ lit. Missing children count as lamp = ∞,
  lit = 0, dark = ∞. Fill in reverse BFS order and print min(lamp[1], lit[1]). O(n) time.
reference: |
  import sys
  data = sys.stdin.buffer.read().split()
  n = int(data[0])
  cost = [0] + [int(x) for x in data[1:n + 1]]
  left, right = [0] * (n + 1), [0] * (n + 1)
  for i in range(1, n + 1):
      left[i], right[i] = int(data[n + 2 * i - 1]), int(data[n + 2 * i])
  order = [1]
  for x in order:
      if left[x]:
          order.append(left[x])
      if right[x]:
          order.append(right[x])
  INF = float("inf")
  lamp, lit, dark = [INF] * (n + 1), [0] * (n + 1), [INF] * (n + 1)
  for x in reversed(order):
      kids = [c for c in (left[x], right[x]) if c]
      lamp[x] = cost[x] + sum(min(lamp[c], lit[c], dark[c]) for c in kids)
      base = sum(min(lamp[c], lit[c]) for c in kids)
      extra = min((lamp[c] - min(lamp[c], lit[c]) for c in kids), default=INF)
      lit[x] = base + extra
      dark[x] = sum(lit[c] for c in kids)
  print(int(min(lamp[1], lit[1])))
