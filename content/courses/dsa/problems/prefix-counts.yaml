id: prefix-counts
title: Autocomplete counts
concepts: [tries]
difficulty: medium
statement: |
  Process `q` operations on an initially empty dictionary of lowercase words:

  - `add w` — add word `w` (the same word may be added more than once; count each addition);
  - `count p` — print how many added words start with prefix `p`.
input_format: |
  The first line contains q. Each of the next q lines contains an operation.
output_format: One line per count operation.
constraints:
  - 1 ≤ q ≤ 100000
  - Words and prefixes have 1 to 20 lowercase letters; total characters ≤ 10^6.
examples:
  - input: "6\nadd apple\nadd app\nadd apply\ncount app\ncount appl\ncount b"
    output: "3\n2\n0"
hints:
  - Scanning every stored word for each query is too slow. What do all words with the same prefix share?
  - If you walked the prefix character by character in a tree, what information at the end node would answer the query?
  - Build a trie; increment a counter on every node visited during add; the answer is the counter at the prefix's node (0 if the path is missing).
approach: |
  Trie with a pass-through counter on every node. add: walk/create nodes for each character,
  incrementing counters. count: walk the prefix; if the path breaks, 0, else the node's
  counter. O(length) per operation.
reference: |
  import sys
  lines = sys.stdin.read().split("\n")
  q = int(lines[0])
  counts = {}
  out = []
  for line in lines[1:1 + q]:
      op, w = line.split()
      if op == "add":
          for i in range(1, len(w) + 1):
              key = w[:i]
              counts[key] = counts.get(key, 0) + 1
      else:
          out.append(counts.get(w, 0))
  print("\n".join(map(str, out)))
generator: |
  def cases(rng):
      yield "2\nadd a\ncount a"
      yield "3\ncount z\nadd zz\ncount zzz"
      def word(k):
          return "".join(rng.choice("abc") for _ in range(k))
      ops = []
      for _ in range(80000):
          if rng.random() < 0.55:
              ops.append(f"add {word(rng.randint(1, 10))}")
          else:
              ops.append(f"count {word(rng.randint(1, 4))}")
      ops.append("count a")
      yield f"{len(ops)}\n" + "\n".join(ops)
      for _ in range(6):
          ops = []
          for _ in range(rng.randint(2, 10)):
              ops.append(f"{rng.choice(['add', 'count'])} {word(rng.randint(1, 3))}")
          ops.append("count a")
          yield f"{len(ops)}\n" + "\n".join(ops)
