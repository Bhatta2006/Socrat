id: subarray-sum-k
title: Subarrays summing to K
concepts: [prefix-sums]
difficulty: medium
statement: |
  Count the number of **contiguous, non-empty** subarrays whose elements sum to exactly
  `k`. The array may contain negative numbers.
input_format: |
  The first line contains n and k. The second line contains n integers.
output_format: The number of subarrays with sum k.
constraints:
  - 1 ≤ n ≤ 200000
  - -10^4 ≤ value ≤ 10^4
  - -10^9 ≤ k ≤ 10^9
examples:
  - input: "3 2\n1 1 1"
    output: "2"
  - input: "5 0\n1 -1 1 -1 0"
    output: "7"
hints:
  - Write the sum of a[l..r] using two prefix sums. What equation must hold for it to equal k?
  - As you scan left to right, what would you like to know about the prefix sums you've already passed?
  - "Keep a hash map from prefix sum to how many times it occurred (start with {0: 1}); add count[current − k] at each step."
approach: |
  Running prefix sum s. A subarray ending here has sum k exactly when an earlier prefix
  equals s − k. Keep counts of prefix sums in a hash map seeded with {0: 1}; add
  counts[s − k] before recording s. O(n) average. The answer can reach ~2·10^10, so use 64
  bits.
reference: |
  import sys
  data = sys.stdin.buffer.read().split()
  n, k = int(data[0]), int(data[1])
  seen = {0: 1}
  s = ans = 0
  for i in range(n):
      s += int(data[2 + i])
      ans += seen.get(s - k, 0)
      seen[s] = seen.get(s, 0) + 1
  print(ans)
generator: |
  def cases(rng):
      yield "1 5\n5"
      yield "1 5\n4"
      yield "4 0\n0 0 0 0"
      n = 200000
      yield f"{n} 0\n" + " ".join("0" for _ in range(n))
      yield f"{n} 3\n" + " ".join(str(rng.randint(-3, 3)) for _ in range(n))
      for _ in range(6):
          n = rng.randint(1, 15)
          yield f"{n} {rng.randint(-4, 4)}\n" + " ".join(str(rng.randint(-3, 3)) for _ in range(n))
