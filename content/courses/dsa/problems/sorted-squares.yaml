id: sorted-squares
title: Squares in order
concepts: [two-pointers]
difficulty: easy
statement: |
  Given a list of whole numbers sorted in non-decreasing order (negative numbers allowed),
  print the squares of all of them, also in non-decreasing order. Do it in O(n) without
  sorting again.
input_format: |
  The first line contains n. The second line contains n sorted whole numbers.
output_format: The n squares in non-decreasing order, separated by spaces.
constraints:
  - 1 ≤ n ≤ 10^5
  - -10^6 ≤ a_i ≤ 10^6, and a is sorted
examples:
  - input: "5\n-4 -1 0 3 10"
    output: "0 1 9 16 100"
hints:
  - Where in the sorted input can the largest square be?
  - Compare the squares at the two ends; whichever is larger is the largest square still to be placed.
  - Use pointers lo = 0 and hi = n - 1, fill the answer from the back with the larger of a[lo]^2 and a[hi]^2, and move that pointer inward.
approach: |
  The largest remaining square is always at one of the two ends. Two pointers move inward while
  the result array is filled from its last position. O(n). Squares reach 10^12, so use 64-bit integers.
reference: |
  import sys
  data = sys.stdin.buffer.read().split()
  n = int(data[0])
  a = list(map(int, data[1:1 + n]))
  out = [0] * n
  lo, hi = 0, n - 1
  for pos in range(n - 1, -1, -1):
      if abs(a[lo]) > abs(a[hi]):
          out[pos] = a[lo] * a[lo]
          lo += 1
      else:
          out[pos] = a[hi] * a[hi]
          hi -= 1
  print(" ".join(map(str, out)))
brute: |
  n = int(input())
  print(" ".join(map(str, sorted(x * x for x in map(int, input().split())))))
generator: |
  def cases(rng):
      yield "1\n-1000000"
      yield "3\n-2 -2 2"
      n = 80000
      yield f"{n}\n" + " ".join(map(str, sorted(rng.randint(-10**6, 10**6) for _ in range(n))))
      yield f"{n}\n" + " ".join(map(str, sorted(rng.randint(-10**6, 0) for _ in range(n))))
      for _ in range(4):
          n = rng.randint(1, 1000)
          yield f"{n}\n" + " ".join(map(str, sorted(rng.randint(-30, 30) for _ in range(n))))
