id: bst-validate
title: Validate a BST
concepts: [bst]
difficulty: medium
statement: |
  For each of `t` binary trees, decide whether it is a valid **binary search tree** with
  distinct keys: every key in a node's left subtree is strictly smaller than the node's
  key, and every key in its right subtree is strictly larger.

  Each tree has `n` nodes numbered 1 to `n`, rooted at node 1. Node `i` has key `k[i]` and
  children `l[i]`, `r[i]` (0 = none).
input_format: |
  The first line contains t. Each tree starts with a line containing n, then a line with
  k[1..n], then n lines with l[i] and r[i].
output_format: t lines, each YES or NO.
constraints:
  - 1 ≤ t ≤ 100
  - 1 ≤ n, and the total number of nodes is at most 200000
  - -10^9 ≤ k[i] ≤ 10^9
examples:
  - input: "2\n3\n2 1 3\n2 3\n0 0\n0 0\n4\n10 5 15 12\n2 3\n0 4\n0 0\n0 0"
    output: "YES\nNO"
    explanation: In the second tree, 12 sits in the left subtree of 10 but is larger than 10.
hints:
  - Is checking each node against its direct children enough? Try the second example.
  - What range of keys is allowed for a node, given all of its ancestors?
  - Pass (low, high) bounds down from the root; going left sets high = key, going right sets low = key. Use an explicit stack to avoid deep recursion.
approach: |
  DFS with bounds: the root allows (−∞, +∞); a left child inherits (low, key) and a right
  child (key, high). A node is invalid if its key is not strictly inside its bounds. Use an
  explicit stack because trees may be chains of length 200000. O(n). Equivalently, check
  that an inorder traversal is strictly increasing.
reference: |
  import sys
  data = sys.stdin.buffer.read().split()
  pos = 0
  t = int(data[pos]); pos += 1
  out = []
  INF = float("inf")
  for _ in range(t):
      n = int(data[pos]); pos += 1
      k = [0] + [int(x) for x in data[pos:pos + n]]; pos += n
      L = [0] * (n + 1); R = [0] * (n + 1)
      for i in range(1, n + 1):
          L[i] = int(data[pos]); R[i] = int(data[pos + 1]); pos += 2
      ok = True
      stack = [(1, -INF, INF)]
      while stack:
          x, lo, hi = stack.pop()
          if not lo < k[x] < hi:
              ok = False
              break
          if L[x]: stack.append((L[x], lo, k[x]))
          if R[x]: stack.append((R[x], k[x], hi))
      out.append("YES" if ok else "NO")
  print("\n".join(out))
generator: |
  def cases(rng):
      def bst(n, chain=False):
          keys = rng.sample(range(-10**9, 10**9), n)
          if chain:
              keys.sort()
          ids = {}
          L = [0] * (n + 1); R = [0] * (n + 1); K = [0] * (n + 1)
          root = None
          for idx, key in enumerate(keys, start=1):
              K[idx] = key
              if root is None:
                  root = idx
                  continue
              cur = root
              while True:
                  if key < K[cur]:
                      if L[cur]: cur = L[cur]
                      else: L[cur] = idx; break
                  else:
                      if R[cur]: cur = R[cur]
                      else: R[cur] = idx; break
          return K, L, R
      def fmt(K, L, R, corrupt=False):
          n = len(K) - 1
          K = K[:]
          if corrupt and n > 2:
              i = rng.randint(2, n)
              K[i] = K[1] + (1 if L[1] and rng.random() < 0.5 else -1) * rng.randint(1, 5)
          return f"{n}\n" + " ".join(map(str, K[1:])) + "\n" + "\n".join(f"{L[i]} {R[i]}" for i in range(1, n + 1))
      big = [fmt(*bst(45000)), fmt(*bst(45000), corrupt=True), fmt(*bst(3000, chain=True))]
      yield f"{len(big)}\n" + "\n".join(big)
      small = []
      for _ in range(60):
          K, L, R = bst(rng.randint(1, 8))
          small.append(fmt(K, L, R, corrupt=rng.random() < 0.5))
      yield f"{len(small)}\n" + "\n".join(small)
      yield "1\n1\n7\n0 0"
      yield "1\n2\n5 5\n2 0\n0 0"
