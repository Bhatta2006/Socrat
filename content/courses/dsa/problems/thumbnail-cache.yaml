      key = int(parts[1])
      found = [p for p in items if p[0] == key]
      if parts[0] == "get":
          if found:
              items.remove(found[0])
              items.append(found[0])
              print("HIT")
          else:
              print("MISS")
          continue
      size = int(parts[2])
      if found:
          items.remove(found[0])
      if size > b:
          continue
      items.append([key, size])
      while sum(p[1] for p in items) > b:
          items.pop(0)
