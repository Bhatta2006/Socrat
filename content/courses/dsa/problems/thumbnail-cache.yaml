id: thumbnail-cache
title: Thumbnail cache
concepts: [design-data-structures]
difficulty: medium
statement: |
  A photo app keeps thumbnails in a cache that holds at most `B` bytes in total. Each
  thumbnail has an id and a size in bytes. The cache follows these rules, where a **use**
  of a thumbnail is a successful `get` or any `put` of it:

  - `get k`: if thumbnail k is in the cache, print `HIT` and count it as a use; otherwise
    print `MISS`.
  - `put k s`: thumbnail k is (re)created with size s. Any old copy of k leaves the cache
    first. If s > B, the new thumbnail is not stored at all. Otherwise it is stored as the
    most recently used, and then, while the total size is above B, the **least recently
    used** other thumbnail is removed.

  Process the operations in order.
input_format: |
  The first line contains B and q. Each of the next q lines is `get k` or `put k s`.
output_format: One line, HIT or MISS, for every get.
constraints:
  - 1 ≤ B ≤ 10^12
  - 1 ≤ q ≤ 10^5
  - 1 ≤ k ≤ 10^9 and 1 ≤ s ≤ 10^9
examples:
  - input: "10 7\nput 1 4\nput 2 4\nget 1\nput 3 5\nget 2\nget 1\nget 3"
    output: "HIT\nMISS\nHIT\nHIT"
    explanation: "After get 1, thumbnail 2 is the least recently used. put 3 brings the total to 13, so 2 leaves (total 9). Thumbnails 1 and 3 stay."
  - input: "5 3\nput 1 3\nput 2 6\nget 1"
    output: "HIT"
    explanation: "Thumbnail 2 is bigger than the whole cache, so it is never stored and nothing is removed."
hints:
  - "This is an LRU cache, except that one new item may push out several old ones, and capacity is measured in bytes."
  - "Keep the thumbnails in use order (a hash map plus a doubly linked list, or an ordered dictionary) along with the total size."
  - "After storing a new thumbnail, remove from the least recent end until the total fits. Totals reach about 10^14, so use 64-bit integers."
approach: |
  An LRU cache with weights. Keep an ordered map from id to size in use order (least recent
  first) and the running total. get moves a hit to the most recent end. put first removes an
  old copy of k (subtracting its size); if s > B it stops there; otherwise it appends k as the
  most recent, adds s, and pops from the least recent end while the total exceeds B. Since s ≤
  B, the loop never removes k itself. Every thumbnail is inserted once and removed at most once
  per insertion, so the whole run is O(q) amortised.
reference: |
  import sys
  from collections import OrderedDict
  def main():
      data = sys.stdin.buffer.read().split()
      budget, q = int(data[0]), int(data[1])
      cache = OrderedDict()
      total = 0
      out = []
      pos = 2
      for _ in range(q):
          op = data[pos]
          key = int(data[pos + 1])
          if op == b"get":
              pos += 2
              if key in cache:
                  cache.move_to_end(key)
                  out.append("HIT")
              else:
                  out.append("MISS")
              continue
          size = int(data[pos + 2])
          pos += 3
          if key in cache:
              total -= cache.pop(key)
          if size > budget:
              continue
          cache[key] = size
          total += size
          while total > budget:
              _, old = cache.popitem(last=False)
              total -= old
      sys.stdout.write("\n".join(out) + ("\n" if out else ""))
  main()
