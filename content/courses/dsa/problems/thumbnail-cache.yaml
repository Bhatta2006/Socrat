  def ops(rng, q, keys, smax, put_share):
      lines = []
      for _ in range(q):
          k = rng.randint(1, keys)
          if rng.random() < put_share:
              lines.append(f"put {k} {rng.randint(1, smax)}")
          else:
              lines.append(f"get {k}")
      return lines

  def case(budget, lines):
      return f"{budget} {len(lines)}\n" + "\n".join(lines)

  def cases(rng):
      yield "1 2\nget 5\nput 5 2"
      yield "3 4\nput 1 3\nput 1 3\nget 1\nput 2 3"
      yield "7 5\nput 1 4\nput 2 3\nput 3 1\nget 1\nget 3"
      q = 100000
      yield case(10**12, ops(rng, q, 1000, 10**6, 0.5))
      yield case(5 * 10**6, ops(rng, q, 1000, 10**6, 0.5))
      yield case(10**6, ops(rng, q, 1000, 10**6, 0.6))
      yield case(1, ops(rng, q, 1000, 2, 0.5))
      yield case(3 * 10**6, ["put %d %d" % (i % 997 + 1, 10**6) for i in range(q // 2)] + ["get %d" % (i % 997 + 1) for i in range(q // 2)])
      for _ in range(4):
          yield case(rng.randint(1, 30), ops(rng, rng.randint(1, 40), 6, 12, 0.5))
