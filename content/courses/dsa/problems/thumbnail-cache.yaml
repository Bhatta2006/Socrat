    #include <cstdio>
    #include <list>
    #include <string>
    #include <unordered_map>
    using namespace std;

    int main() {
        long long budget;
        int q;
        if (scanf("%lld %d", &budget, &q) != 2) return 0;
        list<pair<long long, long long>> order;
        unordered_map<long long, list<pair<long long, long long>>::iterator> where;
        where.reserve(2 * q + 1);
        long long total = 0;
        string out;
        char op[8];
        for (int i = 0; i < q; i++) {
            long long key;
            scanf("%7s %lld", op, &key);
            auto it = where.find(key);
            if (op[0] == 'g') {
                if (it == where.end()) out += "MISS\n";
                else { order.splice(order.end(), order, it->second); out += "HIT\n"; }
                continue;
            }
            long long size;
            scanf("%lld", &size);
            if (it != where.end()) { total -= it->second->second; order.erase(it->second); where.erase(it); }
            if (size > budget) continue;
            order.push_back({key, size});
            where[key] = prev(order.end());
            total += size;
            while (total > budget) {
                total -= order.front().second;
                where.erase(order.front().first);
                order.pop_front();
            }
        }
        fputs(out.c_str(), stdout);
    }
  java: |
    import java.io.*;
    import java.util.*;

    public class Solution {
        public static void main(String[] args) throws IOException {
            BufferedReader in = new BufferedReader(new InputStreamReader(System.in), 1 << 16);
            StringTokenizer st = new StringTokenizer(in.readLine());
            long budget = Long.parseLong(st.nextToken());
            int q = Integer.parseInt(st.nextToken());
            LinkedHashMap<Long, Long> cache = new LinkedHashMap<>(16, 0.75f, true);
            long total = 0;
            StringBuilder out = new StringBuilder();
            for (int i = 0; i < q; i++) {
                st = new StringTokenizer(in.readLine());
                String op = st.nextToken();
                long key = Long.parseLong(st.nextToken());
                if (op.equals("get")) {
                    out.append(cache.get(key) != null ? "HIT\n" : "MISS\n");
                    continue;
                }
                long size = Long.parseLong(st.nextToken());
                Long old = cache.remove(key);
                if (old != null) total -= old;
                if (size > budget) continue;
                cache.put(key, size);
                total += size;
                Iterator<Map.Entry<Long, Long>> eldest = cache.entrySet().iterator();
                while (total > budget) {
                    total -= eldest.next().getValue();
                    eldest.remove();
                }
            }
            System.out.print(out);
        }
    }
