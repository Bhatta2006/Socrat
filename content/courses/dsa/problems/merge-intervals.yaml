id: merge-intervals
title: Merge study sessions
concepts: [intervals]
difficulty: medium
statement: |
  You have `n` study sessions, each a closed interval `[s, e]` of minutes. Sessions that
  overlap or touch (share an endpoint) belong to the same block. Merge them and print the
  resulting blocks in increasing order of start.
input_format: |
  The first line contains n. Each of the next n lines contains s and e.
output_format: |
  First the number of blocks, then one line per block with its start and end.
constraints:
  - 1 ≤ n ≤ 200000
  - 0 ≤ s ≤ e ≤ 10^9
examples:
  - input: "4\n1 3\n2 6\n8 10\n15 18"
    output: "3\n1 6\n8 10\n15 18"
  - input: "3\n1 4\n4 5\n6 6"
    output: "2\n1 5\n6 6"
    explanation: "[1, 4] and [4, 5] touch, so they merge; [6, 6] starts after 5."
hints:
  - In what order should you look at the sessions so overlaps are always next to each other?
  - While sweeping, what do you need to remember about the current block?
  - Sort by start; if the next start ≤ current block end, extend end to max(end, e); otherwise start a new block.
approach: |
  Sort by start. Sweep, keeping the current block [cs, ce]. If s ≤ ce (touching counts), set
  ce = max(ce, e); otherwise output the block and start a new one. O(n log n).
reference: |
  import sys
  data = sys.stdin.buffer.read().split()
  n = int(data[0])
  v = sorted((int(data[1 + 2 * i]), int(data[2 + 2 * i])) for i in range(n))
  out = []
  cs, ce = v[0]
  for s, e in v[1:]:
      if s <= ce:
          ce = max(ce, e)
      else:
          out.append((cs, ce))
          cs, ce = s, e
  out.append((cs, ce))
  print(len(out))
  print("\n".join(f"{s} {e}" for s, e in out))
generator: |
  def cases(rng):
      yield "1\n0 0"
      yield "3\n1 10\n2 3\n4 5"
      yield "3\n5 6\n1 2\n3 4"
      n = 55000
      rows = []
      for _ in range(n):
          s = rng.randint(0, 10**9)
          rows.append(f"{s} {min(10**9, s + rng.randint(0, 20000))}")
      yield f"{n}\n" + "\n".join(rows)
      for _ in range(6):
          n = rng.randint(1, 8)
          rows = []
          for _ in range(n):
              s = rng.randint(0, 15)
              rows.append(f"{s} {s + rng.randint(0, 4)}")
          yield f"{n}\n" + "\n".join(rows)
