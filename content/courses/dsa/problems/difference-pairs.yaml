id: difference-pairs
title: Pairs with a fixed gap
concepts: [two-pointers]
difficulty: medium
statement: |
  Given a sorted list of whole numbers and a gap `d ≥ 0`, count the **distinct** value pairs
  `(x, y)` with `x ≤ y`, both present in the list, and `y - x = d`. Each pair of values counts
  once, however many times the values repeat.
input_format: |
  The first line contains n and d. The second line contains n whole numbers in non-decreasing order.
output_format: The number of distinct pairs.
constraints:
  - 1 ≤ n ≤ 10^5
  - 0 ≤ d ≤ 2·10^9
  - -10^9 ≤ a_i ≤ 10^9
examples:
  - input: "6 2\n1 1 3 4 5 7"
    output: "3"
    explanation: (1, 3), (3, 5) and (5, 7).
  - input: "4 0\n2 2 2 5"
    output: "1"
hints:
  - Duplicates only matter for d = 0. Which values form a pair with themselves?
  - In a sorted list, if a[j] - a[i] is too small, which pointer should move? If too large?
  - Move j forward while a[j] - a[i] < d (keeping j > i); count a match once per distinct a[i], skipping repeated values.
approach: |
  For d = 0 the answer is the number of values that appear at least twice. Otherwise use two
  pointers on the distinct values: advance j while the gap is below d; on an exact gap count it
  and advance i. Both pointers only move forward, so the scan is O(n).
reference: |
  import sys
  data = sys.stdin.buffer.read().split()
  n, d = int(data[0]), int(data[1])
  a = list(map(int, data[2:2 + n]))
  if d == 0:
      print(sum(1 for i in range(1, n) if a[i] == a[i - 1] and (i == 1 or a[i - 1] != a[i - 2])))
  else:
      u = [a[0]] + [a[i] for i in range(1, n) if a[i] != a[i - 1]]
      count = 0
      j = 0
      for i in range(len(u)):
          while j < len(u) and u[j] - u[i] < d:
              j += 1
          if j < len(u) and u[j] - u[i] == d:
              count += 1
      print(count)
brute: |
  n, d = map(int, input().split())
  a = list(map(int, input().split()))
  pairs = set()
  for i in range(n):
      for j in range(i + 1, n):
          if a[j] - a[i] == d:
              pairs.add((a[i], a[j]))
  print(len(pairs))
