id: count-inversions
title: Count inversions
concepts: [sorting]
difficulty: hard
statement: |
  An **inversion** is a pair of positions `i < j` with `a[i] > a[j]`. It measures how far
  an array is from sorted. Count the inversions in an array of `n` integers.
input_format: |
  The first line contains n. The second line contains n integers.
output_format: The number of inversions.
constraints:
  - 1 ≤ n ≤ 100000
  - -10^9 ≤ a[i] ≤ 10^9
examples:
  - input: "5\n2 4 1 3 5"
    output: "3"
    explanation: (2,1), (4,1) and (4,3).
  - input: "3\n3 2 1"
    output: "3"
hints:
  - Checking all pairs is O(n²) — too slow. Think about merge sort's merge step.
  - When merging two sorted halves, if you take an element from the right half, how many left-half elements are larger than it?
  - During each merge, when right[j] < left[i], add (number of remaining left elements) to the count. Equal elements are not inversions.
approach: |
  Merge sort while counting. When the merge takes right[j] because right[j] < left[i], all
  remaining left elements (len(left) − i) are greater and appear earlier, so add that many.
  Take from the left on ties so equal values are not counted. O(n log n). The count can
  reach ~5·10^9: use 64 bits.
reference: |
  import sys
  data = sys.stdin.buffer.read().split()
  n = int(data[0])
  a = list(map(int, data[1:1 + n]))
  def sort(a):
      if len(a) <= 1:
          return a, 0
      mid = len(a) // 2
      left, x = sort(a[:mid])
      right, y = sort(a[mid:])
      out = []
      i = j = 0
      inv = x + y
      while i < len(left) and j < len(right):
          if left[i] <= right[j]:
              out.append(left[i]); i += 1
          else:
              out.append(right[j]); j += 1
              inv += len(left) - i
      out.extend(left[i:]); out.extend(right[j:])
      return out, inv
  print(sort(a)[1])
generator: |
