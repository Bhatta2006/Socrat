    #include <cstdio>
    #include <queue>
    #include <vector>
    using namespace std;

    int main() {
        int n, t;
        if (scanf("%d %d", &n, &t) != 2) return 0;
        vector<int> left(n + 1), right(n + 1), parent(n + 1, 0), dist(n + 1, -1);
        for (int i = 1; i <= n; i++) {
            scanf("%d %d", &left[i], &right[i]);
            if (left[i]) parent[left[i]] = i;
            if (right[i]) parent[right[i]] = i;
        }
        dist[t] = 0;
        queue<int> q;
        q.push(t);
        while (!q.empty()) {
            int x = q.front();
            q.pop();
            if (!left[x] && !right[x]) {
                printf("%d\n", dist[x]);
                return 0;
            }
            for (int y : {left[x], right[x], parent[x]})
                if (y && dist[y] == -1) {
                    dist[y] = dist[x] + 1;
                    q.push(y);
                }
        }
    }
  java: |
    import java.io.*;
    import java.util.*;

    public class Solution {
        public static void main(String[] args) throws IOException {
            BufferedReader in = new BufferedReader(new InputStreamReader(System.in));
            StringTokenizer st = new StringTokenizer(in.readLine());
            int n = Integer.parseInt(st.nextToken()), t = Integer.parseInt(st.nextToken());
            int[] left = new int[n + 1], right = new int[n + 1], parent = new int[n + 1], dist = new int[n + 1];
            for (int i = 1; i <= n; i++) {
                st = new StringTokenizer(in.readLine());
                left[i] = Integer.parseInt(st.nextToken());
                right[i] = Integer.parseInt(st.nextToken());
                if (left[i] != 0) parent[left[i]] = i;
                if (right[i] != 0) parent[right[i]] = i;
            }
            Arrays.fill(dist, -1);
            dist[t] = 0;
            int[] q = new int[n];
            int head = 0, tail = 0;
            q[tail++] = t;
            while (head < tail) {
                int x = q[head++];
                if (left[x] == 0 && right[x] == 0) {
                    System.out.println(dist[x]);
                    return;
                }
                for (int y : new int[] {left[x], right[x], parent[x]})
                    if (y != 0 && dist[y] == -1) {
                        dist[y] = dist[x] + 1;
                        q[tail++] = y;
                    }
            }
        }
    }
generator: |
  def tree(rng, n, shape):
      left, right = [0] * (n + 1), [0] * (n + 1)
      for node in range(2, n + 1):
          if shape == "chain":
              (left if rng.random() < 0.5 else right)[node - 1] = node
              continue
          while True:
              parent = rng.randint(max(1, node - 50), node - 1) if shape == "deep" else rng.randint(1, node - 1)
              side = left if rng.random() < 0.5 else right
              if side[parent] == 0:
                  side[parent] = node
                  break
      return left, right

  def render(n, t, left, right):
      return f"{n} {t}\n" + "\n".join(f"{left[i]} {right[i]}" for i in range(1, n + 1))

  def cases(rng):
      yield "1 1\n0 0"
      yield "2 1\n2 0\n0 0"
      n = 100000
      l, r = tree(rng, n, "chain")
      yield render(n, 1, l, r)
      yield render(n, n // 2, l, r)
      l, r = tree(rng, n, "random")
      yield render(n, rng.randint(1, n), l, r)
      l, r = tree(rng, n, "deep")
      yield render(n, 1, l, r)
      yield render(n, rng.randint(1, n), l, r)
      for _ in range(4):
          m = rng.randint(1, 60)
          l, r = tree(rng, m, "random")
          yield render(m, rng.randint(1, m), l, r)
