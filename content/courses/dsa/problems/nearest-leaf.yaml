id: nearest-leaf
title: Shortest walk to a leaf
concepts: [tree-patterns]
difficulty: medium
statement: |
  A binary tree has `n` nodes numbered 1 to n, rooted at node 1. A **leaf** is a node with no
  children. Moving along one edge, up to a parent or down to a child, takes one step.

  Starting at node `t`, print the fewest steps needed to reach any leaf.
input_format: |
  The first line contains n and t. Each of the next n lines contains the left and right child
  of node i (0 = none).
output_format: The fewest steps from t to a leaf.
constraints:
  - 1 ≤ n ≤ 10^5
  - 1 ≤ t ≤ n
  - the input describes a binary tree rooted at node 1
examples:
  - input: "6 2\n2 3\n4 0\n0 0\n5 0\n6 0\n0 0"
    output: "2"
    explanation: "Going down from node 2 takes 3 steps (2 → 4 → 5 → 6), but going up takes 2 (2 → 1 → 3)."
  - input: "1 1\n0 0"
    output: "0"
hints:
  - "The nearest leaf may not be below t. Which edges does a search from t need besides the child links?"
  - "Record every node's parent, then search from t over left child, right child and parent."
  - "Use BFS: the first leaf it reaches is the nearest. Mark visited nodes so you never walk back."
approach: |
  Treat the tree as an undirected graph: record parents, then BFS from t over children and
  parent, with visited marks. The first node popped that has no children is the nearest leaf,
  and its BFS layer is the answer. O(n) time and memory; no recursion, so deep chains are
  fine.
reference: |
  import sys
  from collections import deque
  data = sys.stdin.buffer.read().split()
  n, t = int(data[0]), int(data[1])
  left, right, parent = [0] * (n + 1), [0] * (n + 1), [0] * (n + 1)
  for i in range(1, n + 1):
      left[i], right[i] = int(data[2 * i]), int(data[2 * i + 1])
      if left[i]:
          parent[left[i]] = i
      if right[i]:
          parent[right[i]] = i
  dist = [-1] * (n + 1)
  dist[t] = 0
  q = deque([t])
  while q:
      x = q.popleft()
      if not left[x] and not right[x]:
          print(dist[x])
          break
      for y in (left[x], right[x], parent[x]):
          if y and dist[y] == -1:
              dist[y] = dist[x] + 1
              q.append(y)
brute: |
  n, t = map(int, input().split())
  kids = [(0, 0)] + [tuple(map(int, input().split())) for _ in range(n)]
  adj = {i: [] for i in range(1, n + 1)}
  for i in range(1, n + 1):
      for c in kids[i]:
          if c:
              adj[i].append(c)
              adj[c].append(i)

  def dist(a, b):
      seen, frontier, d = {a}, [a], 0
      while frontier:
          if b in frontier:
              return d
          nxt = []
          for x in frontier:
              for y in adj[x]:
                  if y not in seen:
                      seen.add(y)
                      nxt.append(y)
          frontier, d = nxt, d + 1
      return None

  print(min(dist(t, x) for x in range(1, n + 1) if kids[x] == (0, 0)))
