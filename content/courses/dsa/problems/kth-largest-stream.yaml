id: kth-largest-stream
title: Live k-th best score
concepts: [heaps]
difficulty: medium
statement: |
  Scores arrive one at a time. After each new score, print the **k-th largest** score seen
  so far, or `-1` if fewer than `k` scores have arrived.
input_format: |
  The first line contains n and k. The second line contains n scores in arrival order.
output_format: n numbers separated by spaces.
constraints:
  - 1 ≤ k ≤ n ≤ 200000
  - 0 ≤ score ≤ 10^9
examples:
  - input: "6 3\n4 5 8 2 9 3"
    output: "-1 -1 4 4 5 5"
    explanation: After 4 5 8 the 3rd largest is 4; after adding 9 the top three are 9 8 5.
hints:
  - Re-sorting after every score is O(n² log n). Which scores do you actually need to remember?
  - Among the k largest so far, which one do you report — and which one would you discard when a better score arrives?
  - Keep a min-heap of the k largest; push each score, pop when the size exceeds k; the heap's top is the answer.
approach: |
  Maintain a min-heap of at most k elements: push each score; if the size exceeds k, pop
  the minimum. Once the heap has k elements, its minimum is the k-th largest. O(n log k).
reference: |
  import sys, heapq
  data = sys.stdin.buffer.read().split()
  n, k = int(data[0]), int(data[1])
  h = []
  out = []
  for i in range(n):
      heapq.heappush(h, int(data[2 + i]))
      if len(h) > k:
          heapq.heappop(h)
      out.append(h[0] if len(h) == k else -1)
  print(" ".join(map(str, out)))
generator: |
  def cases(rng):
      yield "1 1\n7"
      yield "4 2\n5 5 5 5"
      n = 70000
      yield f"{n} 1000\n" + " ".join(str(rng.randint(0, 10**9)) for _ in range(n))
      yield f"{n} {n}\n" + " ".join(str(rng.randint(0, 100)) for _ in range(n))
      for _ in range(6):
          n = rng.randint(1, 12)
          yield f"{n} {rng.randint(1, n)}\n" + " ".join(str(rng.randint(0, 9)) for _ in range(n))
