id: consecutive-run
title: Longest unbroken run of values
concepts: [arrays-hashing]
difficulty: medium
statement: |
  Given `n` whole numbers in any order, find the length of the longest run of consecutive
  values `v, v+1, …, v+k-1` that all appear among them. The numbers may repeat and may be
  negative. Aim for O(n) expected time.
input_format: |
  The first line contains n. The second line contains n whole numbers.
output_format: The length of the longest run of consecutive values.
constraints:
  - 1 ≤ n ≤ 10^5
  - -10^9 ≤ value ≤ 10^9
examples:
  - input: "7\n100 4 200 1 3 2 4"
    output: "4"
    explanation: 1, 2, 3 and 4 all appear.
hints:
  - Sorting works in O(n log n). What would let you ask "is v present?" in O(1)?
  - If you start counting a run from every value, some runs are counted many times. Which values can start a run?
  - Put the values in a set. Only start counting at v when v - 1 is not in the set, then walk v+1, v+2, … while they are present.
approach: |
  Put all values in a hash set. A value v starts a run only if v-1 is absent; from each start,
  extend while v+1, v+2, … are present. Every value is visited at most twice, so the whole scan is
  O(n) expected.
reference: |
  import sys
  data = sys.stdin.buffer.read().split()
  n = int(data[0])
  values = set(map(int, data[1:1 + n]))
  best = 0
  for v in values:
      if v - 1 not in values:
          end = v
          while end + 1 in values:
              end += 1
          best = max(best, end - v + 1)
  print(best)
brute: |
  n = int(input())
  a = sorted(set(map(int, input().split())))
  best = run = 1
  for i in range(1, len(a)):
      run = run + 1 if a[i] == a[i - 1] + 1 else 1
      best = max(best, run)
  print(best)
