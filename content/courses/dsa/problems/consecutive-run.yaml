  def cases(rng):
      yield "1\n-5"
      yield "4\n2 2 2 2"
      n = 100000
      yield f"{n}\n" + " ".join(str(x) for x in rng.sample(range(-10**9, -10**9 + 2 * n), n))
      values = list(range(-50000, 50000))
      rng.shuffle(values)
      yield f"{n}\n" + " ".join(map(str, values))
      yield f"{n}\n" + " ".join(str(rng.randint(-10**9, 10**9)) for _ in range(n))
      for _ in range(4):
          n = rng.randint(1, 2000)
          yield f"{n}\n" + " ".join(str(rng.randint(-100, 100)) for _ in range(n))
