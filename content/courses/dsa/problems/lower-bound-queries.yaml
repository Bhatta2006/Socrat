id: lower-bound-queries
title: Count in range
concepts: [binary-search]
difficulty: medium
statement: |
  You are given `n` integers (not necessarily sorted) and `q` queries. Each query gives
  `lo` and `hi`; print how many of the integers `x` satisfy `lo ≤ x ≤ hi`.
input_format: |
  The first line contains n and q. The second line contains n integers. Each of the next q
  lines contains lo and hi.
output_format: q lines, each a count.
constraints:
  - 1 ≤ n, q ≤ 150000
  - -10^9 ≤ values, lo, hi ≤ 10^9
  - lo ≤ hi
examples:
  - input: "6 3\n5 1 9 3 3 7\n3 5\n10 20\n-5 100"
    output: "3\n0\n6"
hints:
  - Scanning all n numbers per query is too slow. What one-time preparation makes range questions easy?
  - In a sorted array, the values in [lo, hi] form one contiguous block. How can you find its edges quickly?
  - Sort once; the count is (first index with a[i] > hi) − (first index with a[i] >= lo), each found by binary search.
approach: |
  Sort the array once, O(n log n). For each query, answer = upper_bound(hi) − lower_bound(lo),
  each O(log n). In Python use bisect_right and bisect_left; in C++ upper_bound/lower_bound.
reference: |
  import sys
  from bisect import bisect_left, bisect_right
  data = sys.stdin.buffer.read().split()
  n, q = int(data[0]), int(data[1])
  a = sorted(map(int, data[2:2 + n]))
  out = []
  base = 2 + n
  for j in range(q):
      lo, hi = int(data[base + 2 * j]), int(data[base + 2 * j + 1])
      out.append(bisect_right(a, hi) - bisect_left(a, lo))
  print("\n".join(map(str, out)))
generator: |
  def cases(rng):
      yield "1 2\n0\n0 0\n1 1"
      yield "4 1\n2 2 2 2\n2 2"
      n = q = 42000
      arr = " ".join(str(rng.randint(-10**9, 10**9)) for _ in range(n))
      qs = []
      for _ in range(q):
          a, b = sorted((rng.randint(-10**9, 10**9), rng.randint(-10**9, 10**9)))
          qs.append(f"{a} {b}")
      yield f"{n} {q}\n{arr}\n" + "\n".join(qs)
      for _ in range(5):
          n, q = rng.randint(1, 10), rng.randint(1, 5)
          arr = " ".join(str(rng.randint(-5, 5)) for _ in range(n))
          qs = []
          for _ in range(q):
              a, b = sorted((rng.randint(-6, 6), rng.randint(-6, 6)))
              qs.append(f"{a} {b}")
          yield f"{n} {q}\n{arr}\n" + "\n".join(qs)
