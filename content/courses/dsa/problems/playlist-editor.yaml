id: playlist-editor
title: Playlist editor
concepts: [linked-lists]
difficulty: medium
statement: |
  A playlist initially contains songs `1, 2, ..., n` in that order. Process `q` operations:

  - `after x y` — move song `x` so that it comes immediately **after** song `y`
    (`x ≠ y`);
  - `front x` — move song `x` to the front of the playlist;
  - `remove x` — delete song `x` (it is never referenced again).

  Each operation refers only to songs currently in the playlist. Print the final playlist
  from front to back.

  With up to 200,000 operations, shifting array elements is too slow — every operation
  must be O(1).
input_format: |
  The first line contains n and q. Each of the next q lines contains one operation.
output_format: The remaining songs in order, separated by spaces (print an empty line if none remain).
constraints:
  - 1 ≤ n, q ≤ 200000
examples:
  - input: "5 3\nafter 1 3\nremove 4\nfront 5"
    output: "5 2 3 1"
    explanation: "1 2 3 4 5 → 2 3 1 4 5 → 2 3 1 5 → 5 2 3 1"
hints:
  - Which operations does an array make slow, and which structure makes "move this element" cheap?
  - To unlink a song in O(1), what do you need to know about its neighbours?
  - Use a doubly linked list in arrays (prev[x], next[x]) with a sentinel before the front; unlink x, then splice it after y or after the sentinel.
approach: |
  Doubly linked list stored in arrays prv/nxt with sentinel 0 (front) and n+1 (end).
  unlink(x): nxt[prv[x]] = nxt[x]; prv[nxt[x]] = prv[x]. insert_after(x, y): link x between y
  and nxt[y]. "front x" is insert_after(x, 0). Every operation is O(1); finally walk from
  nxt[0]. Moving x after itself never happens (x ≠ y).
reference: |
  import sys
  lines = sys.stdin.buffer.read().split(b"\n")
  n, q = map(int, lines[0].split())
  nxt = list(range(1, n + 3))
  prv = [0] + list(range(0, n + 1))
  def unlink(x):
      nxt[prv[x]] = nxt[x]
      prv[nxt[x]] = prv[x]
  def insert_after(x, y):
      nxt[x] = nxt[y]
      prv[x] = y
      prv[nxt[y]] = x
      nxt[y] = x
  for line in lines[1:1 + q]:
      parts = line.split()
      op = parts[0]
      if op == b"after":
          x, y = int(parts[1]), int(parts[2])
          unlink(x)
          insert_after(x, y)
      elif op == b"front":
          x = int(parts[1])
          unlink(x)
          insert_after(x, 0)
      else:
          unlink(int(parts[1]))
  out = []
  cur = nxt[0]
  while cur != n + 1:
      out.append(cur)
      cur = nxt[cur]
  print(" ".join(map(str, out)))
generator: |
  def cases(rng):
      yield "1 1\nfront 1"
      yield "2 2\nremove 1\nremove 2"
      yield "3 2\nafter 3 1\nafter 1 2"
      def make(n, q):
          alive = list(range(1, n + 1))
          ops = []
          for _ in range(q):
              r = rng.random()
              if r < 0.15 and len(alive) > 2:
                  idx = rng.randrange(len(alive))
                  x = alive[idx]
                  alive[idx] = alive[-1]
                  alive.pop()
                  ops.append(f"remove {x}")
              elif r < 0.4:
                  ops.append(f"front {rng.choice(alive)}")
              elif len(alive) >= 2:
                  x, y = rng.sample(alive, 2)
                  ops.append(f"after {x} {y}")
              else:
                  ops.append(f"front {alive[0]}")
          return f"{n} {q}\n" + "\n".join(ops)
      yield make(100000, 60000)
      for _ in range(6):
          yield make(rng.randint(2, 7), rng.randint(1, 6))
