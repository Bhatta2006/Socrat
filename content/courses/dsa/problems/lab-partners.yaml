  def matrix(rng, n, lo, hi):
      c = [[0] * n for _ in range(n)]
      for i in range(n):
          for j in range(i + 1, n):
              c[i][j] = c[j][i] = rng.randint(lo, hi)
      return f"{n}\n" + "\n".join(" ".join(map(str, row)) for row in c)

  def cases(rng):
      yield "2\n0 0\n0 0"
      yield "2\n0 1000000\n1000000 0"
      yield matrix(rng, 16, 0, 10**6)
      yield matrix(rng, 16, 0, 3)
      yield matrix(rng, 16, 10**6, 10**6)
      yield matrix(rng, 14, 0, 10**6)
      for _ in range(5):
          yield matrix(rng, rng.choice([2, 4, 6, 8]), 0, 50)
