id: lab-partners
title: Lab partners
concepts: [dp-advanced-patterns]
difficulty: medium
statement: |
  `n` students (n is even) must be split into n / 2 pairs for a lab. Pairing students i and j
  has an awkwardness of `c[i][j]` (the table is symmetric, and c[i][i] = 0).

  Print the smallest possible total awkwardness over all pairs.
input_format: |
  The first line contains n. Each of the next n lines contains n integers: row i is c[i][0] … c[i][n−1].
output_format: The smallest total awkwardness.
constraints:
  - 2 ≤ n ≤ 16, n is even
  - 0 ≤ c[i][j] = c[j][i] ≤ 10^6
  - c[i][i] = 0
examples:
  - input: "4\n0 1 5 9\n1 0 9 5\n5 9 0 1\n9 5 1 0"
    output: "2"
    explanation: "Pair (0, 1) and (2, 3): 1 + 1 = 2. Pairing 0 with 2 would force 1 with 3: 5 + 5 = 10."
  - input: "2\n0 7\n7 0"
    output: "7"
hints:
  - "Which students are already paired matters, not just how many. With n ≤ 16, what can the state be?"
  - "Let dp[mask] be the smallest awkwardness for pairing exactly the students in mask. The answer is dp[all students]."
  - "From a mask, always pair the lowest unpaired student i with some other unpaired j: dp[mask | 1<<i | 1<<j] = min(…, dp[mask] + c[i][j]). Fixing i avoids counting the same pairing in many orders."
approach: |
  Bitmask DP over the set of students already paired. dp[0] = 0. From any reachable mask, take
  the lowest student i not in it and pair them with every other free j. Always choosing the
  lowest free student means each pairing is built in exactly one order, so there are at most
  n transitions per mask: O(2^n · n) time, O(2^n) memory.
reference: |
  n = int(input())
  c = [list(map(int, input().split())) for _ in range(n)]
  full = (1 << n) - 1
  INF = float("inf")
  dp = [INF] * (1 << n)
  dp[0] = 0
  for mask in range(1 << n):
      d = dp[mask]
      if d == INF or mask == full:
          continue
      i = 0
      while mask >> i & 1:
          i += 1
      row = c[i]
      for j in range(i + 1, n):
          if not mask >> j & 1:
              nxt = mask | (1 << i) | (1 << j)
              if d + row[j] < dp[nxt]:
                  dp[nxt] = d + row[j]
  print(dp[full])
brute: |
  n = int(input())
  c = [list(map(int, input().split())) for _ in range(n)]

  def go(left):
      if not left:
          return 0
      i, rest = left[0], left[1:]
      return min(c[i][j] + go(rest[:k] + rest[k + 1:]) for k, j in enumerate(rest))

  print(go(list(range(n))))
