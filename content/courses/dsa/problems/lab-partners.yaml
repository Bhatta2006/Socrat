    #include <algorithm>
    #include <climits>
    #include <iostream>
    #include <vector>
    using namespace std;

    int main() {
        int n;
        cin >> n;
        vector<vector<long long>> c(n, vector<long long>(n));
        for (auto& row : c)
            for (auto& x : row) cin >> x;
        int full = (1 << n) - 1;
        vector<long long> dp(1 << n, LLONG_MAX);
        dp[0] = 0;
        for (int mask = 0; mask < (1 << n); mask++) {
            if (dp[mask] == LLONG_MAX || mask == full) continue;
            int i = 0;
            while (mask >> i & 1) i++;
            for (int j = i + 1; j < n; j++)
                if (!(mask >> j & 1)) {
                    int nxt = mask | (1 << i) | (1 << j);
                    dp[nxt] = min(dp[nxt], dp[mask] + c[i][j]);
                }
        }
        cout << dp[full] << "\n";
    }
  java: |
    import java.io.*;
    import java.util.*;

    public class Solution {
        public static void main(String[] args) throws IOException {
            BufferedReader in = new BufferedReader(new InputStreamReader(System.in));
            int n = Integer.parseInt(in.readLine().trim());
            long[][] c = new long[n][n];
            for (int i = 0; i < n; i++) {
                StringTokenizer st = new StringTokenizer(in.readLine());
                for (int j = 0; j < n; j++) c[i][j] = Long.parseLong(st.nextToken());
            }
            int full = (1 << n) - 1;
            long[] dp = new long[1 << n];
            Arrays.fill(dp, Long.MAX_VALUE);
            dp[0] = 0;
            for (int mask = 0; mask < (1 << n); mask++) {
                if (dp[mask] == Long.MAX_VALUE || mask == full) continue;
                int i = 0;
                while ((mask >> i & 1) == 1) i++;
                for (int j = i + 1; j < n; j++)
                    if ((mask >> j & 1) == 0) {
                        int nxt = mask | (1 << i) | (1 << j);
                        dp[nxt] = Math.min(dp[nxt], dp[mask] + c[i][j]);
                    }
            }
            System.out.println(dp[full]);
        }
    }
