id: n-queens-count
title: N-Queens
concepts: [backtracking]
difficulty: hard
statement: |
  Count the ways to place `n` queens on an `n × n` chessboard so that no two queens attack
  each other (no two share a row, a column, or a diagonal).
input_format: One whole number n.
output_format: The number of valid placements.
constraints:
  - 1 ≤ n ≤ 11
examples:
  - input: "4"
    output: "2"
  - input: "1"
    output: "1"
hints:
  - Every row must contain exactly one queen. How does that shrink the search?
  - Before placing a queen at (row, col), what three things must be free?
  - Recurse row by row; keep sets/arrays for used columns, r + c diagonals and r − c diagonals; undo after recursing.
approach: |
  Place one queen per row recursively. Track used columns, used r + c diagonals and used
  r − c diagonals (offset by n − 1 for arrays) for O(1) checks; skip attacked squares and
  undo after each recursive call. For n = 11 the pruned search is fast.
reference: |
  n = int(input())
  cols = [False] * n
  d1 = [False] * (2 * n)
  d2 = [False] * (2 * n)
  def place(r):
      if r == n:
          return 1
      total = 0
      for c in range(n):
          if cols[c] or d1[r + c] or d2[r - c + n]:
              continue
          cols[c] = d1[r + c] = d2[r - c + n] = True
          total += place(r + 1)
          cols[c] = d1[r + c] = d2[r - c + n] = False
      return total
  print(place(0))
generator: |
  def cases(rng):
      for value in [2, 3, 5, 6, 7, 8, 9, 10, 11]:
          yield str(value)
