id: divisible-subarrays
title: Profits that split evenly
concepts: [prefix-sums]
difficulty: medium
statement: |
  A food stall records its profit for each of `n` days (a loss is negative). The `k` partners
  want to know in how many stretches of consecutive days the total profit could be shared
  between them exactly, with nothing left over: count the non-empty contiguous stretches whose
  sum is divisible by `k` (0 counts as divisible).
input_format: |
  The first line contains n and k. The second line contains n whole numbers.
output_format: The number of such subarrays.
constraints:
  - 1 ≤ n ≤ 10^5
  - 1 ≤ k ≤ 10^9
  - -10^9 ≤ a_i ≤ 10^9
examples:
  - input: "6 5\n4 5 0 -2 -3 1"
    output: "7"
hints:
  - The sum of a[l..r] is a difference of two prefix sums. When is a difference divisible by k?
  - Two prefix sums give a divisible subarray exactly when they have the same remainder mod k.
  - Count remainders of prefix sums (starting with remainder 0 once, for the empty prefix); each new prefix adds the number of earlier prefixes with the same remainder. Normalise negative remainders.
approach: |
  Let P_0 = 0 and P_i = a_1 + … + a_i. Subarray (l, r] has sum P_r - P_l, divisible by k exactly
  when P_r ≡ P_l (mod k). Scan once, keeping a hash map from remainder to count, and add the count
  of the current remainder before incrementing it. In C++/Java take ((P % k) + k) % k for negative
  sums. O(n).
reference: |
  import sys
  data = sys.stdin.buffer.read().split()
  n, k = int(data[0]), int(data[1])
  counts = {0: 1}
  prefix = 0
  total = 0
  for x in data[2:2 + n]:
      prefix = (prefix + int(x)) % k
      c = counts.get(prefix, 0)
      total += c
      counts[prefix] = c + 1
  print(total)
brute: |
  n, k = map(int, input().split())
  a = list(map(int, input().split()))
  print(sum(1 for l in range(n) for r in range(l, n) if sum(a[l:r + 1]) % k == 0))
