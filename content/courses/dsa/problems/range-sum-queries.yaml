          q = rng.randint(1, 5)
          arr = " ".join(str(rng.randint(-9, 9)) for _ in range(n))
          queries = []
          for _ in range(q):
              l = rng.randint(1, n)
              queries.append(f"{l} {rng.randint(l, n)}")
          yield f"{n} {q}\n{arr}\n" + "\n".join(queries)
