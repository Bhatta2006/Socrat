id: range-sum-queries
title: Range sum queries
concepts: [prefix-sums]
difficulty: easy
statement: |
  Given an array of `n` integers, answer `q` queries. Each query gives `l` and `r`
  (1-indexed, inclusive); print the sum of the elements from position `l` to position `r`.
input_format: |
  The first line contains n and q. The second line contains n integers. Each of the next q
  lines contains l and r.
output_format: q lines, each a range sum.
constraints:
  - 1 ≤ n, q ≤ 200000
  - -10^9 ≤ value ≤ 10^9
  - 1 ≤ l ≤ r ≤ n
examples:
  - input: "5 3\n3 1 4 1 5\n1 5\n2 4\n3 3"
    output: "14\n6\n4"
hints:
  - Summing each range from scratch costs how much in total for 200000 queries?
  - What could you precompute once so that any range sum is a difference of two numbers?
  - Build p with p[0] = 0 and p[i] = p[i-1] + a[i]; the answer is p[r] − p[l−1] (1-indexed). Use 64-bit integers.
approach: |
  Precompute prefix sums with a leading zero; with 1-indexed queries the answer is
  p[r] − p[l − 1]. O(n + q) time. Sums reach 2·10^14, so use 64-bit integers, and read input
  quickly.
reference: |
  import sys
  data = sys.stdin.buffer.read().split()
  n, q = int(data[0]), int(data[1])
  p = [0] * (n + 1)
  for i in range(n):
      p[i + 1] = p[i] + int(data[2 + i])
  out = []
  base = 2 + n
  for j in range(q):
      l, r = int(data[base + 2 * j]), int(data[base + 2 * j + 1])
      out.append(p[r] - p[l - 1])
  print("\n".join(map(str, out)))
generator: |
  def cases(rng):
      yield "1 1\n-7\n1 1"
      yield "3 2\n1000000000 1000000000 1000000000\n1 3\n2 3"
      n = q = 45000
      arr = " ".join(str(rng.randint(-10**9, 10**9)) for _ in range(n))
      queries = []
      for _ in range(q):
          l = rng.randint(1, n)
          r = rng.randint(l, n)
          queries.append(f"{l} {r}")
      yield f"{n} {q}\n{arr}\n" + "\n".join(queries)
      for _ in range(5):
