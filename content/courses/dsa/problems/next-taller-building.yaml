id: next-taller-building
title: Next taller building
concepts: [stacks]
difficulty: medium
statement: |
  Buildings stand in a row from west to east. For each building, print the height of the
  first building to its east that is strictly taller, or `-1` if there is none.
input_format: |
  The first line contains n. The second line contains the n heights from west to east.
output_format: n numbers separated by spaces.
constraints:
  - 1 ≤ n ≤ 10^5
  - 1 ≤ height ≤ 10^9
examples:
  - input: "6\n4 2 3 7 7 1"
    output: "7 3 7 -1 -1 -1"
hints:
  - Checking every building to the east is O(n^2) on a decreasing row. What can you keep instead?
  - When a taller building appears, which earlier buildings has it just answered?
  - Keep a stack of indices still waiting for an answer, with heights decreasing from bottom to top; each new building pops (and answers) every shorter one on top before being pushed.
approach: |
  Monotonic stack: scan west to east keeping indices of buildings without an answer, their
  heights non-increasing on the stack. A new height h pops every index with height < h and sets
  its answer to h, then pushes itself. Every index is pushed and popped once, O(n).
reference: |
  import sys
  data = sys.stdin.buffer.read().split()
  n = int(data[0])
  h = list(map(int, data[1:1 + n]))
  answer = [-1] * n
  stack = []
  for i, x in enumerate(h):
      while stack and h[stack[-1]] < x:
          answer[stack.pop()] = x
      stack.append(i)
  print(" ".join(map(str, answer)))
brute: |
  n = int(input())
  h = list(map(int, input().split()))
  print(" ".join(str(next((h[j] for j in range(i + 1, n) if h[j] > h[i]), -1)) for i in range(n)))
generator: |
  def cases(rng):
      yield "1\n5"
      yield "4\n3 3 3 3"
      n = 100000
      yield f"{n}\n" + " ".join(str(10**9 - i) for i in range(n))
      yield f"{n}\n" + " ".join(str(i + 1) for i in range(n))
      yield f"{n}\n" + " ".join(str(rng.randint(1, 10**9)) for _ in range(n))
      for _ in range(4):
          n = rng.randint(1, 500)
          yield f"{n}\n" + " ".join(str(rng.randint(1, 10)) for _ in range(n))
