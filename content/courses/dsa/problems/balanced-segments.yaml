id: balanced-segments
title: Balanced shifts
concepts: [hashing]
difficulty: medium
statement: |
  A hospital ward logs its shifts as a string `s` of length n: `A` for a shift covered by an
  agency nurse, `B` for one covered by a ward nurse. A run of consecutive shifts is
  **balanced** if it has exactly as many `A` shifts as `B` shifts.

  Count the balanced runs. Runs at different positions count separately, even if they read
  the same.
input_format: |
  The first line contains n. The second line contains s.
output_format: The number of balanced runs.
constraints:
  - 1 ≤ n ≤ 2·10^5
  - s consists of the letters A and B
examples:
  - input: "4\nABBA"
    output: "3"
    explanation: "AB (shifts 1–2), BA (shifts 3–4) and ABBA (all four). BB, ABB and BBA are not balanced."
  - input: "3\nAAA"
    output: "0"
hints:
  - "Score A as +1 and B as −1. A run is balanced exactly when its score is 0."
  - "A run from shift j+1 to shift i has score p_i − p_j, where p is the running score. Count, for each i, how many earlier prefixes have the same score."
  - "Keep a map from score to how many prefixes had it, seeded with the empty prefix: score 0, count 1. The answer can exceed 2^31."
approach: |
  Turn the count condition into a sum: A is +1, B is −1, so a balanced run has sum 0. With
  the running score p (p_0 = 0 for the empty prefix), the run j+1 … i is balanced exactly
  when p_j = p_i. Scan the string; before recording p_i, add the number of earlier prefixes
  with the same score. This is the counting form of the prefix state hash map, seeded with
  {0: 1}. Scores lie in −n … n, so an array of size 2n + 1 works as the map. O(n) time; the
  count needs 64-bit integers.
reference: |
  import sys
  data = sys.stdin.read().split()
  n = int(data[0])
  s = data[1]
  seen = [0] * (2 * n + 1)
  score = n
  seen[score] = 1
  total = 0
  for ch in s:
      score += 1 if ch == "A" else -1
      total += seen[score]
      seen[score] += 1
  print(total)
brute: |
  n = int(input())
  s = input().strip()
  total = 0
  for lo in range(n):
      score = 0
      for hi in range(lo, n):
          score += 1 if s[hi] == "A" else -1
          if score == 0:
              total += 1
  print(total)
references:
  cpp: |
    #include <iostream>
    #include <string>
    #include <vector>
    using namespace std;

    int main() {
        ios::sync_with_stdio(false);
        cin.tie(nullptr);
        int n;
        string s;
        cin >> n >> s;
        vector<long long> seen(2 * n + 1, 0);
        int score = n;
        seen[score] = 1;
        long long total = 0;
        for (char ch : s) {
            score += ch == 'A' ? 1 : -1;
            total += seen[score];
            seen[score]++;
        }
        cout << total << "\n";
    }
  java: |
    import java.io.*;

    public class Solution {
        public static void main(String[] args) throws IOException {
            BufferedReader in = new BufferedReader(new InputStreamReader(System.in));
            int n = Integer.parseInt(in.readLine().trim());
            String s = in.readLine().trim();
            long[] seen = new long[2 * n + 1];
            int score = n;
            seen[score] = 1;
            long total = 0;
            for (int i = 0; i < n; i++) {
                score += s.charAt(i) == 'A' ? 1 : -1;
                total += seen[score];
                seen[score]++;
            }
            System.out.println(total);
        }
    }
