id: fair-teams
title: Fair teams
concepts: [knapsack-01]
difficulty: medium
statement: |
  `n` players have skill ratings `s_i` (a rating may be 0). Every player joins exactly one of
  two teams, Team A or Team B, and a team may be empty. The coach wants Team A's total skill
  to be exactly `D` more than Team B's.

  In how many ways can the players be split? Two splits differ if some player is on a
  different team. Print the answer modulo 1,000,000,007.
input_format: |
  The first line contains n and D. The second line contains the n ratings.
output_format: The number of splits modulo 1000000007.
constraints:
  - 1 ≤ n ≤ 100
  - 0 ≤ s_i ≤ 100
  - 0 ≤ D ≤ 10^4
examples:
  - input: "4 1\n1 1 2 3"
    output: "3"
    explanation: "Team A must total 4: {1, 3}, {1′, 3} or {1, 1′, 2}."
  - input: "3 0\n0 2 2"
    output: "4"
    explanation: "Team A must total 2: {2}, {2′}, {0, 2} or {0, 2′}."
  - input: "2 1\n1 1"
    output: "0"
hints:
  - "If Team A totals a, Team B totals S − a, where S is the sum of all ratings. What does A − B = D tell you about a?"
  - "a = (S + D) / 2. If S + D is odd, or D > S, there are no splits at all."
  - "Count the subsets with sum a using a counting knapsack: ways[0] = 1, and for each rating x loop s from a down to x. Make sure the loop reaches s = x so that ratings of 0 double the count."
approach: |
  Team A's total a satisfies a − (S − a) = D, so a = (S + D) / 2; if S + D is odd or D > S the
  answer is 0. Every split corresponds to exactly one subset (Team A), so count subsets with sum
  a: ways[0] = 1, and for each rating x, for s from a down to x, ways[s] += ways[s − x] modulo
  1e9 + 7. The loop must include s = x so a rating of 0 doubles ways[0]. O(n·S) time.
reference: |
  MOD = 10**9 + 7
  n, D = map(int, input().split())
  s = list(map(int, input().split()))
  total = sum(s)
  if (total + D) % 2 or D > total:
      print(0)
  else:
      a = (total + D) // 2
      ways = [1] + [0] * a  # ways[t]: subsets so far with sum t
      for x in s:
          for t in range(a, x - 1, -1):
              ways[t] = (ways[t] + ways[t - x]) % MOD
      print(ways[a])
brute: |
  n, D = map(int, input().split())
  s = list(map(int, input().split()))
  count = 0
  for mask in range(1 << n):
      a = sum(s[i] for i in range(n) if mask >> i & 1)
      if a - (sum(s) - a) == D:
          count += 1
  print(count % (10**9 + 7))
references:
  cpp: |
    #include <iostream>
    #include <vector>
    using namespace std;

    int main() {
        const long long MOD = 1000000007;
        int n, D;
        cin >> n >> D;
        vector<int> s(n);
        int total = 0;
        for (auto& x : s) cin >> x, total += x;
        if ((total + D) % 2 != 0 || D > total) {
            cout << 0 << "\n";
            return 0;
        }
        int a = (total + D) / 2;
        vector<long long> ways(a + 1, 0);  // ways[t]: subsets so far with sum t
        ways[0] = 1;
        for (int x : s)
            for (int t = a; t >= x; t--) ways[t] = (ways[t] + ways[t - x]) % MOD;
        cout << ways[a] << "\n";
    }
  java: |
    import java.util.Scanner;

    public class Solution {
        public static void main(String[] args) {
            final long MOD = 1_000_000_007L;
            Scanner in = new Scanner(System.in);
            int n = in.nextInt(), D = in.nextInt(), total = 0;
            int[] s = new int[n];
            for (int i = 0; i < n; i++) { s[i] = in.nextInt(); total += s[i]; }
            if ((total + D) % 2 != 0 || D > total) {
                System.out.println(0);
                return;
            }
            int a = (total + D) / 2;
            long[] ways = new long[a + 1];  // ways[t]: subsets so far with sum t
            ways[0] = 1;
            for (int x : s)
                for (int t = a; t >= x; t--) ways[t] = (ways[t] + ways[t - x]) % MOD;
            System.out.println(ways[a]);
        }
    }
