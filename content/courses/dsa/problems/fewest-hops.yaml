id: fewest-hops
title: Fewest hops
concepts: [graph-traversal]
difficulty: medium
statement: |
  A network has `n` computers and `m` undirected cables. Find the minimum number of cables
  a message must travel from computer `1` to computer `n`, or print `-1` if it cannot
  arrive.
input_format: |
  The first line contains n and m. Each of the next m lines contains a and b, a cable
  between computers a and b.
output_format: The minimum number of hops, or -1.
constraints:
  - 2 ≤ n ≤ 100000
  - 1 ≤ m ≤ 200000
examples:
  - input: "5 5\n1 2\n1 3\n1 4\n2 3\n5 4"
    output: "2"
    explanation: 1 → 4 → 5.
  - input: "3 1\n1 2"
    output: "-1"
hints:
  - Every cable has the same cost. Which traversal discovers nodes in order of distance?
  - What do you need to store per computer so you never process it twice?
  - Build adjacency lists; BFS from 1 with dist = -1 for unvisited; answer dist[n].
approach: |
  Unweighted shortest path: BFS from node 1 over adjacency lists, recording distances when
  nodes are first discovered. Print dist[n] (−1 if unreached). O(n + m).
reference: |
  import sys
  from collections import deque
  data = sys.stdin.buffer.read().split()
  n, m = int(data[0]), int(data[1])
  adj = [[] for _ in range(n + 1)]
  for i in range(m):
      a, b = int(data[2 + 2 * i]), int(data[3 + 2 * i])
      adj[a].append(b); adj[b].append(a)
  dist = [-1] * (n + 1)
  dist[1] = 0
  q = deque([1])
  while q:
      u = q.popleft()
      for v in adj[u]:
          if dist[v] == -1:
              dist[v] = dist[u] + 1
              q.append(v)
  print(dist[n])
