quiz:
  - id: overflow-product
    kind: mcq
    prompt: In C++, int a = 100000, b = 100000; long long c = a * b; — what goes wrong?
    options:
      - a * b overflows as int before being stored in c
      - Nothing, c is long long
      - It is a compile error
      - c becomes 10^10 exactly
    answer: 0
    explanation: The multiplication happens in int; write 1LL * a * b.
    difficulty: 2
  - id: budget
    kind: mcq
    prompt: n = 2·10^5 and the limit is 1 second. Which is safe in C++?
    options: ["O(n log n)", "O(n²)", "O(n² log n)", "O(2^n)"]
    answer: 0
    explanation: n log n ≈ 3.5·10^6 operations; n² is 4·10^10.
    difficulty: 1
  - id: java-input
    kind: mcq
    prompt: Which Java approach reads 10^6 integers fast enough?
    options: ["BufferedReader with StringTokenizer (or a custom byte reader)", "Scanner.nextInt", "System.console()", "Reading one char at a time with System.in.read() unbuffered"]
    answer: 0
    explanation: Scanner's regex parsing is far too slow at this scale.
    difficulty: 2
  - id: endl
    kind: mcq
    prompt: Why avoid endl in C++ when printing many lines?
    options: ["It flushes the output buffer every time", "It is not portable", "It adds two newlines", "It is a compile error"]
    answer: 0
    explanation: Flushing on every line turns buffered output into many slow system calls.
    difficulty: 1
problems: [sum-big]
