quiz:
  - id: jumps
    kind: mcq
    prompt: To jump 13 levels up with binary lifting, which jumps do you take?
    options: ["2^3, 2^2 and 2^0 (8 + 4 + 1)", "13 single steps", "2^4 then back", "2^3 and 2^2"]
    answer: 0
    explanation: 13 is 1101 in binary.
    difficulty: 2
  - id: distance
    kind: mcq
    prompt: depth[u] = 7, depth[v] = 5, depth[lca] = 3. Distance between u and v?
    options: ["6", "12", "2", "4"]
    answer: 0
    explanation: 7 + 5 − 2·3 = 6.
    difficulty: 1
  - id: log-size
    kind: mcq
    prompt: For n = 200,000, what is the smallest safe LOG?
    options: ["18", "17", "10", "200000"]
    answer: 0
    explanation: 2^17 = 131,072 < 200,000 ≤ 2^18.
    difficulty: 2
