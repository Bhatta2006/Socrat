quiz:
  - id: pi-value
    kind: mcq
    prompt: For s = "abab", what is π[3]?
    options: ["2", "1", "3", "0"]
    answer: 0
    explanation: '"ab" is both a proper prefix and a suffix of "abab".'
    difficulty: 2
  - id: period
    kind: mcq
    prompt: For s = "abcabcabc", π[n−1] = 6. What is the smallest period?
    options: ["3", "6", "9", "1"]
    answer: 0
    explanation: n − π[n−1] = 9 − 6 = 3.
    difficulty: 2
  - id: separator
    kind: mcq
    prompt: Why insert a separator between pattern and text in KMP?
    options: ["So borders can never extend across the boundary", "To speed it up", "To handle uppercase", "It is optional and never matters"]
    answer: 0
    explanation: Without it, π could exceed the pattern length and report false matches.
    difficulty: 3
