quiz:
  - id: c-5-2
    kind: mcq
    prompt: What is C(5, 2)?
    options: ["10", "20", "5", "25"]
    answer: 0
    explanation: 5! / (2! · 3!) = 120 / 12 = 10.
    difficulty: 1
  - id: grid
    kind: mcq
    prompt: How many right/down paths cross a grid needing 3 rights and 2 downs?
    options: ["10", "6", "5", "32"]
    answer: 0
    explanation: Choose which 2 of the 5 moves are downs — C(5, 2) = 10.
    difficulty: 2
  - id: stars-bars
    kind: mcq
    prompt: Ways to give 4 identical candies to 3 children (some may get none)?
    options: ["15", "12", "64", "4"]
    answer: 0
    explanation: Stars and bars - C(4 + 3 − 1, 3 − 1) = C(6, 2) = 15.
    difficulty: 3
  - id: precompute
    kind: mcq
    prompt: With factorials and inverse factorials precomputed up to N, each C(n, k) costs...
    options: ["O(1)", "O(n)", "O(log n)", "O(k)"]
    answer: 0
    explanation: Three multiplications modulo p.
    difficulty: 1
