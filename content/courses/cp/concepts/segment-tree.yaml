quiz:
  - id: identity
    kind: mcq
    prompt: For a range-maximum segment tree, unused leaves should hold...
    options: ["−infinity", "0", "+infinity", "1"]
    answer: 0
    explanation: The identity for max is −∞, so padding never changes an answer.
    difficulty: 2
  - id: nodes
    kind: mcq
    prompt: A segment tree over n leaves (n a power of two) has how many nodes?
    options: ["2n − 1", "n", "n log n", "n²"]
    answer: 0
    explanation: n leaves plus n − 1 internal nodes.
    difficulty: 2
  - id: associative
    kind: mcq
    prompt: Which operation can a plain segment tree NOT combine directly?
    options: ["The median of a range", "gcd", "min", "XOR"]
    answer: 0
    explanation: Median isn't computable from two children's medians — it's not a simple associative merge.
    difficulty: 3
