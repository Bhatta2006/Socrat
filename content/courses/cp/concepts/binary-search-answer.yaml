quiz:
  - id: monotonic
    kind: mcq
    prompt: Why may we binary search the time T in "factory machines"?
    options:
      - If k items can be made in time T, they can be made in any T' > T
      - Machines are sorted
      - T is always a power of two
      - Times are small
    answer: 0
    explanation: More time never produces fewer items, so feasibility is monotonic.
    difficulty: 2
  - id: last-true
    kind: mcq
    prompt: Searching the LAST x with ok(x) true, why use mid = (lo + hi + 1) / 2?
    options:
      - With lo = mid on success, rounding down could loop forever
      - It is faster
      - To avoid overflow
      - It finds the first true instead
    answer: 0
    explanation: When hi = lo + 1, rounding down gives mid = lo and lo = mid makes no progress.
    difficulty: 3
  - id: iterations
    kind: mcq
    prompt: Binary searching an answer in [0, 10^18] takes about how many checks?
    options: ["60", "10^9", "18", "1,000"]
    answer: 0
    explanation: log₂(10^18) ≈ 60.
    difficulty: 1
