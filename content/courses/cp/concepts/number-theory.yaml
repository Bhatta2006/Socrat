quiz:
  - id: divisor-count
    kind: mcq
    prompt: How many divisors does 72 = 2^3 · 3^2 have?
    options: ["12", "6", "5", "9"]
    answer: 0
    explanation: (3 + 1)(2 + 1) = 12.
    difficulty: 2
  - id: sieve-start
    kind: mcq
    prompt: In the sieve, why start crossing out multiples of p at p²?
    options:
      - Smaller multiples were already crossed out by smaller primes
      - p² is always prime
      - To avoid overflow
      - It's required for correctness
    answer: 0
    explanation: k·p with k < p has a prime factor smaller than p, so it's already marked.
    difficulty: 3
  - id: leftover
    kind: mcq
    prompt: After trial division up to √n, the remaining value is 1373 (> 1). What is it?
    options: ["A prime factor of the original n", "Composite", "Always 1", "An error"]
    answer: 0
    explanation: Any composite remainder would have a factor ≤ √n, which would have been divided out.
    difficulty: 2
  - id: gcd-value
    kind: mcq
    prompt: What is gcd(84, 36)?
    options: ["12", "6", "4", "36"]
    answer: 0
    explanation: gcd(84, 36) = gcd(36, 12) = gcd(12, 0) = 12.
    difficulty: 1
