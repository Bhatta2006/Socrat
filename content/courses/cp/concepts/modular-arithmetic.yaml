quiz:
  - id: subtract
    kind: mcq
    prompt: In C++, a = 3 and b = 5 (both already reduced mod 7). What is the correct (a − b) mod 7?
    options: ["((a − b) % 7 + 7) % 7 = 5", "(a − b) % 7 = −2", "(b − a) % 7 = 2", "0"]
    answer: 0
    explanation: C++ % keeps the sign of the dividend; adding 7 normalises it to 5.
    difficulty: 2
  - id: fermat
    kind: mcq
    prompt: Modulo the prime p = 10^9 + 7, the inverse of x is...
    options: ["x^(p−2) mod p", "1 / x", "x^(p−1) mod p", "p − x"]
    answer: 0
    explanation: Fermat's little theorem gives x^(p−1) ≡ 1, so x^(p−2) is the inverse.
    difficulty: 2
  - id: pow-steps
    kind: mcq
    prompt: How many multiplications does fast exponentiation need for b ≈ 10^18?
    options: ["About 120 (2 per bit, 60 bits)", "10^18", "10^9", "18"]
    answer: 0
    explanation: One squaring per bit plus one multiply per set bit — at most ~2·60.
    difficulty: 2
  - id: when-inverse
    kind: mcq
    prompt: When does x have an inverse modulo m?
    options: ["When gcd(x, m) = 1", "Always", "When x is prime", "When x < m"]
    answer: 0
    explanation: An inverse exists exactly when x and m are coprime.
    difficulty: 3
  - id: mod-subtraction
    kind: mcq
    prompt: "In C++ with values already reduced mod p, how do you compute (a - b) mod p safely?"
    options:
      - "((a - b) % p + p) % p"
      - "(a - b) % p"
      - "abs(a - b) % p"
      - "(a % p - b % p)"
    answer: 0
    explanation: "% can return a negative result in C++; adding p before the final % brings it into [0, p)."
    difficulty: 4
  - id: fermat-inverse
    kind: mcq
    prompt: "For a prime p and a not divisible by p, the modular inverse of a is"
    options:
      - "a^(p-2) mod p"
      - "a^(p-1) mod p"
      - "(p - a) mod p"
      - "p / a"
    answer: 0
    explanation: "By Fermat's little theorem a^(p-1) ≡ 1, so a · a^(p-2) ≡ 1 (mod p)."
    difficulty: 5
