quiz:
  - id: subset-test
    kind: mcq
    prompt: How do you test whether mask a is a subset of mask b?
    options: ["(a & b) == a", "(a | b) == a", "(a ^ b) == 0", "a < b"]
    answer: 0
    explanation: Every bit of a must also be set in b.
    difficulty: 2
  - id: range-xor
    kind: mcq
    prompt: With prefix XOR px, the XOR of a[l..r] is...
    options: ["px[r+1] ^ px[l]", "px[r] − px[l]", "px[r+1] & px[l]", "px[r] ^ px[r]"]
    answer: 0
    explanation: XOR cancels the common prefix a[0..l−1].
    difficulty: 2
  - id: three-n
    kind: mcq
    prompt: Enumerating every submask of every mask of n bits takes...
    options: ["O(3^n)", "O(4^n)", "O(2^n)", "O(n · 2^n)"]
    answer: 0
    explanation: Each element is either outside the mask, in the mask but not the submask, or in both — 3 choices.
    difficulty: 3
problems: [xor-subarrays]
