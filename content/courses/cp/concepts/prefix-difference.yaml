quiz:
  - id: diff-update
    kind: mcq
    prompt: To add 5 to positions 3..7 with a difference array, you do...
    options: ["diff[3] += 5, diff[8] −= 5", "diff[3] += 5, diff[7] −= 5", "diff[3..7] += 5", "diff[8] += 5"]
    answer: 0
    explanation: Start adding at 3 and cancel right after 7.
    difficulty: 2
  - id: twod
    kind: mcq
    prompt: Which term is added back in the 2D rectangle query?
    options: ["P[r1−1][c1−1]", "P[r2][c2]", "P[r1][c1]", "None"]
    answer: 0
    explanation: The top-left corner region is subtracted twice, so it's added back once.
    difficulty: 3
  - id: choose
    kind: mcq
    prompt: Range additions and range-sum queries are interleaved. Which structure?
    options: ["A Fenwick or segment tree", "Prefix sums", "A difference array alone", "A hash map"]
    answer: 0
    explanation: Prefix sums and difference arrays assume all updates come before all queries (or vice versa).
    difficulty: 2
