id: prefix-difference
title: Prefix sums and difference arrays
summary: O(1) range queries with prefix sums, O(1) range updates with difference arrays, and their 2D versions.
module: techniques
prerequisites: [dsa:prefix-sums, fast-io]
difficulty: 3
estimated_minutes: 45
lesson: |
  ## The big idea

  Prefix sums answer many **range queries** after one pass. Their mirror image, the
  **difference array**, applies many **range updates** in O(1) each and reconstructs the
  final array in one pass. Contest problems mix both constantly.

  ## Difference arrays

  To add `v` to every element in `[l, r]`: `diff[l] += v` and `diff[r + 1] −= v`. After all
  updates, the prefix sum of `diff` is the final array.

  ```python
  diff = [0] * (n + 2)
  for l, r, v in updates:          # 1-indexed, inclusive
      diff[l] += v
      diff[r + 1] -= v
  a, run = [0] * (n + 1), 0
  for i in range(1, n + 1):
      run += diff[i]
      a[i] = run
  ```

  ```cpp
  vector<long long> diff(n + 2, 0);
  for (auto [l, r, v] : updates) { diff[l] += v; diff[r + 1] -= v; }
  vector<long long> a(n + 1, 0);
  long long run = 0;
  for (int i = 1; i <= n; i++) { run += diff[i]; a[i] = run; }
  ```

  ```java
  long[] diff = new long[n + 2];
  for (int[] u : updates) { diff[u[0]] += u[2]; diff[u[1] + 1] -= u[2]; }
  long[] a = new long[n + 1];
  long run = 0;
  for (int i = 1; i <= n; i++) { run += diff[i]; a[i] = run; }
  ```

  Why it works: `diff[l] += v` starts adding v from position l onward; `diff[r+1] −= v`
  cancels it after r.

  ## Sweep with coordinate compression

  When positions go up to 10^9 but there are only n events, sort the event positions,
  apply +1/−1 at each, and sweep — the same idea without a huge array.

  ## 2D prefix sums

  `P[i][j]` = sum of the rectangle from (1, 1) to (i, j):
  `P[i][j] = a[i][j] + P[i−1][j] + P[i][j−1] − P[i−1][j−1]`. A query for rectangle
  (r1, c1)–(r2, c2) is `P[r2][c2] − P[r1−1][c2] − P[r2][c1−1] + P[r1−1][c1−1]`
  (inclusion–exclusion).

  ## Spotting them

  - "q queries of sum on [l, r], no updates" → prefix sums.
  - "q operations add v to [l, r], then report the array" → difference array.
  - Updates and queries interleaved → Fenwick or segment tree (later in this course).
key_points:
  - Prefix sums - O(1) range-sum queries on a static array.
  - Difference arrays - O(1) range additions, one final prefix pass.
  - 2D versions use inclusion–exclusion.
  - Interleaved updates and queries need Fenwick/segment trees.
pitfalls:
  - Allocating diff of size n + 1 and writing diff[r + 1] out of bounds.
  - Forgetting 64-bit accumulators.
  - Sign errors in 2D inclusion–exclusion.
