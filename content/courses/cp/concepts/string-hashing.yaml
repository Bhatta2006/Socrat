quiz:
  - id: formula
    kind: mcq
    prompt: With prefix hashes h and powers pw, the hash of s[l:r] is...
    options: ["(h[r] − h[l]·pw[r − l]) mod M", "h[r] − h[l]", "h[r]·pw[l]", "(h[r] + h[l]) mod M"]
    answer: 0
    explanation: Shift h[l] up by r − l positions before subtracting it from h[r].
    difficulty: 2
  - id: collisions
    kind: mcq
    prompt: Why use two moduli (or 2^61 − 1)?
    options: ["To make accidental and adversarial collisions negligible", "To make hashing faster", "To support uppercase letters", "Because one modulus is incorrect"]
    answer: 0
    explanation: Many comparisons with a ~10^9 modulus make a false match likely (birthday paradox).
    difficulty: 2
  - id: zero-code
    kind: mcq
    prompt: Why avoid mapping 'a' to 0 in a polynomial hash?
    options: ['"a" and "aa" would both hash to 0', "It's slower", "Zero is not allowed modulo a prime", "It changes the base"]
    answer: 0
    explanation: Leading zeros vanish, so strings of a's of different lengths collide.
    difficulty: 3
