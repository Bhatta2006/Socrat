quiz:
  - id: lowbit
    kind: mcq
    prompt: What is 12 & −12?
    options: ["4", "12", "8", "1"]
    answer: 0
    explanation: 12 = 1100 in binary; the lowest set bit is 100 = 4.
    difficulty: 2
  - id: zero-index
    kind: mcq
    prompt: Why must Fenwick indexes start at 1?
    options: ["0 & −0 = 0, so updates at 0 would loop forever", "Arrays start at 1", "It's faster", "Convention only"]
    answer: 0
    explanation: The step size i & −i must be positive.
    difficulty: 2
  - id: minmax
    kind: mcq
    prompt: Range-minimum queries with point updates — Fenwick or segment tree?
    options: ["Segment tree", "Fenwick tree", "Prefix sums", "Difference array"]
    answer: 0
    explanation: Minimum isn't invertible, so prefix(r) − prefix(l − 1) has no equivalent.
    difficulty: 2
