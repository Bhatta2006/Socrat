quiz:
  - id: knap-order
    kind: mcq
    prompt: In 1D 0/1 knapsack, the capacity loop must run...
    options: ["From W down to w", "From w up to W", "In any order", "Only once"]
    answer: 0
    explanation: Downwards ensures dp[c − w] still refers to the previous item round.
    difficulty: 2
  - id: combos
    kind: mcq
    prompt: Counting unordered coin combinations (1+2 same as 2+1) needs which loop order?
    options: ["Coins outer, sum inner", "Sum outer, coins inner", "Either", "Recursion only"]
    answer: 0
    explanation: Coins-outer adds coins in a fixed order, so each multiset is counted once.
    difficulty: 3
  - id: lis-len
    kind: mcq
    prompt: LIS length of [10, 9, 2, 5, 3, 7, 101, 18]?
    options: ["4", "3", "5", "8"]
    answer: 0
    explanation: For example 2, 3, 7, 18.
    difficulty: 2
  - id: lis-strict
    kind: mcq
    prompt: For a strictly increasing LIS with tails, which search is correct?
    options: ["lower_bound (first ≥ x)", "upper_bound (first > x)", "Linear scan only", "Binary search for exact x"]
    answer: 0
    explanation: Replacing the first tail ≥ x prevents equal values from extending a strict sequence.
    difficulty: 3
