id: simulation
title: Simulation and implementation
summary: Translate a long statement into exact code — the skill behind most Div 3 A–C problems.
module: contest-basics
prerequisites: [fast-io, zero:grids]
difficulty: 2
estimated_minutes: 40
lesson: |
  ## The big idea

  Many contest problems need no clever algorithm — just **doing exactly what the statement
  says**, efficiently and without bugs. These "implementation" problems reward careful
  reading, clean state, and testing edge cases. They are also where speed comes from: the
  faster you finish them, the more time you have for the hard problems.

  ## A reliable workflow

  1. **Model the state.** What variables fully describe the situation at any moment?
     (positions, directions, a grid, counters)
  2. **Write one step.** Implement a single time step / operation as a small function.
  3. **Loop** the step the required number of times — and check that number against the
     time limit.
  4. **Check edges**: n = 1, all equal, walls, wrap-around, simultaneous events.

  ## Directions and grids

  ```python
  # 0 = north, 1 = east, 2 = south, 3 = west
  dr = [-1, 0, 1, 0]
  dc = [0, 1, 0, -1]
  d = (d + 1) % 4          # turn right
  d = (d + 3) % 4          # turn left
  r, c = r + dr[d], c + dc[d]
  ```

  ```cpp
  int dr[] = {-1, 0, 1, 0}, dc[] = {0, 1, 0, -1};
  d = (d + 1) % 4;   // right
  d = (d + 3) % 4;   // left
  r += dr[d]; c += dc[d];
  ```

  ```java
  int[] dr = {-1, 0, 1, 0}, dc = {0, 1, 0, -1};
  d = (d + 1) % 4;   // right
  d = (d + 3) % 4;   // left
  r += dr[d]; c += dc[d];
  ```

  ## When simulation is too slow

  If the statement asks for step 10^18, you cannot simulate every step. Look for:

  - a **cycle**: record each state's first time seen; once a state repeats, the process
    loops with a known period, so jump ahead with modulo;
  - a **closed form**: the k-th step can be computed directly;
  - **batching**: apply many identical steps at once.

  ## Cleanliness pays

  Use meaningful names, avoid copy-pasted branches (use direction arrays), and keep the
  update for one step in one place. In contests, a messy simulation is where 20 minutes of
  debugging hides.
key_points:
  - Model the full state, implement one step, then loop.
  - Direction arrays turn four branches into one formula.
  - Check the number of steps against the time limit before simulating.
  - For huge step counts, find a cycle or closed form.
pitfalls:
  - Updating state in place when all updates should happen "simultaneously".
  - Misreading the order of operations in the statement.
  - Simulating 10^18 steps instead of finding the cycle.
