quiz:
  - id: turn-right
    kind: mcq
    prompt: With directions 0=N, 1=E, 2=S, 3=W, how do you turn left?
    options: ["d = (d + 3) % 4", "d = (d + 1) % 4", "d = d - 1", "d = (d + 2) % 4"]
    answer: 0
    explanation: Turning left is three right turns; +3 avoids negative values with %.
    difficulty: 2
  - id: simultaneous
    kind: mcq
    prompt: In Game of Life–style updates, why use a second grid?
    options:
      - All cells must update from the same previous state
      - It is faster
      - To save memory
      - The judge requires it
    answer: 0
    explanation: Updating in place would let early cells' new values affect later cells in the same step.
    difficulty: 2
  - id: huge-steps
    kind: mcq
    prompt: A deterministic process has at most 1000 possible states. You need its state after 10^18 steps. Approach?
    options:
      - Detect the cycle (it must repeat within 1001 steps) and use modulo
      - Simulate all 10^18 steps
      - Binary search on the step
      - It is impossible
    answer: 0
    explanation: By the pigeonhole principle a state repeats quickly; the rest is periodic.
    difficulty: 3
