quiz:
  - id: edges
    kind: mcq
    prompt: An MST of a connected graph with 50 nodes has how many edges?
    options: ["49", "50", "51", "It depends"]
    answer: 0
    explanation: Every spanning tree on n nodes has exactly n − 1 edges.
    difficulty: 1
  - id: kruskal-skip
    kind: mcq
    prompt: In Kruskal, when is an edge skipped?
    options: ["When both ends are already in the same component", "When it is the most expensive", "When it touches a leaf", "Never"]
    answer: 0
    explanation: Adding it would create a cycle without connecting anything new.
    difficulty: 1
  - id: maximum
    kind: mcq
    prompt: How do you get a maximum spanning tree with Kruskal?
    options: ["Sort edges in descending order", "Negate the node numbers", "Use BFS", "It's impossible"]
    answer: 0
    explanation: The same greedy with the opposite order maximises the total.
    difficulty: 2
