quiz:
  - id: boats
    kind: mcq
    prompt: Weights [1, 2, 2, 3], limit 3, at most two per boat. Minimum boats?
    options: ["3", "2", "4", "1"]
    answer: 0
    explanation: "Pairs: (3), (1, 2), (2) — 3 boats; no arrangement does better."
    difficulty: 2
  - id: multiset-erase
    kind: mcq
    prompt: In C++, how do you remove ONE copy of x from a multiset s?
    options: ["s.erase(s.find(x))", "s.erase(x)", "s.remove(x)", "s.pop(x)"]
    answer: 0
    explanation: erase(value) removes all copies; erase(iterator) removes exactly one.
    difficulty: 3
  - id: proof
    kind: mcq
    prompt: Your greedy passes the samples. Best way to gain confidence before submitting?
    options: ["Stress-test against a brute force on random small cases", "Submit and see", "Add more comments", "Run the samples again"]
    answer: 0
    explanation: Random small tests quickly expose wrong greedy orderings.
    difficulty: 1
