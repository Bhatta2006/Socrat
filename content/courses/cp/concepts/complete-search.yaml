quiz:
  - id: perm-feasible
    kind: mcq
    prompt: For n ≤ 10, is trying all permutations (with O(n) work each) feasible in C++?
    options: ["Yes — about 3.6·10^7 operations", "No — 10^10 operations", "Only for n ≤ 5", "Only in Python"]
    answer: 0
    explanation: 10! ≈ 3.6·10^6 permutations × 10 ≈ 3.6·10^7.
    difficulty: 2
  - id: subset-count
    kind: mcq
    prompt: How many subsets does mask iterate over for n = 20?
    options: ["1,048,576", "400", "20", "2,432,902,008,176,640,000"]
    answer: 0
    explanation: 2^20 = 1,048,576.
    difficulty: 1
  - id: mitm
    kind: mcq
    prompt: Meet in the middle improves subset enumeration from O(2^n) to roughly...
    options: ["O(2^(n/2) · n)", "O(n²)", "O(n log n)", "O(2^n / n)"]
    answer: 0
    explanation: Two halves of 2^(n/2) sums each, combined after sorting.
    difficulty: 3
  - id: stress
    kind: mcq
    prompt: Your fast solution gets Wrong Answer on a hidden test. What's the most effective next step?
    options:
      - Compare it with a brute force on many random small inputs
      - Resubmit unchanged
      - Rewrite in another language
      - Increase array sizes
    answer: 0
    explanation: Stress testing finds a tiny counterexample you can trace by hand.
    difficulty: 2
