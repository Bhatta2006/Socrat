quiz:
  - id: multisource
    kind: mcq
    prompt: Distance from every cell to the nearest of k exits — most efficient approach?
    options: ["One BFS with all exits enqueued at distance 0", "k separate BFS runs", "Dijkstra from each cell", "Floyd–Warshall"]
    answer: 0
    explanation: Multi-source BFS solves it in a single O(V + E) pass.
    difficulty: 2
  - id: deque
    kind: mcq
    prompt: In 0-1 BFS, where does a node reached by a 0-weight edge go?
    options: ["Front of the deque", "Back of the deque", "A separate heap", "It's skipped"]
    answer: 0
    explanation: Same distance as the current node, so it should be processed next.
    difficulty: 2
  - id: negcycle
    kind: mcq
    prompt: Bellman–Ford detects a negative cycle when...
    options: ["An edge still relaxes in the n-th round", "The graph is disconnected", "All distances are negative", "Dijkstra fails"]
    answer: 0
    explanation: Without negative cycles, n − 1 rounds suffice; further improvement proves a cycle.
    difficulty: 3
