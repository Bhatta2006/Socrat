quiz:
  - id: edges-tree
    kind: mcq
    prompt: A tree with n nodes has how many edges?
    options: ["n − 1", "n", "n + 1", "2n"]
    answer: 0
    explanation: Connected and acyclic means exactly n − 1 edges.
    difficulty: 1
  - id: reverse-order
    kind: mcq
    prompt: Why process nodes in reverse BFS order for subtree sums?
    options: ["Children appear after parents in BFS order, so reversing handles children first", "It's faster", "BFS order is random", "To avoid cycles"]
    answer: 0
    explanation: Bottom-up DP needs every child finished before its parent.
    difficulty: 2
  - id: euler
    kind: mcq
    prompt: With an Euler tour, the subtree of u corresponds to...
    options: ["The contiguous range [tin[u], tout[u]]", "All nodes with larger labels", "The path from root to u", "A random set"]
    answer: 0
    explanation: DFS visits an entire subtree before leaving it.
    difficulty: 2
  - id: reroot
    kind: mcq
    prompt: Rerooting from parent p to child c changes the sum of distances by...
    options: ["−size[c] + (n − size[c])", "+size[c]", "+1", "Nothing"]
    answer: 0
    explanation: Nodes in c's subtree get 1 closer; all others get 1 farther.
    difficulty: 3
