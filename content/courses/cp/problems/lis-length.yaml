id: lis-length
title: Longest increasing subsequence
concepts: [dp-classics]
difficulty: medium
statement: |
  Find the length of the longest **strictly increasing** subsequence of an array (elements
  keep their order but need not be adjacent).
input_format: |
  The first line contains n. The second line contains n integers.
output_format: The LIS length.
constraints:
  - 1 ≤ n ≤ 200000
  - 1 ≤ a[i] ≤ 10^9
examples:
  - input: "8\n7 3 5 3 6 2 9 8"
    output: "4"
    explanation: For example 3, 5, 6, 9.
hints:
  - The O(n²) DP compares every pair — too slow for 2·10^5. What could you remember for each possible length?
  - For each length L, keep the smallest tail of any increasing subsequence of length L. Why is that array sorted?
  - For each x, binary search the first tail ≥ x and replace it (append if none); the answer is the number of tails.
approach: |
  Patience-sorting LIS: maintain tails sorted; for each x, lower_bound(x) in tails and replace
  or append. The tails length is the LIS length. O(n log n).
reference: |
  import sys
  from bisect import bisect_left
  data = sys.stdin.buffer.read().split()
  n = int(data[0])
  tails = []
  for i in range(n):
      x = int(data[1 + i])
      j = bisect_left(tails, x)
      if j == len(tails):
          tails.append(x)
      else:
          tails[j] = x
  print(len(tails))
generator: |
  def cases(rng):
      yield "1\n5"
      yield "5\n2 2 2 2 2"
      yield "5\n1 2 3 4 5"
      n = 150000
      yield f"{n}\n" + " ".join(str(rng.randint(1, 10**9)) for _ in range(n))
      yield f"{n}\n" + " ".join(str(n - i) for i in range(n))
      for _ in range(5):
          n = rng.randint(1, 10)
          yield f"{n}\n" + " ".join(str(rng.randint(1, 6)) for _ in range(n))
