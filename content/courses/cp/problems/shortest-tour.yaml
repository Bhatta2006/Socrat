id: shortest-tour
title: Shortest study tour
concepts: [bitmask-dp]
difficulty: hard
statement: |
  A mentor must visit `n` study groups (numbered 0 to n − 1) starting at group 0, visiting
  every group exactly once, and finally returning to group 0. The travel time between groups
  `i` and `j` is `d[i][j]` (not necessarily symmetric). Print the minimum total travel time.
input_format: |
  The first line contains n. Then n lines follow, each with n integers d[i][0..n−1].
output_format: The minimum tour length.
constraints:
  - 1 ≤ n ≤ 13
  - 0 ≤ d[i][j] ≤ 10^6, d[i][i] = 0
examples:
  - input: "4\n0 10 15 20\n10 0 35 25\n15 35 0 30\n20 25 30 0"
    output: "80"
    explanation: 0 → 1 → 3 → 2 → 0 costs 10 + 25 + 30 + 15.
hints:
  - Trying all (n−1)! orders is too many for n = 13. What information about a partial tour actually matters for the rest?
  - Only which groups were visited and where you are now matter. How many such states are there?
  - dp[mask][v] = shortest path from 0 visiting exactly mask and ending at v; extend to unvisited u; answer min over v of dp[full][v] + d[v][0].
approach: |
  Held–Karp bitmask DP: dp[1][0] = 0; for masks in increasing order and each end v, relax
  dp[mask | 1<<u][u] for unvisited u. Answer min(dp[full][v] + d[v][0]); for n = 1 the answer
  is 0. O(2^n · n²) ≈ 1.4·10^6 for n = 13.
reference: |
  import sys
  data = sys.stdin.read().split()
  n = int(data[0])
  d = [list(map(int, data[1 + i * n:1 + (i + 1) * n])) for i in range(n)]
  INF = float("inf")
  full = (1 << n) - 1
  dp = [[INF] * n for _ in range(1 << n)]
  dp[1][0] = 0
  for mask in range(1, 1 << n):
      if not mask & 1:
          continue
      row = dp[mask]
      for v in range(n):
          cur = row[v]
          if cur == INF:
              continue
          dv = d[v]
          for u in range(n):
              if not mask >> u & 1:
                  nm = mask | 1 << u
                  if cur + dv[u] < dp[nm][u]:
                      dp[nm][u] = cur + dv[u]
  print(min(dp[full][v] + d[v][0] for v in range(n)) if n > 1 else 0)
generator: |
  def cases(rng):
      yield "1\n0"
      yield "2\n0 5\n7 0"
      for n in [13, 12, 9]:
