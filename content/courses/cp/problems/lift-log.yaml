id: lift-log
title: Lift log
concepts: [simulation]
difficulty: easy
statement: |
  A lift starts at floor 0 in a building with floors 0 to `f`. It receives `m` commands in
  order:

  - `U x` moves it up x floors, but never above floor f (it stops at f);
  - `D x` moves it down x floors, but never below floor 0;
  - `G y` sends it straight to floor y.

  Every floor the lift *passes or stops at* while moving counts as travelled distance: moving
  from floor 2 to floor 5 travels 3. Print the final floor and the total distance travelled.
input_format: |
  The first line contains f and m. Each of the next m lines is one command.
output_format: The final floor and the total distance, separated by a space.
constraints:
  - 1 ≤ f ≤ 10^9
  - 1 ≤ m ≤ 10^5
  - 0 ≤ x ≤ 10^9, 0 ≤ y ≤ f
examples:
  - input: "10 4\nU 7\nU 7\nG 2\nD 5"
    output: "0 20"
    explanation: 0 → 7 (7), 7 → 10 (3), 10 → 2 (8), 2 → 0 (2); total 20.
hints:
  - Keep exactly two pieces of state. Which ones?
  - For each command, first work out the target floor, then clamp it to [0, f].
  - Distance added by a move is abs(target - current); the total can reach about 10^14, so use 64-bit integers.
approach: |
  Simulate with the current floor and a running total. Compute the target for each command
  (current ± x, or y), clamp it to [0, f], add the absolute difference to the total, and move.
  O(m).
reference: |
  import sys
  data = sys.stdin.buffer.read().split()
  f, m = int(data[0]), int(data[1])
  floor = 0
  total = 0
  for i in range(m):
      op, v = data[2 + 2 * i], int(data[3 + 2 * i])
      if op == b"U":
          target = min(f, floor + v)
      elif op == b"D":
          target = max(0, floor - v)
      else:
          target = v
      total += abs(target - floor)
      floor = target
  print(floor, total)
brute: |
  f, m = map(int, input().split())
  floor = total = 0
  for _ in range(m):
      op, v = input().split()
      v = int(v)
      goal = floor + v if op == "U" else floor - v if op == "D" else v
      goal = max(0, min(f, goal))
      while floor != goal:
          floor += 1 if goal > floor else -1
          total += 1
  print(floor, total)
generator: |
  def cases(rng):
      yield "1 1\nD 5"
      yield "5 3\nG 5\nU 1\nG 0"
      f, m = 10**9, 100000
      ops = []
      for _ in range(m):
          kind = rng.choice("UDG")
          ops.append(f"G {rng.randint(0, f)}" if kind == "G" else f"{kind} {rng.randint(0, 10**9)}")
      yield f"{f} {m}\n" + "\n".join(ops)
      for _ in range(4):
          f, m = rng.randint(1, 30), rng.randint(1, 50)
          ops = [f"G {rng.randint(0, f)}" if rng.random() < 0.3 else f"{rng.choice('UD')} {rng.randint(0, 40)}" for _ in range(m)]
          yield f"{f} {m}\n" + "\n".join(ops)
