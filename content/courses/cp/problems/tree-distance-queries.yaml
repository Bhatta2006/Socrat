id: tree-distance-queries
title: Distance queries
concepts: [lca]
difficulty: hard
statement: |
  A tree has `n` nodes; node 1 is the root and node `i > 1` has parent `p[i]`. Answer `q`
  queries: the number of edges on the path between `u` and `v`.
input_format: |
  The first line contains n and q. The second line contains p[2..n]. Each of the next q lines
  contains u and v.
output_format: q lines, each a distance.
constraints:
  - 1 ≤ n, q ≤ 100000
  - 1 ≤ p[i] < i
examples:
  - input: "5 3\n1 1 3 3\n4 5\n2 4\n1 1"
    output: "2\n3\n0"
hints:
  - The path from u to v goes up to some special node and back down. Which node?
  - If you knew that node and all depths, what is the distance formula?
  - Precompute depths and binary-lifting ancestors; distance = depth[u] + depth[v] − 2·depth[lca(u, v)].
approach: |
  Since p[i] < i, depths follow in one forward pass. Build up[k][v] for k < 17, answer each LCA
  in O(log n) by equalising depths and lifting both while ancestors differ, then apply
  depth[u] + depth[v] − 2·depth[lca]. O((n + q) log n).
reference: |
  import sys
  data = sys.stdin.buffer.read().split()
  n, q = int(data[0]), int(data[1])
  par = [0, 1] + [int(x) for x in data[2:2 + n - 1]]
  depth = [0] * (n + 1)
  for i in range(2, n + 1):
      depth[i] = depth[par[i]] + 1
  LOG = max(1, n.bit_length())
  up = [par]
  for k in range(1, LOG):
      prev = up[-1]
      up.append([prev[prev[v]] for v in range(n + 1)])
  def lca(u, v):
      if depth[u] < depth[v]:
          u, v = v, u
      diff = depth[u] - depth[v]
      k = 0
      while diff:
          if diff & 1:
              u = up[k][u]
          diff >>= 1
          k += 1
      if u == v:
          return u
      for k in range(LOG - 1, -1, -1):
          if up[k][u] != up[k][v]:
              u, v = up[k][u], up[k][v]
      return up[0][u]
  out = []
  base = 2 + n - 1
  for j in range(q):
      u, v = int(data[base + 2 * j]), int(data[base + 2 * j + 1])
      out.append(depth[u] + depth[v] - 2 * depth[lca(u, v)])
  print("\n".join(map(str, out)))
