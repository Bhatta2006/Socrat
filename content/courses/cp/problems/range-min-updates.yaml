id: range-min-updates
title: Dynamic range minimum
concepts: [segment-tree]
difficulty: medium
statement: |
  Given an array of `n` integers, process `q` operations:

  - `1 k u` — set `a[k] = u`;
  - `2 a b` — print the minimum of `a[a..b]` (1-indexed, inclusive).
input_format: |
  The first line contains n and q. The second line contains the array. Each of the next q
  lines contains an operation.
output_format: One line per type-2 operation.
constraints:
  - 1 ≤ n, q ≤ 100000
  - 1 ≤ values ≤ 10^9
examples:
  - input: "8 4\n3 2 4 5 1 1 5 3\n2 1 4\n2 5 6\n1 2 3\n2 1 4"
    output: "2\n1\n3"
hints:
  - A Fenwick tree can't subtract minima. Which structure stores the minimum of many ranges and recombines them?
  - How many stored ranges does any query range break into?
  - Build a segment tree of minima; a point update recomputes O(log n) ancestors; a query combines O(log n) nodes.
approach: |
  Iterative segment tree over minima with half-open queries [a − 1, b). Updates walk up from
  the leaf; queries walk two pointers up the tree. O((n + q) log n).
reference: |
  import sys
  data = sys.stdin.buffer.read().split()
  n, q = int(data[0]), int(data[1])
  size = 1
  while size < n:
      size *= 2
  INF = 1 << 62
  t = [INF] * (2 * size)
  for i in range(n):
      t[size + i] = int(data[2 + i])
  for i in range(size - 1, 0, -1):
      t[i] = min(t[2 * i], t[2 * i + 1])
  out = []
  pos = 2 + n
  for _ in range(q):
      op, x, y = int(data[pos]), int(data[pos + 1]), int(data[pos + 2]); pos += 3
      if op == 1:
          i = size + x - 1
          t[i] = y
          i >>= 1
          while i:
              t[i] = min(t[2 * i], t[2 * i + 1])
              i >>= 1
      else:
          res = INF
          l, r = x - 1 + size, y + size
          while l < r:
              if l & 1:
                  res = min(res, t[l]); l += 1
              if r & 1:
                  r -= 1; res = min(res, t[r])
              l >>= 1; r >>= 1
          out.append(res)
  print("\n".join(map(str, out)))
