              ops.append(f"1 {rng.randint(1, n)} {rng.randint(1, 10**9)}")
          else:
              l = rng.randint(1, n)
              ops.append(f"2 {l} {rng.randint(l, n)}")
      ops.append(f"2 1 {n}")
      yield f"{n} {len(ops)}\n{arr}\n" + "\n".join(ops)
