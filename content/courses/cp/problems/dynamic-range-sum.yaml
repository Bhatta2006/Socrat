id: dynamic-range-sum
title: Dynamic range sums
concepts: [fenwick-tree]
difficulty: medium
statement: |
  Given an array of `n` integers, process `q` operations:

  - `1 k u` — set `a[k] = u`;
  - `2 a b` — print the sum of `a[a..b]` (1-indexed, inclusive).
input_format: |
  The first line contains n and q. The second line contains the array. Each of the next q
  lines contains an operation.
output_format: One line per type-2 operation.
constraints:
  - 1 ≤ n, q ≤ 100000
  - -10^9 ≤ values ≤ 10^9
examples:
  - input: "5 4\n3 2 4 5 1\n2 1 3\n1 2 10\n2 1 3\n2 4 5"
    output: "9\n17\n6"
hints:
  - Prefix sums break after every update. What structure supports both updates and prefix sums quickly?
  - A "set" operation is an "add" of what amount?
  - Use a Fenwick tree; for "1 k u" add (u − a[k]) at k and store a[k] = u; for "2 a b" answer prefix(b) − prefix(a − 1).
approach: |
  Fenwick tree over the array (build with n adds or the O(n) linear build). Setting a value
  adds the difference; queries are prefix(b) − prefix(a − 1). O((n + q) log n), 64-bit sums.
reference: |
  import sys
  data = sys.stdin.buffer.read().split()
  n, q = int(data[0]), int(data[1])
  a = [0] + [int(x) for x in data[2:2 + n]]
  t = [0] * (n + 1)
  for i in range(1, n + 1):
      t[i] += a[i]
      j = i + (i & -i)
      if j <= n:
          t[j] += t[i]
  def prefix(i):
      s = 0
      while i > 0:
          s += t[i]
          i -= i & -i
      return s
  out = []
  pos = 2 + n
  for _ in range(q):
      op, x, y = int(data[pos]), int(data[pos + 1]), int(data[pos + 2]); pos += 3
      if op == 1:
          d = y - a[x]
          a[x] = y
          i = x
          while i <= n:
              t[i] += d
              i += i & -i
      else:
          out.append(prefix(y) - prefix(x - 1))
  print("\n".join(map(str, out)))
generator: |
