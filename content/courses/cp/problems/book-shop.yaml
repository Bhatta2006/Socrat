id: book-shop
title: Book shop
concepts: [dp-classics]
difficulty: medium
statement: |
  There are `n` books; book `i` costs `h[i]` and has `s[i]` pages. You have `x` money and may
  buy each book at most once. What is the maximum total number of pages you can buy?
input_format: |
  The first line contains n and x. The second line contains the prices h. The third line
  contains the page counts s.
output_format: The maximum number of pages.
constraints:
  - 1 ≤ n ≤ 200
  - 1 ≤ x ≤ 5000
  - 1 ≤ h[i], s[i] ≤ 1000
examples:
  - input: "4 10\n4 8 5 3\n5 12 8 1"
    output: "13"
    explanation: Buy books 1 and 3 (cost 9, pages 13).
hints:
  - Each book is either bought or not. What do you need to remember about the books decided so far?
  - Let best[c] be the most pages for total cost at most c. How does adding one book change best?
  - 0/1 knapsack - for each book, loop c from x down to h[i] and set best[c] = max(best[c], best[c − h[i]] + s[i]).
approach: |
  0/1 knapsack over money with a 1D table, iterating capacity downwards so each book is used
  at most once. O(n · x) = 10^6.
reference: |
  import sys
  data = sys.stdin.read().split()
  n, x = int(data[0]), int(data[1])
  h = list(map(int, data[2:2 + n]))
  s = list(map(int, data[2 + n:2 + 2 * n]))
  dp = [0] * (x + 1)
  for i in range(n):
      w, v = h[i], s[i]
      for c in range(x, w - 1, -1):
          cand = dp[c - w] + v
          if cand > dp[c]:
              dp[c] = cand
  print(dp[x])
generator: |
  def cases(rng):
      yield "1 1\n2\n5"
      yield "2 5\n5 5\n3 4"
      n, x = 200, 5000
      yield f"{n} {x}\n" + " ".join(str(rng.randint(1, 1000)) for _ in range(n)) + "\n" + " ".join(str(rng.randint(1, 1000)) for _ in range(n))
      n, x = 150, 4000
      yield f"{n} {x}\n" + " ".join(str(rng.randint(1, 60)) for _ in range(n)) + "\n" + " ".join(str(rng.randint(1, 1000)) for _ in range(n))
      for _ in range(5):
          n, x = rng.randint(1, 6), rng.randint(1, 20)
          yield f"{n} {x}\n" + " ".join(str(rng.randint(1, 9)) for _ in range(n)) + "\n" + " ".join(str(rng.randint(1, 9)) for _ in range(n))
