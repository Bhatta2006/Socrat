id: mod-expressions
title: Modular fractions
concepts: [modular-arithmetic]
difficulty: medium
statement: |
  For each query `a b c d`, compute `(a^b − c) / d` modulo `p = 1,000,000,007`, where
  division means multiplication by the modular inverse of `d`. Print a value in
  `[0, p − 1]`.
input_format: |
  The first line contains q. Each of the next q lines contains a, b, c and d.
output_format: q lines, each the result.
constraints:
  - 1 ≤ q ≤ 100000
  - 0 ≤ a, c ≤ 10^18
  - 0 ≤ b ≤ 10^18
  - 1 ≤ d ≤ 10^9 + 6
examples:
  - input: "3\n2 10 24 1000\n3 3 0 9\n5 0 2 1"
    output: "1\n3\n1000000006"
    explanation: "(1024 − 24) / 1000 = 1; 27 / 9 = 3; (1 − 2) mod p = p − 1."
hints:
  - Which of these four operations cannot be done with plain % ?
  - How do you compute a^b when b can be 10^18, and what is the inverse of d modulo a prime?
  - Reduce a and c mod p first; compute a^b with fast exponentiation; subtract with + p; multiply by d^(p−2) mod p.
approach: |
  r = (pow(a mod p, b, p) − c mod p + p) mod p; answer = r · pow(d, p − 2, p) mod p. Both
  powers take O(log) multiplications. Reduce inputs before multiplying to stay within 64
  bits. Note 0^0 = 1 by convention here.
reference: |
  import sys
  P = 10**9 + 7
  data = sys.stdin.buffer.read().split()
  q = int(data[0])
  out = []
  for i in range(q):
      a, b, c, d = (int(x) for x in data[1 + 4 * i:5 + 4 * i])
      r = (pow(a % P, b, P) - c % P) % P
      out.append(r * pow(d, P - 2, P) % P)
  print("\n".join(map(str, out)))
generator: |
  def cases(rng):
      yield "2\n0 0 0 1\n0 5 1 1"
      yield "1\n1000000007 3 1000000007 7"
      q = 22000
      rows = [f"{rng.randint(0, 10**18)} {rng.randint(0, 10**18)} {rng.randint(0, 10**18)} {rng.randint(1, 10**9 + 6)}" for _ in range(q)]
      yield f"{q}\n" + "\n".join(rows)
      for _ in range(5):
          q = rng.randint(1, 4)
          rows = [f"{rng.randint(0, 9)} {rng.randint(0, 9)} {rng.randint(0, 9)} {rng.randint(1, 9)}" for _ in range(q)]
          yield f"{q}\n" + "\n".join(rows)
