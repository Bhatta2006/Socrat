id: binomial-queries
title: Choosing teams
concepts: [combinatorics]
difficulty: medium
statement: |
  Answer `q` queries: each gives `n` and `k`; print `C(n, k)` — the number of ways to
  choose a team of `k` learners from `n` — modulo 1,000,000,007. If `k > n`, the answer is 0.
input_format: |
  The first line contains q. Each of the next q lines contains n and k.
output_format: q lines, each C(n, k) mod 1000000007.
constraints:
  - 1 ≤ q ≤ 100000
  - 0 ≤ n, k ≤ 1000000
examples:
  - input: "4\n5 2\n10 0\n3 5\n1000000 500000"
    output: "10\n1\n0\n996692777"
hints:
  - Computing factorials from scratch per query is O(n) each — too slow. What can be shared across queries?
  - Division modulo a prime needs inverses. Can you get all inverse factorials from a single inverse?
  - Precompute fact[] up to 10^6, invFact[N] = fact[N]^(p−2), then invFact[i−1] = invFact[i]·i; answer fact[n]·invFact[k]·invFact[n−k].
approach: |
  Precompute factorials and inverse factorials up to the maximum n in O(N + log p); each
  query is O(1). Return 0 when k > n. All arithmetic modulo 1e9+7 with 64-bit products.
reference: |
  import sys
  MOD = 10**9 + 7
  data = sys.stdin.buffer.read().split()
  q = int(data[0])
  qs = [(int(data[1 + 2 * i]), int(data[2 + 2 * i])) for i in range(q)]
  N = max(max(n for n, _ in qs), 1)
  fact = [1] * (N + 1)
  for i in range(1, N + 1):
      fact[i] = fact[i - 1] * i % MOD
  inv = [1] * (N + 1)
  inv[N] = pow(fact[N], MOD - 2, MOD)
  for i in range(N, 0, -1):
      inv[i - 1] = inv[i] * i % MOD
  out = []
  for n, k in qs:
      out.append(0 if k > n else fact[n] * inv[k] % MOD * inv[n - k] % MOD)
  print("\n".join(map(str, out)))
generator: |
  def cases(rng):
      yield "3\n0 0\n0 1\n1 1"
      yield "1\n1000000 1"
      q = 80000
      rows = []
      for _ in range(q):
          n = rng.randint(0, 1000000)
          rows.append(f"{n} {rng.randint(0, n + 3)}")
      yield f"{q}\n" + "\n".join(rows)
      for _ in range(5):
          q = rng.randint(1, 5)
          yield f"{q}\n" + "\n".join(f"{rng.randint(0, 12)} {rng.randint(0, 12)}" for _ in range(q))
