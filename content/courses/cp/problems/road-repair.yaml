id: road-repair
title: Road repair
concepts: [mst]
difficulty: medium
statement: |
  There are `n` cities and `m` damaged roads; repairing road `i` between `a` and `b` costs
  `c`. Choose roads to repair so every city can reach every other city, minimising the total
  cost. Print the minimum cost, or `IMPOSSIBLE` if the cities cannot all be connected.
input_format: |
  The first line contains n and m. Each of the next m lines contains a, b and c.
output_format: The minimum total cost, or IMPOSSIBLE.
constraints:
  - 1 ≤ n ≤ 100000
  - 1 ≤ m ≤ 200000
  - 1 ≤ c ≤ 10^9
examples:
  - input: "5 6\n1 2 3\n2 3 5\n2 4 2\n3 4 8\n5 1 7\n5 4 4"
    output: "14"
hints:
  - Which road is always safe to repair first?
  - When does adding a road waste money? How can you check that quickly?
  - Kruskal - sort roads by cost and take each one that joins two different DSU components; if fewer than n − 1 are taken, print IMPOSSIBLE.
approach: |
  Kruskal's MST: sort edges by cost, union endpoints with DSU when they are in different
  components, add the cost. If the number of accepted edges is less than n − 1 the graph is
  disconnected. O(m log m); 64-bit total.
reference: |
  import sys
  data = sys.stdin.buffer.read().split()
  n, m = int(data[0]), int(data[1])
  edges = sorted((int(data[4 + 3 * i]), int(data[2 + 3 * i]), int(data[3 + 3 * i])) for i in range(m))
  parent = list(range(n + 1))
  def find(x):
      while parent[x] != x:
          parent[x] = parent[parent[x]]
          x = parent[x]
      return x
  total = used = 0
  for c, a, b in edges:
      ra, rb = find(a), find(b)
      if ra != rb:
          parent[ra] = rb
          total += c
          used += 1
  print(total if used == n - 1 else "IMPOSSIBLE")
generator: |
  def cases(rng):
      yield "1 1\n1 1 5"
      yield "3 1\n1 2 4"
      n, m = 50000, 90000
      edges = [f"{i} {rng.randint(1, i - 1)} {rng.randint(1, 10**9)}" for i in range(2, n + 1)]
      while len(edges) < m:
          edges.append(f"{rng.randint(1, n)} {rng.randint(1, n)} {rng.randint(1, 10**9)}")
      rng.shuffle(edges)
      yield f"{n} {m}\n" + "\n".join(edges)
      for _ in range(5):
          n, m = rng.randint(1, 6), rng.randint(1, 8)
          yield f"{n} {m}\n" + "\n".join(f"{rng.randint(1, n)} {rng.randint(1, n)} {rng.randint(1, 9)}" for _ in range(m))
