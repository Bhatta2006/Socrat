id: closest-subset-sum
title: Packing the van
concepts: [complete-search]
difficulty: medium
statement: |
  A van can carry at most `c` kilograms. There are `n` boxes with weights `w_i`. Choose any set
  of boxes (possibly none) whose total weight is at most `c` and as large as possible. Print
  that total.
input_format: |
  The first line contains n and c. The second line contains the n weights.
output_format: The largest total weight not exceeding c.
constraints:
  - 1 ≤ n ≤ 20
  - 1 ≤ c ≤ 10^12
  - 1 ≤ w_i ≤ 10^11
examples:
  - input: "4 10\n4 6 7 3"
    output: "10"
  - input: "3 5\n6 7 8"
    output: "0"
hints:
  - With n ≤ 20, how many different sets of boxes are there? Is checking all of them fast enough?
  - Each set corresponds to a number from 0 to 2^n - 1. What does bit i of that number tell you?
  - Loop over every mask, sum the weights whose bit is set, and keep the best sum that is ≤ c. Faster - build all 2^n sums incrementally from mask without its lowest bit.
approach: |
  Complete search over all 2^n subsets. Compute subset sums incrementally - sum[mask] =
  sum[mask without its lowest set bit] + weight of that bit - so the whole search is O(2^n), about
  10^6 steps, and keep the largest sum ≤ c.
reference: |
  n, c = map(int, input().split())
  w = list(map(int, input().split()))
  sums = [0] * (1 << n)
  best = 0
  for mask in range(1, 1 << n):
      low = mask & -mask
      s = sums[mask ^ low] + w[low.bit_length() - 1]
      sums[mask] = s
      if best < s <= c:
          best = s
  print(best)
brute: |
  from itertools import combinations
  n, c = map(int, input().split())
  w = list(map(int, input().split()))
  best = 0
  for k in range(n + 1):
      for combo in combinations(w, k):
          if best < sum(combo) <= c:
              best = sum(combo)
  print(best)
generator: |
  def cases(rng):
      yield "1 1\n1"
      yield "1 1\n2"
      n = 20
      yield f"{n} {10**12}\n" + " ".join(str(rng.randint(1, 10**11)) for _ in range(n))
      yield f"{n} 999999999999\n" + " ".join(str(rng.randint(10**10, 10**11)) for _ in range(n))
      yield f"{n} 1000\n" + " ".join(str(rng.randint(1, 200)) for _ in range(n))
      for _ in range(4):
          n = rng.randint(1, 20)
          yield f"{n} {rng.randint(1, 500)}\n" + " ".join(str(rng.randint(1, 100)) for _ in range(n))
