id: sum-of-distances
title: Sum of distances
concepts: [tree-techniques]
difficulty: hard
statement: |
  A tree has `n` nodes connected by `n − 1` edges. For **every** node, print the sum of its
  distances (in edges) to all other nodes.
input_format: |
  The first line contains n. Each of the next n − 1 lines contains an edge a b.
output_format: n numbers separated by spaces.
constraints:
  - 1 ≤ n ≤ 200000
examples:
  - input: "5\n1 2\n1 3\n3 4\n3 5"
    output: "6 9 5 8 8"
hints:
  - BFS from every node is O(n²). Can you compute the answer for one root and then move the root cheaply?
  - When the root moves from a parent to its child c, which nodes get one step closer and which get one step farther?
  - Compute ans[1] and subtree sizes; then ans[c] = ans[parent] + n − 2·size[c], processing nodes top-down in BFS order.
approach: |
  Root at 1. One bottom-up pass computes subtree sizes and ans[1] (sum of depths). Moving the
  root to child c brings size[c] nodes one step closer and n − size[c] nodes one step farther:
  ans[c] = ans[p] + n − 2·size[c]. Iterative BFS order; O(n); 64-bit sums.
reference: |
  import sys
  data = sys.stdin.buffer.read().split()
  n = int(data[0])
  adj = [[] for _ in range(n + 1)]
  for i in range(n - 1):
      a, b = int(data[1 + 2 * i]), int(data[2 + 2 * i])
      adj[a].append(b); adj[b].append(a)
  parent = [0] * (n + 1)
  depth = [0] * (n + 1)
  parent[1] = -1
  order = [1]
  for u in order:
      for v in adj[u]:
          if v != parent[u]:
              parent[v] = u
              depth[v] = depth[u] + 1
              order.append(v)
  size = [1] * (n + 1)
  for u in reversed(order):
      if parent[u] > 0:
          size[parent[u]] += size[u]
  ans = [0] * (n + 1)
  ans[1] = sum(depth)
  for u in order[1:]:
      ans[u] = ans[parent[u]] + n - 2 * size[u]
  print(" ".join(map(str, ans[1:])))
