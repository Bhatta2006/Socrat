id: range-add
title: Range additions
concepts: [prefix-difference]
difficulty: easy
statement: |
  Start with an array of `n` zeros. Apply `q` operations `l r v`: add `v` to every element
  with index in `[l, r]` (1-indexed). Then print the final array.
input_format: |
  The first line contains n and q. Each of the next q lines contains l, r and v.
output_format: The n final values separated by spaces.
constraints:
  - 1 ≤ n, q ≤ 200000
  - 1 ≤ l ≤ r ≤ n
  - -10^9 ≤ v ≤ 10^9
examples:
  - input: "5 3\n1 3 2\n2 5 -1\n3 3 10"
    output: "2 1 11 -1 -1"
hints:
  - Applying each update element by element can take 4·10^10 steps. What if each update only touched two places?
  - What array, when prefix-summed, adds v from l through r and nothing elsewhere?
  - diff[l] += v and diff[r + 1] −= v for each update; the answer is the running prefix sum of diff. Use 64-bit values.
approach: |
  Difference array: diff[l] += v, diff[r + 1] −= v. After all updates the prefix sums of diff
  are the final values. O(n + q). Values reach 2·10^14 — 64-bit.
reference: |
  import sys
  data = sys.stdin.buffer.read().split()
  n, q = int(data[0]), int(data[1])
  diff = [0] * (n + 2)
  for i in range(q):
      l, r, v = int(data[2 + 3 * i]), int(data[3 + 3 * i]), int(data[4 + 3 * i])
      diff[l] += v
      diff[r + 1] -= v
  out = []
  run = 0
  for i in range(1, n + 1):
      run += diff[i]
      out.append(run)
  print(" ".join(map(str, out)))
generator: |
  def cases(rng):
      yield "1 1\n1 1 -1000000000"
      yield "3 2\n1 3 1000000000\n1 3 1000000000"
      n, q = 50000, 50000
      rows = []
      for _ in range(q):
          l = rng.randint(1, n)
          rows.append(f"{l} {rng.randint(l, n)} {rng.randint(-10**9, 10**9)}")
      yield f"{n} {q}\n" + "\n".join(rows)
      for _ in range(5):
          n, q = rng.randint(1, 8), rng.randint(1, 5)
          rows = []
          for _ in range(q):
              l = rng.randint(1, n)
              rows.append(f"{l} {rng.randint(l, n)} {rng.randint(-5, 5)}")
          yield f"{n} {q}\n" + "\n".join(rows)
