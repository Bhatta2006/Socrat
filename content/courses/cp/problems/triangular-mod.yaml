id: triangular-mod
title: Huge staircase totals
concepts: [modular-arithmetic]
difficulty: medium
statement: |
  Building a staircase of `n` steps needs `1 + 2 + … + n` bricks. For each query `n`, print that
  number modulo 1 000 000 007. `n` can be as large as 10^18, so the true answer does not fit in
  64 bits.
input_format: |
  The first line contains q. Each of the next q lines contains one whole number n.
output_format: q lines, each (1 + 2 + … + n) mod 1 000 000 007.
constraints:
  - 1 ≤ q ≤ 5·10^4
  - 1 ≤ n ≤ 10^18
examples:
  - input: "3\n4\n1000000007\n1000000000000000000"
    output: "10\n0\n1225"
hints:
  - The sum is n(n + 1) / 2. Why can't you compute n(n + 1) directly in 64 bits?
  - You may reduce factors modulo p before multiplying, but division by 2 needs care. Which of n and n + 1 is even?
  - Divide the even one of n, n + 1 by 2 first, then multiply the two factors modulo p (each reduced mod p first). Or multiply by the modular inverse of 2, which is 500000004.
approach: |
  Exactly one of n, n + 1 is even: halve it, reduce both factors mod p = 10^9 + 7, and multiply mod
  p. Each reduced factor is below p, so their product is below about 10^18 and fits in a
  signed 64-bit integer. Equivalently compute (n mod p)·((n+1) mod p)·inv2 mod p with inv2 = 500000004.
reference: |
  import sys
  P = 10**9 + 7
  data = sys.stdin.buffer.read().split()
  q = int(data[0])
  out = []
  for n in map(int, data[1:1 + q]):
      a, b = n, n + 1
      if a % 2 == 0:
          a //= 2
      else:
          b //= 2
      out.append(a % P * (b % P) % P)
  print("\n".join(map(str, out)))
brute: |
  q = int(input())
  for _ in range(q):
      n = int(input())
      print(n * (n + 1) // 2 % (10**9 + 7))
generator: |
  def cases(rng):
      special = [1, 2, 10**9 + 6, 10**9 + 7, 2 * (10**9 + 7) - 1, 10**18, 10**18 - 1]
      yield f"{len(special)}\n" + "\n".join(map(str, special))
      q = 50000
      yield f"{q}\n" + "\n".join(str(rng.randint(1, 10**18)) for _ in range(q))
      yield f"{q}\n" + "\n".join(str(rng.randint(1, 10**9)) for _ in range(q))
      yield "5\n" + "\n".join(str(k * (10**9 + 7) + rng.choice([-1, 0, 1])) for k in range(1, 6))
