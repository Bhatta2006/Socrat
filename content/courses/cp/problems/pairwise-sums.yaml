id: pairwise-sums
title: A million additions
concepts: [fast-io]
difficulty: easy
statement: |
  Print `a + b` for each of `t` pairs. The arithmetic is trivial; the point is handling a very
  large input and output quickly. Reading line by line with `input()` / `cin` without
  synchronisation turned off / `Scanner` is too slow here.
input_format: |
  The first line contains t. Each of the next t lines contains two whole numbers a and b.
output_format: t lines, each the sum a + b.
constraints:
  - 1 ≤ t ≤ 5·10^4
  - -10^6 ≤ a, b ≤ 10^6
examples:
  - input: "3\n1 2\n-5 5\n1000000 1000000"
    output: "3\n0\n2000000"
hints:
  - Where does the time go when you call a read function 100,000 times and print 50,000 times?
  - Read the whole input at once and split it; build all output lines and print them once.
  - 'Python: data = sys.stdin.buffer.read().split() and one sys.stdout.write("\n".join(...)). C++: ios::sync_with_stdio(false); cin.tie(nullptr). Java: a buffered tokenizer and a StringBuilder.'
approach: |
  Read all tokens in one call, compute every sum, and write the output in one call.
reference: |
  import sys
  data = sys.stdin.buffer.read().split()
  t = int(data[0])
  out = [str(int(data[1 + 2 * i]) + int(data[2 + 2 * i])) for i in range(t)]
  sys.stdout.write("\n".join(out) + "\n")
brute: |
  t = int(input())
  for _ in range(t):
      a, b = input().split()
      print(int(a) + int(b))
generator: |
  def cases(rng):
      yield "1\n-1000000 -1000000"
      t = 50000
      yield f"{t}\n" + "\n".join(f"{rng.randint(-10**6, 10**6)} {rng.randint(-10**6, 10**6)}" for _ in range(t))
      yield f"{t}\n" + "\n".join(f"{rng.randint(-9, 9)} {rng.randint(-9, 9)}" for _ in range(t))
small_generator: |
  def cases(rng):
      for _ in range(300):
          t = rng.randint(1, 5)
          yield f"{t}\n" + "\n".join(f"{rng.randint(-100, 100)} {rng.randint(-100, 100)}" for _ in range(t))
