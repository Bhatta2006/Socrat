id: pattern-count
title: Pattern occurrences
concepts: [kmp]
difficulty: medium
statement: |
  Count how many times the pattern occurs in the text (occurrences may overlap).
input_format: Two lines - the text, then the pattern (lowercase letters).
output_format: The number of occurrences.
constraints:
  - 1 ≤ |text|, |pattern| ≤ 1000000
examples:
  - input: "saippuakauppias\npp"
    output: "2"
  - input: "aaaaa\naa"
    output: "4"
    explanation: Overlapping matches all count.
hints:
  - Checking the pattern at every position can be O(n·m). What could you reuse from a failed comparison?
  - What does the longest border of the matched prefix tell you about where the next match could start?
  - Compute the prefix function of pattern + '#' + text and count positions where it equals the pattern length.
approach: |
  KMP - build π for pattern + '#' + text in O(n + m) and count entries equal to |pattern|.
  (Polynomial hashing also works but is probabilistic.)
reference: |
  import sys
  lines = sys.stdin.read().split()
  text, pat = lines[0], lines[1]
  s = pat + "#" + text
  pi = [0] * len(s)
  m = len(pat)
  count = 0
  for i in range(1, len(s)):
      k = pi[i - 1]
      while k > 0 and s[i] != s[k]:
          k = pi[k - 1]
      if s[i] == s[k]:
          k += 1
      pi[i] = k
      if k == m:
          count += 1
  print(count)
generator: |
  def cases(rng):
      yield "a\nb"
      yield "a\naa"
      yield "abc\nabc"
      yield "a" * 400000 + "\n" + "a" * 1000
      yield "".join(rng.choice("ab") for _ in range(400000)) + "\n" + "abab"
      yield "".join(rng.choice("abc") for _ in range(300000)) + "\n" + "".join(rng.choice("abc") for _ in range(8))
      for _ in range(5):
          yield "".join(rng.choice("ab") for _ in range(rng.randint(1, 15))) + "\n" + "".join(rng.choice("ab") for _ in range(rng.randint(1, 3)))
