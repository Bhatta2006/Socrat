id: sum-big
title: Many test cases
concepts: [fast-io]
difficulty: easy
statement: |
  There are `t` test cases. Each gives an array of `n` integers; print the sum of the array
  and the maximum product of two **different positions** `a[i] · a[j]` (i ≠ j).

  The sum of `n` over all test cases does not exceed 2·10^5. Watch the input speed and the
  integer sizes.
input_format: |
  The first line contains t. Each test case has a line with n followed by a line with n
  integers.
output_format: For each test case, the sum and the maximum pair product separated by a space.
constraints:
  - 1 ≤ t ≤ 10^4
  - 2 ≤ n, sum of n ≤ 2·10^5
  - -10^9 ≤ a[i] ≤ 10^9
examples:
  - input: "2\n3\n1 2 3\n4\n-5 -6 1 2"
    output: "6 6\n-8 30"
    explanation: "In the second case (-5)·(-6) = 30 beats 1·2."
hints:
  - Sorting is fine, but which few values can form the maximum product?
  - Negative numbers matter. Which two elements could give a large positive product besides the two largest?
  - The answer is the max of (largest × second largest) and (smallest × second smallest). Use 64-bit arithmetic and fast I/O.
approach: |
  For each case, compute the sum (64-bit) and track the two largest and two smallest
  values; the best product is max(max1·max2, min1·min2). Products reach 10^18 — fits in a
  signed 64-bit integer. Read all input at once. O(sum n).
reference: |
  import sys
  data = sys.stdin.buffer.read().split()
  t = int(data[0]); pos = 1
  out = []
  for _ in range(t):
      n = int(data[pos]); pos += 1
      a = sorted(map(int, data[pos:pos + n])); pos += n
      out.append(f"{sum(a)} {max(a[0] * a[1], a[-1] * a[-2])}")
  print("\n".join(out))
generator: |
  def cases(rng):
      yield "1\n2\n-1000000000 -1000000000"
      yield "1\n2\n1000000000 -1000000000"
      t = 10000
      rows = []
      for _ in range(t):
          n = 2
          rows.append(f"{n}\n{rng.randint(-10**9, 10**9)} {rng.randint(-10**9, 10**9)}")
      yield f"{t}\n" + "\n".join(rows)
      n = 90000
      yield f"1\n{n}\n" + " ".join(str(rng.randint(-10**9, 10**9)) for _ in range(n))
      for _ in range(5):
          t = rng.randint(1, 4)
          rows = []
          for _ in range(t):
              n = rng.randint(2, 6)
              rows.append(f"{n}\n" + " ".join(str(rng.randint(-9, 9)) for _ in range(n)))
          yield f"{t}\n" + "\n".join(rows)
