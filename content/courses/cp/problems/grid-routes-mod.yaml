id: grid-routes-mod
title: Routes across the city grid
concepts: [combinatorics]
difficulty: medium
statement: |
  A courier walks from the top-left corner of a city grid to the corner `r` blocks down and `c`
  blocks to the right, moving only down or right along the streets. For each query, print the
  number of different routes modulo 1 000 000 007.
input_format: |
  The first line contains q. Each of the next q lines contains r and c.
output_format: q lines, each the number of routes modulo 1 000 000 007.
constraints:
  - 1 ≤ q ≤ 5·10^4
  - 0 ≤ r, c ≤ 10^6
examples:
  - input: "3\n2 2\n0 5\n1000000 1000000"
    output: "6\n1\n192151600"
hints:
  - Every route is a sequence of r downs and c rights. How many such sequences are there?
  - C(r + c, r) needs factorials up to 2·10^6. How do you divide modulo a prime?
  - Precompute factorials and inverse factorials up to 2·10^6 once (inverse via Fermat - x^(p-2) mod p), then each answer is fact[r+c] · inv[r] · inv[c] mod p.
approach: |
  A route is an arrangement of r downs and c rights, so the count is C(r + c, r). Precompute
  fact[i] and invfact[i] for i ≤ max(r + c) (inverse of the last factorial by Fermat's little
  theorem, then invfact[i-1] = invfact[i]·i). Each query is O(1).
reference: |
  import sys
  P = 10**9 + 7
  data = sys.stdin.buffer.read().split()
  q = int(data[0])
  pairs = [(int(data[1 + 2 * i]), int(data[2 + 2 * i])) for i in range(q)]
  top = max(r + c for r, c in pairs)
  fact = [1] * (top + 1)
  for i in range(1, top + 1):
      fact[i] = fact[i - 1] * i % P
  inv = [1] * (top + 1)
  inv[top] = pow(fact[top], P - 2, P)
  for i in range(top, 0, -1):
      inv[i - 1] = inv[i] * i % P
  print("\n".join(str(fact[r + c] * inv[r] % P * inv[c] % P) for r, c in pairs))
brute: |
  from math import comb
  q = int(input())
  for _ in range(q):
      r, c = map(int, input().split())
      print(comb(r + c, r) % (10**9 + 7))
