      yield f"{n} {m}\n" + " ".join(str(rng.randint(1, 50)) for _ in range(n)) + "\n" + " ".join(str(rng.randint(1, 50)) for _ in range(m))
      for _ in range(5):
          n, m = rng.randint(1, 6), rng.randint(1, 6)
