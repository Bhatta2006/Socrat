id: ticket-matching
title: Ticket desk
concepts: [greedy-cp]
difficulty: hard
statement: |
  There are `n` tickets with prices `h[i]`. Then `m` customers arrive one by one; customer
  `j` has a budget `b[j]` and buys the **most expensive remaining ticket whose price does not
  exceed the budget**. For each customer, print the price paid, or `-1` if no ticket fits.
  A ticket can be sold only once.
input_format: |
  The first line contains n and m. The second line contains the n prices. The third line
  contains the m budgets in arrival order.
output_format: m lines, each a price or -1.
constraints:
  - 1 ≤ n, m ≤ 200000
  - 1 ≤ h[i], b[j] ≤ 10^9
examples:
  - input: "5 3\n5 3 7 8 5\n4 8 3"
    output: "3\n8\n-1"
hints:
  - For one customer, which ticket should they get, and how would you find it quickly in sorted prices?
  - After a ticket is sold it must disappear. Which structure supports "largest ≤ x" and deletion in O(log n)?
  - Use a sorted multiset (C++ multiset upper_bound then step back; Java TreeMap floorKey with counts), or a sorted array with a DSU that skips sold positions.
approach: |
  Keep prices in a sorted multiset. For budget b, find the largest price ≤ b (C++:
  prev(upper_bound(b)); Java: TreeMap.floorKey(b) with counts), print it and remove one
  copy. In Python, sort the prices and use "next unsold to the left" pointers with path
  compression (a DSU on indices) to skip sold tickets. O((n + m) log n).
reference: |
  import sys
  from bisect import bisect_right
  data = sys.stdin.buffer.read().split()
  n, m = int(data[0]), int(data[1])
  h = sorted(map(int, data[2:2 + n]))
  parent = list(range(n + 1))   # index i+1 represents ticket i; 0 = none left
  def find(x):
      while parent[x] != x:
          parent[x] = parent[parent[x]]
          x = parent[x]
      return x
  out = []
  for j in range(m):
      b = int(data[2 + n + j])
      pos = find(bisect_right(h, b))
      if pos == 0:
          out.append(-1)
      else:
          out.append(h[pos - 1])
          parent[pos] = pos - 1
  print("\n".join(map(str, out)))
generator: |
