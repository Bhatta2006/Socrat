id: prime-count-queries
title: Primes in a range
concepts: [number-theory]
difficulty: medium
statement: |
  Answer `q` queries: each gives `l` and `r`; print how many primes lie in `[l, r]`.
input_format: |
  The first line contains q. Each of the next q lines contains l and r.
output_format: q lines, each a count.
constraints:
  - 1 ≤ q ≤ 100000
  - 1 ≤ l ≤ r ≤ 2000000
examples:
  - input: "3\n1 10\n11 19\n20 22"
    output: "4\n4\n0"
hints:
  - Testing every number in every range is far too slow. What could you compute once for all numbers up to 2·10^6?
  - After you know which numbers are prime, how do you count primes in any range in O(1)?
  - Sieve up to 2·10^6, build prefix counts pc[x] = number of primes ≤ x, and answer pc[r] − pc[l − 1].
approach: |
  Sieve of Eratosthenes up to the maximum r, then a prefix count array. Each query is
  pc[r] − pc[l − 1]. O(N log log N + q).
reference: |
  import sys
  data = sys.stdin.buffer.read().split()
  q = int(data[0])
  qs = [(int(data[1 + 2 * i]), int(data[2 + 2 * i])) for i in range(q)]
  N = max(r for _, r in qs)
  is_prime = bytearray([1]) * (N + 1)
  is_prime[0] = 0
  if N >= 1:
      is_prime[1] = 0
  p = 2
  while p * p <= N:
      if is_prime[p]:
          is_prime[p * p :: p] = bytearray(len(range(p * p, N + 1, p)))
      p += 1
  pc = [0] * (N + 1)
  c = 0
  for i in range(N + 1):
      c += is_prime[i]
      pc[i] = c
  print("\n".join(str(pc[r] - pc[l - 1]) for l, r in qs))
generator: |
  def cases(rng):
      yield "2\n1 1\n2 2"
      yield "1\n1 2000000"
      q = 90000
      rows = []
      for _ in range(q):
          a, b = sorted((rng.randint(1, 2000000), rng.randint(1, 2000000)))
          rows.append(f"{a} {b}")
      yield f"{q}\n" + "\n".join(rows)
      for _ in range(5):
          q = rng.randint(1, 5)
          rows = []
          for _ in range(q):
              a, b = sorted((rng.randint(1, 60), rng.randint(1, 60)))
              rows.append(f"{a} {b}")
          yield f"{q}\n" + "\n".join(rows)
