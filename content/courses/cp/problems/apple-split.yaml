id: apple-split
title: Fair split
concepts: [complete-search]
difficulty: easy
statement: |
  Split `n` weights into two groups so that the difference between the group totals is as
  small as possible. Print that minimum difference. A group may be empty.
input_format: |
  The first line contains n. The second line contains n weights.
output_format: The minimum possible difference.
constraints:
  - 1 ≤ n ≤ 18
  - 1 ≤ weight ≤ 10^9
examples:
  - input: "5\n3 2 7 4 1"
    output: "1"
    explanation: "{2, 7} vs {3, 4, 1}: 9 vs 8."
  - input: "1\n10"
    output: "10"
hints:
  - n is at most 18. How many ways are there to assign every weight to one of two groups?
  - If one group's total is S and the overall total is T, what is the difference?
  - Enumerate every subset (bitmask or recursion) as group A; the difference is |T − 2·sum(A)|; take the minimum. Use 64-bit sums.
approach: |
  Complete search over 2^n subsets. For each subset with sum s, the difference is
  |T − 2s|. Recursion that carries the running sum costs O(2^n) total. Weights sum to
  1.8·10^10, so use 64-bit integers.
reference: |
  import sys
  data = sys.stdin.read().split()
  n = int(data[0])
  w = list(map(int, data[1:1 + n]))
  total = sum(w)
  sums = [0]
  for x in w:
      sums += [s + x for s in sums]
  print(min(abs(total - 2 * s) for s in sums))
generator: |
  def cases(rng):
      yield "2\n1 1"
      yield "3\n1000000000 1000000000 1"
      yield "18\n" + " ".join(str(rng.randint(1, 10**9)) for _ in range(18))
      yield "18\n" + " ".join(str(2 ** i) for i in range(18))
      for _ in range(6):
          n = rng.randint(1, 8)
          yield f"{n}\n" + " ".join(str(rng.randint(1, 20)) for _ in range(n))
