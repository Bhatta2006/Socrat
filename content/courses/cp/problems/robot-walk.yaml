id: robot-walk
title: Robot on a grid
concepts: [simulation]
difficulty: medium
statement: |
  A robot stands on cell (1, 1) of an `n × m` grid facing **east** (towards increasing
  column). Some cells are walls `#`; the start is always open `.`. It executes a command
  string of `L` (turn left 90°), `R` (turn right 90°) and `F` (move one cell forward).
  If a forward move would leave the grid or enter a wall, the robot stays in place.

  Print the robot's final row and column and the number of **distinct** cells it visited
  (including the start).
input_format: |
  The first line contains n and m. Then n grid lines follow. The last line contains the
  command string.
output_format: Three numbers - final row, final column, distinct cells visited.
constraints:
  - 1 ≤ n, m ≤ 1000
  - 1 ≤ length of commands ≤ 200000
examples:
  - input: "3 4\n....\n.#..\n....\nFFRFFLF"
    output: "3 4 6"
    explanation: "(1,1)→(1,2)→(1,3), turn to face south, →(2,3)→(3,3), turn to face east, →(3,4)."
hints:
  - What variables completely describe the robot at any moment?
  - How can direction arrays and modular arithmetic replace a chain of ifs for turning and moving?
  - Keep (r, c, d); L is d = (d+3)%4, R is d = (d+1)%4; on F compute the next cell and move only if it's inside and not '#'. Track visited cells in a set or boolean grid.
approach: |
  State (r, c, d) with d indexing direction arrays starting at east. Process each command in
  O(1); mark visited cells in a boolean grid and count first visits. O(n·m + length).
reference: |
  import sys
  data = sys.stdin.read().split()
  n, m = int(data[0]), int(data[1])
  g = data[2:2 + n]
  cmds = data[2 + n] if len(data) > 2 + n else ""
  dr = [0, 1, 0, -1]
  dc = [1, 0, -1, 0]
  r = c = d = 0
  seen = {(0, 0)}
  for ch in cmds:
      if ch == "L":
          d = (d + 3) % 4
      elif ch == "R":
          d = (d + 1) % 4
      else:
          nr, nc = r + dr[d], c + dc[d]
          if 0 <= nr < n and 0 <= nc < m and g[nr][nc] != "#":
              r, c = nr, nc
              seen.add((r, c))
  print(r + 1, c + 1, len(seen))
generator: |
  def cases(rng):
      yield "1 1\n.\nFFLRF"
      yield "2 2\n.#\n..\nFRFLFF"
      n = m = 400
      grid = ["".join("#" if rng.random() < 0.15 else "." for _ in range(m)) for _ in range(n)]
      grid[0] = "." + grid[0][1:]
      cmds = "".join(rng.choice("FFFLR") for _ in range(200000))
      yield f"{n} {m}\n" + "\n".join(grid) + "\n" + cmds
      yield "3 3\n...\n...\n...\n" + "F" * 50
      for _ in range(5):
          n, m = rng.randint(1, 5), rng.randint(1, 5)
          grid = ["".join("#" if rng.random() < 0.2 else "." for _ in range(m)) for _ in range(n)]
          grid[0] = "." + grid[0][1:]
          yield f"{n} {m}\n" + "\n".join(grid) + "\n" + "".join(rng.choice("FLR") for _ in range(rng.randint(1, 15)))
