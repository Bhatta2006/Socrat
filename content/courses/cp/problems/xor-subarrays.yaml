id: xor-subarrays
title: Subarrays with XOR k
concepts: [bitmasks]
difficulty: medium
statement: |
  Count the contiguous, non-empty subarrays whose bitwise XOR equals `k`.
input_format: |
  The first line contains n and k. The second line contains n non-negative integers.
output_format: The number of subarrays.
constraints:
  - 1 ≤ n ≤ 200000
  - 0 ≤ a[i], k < 2^30
examples:
  - input: "5 6\n4 2 2 6 4"
    output: "4"
    explanation: "[4, 2], [4, 2, 2, 6, 4], [2, 2, 6] and [6]."
  - input: "3 0\n0 0 0"
    output: "6"
hints:
  - How can you get the XOR of any subarray from two prefix values?
  - If px[r+1] ^ px[l] must equal k, what must px[l] equal for a fixed right end?
  - Scan prefix XORs, keeping counts in a hash map seeded with {0 → 1}; add count[current ^ k] each step.
approach: |
  With prefix XOR px, subarray (l, r) has XOR px[r+1] ^ px[l]. It equals k exactly when
  px[l] = px[r+1] ^ k. Count earlier prefix values with a hash map. O(n).
reference: |
  import sys
  data = sys.stdin.buffer.read().split()
  n, k = int(data[0]), int(data[1])
  seen = {0: 1}
  cur = ans = 0
  for i in range(n):
      cur ^= int(data[2 + i])
      ans += seen.get(cur ^ k, 0)
      seen[cur] = seen.get(cur, 0) + 1
  print(ans)
generator: |
  def cases(rng):
      yield "1 5\n5"
      yield "1 5\n4"
      n = 150000
      yield f"{n} 0\n" + " ".join("0" for _ in range(n))
      yield f"{n} 7\n" + " ".join(str(rng.randint(0, 15)) for _ in range(n))
      yield f"{n} 123456\n" + " ".join(str(rng.randint(0, 2**30 - 1)) for _ in range(n))
      for _ in range(5):
          n = rng.randint(1, 10)
          yield f"{n} {rng.randint(0, 7)}\n" + " ".join(str(rng.randint(0, 7)) for _ in range(n))
