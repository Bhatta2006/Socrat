id: nearest-exit
title: Distance to the nearest exit
concepts: [graph-techniques]
difficulty: medium
statement: |
  A building map has `r` rows and `c` columns: `#` walls, `.` floor, and `E` exits. For
  every non-wall cell, find the minimum number of up/down/left/right steps to reach **any**
  exit. Print the grid of distances: walls as `#`, unreachable floor cells as `-1`, values
  separated by spaces.
input_format: |
  The first line contains r and c. Then r lines with c characters follow.
output_format: r lines with c entries each, separated by spaces.
constraints:
  - 1 ≤ r, c ≤ 400
examples:
  - input: "3 4\nE..#\n.#..\n...E"
    output: "0 1 2 #\n1 # 2 1\n2 2 1 0"
hints:
  - Running a BFS from every exit is too slow when there are many exits. What if all exits started at once?
  - What should the queue contain at time 0?
  - Multi-source BFS - enqueue every E with distance 0, then expand normally; unreached floor stays −1.
approach: |
  Initialise dist = −1 everywhere, set every exit to 0 and enqueue them all, then BFS over
  floor cells. Each cell is processed once — O(r·c) regardless of the number of exits.
reference: |
  import sys
  from collections import deque
  data = sys.stdin.read().split()
  r, c = int(data[0]), int(data[1])
  g = data[2:2 + r]
  dist = [[-1] * c for _ in range(r)]
  q = deque()
  for i in range(r):
      for j in range(c):
          if g[i][j] == "E":
              dist[i][j] = 0
              q.append((i, j))
  while q:
      x, y = q.popleft()
      for nx, ny in ((x + 1, y), (x - 1, y), (x, y + 1), (x, y - 1)):
          if 0 <= nx < r and 0 <= ny < c and g[nx][ny] != "#" and dist[nx][ny] == -1:
              dist[nx][ny] = dist[x][y] + 1
              q.append((nx, ny))
  out = []
  for i in range(r):
      out.append(" ".join("#" if g[i][j] == "#" else str(dist[i][j]) for j in range(c)))
  print("\n".join(out))
generator: |
  def cases(rng):
      yield "1 1\nE"
      yield "1 3\n.#E"
      yield "2 2\n..\n.."
      r = c = 300
      rows = []
      for i in range(r):
          rows.append("".join(rng.choice("....#") if rng.random() > 0.001 else "E" for _ in range(c)))
      yield f"{r} {c}\n" + "\n".join(rows)
      for _ in range(5):
          r, c = rng.randint(1, 6), rng.randint(1, 6)
          yield f"{r} {c}\n" + "\n".join("".join(rng.choice("..#E") for _ in range(c)) for _ in range(r))
