id: subtree-sizes
title: Team sizes
concepts: [tree-techniques]
difficulty: easy
statement: |
  A company has `n` employees; employee 1 is the CEO, and every other employee `i` has a
  direct boss `p[i]`. For each employee, print how many people work under them (directly or
  indirectly), not counting themselves.
input_format: |
  The first line contains n. The second line contains p[2..n].
output_format: n numbers separated by spaces.
constraints:
  - 1 ≤ n ≤ 200000
  - 1 ≤ p[i] < i
examples:
  - input: "5\n1 1 2 3"
    output: "4 1 1 0 0"
hints:
  - The count for a boss depends on the counts of their direct reports. In what order must you compute them?
  - Since every boss has a smaller number than their employees, is there a simple loop order that processes reports first?
  - Loop i from n down to 2 and add (count[i] + 1) to count[p[i]].
approach: |
  Because p[i] < i, iterating i from n down to 2 processes every employee before their boss:
  cnt[p[i]] += cnt[i] + 1. O(n), no recursion or explicit traversal needed.
reference: |
  import sys
  data = sys.stdin.buffer.read().split()
  n = int(data[0])
  p = [0, 0] + [int(x) for x in data[1:n]]
  cnt = [0] * (n + 1)
  for i in range(n, 1, -1):
      cnt[p[i]] += cnt[i] + 1
  print(" ".join(map(str, cnt[1:])))
generator: |
  def cases(rng):
      yield "1\n"
      yield "2\n1"
      n = 150000
      yield f"{n}\n" + " ".join(str(i - 1) for i in range(2, n + 1))
      yield f"{n}\n" + " ".join(str(rng.randint(1, i - 1)) for i in range(2, n + 1))
      for _ in range(5):
          n = rng.randint(2, 8)
          yield f"{n}\n" + " ".join(str(rng.randint(1, i - 1)) for i in range(2, n + 1))
