id: repeated-substring
title: Longest repeated substring
concepts: [string-hashing]
difficulty: hard
statement: |
  Find the length of the longest substring that occurs **at least twice** in the string (the
  occurrences may overlap). Print 0 if no substring repeats.
input_format: One line with a string of lowercase letters.
output_format: The maximum length.
constraints:
  - 1 ≤ |s| ≤ 50000
examples:
  - input: banana
    output: "3"
    explanation: '"ana" occurs at positions 2 and 4 (they overlap).'
  - input: abcd
    output: "0"
hints:
  - If some substring of length L repeats, does some substring of length L − 1 repeat too? What does that suggest?
  - For a fixed length L, how can you check quickly whether any window of length L appears twice?
  - Binary search L; for each L, hash all windows of length L (rolling hash with a large modulus) and look for a duplicate in a set.
approach: |
  Repetition is monotonic in L, so binary search L in [0, n − 1]. For a given L, compute the
  O(1) hash of every window from prefix hashes (modulus 2^61 − 1 or double hashing) and check
  for duplicates with a hash set. O(n log n).
reference: |
  import sys
  s = sys.stdin.readline().strip()
  n = len(s)
  M = (1 << 61) - 1
  B = 1_000_003
  h = [0] * (n + 1)
  pw = [1] * (n + 1)
  for i, ch in enumerate(s):
      h[i + 1] = (h[i] * B + ord(ch)) % M
      pw[i + 1] = pw[i] * B % M
  def repeats(L):
      if L == 0:
          return True
      seen = {}
      p = pw[L]
      for i in range(n - L + 1):
          key = (h[i + L] - h[i] * p) % M
          j = seen.get(key)
          if j is not None and s[j:j + L] == s[i:i + L]:  # verify: exact, never fooled
              return True
          seen[key] = i
      return False
  lo, hi = 0, n - 1
  while lo < hi:
      mid = (lo + hi + 1) // 2
      if repeats(mid):
          lo = mid
      else:
          hi = mid - 1
  print(lo)
generator: |
  def cases(rng):
      yield "a"
      yield "aaaaa"
      yield "abcabcabc"
      yield "".join(rng.choice("ab") for _ in range(50000))
      yield "".join(rng.choice("abcdefghijklmnopqrstuvwxyz") for _ in range(50000))
      base = "".join(rng.choice("xyz") for _ in range(2000))
      yield "".join(rng.choice("abcdefghijklmnopqrstuvw") for _ in range(20000)) + base + "".join(rng.choice("abcdefghijklmnopqrstuvw") for _ in range(20000)) + base
      for _ in range(5):
          yield "".join(rng.choice("ab") for _ in range(rng.randint(1, 12)))
