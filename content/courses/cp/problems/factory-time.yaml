id: factory-time
title: Factory machines
concepts: [binary-search-answer]
difficulty: medium
statement: |
  There are `n` machines; machine `i` produces one item every `t[i]` seconds, and all work
  simultaneously. What is the minimum number of seconds needed to produce `k` items in
  total?
input_format: |
  The first line contains n and k. The second line contains t[1..n].
output_format: The minimum time.
constraints:
  - 1 ≤ n ≤ 30000
  - 1 ≤ k ≤ 10^9
  - 1 ≤ t[i] ≤ 10^9
examples:
  - input: "3 7\n3 2 5"
    output: "8"
    explanation: "In 8 seconds the machines make 2 + 4 + 1 = 7 items."
hints:
  - Instead of computing the time directly, can you quickly check whether a given time T is enough?
  - If T seconds are enough, are T + 1 seconds enough too? What does that let you do?
  - Binary search T in [1, min(t)·k]; T works if Σ floor(T / t[i]) ≥ k (stop summing early once it reaches k).
approach: |
  ok(T) = Σ T // t[i] ≥ k, monotonic in T. Binary search the smallest feasible T in
  [1, min(t)·k] (min(t)·k is always enough). Stop the sum once it reaches k to avoid
  overflow. O(n log(10^18)).
reference: |
  import sys
  data = sys.stdin.buffer.read().split()
  n, k = int(data[0]), int(data[1])
  t = list(map(int, data[2:2 + n]))
  lo, hi = 1, min(t) * k
  while lo < hi:
      mid = (lo + hi) // 2
      made = 0
      for x in t:
          made += mid // x
          if made >= k:
              break
      if made >= k:
          hi = mid
      else:
          lo = mid + 1
  print(lo)
generator: |
  def cases(rng):
      yield "1 1\n1"
      yield "1 1000000000\n1000000000"
      yield "2 5\n1 1000000000"
      n = 30000
      yield f"{n} 1000000000\n" + " ".join(str(rng.randint(1, 10**9)) for _ in range(n))
      yield f"{n} 1000000000\n" + " ".join(str(rng.randint(1, 100)) for _ in range(n))
      for _ in range(5):
          n = rng.randint(1, 5)
          yield f"{n} {rng.randint(1, 30)}\n" + " ".join(str(rng.randint(1, 10)) for _ in range(n))
