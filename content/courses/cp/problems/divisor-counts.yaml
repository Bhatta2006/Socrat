id: divisor-counts
title: How many divisors?
concepts: [number-theory]
difficulty: medium
statement: |
  Answer `q` queries: for each `x`, print how many positive whole numbers divide `x`.
input_format: |
  The first line contains q. The second line contains q whole numbers.
output_format: q numbers separated by spaces.
constraints:
  - 1 ≤ q ≤ 2·10^5
  - 1 ≤ x ≤ 10^6
examples:
  - input: "4\n1 12 13 1000000"
    output: "1 6 2 49"
    explanation: 12 has divisors 1, 2, 3, 4, 6, 12. 10^6 = 2^6 · 5^6 has 7 · 7 = 49.
hints:
  - Trial division up to sqrt(x) costs about 1000 steps per query. Is 2·10^5 queries of that too slow?
  - If x = p1^e1 · p2^e2 · …, how many divisors does x have?
  - Sieve the smallest prime factor of every number up to 10^6 once; then factor each query by repeated division and multiply (e + 1) over its prime powers.
approach: |
  Precompute the smallest prime factor spf[v] for v ≤ 10^6 with a sieve. Factor each x by dividing
  by spf until 1, counting exponents; the divisor count is the product of (e + 1). Each query takes
  O(log x) after an O(N log log N) sieve. (A divisor-count sieve d[v] for all v also works.)
reference: |
  import sys
  data = sys.stdin.buffer.read().split()
  q = int(data[0])
  xs = list(map(int, data[1:1 + q]))
  limit = max(xs) + 1
  d = [0] * limit
  for i in range(1, limit):
      for j in range(i, limit, i):
          d[j] += 1
  print(" ".join(str(d[x]) for x in xs))
brute: |
  q = int(input())
  xs = list(map(int, input().split()))
  print(" ".join(str(sum(1 for k in range(1, x + 1) if x % k == 0)) for x in xs))
