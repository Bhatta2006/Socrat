id: cp
title: Competitive Programming
tagline: Read fast, think in complexities, and climb your rating with techniques that win contests.
description: >-
  A contest-focused path from your first accepted solution to the data structures and
  techniques behind Div 2 / Div 3 problems on Codeforces, AtCoder and CodeChef. Every topic
  ends in timed, unseen problems, and Socrat adapts to your speed and accuracy as much as
  your correctness.
version: 1.0.0
languages: [python, cpp, java]
levels:
  - id: new-to-programming
    label: I'm new to programming
    description: Build programming and DSA foundations first, then contest technique.
  - id: knows-dsa-basics
    label: I know basic DSA, never competed
    description: Learn contest habits, math and the core techniques.
    start_concept: fast-io
  - id: unrated-or-newbie
    label: I've done a few contests
    description: Roughly newbie/pupil — strengthen techniques and speed.
    start_concept: binary-search-answer
  - id: rated
    label: I compete regularly
    description: Specialist and above — find gaps in advanced techniques.
    start_concept: dp-classics
modules:
  - id: contest-basics
    title: Contest fundamentals
    summary: Fast I/O, overflow, budgeting operations, simulation and complete search.
    concepts: [fast-io, simulation, complete-search]
  - id: math
    title: Contest math
    summary: Number theory, modular arithmetic and counting.
    concepts: [number-theory, modular-arithmetic, combinatorics]
  - id: techniques
    title: Core techniques
    summary: Difference arrays, binary search on the answer, greedy proofs and bitmasks.
    concepts: [prefix-difference, binary-search-answer, greedy-cp, bitmasks]
  - id: dp-module
    title: Dynamic programming for contests
    summary: Knapsack, LIS and bitmask DP.
    concepts: [dp-classics, bitmask-dp]
  - id: graph-module
    title: Graphs and trees
    summary: Multi-source and 0-1 BFS, minimum spanning trees, tree techniques and LCA.
    concepts: [graph-techniques, mst, tree-techniques, lca]
  - id: range-structures
    title: Range query structures
    summary: Fenwick trees and segment trees for fast updates and queries.
    concepts: [fenwick-tree, segment-tree]
  - id: strings-module
    title: String algorithms
    summary: Polynomial hashing and the prefix function.
    concepts: [string-hashing, kmp]
