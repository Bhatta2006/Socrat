# Content source registry (Content Master Plan, Appendix A) as data.
#
# license_status: verified only where Appendix A records a confirmation (✔) on a primary or
# near-primary page during its research (2026-10-15/16), with one unambiguous license.
# Entries marked ◻ (reported or recalled), conflicting reports and unmarked entries are
# unverified. Nothing here was re-checked online for this commit; re-verify before relying
# on an entry, and update last_verified_at/verified_from when you do.
#
# action:
#   adapt              permissive and verified: R2 adaptation with attribution
#   share-alike-lane   share-alike and verified: isolated, labelled lane; legal sign-off first
#   link-only          R3 only (NC, ND, all rights reserved, unknown, or copyleft kept out)
#   per-item           licenses differ per item; register the specific item before adapting
#   verify             not adaptable until the license is verified on the source's own page
#
# The license gate (socrat/catalog/sources.py) only lets `origin: adapted` content cite an
# entry that is verified and whose action is adapt or share-alike-lane.
