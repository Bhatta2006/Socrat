id: quiz:dsa:tree-patterns:return-info-from-children
family: return-info-from-children
concept: dsa:tree-patterns
pattern: dsa:tree-patterns/return-info-from-children
format: mcq
tracks:
- interview
- competitive
languages:
- python
- cpp
- java
generator:
  template: tree_max_path
  params:
    nodes:
    - 3
    - 7
    value:
    - -5
    - 9
  reference: best_path(val, left, right)
  seeds:
    practice:
      start: 0
      stop: 42
    assessment:
      start: 42
      stop: 60
distractors:
- rule: return both branches to the parent
  misconception: tree-return-both-branches
- rule: count only paths that go straight down
  misconception: tree-best-only-downward
- rule: add every value in the tree
  misconception: tree-sum-all
- rule: keep negative branches
  misconception: tree-negative-branch
items:
- id: recognise
  band: 1
  format: mcq
  prompt: Which question is answered by returning information from children?
  options:
  - The longest path between any two nodes
  - The nodes on each level
  - The nodes at distance 3 from node 7
  - The nodes on the path from the root to node 9
  answer: 0
  misconceptions:
  - null
  - pattern-return-vs-record
  - tree-only-downward-search
  - pattern-return-vs-record
  explanation: The longest path bends at some node; children report their heights.
- id: order
  band: 1
  format: mcq
  prompt: Why process nodes in reverse BFS order?
  options:
  - Every child is handled before its parent, without recursion
  - It visits leaves last
  - It sorts the values
  - It is faster than O(n)
  answer: 0
  misconceptions:
  - null
  - dp-loop-order
  - pattern-sort-breaks-order
  - pattern-search-vs-scan
  explanation: BFS puts parents before children; reversing it puts children first.
- id: returned
  band: 2
  format: mcq
  prompt: What does a node return in maximum path sum?
  options:
  - val + max(gl, gr)
  - val + gl + gr
  - max(gl, gr)
  - The best path in its subtree
  answer: 0
  misconceptions:
  - null
  - tree-return-both-branches
  - dp-missing-plus-one
  - pattern-return-vs-record
  explanation: The parent can extend only one side.
- id: clamp
  band: 2
  format: trace
  prompt: Node value 3, down[left] = −4, down[right] = 2. What does it record?
  options:
  - '5'
  - '1'
  - '3'
  - '9'
  answer: 0
  misconceptions:
  - null
  - tree-negative-branch
  - tree-best-only-downward
  - tree-sum-all
  explanation: 3 + max(0, −4) + max(0, 2) = 5.
- id: bent
  band: 3
  format: classify
  prompt: Values 1 2 3 4 5 (1 has 2 and 3; 2 has 4 and 5). Why is 15 impossible?
  options:
  - It would enter node 2 from three directions
  - It uses node 1 twice
  - 15 is larger than the total
  - It is possible
  answer: 0
  misconceptions:
  - null
  - tree-return-both-branches
  - tree-sum-all
  - tree-return-both-branches
  explanation: A path gives each node at most two neighbours.
- id: all-negative
  band: 3
  format: bug_spot
  prompt: best starts at 0 and every value is negative. What goes wrong?
  options:
  - It prints 0, but a path must contain at least one node
  - Nothing
  - It crashes
  - It prints the sum of all values
  answer: 0
  misconceptions:
  - null
  - dp-wrong-base-case
  - tree-sum-all
  - tree-negative-branch
  explanation: Start best very low; the answer is the largest single value.
- id: downward
  band: 4
  format: bug_spot
  prompt: The code records val + max(gl, gr) instead of val + gl + gr. Which paths are missed?
  options:
  - Paths that bend at their highest node
  - Single-node paths
  - Paths through the root
  - None
  answer: 0
  misconceptions:
  - null
  - tree-best-only-downward
  - tree-best-only-downward
  - pattern-return-vs-record
  explanation: 4 → 2 → 5 needs both branches of node 2.
- id: diameter
  band: 4
  format: mcq
  prompt: For the diameter in edges, what does each node record?
  options:
  - The left height plus the right height
  - Its own height
  - The number of nodes below it
  - The deeper of the two heights
  answer: 0
  misconceptions:
  - null
  - tree-best-only-downward
  - count-vs-sum
  - tree-best-only-downward
  explanation: The longest path bending at the node uses both heights.
- id: complexity
  band: 5
  format: complexity
  prompt: n nodes. Time of the reverse-BFS template?
  options:
  - O(n)
  - O(n²)
  - O(n log n)
  - O(2^n)
  answer: 0
  misconceptions:
  - null
  - dp-recompute-subproblems
  - pattern-sort-breaks-order
  - pattern-brute-force-default
  explanation: Each node is handled once and reads two children.
- id: deep
  band: 5
  format: classify
  prompt: The tree is a chain of 10^5 nodes. What is the risk with plain recursion in Python or Java?
  options:
  - Stack overflow; use an explicit order such as reverse BFS
  - It becomes O(n²)
  - Wrong answers on chains
  - None
  answer: 0
  misconceptions:
  - null
  - dp-recompute-subproblems
  - tree-return-both-branches
  - pattern-brute-force-default
  explanation: The recursion depth equals the tree height.
- id: balanced-transfer
  band: 6
  format: classify
  prompt: Check whether every node's subtrees differ in height by at most 1. What should a node return?
  options:
  - Its height, or −1 once any subtree is unbalanced
  - True or false only
  - Its value
  - The number of leaves
  answer: 0
  misconceptions:
  - null
  - pattern-return-vs-record
  - dp-vague-state
  - count-vs-sum
  explanation: The parent needs heights to check itself, plus a way to pass failure up.
- id: coins-transfer
  band: 6
  format: classify
  prompt: Move coins so every node has one; one move shifts a coin along an edge. What does a node return?
  options:
  - Its surplus (coins in subtree minus nodes in subtree)
  - The number of coins it holds
  - Its depth
  - The moves made in its subtree only
  answer: 0
  misconceptions:
  - null
  - dp-vague-state
  - pattern-return-vs-record
  - tree-sum-all
  explanation: Each edge carries |surplus| moves, recorded globally.
status: provisional
provenance:
  origin: original
