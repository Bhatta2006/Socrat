id: quiz:dsa:heaps:top-k
family: top-k
concept: dsa:heaps
pattern: dsa:heaps/top-k
format: output_prediction  # generated items set their own format (predict, fill)
tracks: [interview, competitive]
languages: [python, cpp, java]
generator:
  template: top_k_heap
  params: {n: [6, 9], value: [1, 40], k: [2, 4]}
  reference: "kth_largest(a, k)"
  seeds:
    practice: {start: 0, stop: 42}
    assessment: {start: 42, stop: 60}
distractors:
  - {rule: "k-th smallest instead of largest", misconception: top-k-direction}
  - {rule: "the maximum", misconception: top-k-returns-max}
  - {rule: "heap kept at k - 1 or k + 1 values", misconception: heap-size-off-by-one}
items:
  - id: recognise-which-heap
    band: 1
    format: mcq
    prompt: "To track the k largest values of a stream, which heap do you keep and why?"
    options:
      - "A size-k min-heap: its top is the weakest of the k, the one to evict"
      - "A max-heap of size k: its top is the largest"
      - "A max-heap of all values, popped k times at the end of every step"
      - "No heap: sort the stream after each value"
    answer: 0
    misconceptions: [null, top-k-direction, pattern-brute-force-default, pattern-brute-force-default]
    explanation: "The value to throw out is the smallest of the current top k, so it must sit on top."
  - id: recognise-cost
    band: 1
    format: mcq
    prompt: "What does a size-k min-heap cost over n values?"
    options: ["O(n log k) time, O(k) space", "O(n log n) time, O(n) space", "O(k log n) time", "O(n) time, O(1) space"]
    answer: 0
    misconceptions: [null, heap-size-vs-input-size, heap-size-vs-input-size, pattern-brute-force-default]
    explanation: "Each of n values is pushed (and maybe popped) on a heap that never exceeds k + 1."
  - id: edge-fewer-than-k
    band: 5
    format: mcq
    prompt: "The stream has only 2 values so far and k = 3. What is the 3rd largest?"
    options:
      - "Not defined yet: the heap holds fewer than k values"
      - "The smaller of the two"
      - "0"
      - "The larger of the two"
    answer: 0
    misconceptions: [null, heap-size-off-by-one, missing-unreachable-check, top-k-returns-max]
    explanation: "Until k values have arrived, report that there is no k-th largest (or follow the problem's rule)."
  - id: edge-duplicates
    band: 5
    format: mcq
    prompt: "Values 5 5 4, k = 2. What is the 2nd largest, counting duplicates as separate values?"
    options: ["5", "4", "It is undefined", "9"]
    answer: 0
    misconceptions: [null, top-k-distinct-confusion, missing-unreachable-check, count-vs-sum]
    explanation: "The heap keeps both 5s; the smaller of the top two is 5."
  - id: transfer-frequent
    band: 6
    format: classify
    prompt: "The k most frequent words in a log. Which steps, and what cost?"
    options:
      - "Count with a hash map, then a size-k min-heap by count: O(n + m log k)"
      - "Sort all words alphabetically and take the first k"
      - "A size-k heap of the words themselves, ignoring counts"
      - "Binary search on the frequency"
    answer: 0
    misconceptions: [null, pattern-sort-breaks-order, top-k-direction, pattern-search-vs-scan]
    explanation: "Count first, then select the top k by count with the same heap idea."
  - id: transfer-closest
    band: 6
    format: classify
    prompt: "The k points closest to the origin among a million points. What do you keep?"
    options:
      - "A max-heap of size k by distance: evict the farthest of the current k"
      - "A min-heap of all points by distance"
      - "The single closest point"
      - "A sliding window over the points"
    answer: 0
    misconceptions: [null, heap-size-vs-input-size, top-k-returns-max, pattern-fixed-vs-variable-window]
    explanation: "For the k smallest distances, the one to evict is the largest, so it goes on top."
hint_ladder:
  - Which value should leave when the heap holds k + 1 values?
  - Keep only the k largest so far; the smallest of them is on top of a min-heap.
  - After all values, the top of the size-k min-heap is the k-th largest.
time_limit_s: 120
provenance:
  origin: original
