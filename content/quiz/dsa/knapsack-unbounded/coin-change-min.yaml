id: quiz:dsa:knapsack-unbounded:coin-change-min
family: coin-change-min
concept: dsa:knapsack-unbounded
format: mcq
tracks:
- interview
- competitive
languages:
- python
- cpp
- java
items:
- id: zero-start
  band: 1
  format: mcq
  prompt: Fewest coins, but dp[a] starts at 0 for every a. What does the program print?
  options:
  - 0 for every amount
  - The right answer
  - '-1'
  - The amount itself
  answer: 0
  misconceptions:
  - null
  - coin-min-zero-init
  - missing-unreachable-check
  - confuse-index-value
  explanation: min(0, anything) is 0. Unreached cells must start at infinity.
- id: table-trace
  band: 2
  format: trace
  prompt: Coins 1 3 4. dp[0..5] = 0 1 2 1 1 2. What is dp[6]?
  options:
  - '2'
  - '3'
  - '1'
  - '6'
  answer: 0
  misconceptions:
  - null
  - greedy-coin-change
  - dp-missing-plus-one
  - count-vs-min
  explanation: min(dp[5], dp[3], dp[2]) + 1 = min(2, 1, 2) + 1 = 2, as 3 + 3.
- id: unreachable
  band: 3
  format: mcq
  prompt: Coins 2 only, amount 3. What should the program print?
  options:
  - '-1'
  - '1'
  - '2'
  - A very large number
  answer: 0
  misconceptions:
  - null
  - coin-equals-amount
  - greedy-coin-change
  - missing-unreachable-check
  explanation: dp[3] stays infinity; report it as -1.
- id: overflow
  band: 4
  format: bug_spot
  prompt: In Java, INF = Integer.MAX_VALUE and the update is dp[a] = min(dp[a], dp[a − c] + 1). What goes
    wrong?
  options:
  - dp[a − c] + 1 overflows to a negative number when dp[a − c] is INF
  - Nothing
  - The loop never ends
  - It prints -1 too often
  answer: 0
  misconceptions:
  - null
  - missing-unreachable-check
  - dp-loop-order
  - coin-min-zero-init
  explanation: Use a large finite INF such as 10^9, or skip unreachable cells.
status: provisional
