id: quiz:dsa:knapsack-01:knapsack-01
family: knapsack-01
concept: dsa:knapsack-01
pattern: dsa:knapsack-01/knapsack-01
format: mcq
tracks:
- interview
- competitive
languages:
- python
- cpp
- java
generator:
  template: zero_one_knapsack
  params:
    items:
    - 2
    - 4
    weight:
    - 1
    - 6
    value:
    - 1
    - 9
    capacity:
    - 4
    - 12
  reference: best_subset(w, v, W)
  seeds:
    practice:
      start: 0
      stop: 42
    assessment:
      start: 42
      stop: 60
distractors:
- rule: loop capacity forwards so items are reused
  misconception: knapsack-forward-capacity-loop
- rule: take items greedily by value per weight
  misconception: knapsack-greedy-ratio
- rule: stop the capacity loop before c == w
  misconception: knapsack-capacity-boundary
- rule: add the weight instead of the value
  misconception: knapsack-weight-for-value
items:
- id: recognise-once
  band: 1
  format: mcq
  prompt: Which detail makes a packing problem 0/1 knapsack?
  options:
  - Each item exists once
  - Items can be cut into pieces
  - Unlimited copies of each item
  - No budget
  answer: 0
  misconceptions:
  - null
  - knapsack-greedy-ratio
  - pattern-01-vs-unbounded-knapsack
  - knapsack-ignore-capacity
  explanation: Once per item is 0/1; pieces are fractional; copies are unbounded.
- id: state-meaning
  band: 1
  format: mcq
  prompt: In the one-row version, what does dp[c] mean?
  options:
  - The best value within capacity c using the items so far
  - The value of item c
  - Whether item c was taken
  - The weight left after c items
  answer: 0
  misconceptions:
  - null
  - confuse-index-value
  - dp-vague-state
  - dp-vague-state
  explanation: c is a capacity, not an item index.
- id: base-row
  band: 2
  format: mcq
  prompt: Before any item is processed, what should dp[c] be for every c?
  options:
  - '0'
  - minus infinity
  - c
  - The value of the first item
  answer: 0
  misconceptions:
  - null
  - dp-wrong-base-case
  - knapsack-weight-for-value
  - dp-wrong-base-case
  explanation: With no items the best value within any capacity is 0.
- id: one-cell
  band: 2
  format: trace
  prompt: 'Row above: dp[3] = 4, dp[7] = 5. Item (w 4, v 5). What is the new dp[7]?'
  options:
  - '9'
  - '5'
  - '10'
  - '4'
  answer: 0
  misconceptions:
  - null
  - knapsack-always-take
  - knapsack-forward-capacity-loop
  - confuse-index-value
  explanation: max(skip 5, take 5 + dp[3] = 9) = 9.
- id: greedy-fails
  band: 3
  format: classify
  prompt: Weights 1 3 4 5, values 1 4 5 7, capacity 7. Why does greedy by value per weight fail?
  options:
  - The best ratio item leaves space that only a poor item fits
  - Ratios cannot be compared
  - Greedy needs sorted weights
  - It does not fail
  answer: 0
  misconceptions:
  - null
  - knapsack-greedy-ratio
  - knapsack-greedy-ratio
  - knapsack-greedy-ratio
  explanation: 'Taking weight 5 leaves 2 units: only weight 1 fits, total 8 instead of 9.'
- id: loop-direction
  band: 3
  format: mcq
  prompt: One item (w 2, v 3), capacity 4, loop forwards. What is dp[4]?
  options:
  - '6'
  - '3'
  - '0'
  - '4'
  answer: 0
  misconceptions:
  - null
  - knapsack-forward-capacity-loop
  - dp-wrong-base-case
  - confuse-index-value
  explanation: 'Forwards, dp[2] is already 3 when c = 4 reads it: 3 + 3 = 6. The item is reused.'
- id: boundary
  band: 3
  format: bug_spot
  prompt: The capacity loop runs while c > w[i]. Which case is missed?
  options:
  - An item that exactly fills the capacity
  - Items heavier than W
  - The first item
  - Nothing
  answer: 0
  misconceptions:
  - null
  - knapsack-capacity-boundary
  - knapsack-capacity-boundary
  - knapsack-capacity-boundary
  explanation: c == w[i] means taking the item on top of dp[0]; it must be allowed.
- id: swap-dimension
  band: 5
  format: classify
  prompt: n = 100, W = 10^9, every value ≤ 1000. What changes?
  options:
  - 'Index by total value: least weight for each value'
  - Nothing; use dp over W
  - Use greedy
  - Sort by weight
  answer: 0
  misconceptions:
  - null
  - knapsack-ignore-capacity
  - knapsack-greedy-ratio
  - pattern-sort-breaks-order
  explanation: A 10^9 table is impossible; the value total is at most 10^5.
- id: count-vs-best
  band: 4
  format: mcq
  prompt: Same table, but you must count subsets with sum exactly K. What replaces max?
  options:
  - +, with ways[0] = 1
  - or
  - min
  - max still works
  answer: 0
  misconceptions:
  - null
  - pattern-count-vs-exists
  - dp-overwrite-min
  - dp-count-vs-exists
  explanation: Counting adds both choices; existence uses or; optimisation uses max.
- id: complexity
  band: 4
  format: complexity
  prompt: n items, capacity W. What is the time of the table version?
  options:
  - O(n · W)
  - O(2^n)
  - O(n log n)
  - O(W)
  answer: 0
  misconceptions:
  - null
  - dp-recompute-subproblems
  - knapsack-greedy-ratio
  - dp-vague-state
  explanation: There are n × (W + 1) states, each filled in O(1).
- id: unbounded-transfer
  band: 6
  format: classify
  prompt: Rods can be cut into any number of pieces of each length. Which loop direction?
  options:
  - 'Capacity forwards: reuse is allowed'
  - Capacity backwards
  - Either
  - Greedy by price per length
  answer: 0
  misconceptions:
  - null
  - pattern-01-vs-unbounded-knapsack
  - pattern-01-vs-unbounded-knapsack
  - knapsack-greedy-ratio
  explanation: Unlimited pieces is the unbounded family, where the forward loop is correct.
- id: two-budget-transfer
  band: 6
  format: classify
  prompt: Each word costs some zeros and some ones; both are limited. What is the state?
  options:
  - dp[z][o], both budgets backwards
  - dp[z] only
  - dp over word index only
  - A greedy by length
  answer: 0
  misconceptions:
  - null
  - two-capacity-one-loop
  - dp-vague-state
  - knapsack-greedy-ratio
  explanation: Both resources are spent by the same item, so both are part of the state.
status: provisional
provenance:
  origin: original
