id: quiz:dsa:dp-1d:unbounded-coin-change
family: unbounded-coin-change
concept: dsa:dp-1d
pattern: dsa:dp-1d/unbounded-coin-change
format: output_prediction  # generated items set their own format (predict, fill, fix)
tracks: [interview, competitive]
languages: [python, cpp, java]
generator:
  template: unbounded_coin_change
  params: {coin: [1, 9], kinds: [2, 3], amount: [6, 20]}
  reference: "fewest(coins, amount)"
  seeds:
    practice: {start: 0, stop: 42}
    assessment: {start: 42, stop: 60}
distractors:
  - {rule: "greedy: largest coin first", misconception: greedy-coin-change}
  - {rule: "number of ways instead of fewest coins", misconception: count-vs-min}
  - {rule: "forget the +1 for the coin used", misconception: dp-missing-plus-one}
  - {rule: "print the sentinel for unreachable amounts", misconception: missing-unreachable-check}
items:
  - id: recognise-state
    band: 1
    format: mcq
    prompt: "In fewest-coins DP, what does dp[a] mean?"
    options:
      - "The fewest coins whose values add up to exactly a"
      - "The number of ways to make a"
      - "The largest coin not above a"
      - "The fewest coins for every amount up to a, added together"
    answer: 0
    misconceptions: [null, count-vs-min, greedy-coin-change, dp-vague-state]
    explanation: "One clear state: the best answer for exactly amount a."
  - id: recognise-greedy
    band: 1
    format: mcq
    prompt: "Coins 1, 3, 4 and amount 6. What does 'largest coin first' give, and what is best?"
    options: ["Greedy 3 coins (4+1+1); best 2 (3+3)", "Both give 2", "Greedy 2; best 3", "Both give 3"]
    answer: 0
    misconceptions: [null, greedy-coin-change, greedy-coin-change, dp-missing-plus-one]
    explanation: "Greedy grabs 4 and is left with 2 = 1 + 1; DP finds 3 + 3."
  - id: edge-unreachable
    band: 5
    format: mcq
    prompt: "Coins 4 and 6, amount 7. What should the program print, and why does the DP need a sentinel?"
    options:
      - "-1: odd amounts cannot be made, and INF marks amounts nobody reached"
      - "2, using 4 + 3"
      - "1, the closest coin"
      - "0, since no coins are used"
    answer: 0
    misconceptions: [null, dp-wrong-subproblem, greedy-coin-change, missing-unreachable-check]
    explanation: "4 and 6 are even, so 7 is unreachable; INF must turn into -1 at the end."
  - id: edge-loop-order
    band: 5
    format: mcq
    prompt: "Counting the WAYS to make change, why does the coin loop go outside the amount loop?"
    options:
      - "So each combination is counted once, not once per order"
      - "It is faster"
      - "So larger coins are tried first"
      - "The order of loops never matters"
    answer: 0
    misconceptions: [null, dp-loop-order, greedy-coin-change, dp-loop-order]
    explanation: "Coins outside means each coin is added in a fixed order: combinations, not permutations."
  - id: transfer-squares
    band: 6
    format: classify
    prompt: "Fewest perfect squares that add up to n. Which pattern, and what are the coins?"
    options:
      - "Unbounded coin change with coins 1, 4, 9, … up to n"
      - "Greedy: always take the largest square"
      - "0/1 knapsack: each square used once"
      - "Binary search on the count"
    answer: 0
    misconceptions: [null, greedy-coin-change, unbounded-vs-01, pattern-search-vs-scan]
    explanation: "Squares may repeat, so each square is a coin of unlimited supply."
  - id: transfer-tickets
    band: 6
    format: classify
    prompt: "Pay for exactly n rides with 1-, 7- and 30-ride passes, unlimited of each, minimising cost. Pattern and cost?"
    options:
      - "Unbounded knapsack over rides: dp[r] = min(dp[r − k] + price_k), O(3n)"
      - "Greedy by best price per ride"
      - "Count the ways to buy passes"
      - "Fixed window of 30 rides"
    answer: 0
    misconceptions: [null, greedy-coin-change, count-vs-min, pattern-fixed-vs-variable-window]
    explanation: "Each pass is a coin of size k with a cost; minimise the total like fewest coins."
hint_ladder:
  - What does dp[a] stand for?
  - If the last coin used is c, what amount is left to make?
  - dp[a] = min over coins c ≤ a of dp[a − c] + 1, starting from dp[0] = 0.
time_limit_s: 150
provenance:
  origin: original
