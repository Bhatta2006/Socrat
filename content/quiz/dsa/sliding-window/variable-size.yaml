id: quiz:dsa:sliding-window:variable-size
family: variable-size
concept: dsa:sliding-window
pattern: dsa:sliding-window/variable-size
format: output_prediction  # generated items set their own format (predict, fill, fix)
tracks: [interview, competitive]
languages: [python, cpp, java]
generator:
  template: variable_size_window
  params: {n: [6, 9], value: [1, 9]}
  reference: "longest(a, limit)"
  seeds:
    practice: {start: 0, stop: 42}
    assessment: {start: 42, stop: 60}
distractors:
  - {rule: "keep the latest length instead of the longest", misconception: overwrite-best}
  - {rule: "length as right - left", misconception: window-length-off-by-one}
  - {rule: "largest sum instead of length", misconception: window-sum-not-length}
  - {rule: "subtract the entering element", misconception: drop-wrong-end}
items:
  - id: recognise-longest-run
    band: 1
    format: mcq
    prompt: "Which task is a variable-size sliding window?"
    options:
      - "Longest stretch of days whose total rainfall is at most 50 mm"
      - "Largest total over exactly 7 consecutive days"
      - "Total rainfall between day i and day j for many queries"
      - "Day with the most rainfall"
    answer: 0
    misconceptions: [null, pattern-fixed-vs-variable-window, pattern-window-vs-prefix-sums, pattern-window-for-single-item]
    explanation: "The window length is not fixed: it grows while the rule holds and shrinks when it breaks."
  - id: recognise-why-shrink
    band: 1
    format: mcq
    prompt: "In a variable window over positive numbers, why can we shrink from the left when the sum is too big?"
    options:
      - "Removing a positive number can only lower the sum, so the window moves toward valid"
      - "The left element is always the largest"
      - "Shrinking keeps the window length fixed"
      - "Every window that starts later is shorter"
    answer: 0
    misconceptions: [null, confuse-index-value, pattern-fixed-vs-variable-window, window-length-off-by-one]
    explanation: "With positive numbers, dropping an element always lowers the sum, so shrinking repairs a broken rule."
  - id: recognise-cost
    band: 1
    format: mcq
    prompt: "Why is the grow-and-shrink window O(n) even with a loop inside a loop?"
    options:
      - "Each index enters the window once and leaves it at most once"
      - "The inner loop runs at most once per step"
      - "The window never holds more than two elements"
      - "Sorting first makes the inner loop constant"
    answer: 0
    misconceptions: [null, shrink-with-if, pattern-window-vs-two-pointers, pattern-brute-force-default]
    explanation: "left only moves forward, so all shrinking steps together are at most n."
  - id: edge-longest-with-if
    band: 5
    format: mcq
    prompt: "A longest-run loop shrinks with if instead of while. What happens to the answer?"
    options:
      - "It stays right: the window slides without ever dropping below the best length"
      - "It reports a window that is too long"
      - "It loops forever"
      - "It reports 0 whenever a shrink happens"
    answer: 0
    misconceptions: [null, shrink-with-if, shrink-too-far, reset-instead-of-shrink]
    explanation: "With if, the window keeps its best length and slides; it only grows when the new run is valid."
  - id: edge-count-with-if
    band: 5
    format: mcq
    prompt: "To count every run with sum at most L, the loop adds right − left + 1 at each step. Why must it shrink with while?"
    options:
      - "With if, the window can still be too big, so invalid runs get counted"
      - "if gives the same count, only slower"
      - "while matters only for negative numbers"
      - "Counting never needs a shrink step"
    answer: 0
    misconceptions: [null, shrink-with-if, window-with-negatives, reset-instead-of-shrink]
    explanation: "Counting adds every window ending at right, so that window must be valid first."
  - id: transfer-negatives
    band: 6
    format: classify
    prompt: "Longest run of transactions whose total is at most 100, where refunds are negative. Which approach works?"
    options:
      - "Prefix sums with a sorted structure, because shrinking no longer always lowers the sum"
      - "Grow-and-shrink window, as with positive numbers"
      - "A fixed window of the average run length"
      - "Sort the transactions, then take the smallest ones"
    answer: 0
    misconceptions: [null, window-with-negatives, pattern-fixed-vs-variable-window, pattern-sort-breaks-order]
    explanation: "With negative numbers, removing an element can raise the sum, so the shrink rule is no longer safe."
  - id: transfer-shortest
    band: 6
    format: classify
    prompt: "Fewest consecutive trucks whose loads add up to at least T tonnes (loads are positive). Which approach fits?"
    options:
      - "Variable window: grow until the total reaches T, then shrink while it still does"
      - "Binary search on the answer with a prefix sum check"
      - "Greedy: always take the heaviest truck"
      - "Fixed window of size T"
    answer: 0
    misconceptions: [null, pattern-search-vs-scan, pattern-sort-breaks-order, pattern-fixed-vs-variable-window]
    explanation: "Shortest valid window: record the length every time the window is valid, then shrink to try shorter."
  - id: transfer-distinct
    band: 6
    format: classify
    prompt: "Longest playlist stretch with no song repeated. What does the window keep as its summary?"
    options:
      - "A count of each song inside the window, shrinking while one count exceeds 1"
      - "The sum of song lengths"
      - "Only the last song played"
      - "The positions of all songs in the whole playlist, sorted"
    answer: 0
    misconceptions: [null, stale-window-summary, pattern-window-for-single-item, pattern-sort-breaks-order]
    explanation: "The summary must describe exactly what is inside the window: here, how often each song appears."
hint_ladder:
  - What rule must the window satisfy, and what breaks it?
  - Grow the window by one; if the rule breaks, which end has to move?
  - Keep shrinking until the rule holds again, then measure the window.
time_limit_s: 120
provenance:
  origin: original
