id: quiz:dsa:sliding-window:fixed-window-sum
family: fixed-window-sum
concept: dsa:sliding-window
format: output_prediction
tracks: [interview, competitive]
languages: [python, cpp, java]
generator:
  template: fixed_window_sum
  params: {n: [6, 8], value: [1, 9], k: [2, 4]}
  reference: "max(sum(a[i:i + k]) for i in range(len(a) - k + 1))"
  seeds:
    practice: {start: 0, stop: 70}
    assessment: {start: 70, stop: 100}
distractors:
  - {rule: "window of size k - 1 or k + 1", misconception: window-off-by-one}
  - {rule: "sum of the first window only", misconception: stop-after-first}
  - {rule: "largest single element", misconception: confuse-index-value}
hint_ladder:
  - The code adds up k neighbouring numbers at a time.
  - Write down the sum of the first k numbers.
  - Slide one step at a time; add the new number, drop the oldest, keep the largest sum.
time_limit_s: 90
provenance:
  origin: original
