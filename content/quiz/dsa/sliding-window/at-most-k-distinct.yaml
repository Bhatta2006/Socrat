id: quiz:dsa:sliding-window:at-most-k-distinct
family: at-most-k-distinct
concept: dsa:sliding-window
pattern: dsa:sliding-window/at-most-k-distinct
format: output_prediction  # generated items set their own format (predict, fill, fix)
tracks: [interview, competitive]
languages: [python, cpp, java]
generator:
  template: at_most_k_distinct
  params: {n: [7, 10], value: [1, 4], k: [1, 3]}
  reference: "longest(a, k)"
  seeds:
    practice: {start: 0, stop: 42}
    assessment: {start: 42, stop: 60}
distractors:
  - {rule: "move left two places at a time", misconception: shrink-too-far}
  - {rule: "shrink while at least k values", misconception: k-distinct-boundary}
  - {rule: "report the number of different values", misconception: distinct-count-not-length}
items:
  - id: recognise-summary
    band: 1
    format: mcq
    prompt: "For the longest run with at most k different values, what must the window remember?"
    options:
      - "How many times each value occurs inside the window"
      - "The sum of the values inside"
      - "Only the newest value"
      - "The largest value seen so far"
    answer: 0
    misconceptions: [null, window-sum-not-length, pattern-window-for-single-item, confuse-index-value]
    explanation: "Distinct values leave only when their count drops to zero, so the window needs a count per value."
  - id: recognise-zero-count
    band: 1
    format: mcq
    prompt: "While shrinking, a value's count drops to 0. What must happen?"
    options:
      - "Remove the value from the map so it no longer counts as present"
      - "Nothing: a zero count is harmless"
      - "Move right back by one"
      - "Reset the whole map"
    answer: 0
    misconceptions: [null, stale-zero-count, drop-wrong-end, reset-instead-of-shrink]
    explanation: "The number of distinct values is the size of the map; a stale zero entry keeps it too high."
  - id: recognise-boundary
    band: 1
    format: mcq
    prompt: "At most 2 different values are allowed. When does the window shrink?"
    options:
      - "When 3 different values are inside"
      - "When 2 different values are inside"
      - "When the window is longer than 2"
      - "After every step"
    answer: 0
    misconceptions: [null, k-distinct-boundary, distinct-count-not-length, reset-instead-of-shrink]
    explanation: "Exactly 2 is allowed, so the rule breaks only at 3."
  - id: transfer-exactly-k
    band: 6
    format: classify
    prompt: "Count subarrays with exactly K different values. Which reduction works?"
    options:
      - "atMost(K) − atMost(K − 1), each counted with a window"
      - "One window that shrinks whenever K values are inside"
      - "Sort the array and count runs"
      - "Prefix sums of the values"
    answer: 0
    misconceptions: [null, exactly-vs-at-most, pattern-sort-breaks-order, pattern-window-vs-prefix-sums]
    explanation: "Exactly K is not monotone, but at most K is: subtract the two at-most counts."
  - id: transfer-baskets
    band: 6
    format: classify
    prompt: "Pick fruit from consecutive trees; your two baskets each hold one kind. Most fruit you can pick?"
    options:
      - "Longest window with at most 2 different values"
      - "Fixed window of size 2"
      - "Two most frequent fruit kinds overall"
      - "Binary search on the number of trees"
    answer: 0
    misconceptions: [null, pattern-fixed-vs-variable-window, pattern-sort-breaks-order, pattern-search-vs-scan]
    explanation: "Two baskets means at most two kinds inside a contiguous run: k = 2."
  - id: transfer-counting
    band: 6
    format: classify
    prompt: "Count all subarrays with at most k different values. What do you add at each right end?"
    options:
      - "right − left + 1: every valid window ending at right"
      - "1 when the window is valid"
      - "The number of different values inside"
      - "The length of the whole array"
    answer: 0
    misconceptions: [null, window-length-off-by-one, distinct-count-not-length, pattern-brute-force-default]
    explanation: "If [left, right] is valid, every shorter window ending at right is valid too."
hint_ladder:
  - How many different values may the window hold?
  - When a new value enters, check the size of the count map.
  - Shrink until the map holds at most k values, removing values whose count reaches 0.
time_limit_s: 120
provenance:
  origin: original
