id: quiz:dsa:hashing:set-sequences
family: set-sequences
concept: dsa:hashing
format: mcq
tracks:
- interview
- competitive
languages:
- python
- cpp
- java
items:
- id: start
  band: 2
  format: mcq
  prompt: In longest consecutive sequence, from which numbers does the walk start?
  options:
  - Numbers x where x − 1 is not in the set
  - Every number
  - Numbers x where x + 1 is not in the set
  - The smallest number only
  answer: 0
  misconceptions:
  - null
  - set-walk-every-element
  - drop-wrong-end
  - stop-after-first
  explanation: Only run starts walk, so each number is stepped over once.
- id: trace
  band: 3
  format: trace
  prompt: 100 4 200 1 3 2 2 101. What is the longest run?
  options:
  - '4'
  - '5'
  - '2'
  - '8'
  answer: 0
  misconceptions:
  - null
  - double-count
  - stop-after-first
  - distinct-vs-frequency
  explanation: 1 2 3 4; the duplicate 2 adds nothing.
- id: cost
  band: 4
  format: complexity
  prompt: The input is 1, 2, …, n and the walk starts from every number. The total number of steps?
  options:
  - About n²/2
  - About n
  - About n log n
  - About 2n
  answer: 0
  misconceptions:
  - null
  - set-walk-every-element
  - pattern-sort-breaks-order
  - set-walk-every-element
  explanation: n + (n − 1) + … + 1 steps.
