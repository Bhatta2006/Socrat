id: quiz:dsa:binary-search:boundaries
family: boundaries
concept: dsa:binary-search
pattern: dsa:binary-search/lower-upper-bound
format: bug_spot
tracks: [interview, competitive]
languages: [python, cpp, java]
generator:
  template: binary_search_boundaries
  params: {n: [5, 9], value: [1, 20]}
  reference: "sum(1 for v in a if v < x)"
  seeds:
    practice: {start: 0, stop: 70}
    assessment: {start: 70, stop: 100}
distractors:
  - {rule: "compare with <= (upper bound)", misconception: lower-vs-upper-bound}
  - {rule: "start hi at the last index", misconception: half-open-bound}
  - {rule: "move left with hi = mid - 1", misconception: exclude-candidate-mid}
  - {rule: "print lo + 1", misconception: off-by-one-output}
  - {rule: "print hi instead of lo", misconception: lo-hi-confusion}
items:
  - id: recognise-lower-bound
    band: 1
    format: mcq
    prompt: "In the sorted array 2 4 4 4 7, what is the lower bound of 4 (first index with value at least 4)?"
    options: ["1", "3", "4", "0"]
    answer: 0
    misconceptions: [null, lower-vs-upper-bound, off-by-one-output, confuse-index-value]
    explanation: "Index 1 is the first value that is at least 4."
  - id: recognise-upper-bound
    band: 1
    format: mcq
    prompt: "In 2 4 4 4 7, the upper bound of 4 is the first index with value greater than 4. What is it, and what does upper − lower count?"
    options: ["4; the three copies of 4", "3; the copies of 4 minus one", "4; the values below 4", "5; the whole array"]
    answer: 0
    misconceptions: [null, off-by-one-output, lower-vs-upper-bound, half-open-bound]
    explanation: "Upper bound 4 minus lower bound 1 is 3, the number of 4s."
  - id: edge-empty-and-missing
    band: 5
    format: mcq
    prompt: "A lower-bound search uses lo = 0, hi = n. Which input returns n?"
    options:
      - "Every value is smaller than x"
      - "Every value is larger than x"
      - "x appears exactly once"
      - "The array has one element equal to x"
    answer: 0
    misconceptions: [null, lower-vs-upper-bound, exclude-candidate-mid, half-open-bound]
    explanation: "If nothing is at least x, the first such index is one past the end: n."
  - id: edge-loop-forever
    band: 5
    format: mcq
    prompt: "With while lo < hi and mid = (lo + hi) // 2, which update can loop forever?"
    options: ["lo = mid", "lo = mid + 1", "hi = mid", "hi = mid - 1"]
    answer: 0
    misconceptions: [null, exclude-candidate-mid, half-open-bound, exclude-candidate-mid]
    explanation: "When hi = lo + 1, mid = lo, so lo = mid makes no progress."
  - id: transfer-count-range
    band: 6
    format: classify
    prompt: "Many queries: how many sorted scores lie between a and b inclusive? Which approach answers each query fast?"
    options:
      - "upper_bound(b) − lower_bound(a)"
      - "Scan the array for every query"
      - "lower_bound(b) − lower_bound(a)"
      - "A sliding window over the scores"
    answer: 0
    misconceptions: [null, pattern-brute-force-default, lower-vs-upper-bound, pattern-search-vs-scan]
    explanation: "Values ≥ a start at lower_bound(a); values ≤ b end before upper_bound(b)."
  - id: transfer-first-late
    band: 6
    format: classify
    prompt: "Delivery times are sorted. Find the first delivery that arrived at or after 17:00. Which tool fits?"
    options:
      - "Lower bound of 17:00"
      - "Upper bound of 17:00"
      - "The middle element"
      - "A count of all late deliveries"
    answer: 0
    misconceptions: [null, lower-vs-upper-bound, confuse-index-value, pattern-brute-force-default]
    explanation: "At or after means at least: the lower bound."
hint_ladder:
  - Run the code by hand on these values and track lo and hi.
  - Which index should it print? Count the values smaller than x.
  - Find the first step where lo or hi moves somewhere the answer cannot be.
time_limit_s: 180
provenance:
  origin: original
