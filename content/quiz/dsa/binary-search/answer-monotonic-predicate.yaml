id: quiz:dsa:binary-search:answer-monotonic-predicate
family: answer-monotonic-predicate
concept: dsa:binary-search
pattern: dsa:binary-search/answer-monotonic-predicate
format: output_prediction  # generated items set their own format (predict, fill, fix)
tracks: [interview, competitive]
languages: [python, cpp, java]
generator:
  template: answer_predicate
  params: {n: [3, 6], pile: [2, 30]}
  reference: "slowest(piles, hours)"
  seeds:
    practice: {start: 0, stop: 42}
    assessment: {start: 42, stop: 60}
distractors:
  - {rule: "strict check need < hours", misconception: predicate-boundary}
  - {rule: "discard mid with hi = mid - 1", misconception: exclude-candidate-mid}
  - {rule: "answer the largest pile", misconception: answer-max-not-min}
  - {rule: "total divided by hours", misconception: predicate-average-shortcut}
items:
  - id: recognise-monotone
    band: 1
    format: mcq
    prompt: "Why can we binary search on the eating speed?"
    options:
      - "If a speed finishes in time, every faster speed does too"
      - "The piles are sorted"
      - "The answer is always the middle pile"
      - "Speeds are whole numbers"
    answer: 0
    misconceptions: [null, pattern-search-needs-sorted-input, confuse-index-value, predicate-not-monotone]
    explanation: "The rule 'finishes in time' flips once from false to true as the speed grows."
  - id: recognise-shape
    band: 1
    format: mcq
    prompt: "Which phrase in a problem hints at binary search on the answer?"
    options:
      - "Minimum capacity such that the work fits in D days"
      - "Number of pairs that sum to K"
      - "Longest run without repeats"
      - "Shortest path in a grid"
    answer: 0
    misconceptions: [null, pattern-brute-force-default, pattern-fixed-vs-variable-window, pattern-search-vs-scan]
    explanation: "Minimise a value subject to a feasibility check that gets easier as the value grows."
  - id: edge-impossible
    band: 5
    format: mcq
    prompt: "Speeds are searched in [1, max(piles)]. If hours equals the number of piles, what is the answer?"
    options:
      - "max(piles): every pile must take exactly one hour"
      - "1"
      - "The average pile"
      - "There is no answer"
    answer: 0
    misconceptions: [null, answer-max-not-min, predicate-average-shortcut, search-range-confusion]
    explanation: "One hour per pile means the speed must cover the largest pile."
  - id: edge-not-monotone
    band: 5
    format: mcq
    prompt: "Which check would make binary search on the answer unsafe?"
    options:
      - "'Exactly 3 piles take more than one hour'"
      - "'Total hours at most H'"
      - "'Largest single pile time at most 2 hours'"
      - "'Every pile finishes within 4 hours'"
    answer: 0
    misconceptions: [null, predicate-not-monotone, predicate-not-monotone, predicate-not-monotone]
    explanation: "'Exactly 3' can turn true then false again as speed grows; the others only become easier."
  - id: transfer-ship
    band: 6
    format: classify
    prompt: "Ship packages in order within D days; find the smallest ship capacity. Approach and cost?"
    options:
      - "Binary search capacity in [max weight, total]; each check is O(n), so O(n log total)"
      - "Sort the packages and pack greedily, O(n log n)"
      - "Try every capacity from 1 up, O(n · total), fine for any input"
      - "Sliding window over the weights"
    answer: 0
    misconceptions: [null, pattern-sort-breaks-order, pattern-brute-force-default, pattern-fixed-vs-variable-window]
    explanation: "Larger capacities never need more days: a monotone check over a numeric range."
  - id: transfer-machines
    band: 6
    format: classify
    prompt: "Machines take k_i seconds per product. Least time to make T products? What do you search?"
    options:
      - "The time t, checking sum(t // k_i) >= T"
      - "The number of machines"
      - "The fastest machine only"
      - "Each product's finishing time in a heap, for any T"
    answer: 0
    misconceptions: [null, search-range-confusion, answer-max-not-min, pattern-brute-force-default]
    explanation: "More time never makes fewer products, so time is the monotone answer."
hint_ladder:
  - What value are you searching for, and in what range?
  - If one speed works, does a faster one work too?
  - Keep a working speed (hi = mid) and discard a failing one (lo = mid + 1).
time_limit_s: 150
provenance:
  origin: original
