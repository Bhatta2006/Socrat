id: quiz:cp:prefix-difference:difference-array
family: difference-array
concept: cp:prefix-difference
pattern: cp:prefix-difference/difference-array
format: output_prediction  # generated items set their own format (predict, fill, fix)
tracks: [competitive, interview]
languages: [python, cpp, java]
generator:
  template: difference_array
  params: {n: [5, 7], updates: [2, 3], value: [1, 5]}
  reference: "apply_updates(n, updates)"
  seeds:
    practice: {start: 0, stop: 42}
    assessment: {start: 42, stop: 60}
distractors:
  - {rule: "print the marks without the running sum", misconception: missing-prefix-sum}
  - {rule: "cancel at r instead of r + 1", misconception: diff-end-off-by-one}
  - {rule: "add instead of subtract at r + 1", misconception: diff-sign-error}
  - {rule: "forget the cancel mark", misconception: diff-missing-end}
items:
  - id: recognise-when
    band: 1
    format: mcq
    prompt: "When does a difference array beat updating every position directly?"
    options:
      - "Many range additions first, and the values are read only at the end"
      - "One addition to a single position"
      - "Each update must be read back before the next one"
      - "The array is sorted"
    answer: 0
    misconceptions: [null, pattern-brute-force-default, diff-online-queries, pattern-search-needs-sorted-input]
    explanation: "Each update costs O(1); one prefix pass at the end builds all values."
  - id: recognise-marks
    band: 1
    format: mcq
    prompt: "To add 5 to positions 2..4 of an array of length 7, which marks go in diff?"
    options: ["+5 at 2, −5 at 5", "+5 at 2, −5 at 4", "+5 at 2..4", "+5 at 4, −5 at 2"]
    answer: 0
    misconceptions: [null, diff-end-off-by-one, pattern-brute-force-default, diff-sign-error]
    explanation: "Start adding at 2 and stop just after 4."
  - id: edge-last-position
    band: 5
    format: mcq
    prompt: "An update covers l..n−1, the last position. Why is diff one longer than the array?"
    options:
      - "So the cancel mark at n has somewhere to go"
      - "To store the total"
      - "Arrays must have even length"
      - "It is not needed; diff[n − 1] works too"
    answer: 0
    misconceptions: [null, confuse-index-value, confuse-index-value, diff-end-off-by-one]
    explanation: "r + 1 = n is one past the end; the spare cell takes the mark and is never read."
  - id: edge-overlap
    band: 5
    format: mcq
    prompt: "Updates (0..2, +1) and (1..3, +2) on length 4. What is the final array?"
    options: ["1 3 3 2", "1 2 2 2", "1 3 3 3", "3 3 3 2"]
    answer: 0
    misconceptions: [null, overwrite-not-accumulate, diff-missing-end, diff-sign-error]
    explanation: "Marks: +1 at 0, −1 at 3, +2 at 1, −2 at 4. Running totals: 1, 3, 3, 2."
  - id: transfer-flights
    band: 6
    format: classify
    prompt: "Bookings reserve s seats on every flight from f to g. Seats on each of n flights? Approach and cost?"
    options:
      - "Difference array over flights, then a prefix pass: O(n + bookings)"
      - "Loop over every booked flight: O(n · bookings) is always fast enough"
      - "Sort the bookings by seats"
      - "A heap of bookings"
    answer: 0
    misconceptions: [null, pattern-brute-force-default, pattern-sort-breaks-order, top-k-direction]
    explanation: "Each booking is a range addition; all values are read at the end."
  - id: transfer-coffee
    band: 6
    format: classify
    prompt: "Recipes recommend temperature ranges; count, for many questions, how many degrees in [a, b] are recommended by at least k recipes. Which tools?"
    options:
      - "Difference array for coverage, then a prefix sum of 'good' degrees per question"
      - "Check every recipe for every question"
      - "Binary search on k"
      - "Sliding window of size k"
    answer: 0
    misconceptions: [null, pattern-brute-force-default, pattern-search-vs-scan, pattern-fixed-vs-variable-window]
    explanation: "Coverage is range additions; answering ranges fast is a second prefix sum."
hint_ladder:
  - What does one update add, and to which positions?
  - Mark +x where the range starts and −x just after it ends.
  - A running total over the marks gives every value.
time_limit_s: 150
provenance:
  origin: original
