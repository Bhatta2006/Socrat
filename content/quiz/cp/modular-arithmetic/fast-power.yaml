id: quiz:cp:modular-arithmetic:fast-power
family: fast-power
concept: cp:modular-arithmetic
pattern: cp:modular-arithmetic/fast-power
format: output_prediction  # generated items set their own format (predict, fill, fix)
tracks: [competitive, interview]
languages: [python, cpp, java]
generator:
  template: fast_power
  params: {base: [2, 50], exp: [5, 60], mod: [100, 997, 1000, 1009, 10007]}
  reference: "pow(base, exp, mod)"
  seeds:
    practice: {start: 0, stop: 42}
    assessment: {start: 42, stop: 60}
distractors:
  - {rule: "one power too few or too many", misconception: off-by-one-output}
  - {rule: "base times exp", misconception: power-as-multiply}
  - {rule: "half the exponent", misconception: fast-power-step}
items:
  - id: recognise-why-fast
    band: 1
    format: mcq
    prompt: "How many multiplications does repeated squaring need for base^e?"
    options: ["About 2·log2(e)", "e − 1", "e²", "Always 64"]
    answer: 0
    misconceptions: [null, power-as-repeat, power-as-repeat, fast-power-step]
    explanation: "One squaring per bit, plus one multiply per 1 bit."
  - id: recognise-bits
    band: 1
    format: mcq
    prompt: "3^13: 13 is 1101 in binary. Which powers of 3 are multiplied together?"
    options: ["3^1 · 3^4 · 3^8", "3^1 · 3^2 · 3^8", "3^13 directly", "3^4 · 3^8"]
    answer: 0
    misconceptions: [null, fast-power-parity, power-as-repeat, skip-first-element]
    explanation: "13 = 8 + 4 + 1, so the factors are 3^8, 3^4 and 3^1."
  - id: edge-overflow
    band: 5
    format: mcq
    prompt: "mod is about 10^9 and values are stored in 32-bit ints. Where does fast power break?"
    options:
      - "result * b can reach 10^18 and overflow; use 64-bit before reducing"
      - "Nowhere: % mod keeps every value small"
      - "Only when exp is 0"
      - "The loop never ends"
    answer: 0
    misconceptions: [null, mod-only-at-end, fast-power-parity, fast-power-step]
    explanation: "Each factor is below mod, but their product before % can be mod² ≈ 10^18."
  - id: edge-zero-exponent
    band: 5
    format: mcq
    prompt: "What should fast power return for exp = 0, and does the loop handle it?"
    options:
      - "1, and yes: the loop never runs and result stays 1"
      - "0, because nothing is multiplied"
      - "base"
      - "It needs a special case"
    answer: 0
    misconceptions: [null, product-init-zero, power-as-multiply, filter-empty-crash]
    explanation: "Any base to the power 0 is 1, the starting value of result."
  - id: transfer-bit-strings
    band: 6
    format: classify
    prompt: "How many bit strings of length n exist, mod 10^9 + 7, for n up to 10^6? Which tool?"
    options: ["2^n with fast power (or a loop of doublings)", "Generate all strings", "Binary search on n", "Sort the strings"]
    answer: 0
    misconceptions: [null, pattern-brute-force-default, pattern-search-vs-scan, pattern-sort-breaks-order]
    explanation: "Each position has 2 choices: 2^n, reduced mod 10^9 + 7."
  - id: transfer-inverse
    band: 6
    format: classify
    prompt: "Divide by b modulo a prime p (binomial coefficients). How do you compute 1/b mod p?"
    options:
      - "b^(p − 2) mod p with fast power (Fermat's little theorem)"
      - "Integer division b / p"
      - "Floating-point 1.0 / b"
      - "Try every x until b·x = 1, for any p"
    answer: 0
    misconceptions: [null, mod-division, mod-division, pattern-brute-force-default]
    explanation: "For prime p, b^(p−1) ≡ 1, so b^(p−2) is the inverse of b."
hint_ladder:
  - Write the exponent in binary.
  - b runs through base^1, base^2, base^4, …; when is it multiplied into the result?
  - Multiply on 1 bits, square b every step, halve e, and reduce mod every time.
time_limit_s: 150
provenance:
  origin: original
