id: quiz:cp:complete-search:subset-enumeration
family: subset-enumeration
concept: cp:complete-search
pattern: cp:complete-search/subset-enumeration
format: output_prediction  # generated items set their own format (predict, fill, fix)
tracks: [competitive, interview]
languages: [python, cpp, java]
generator:
  template: subset_enumeration
  params: {n: [4, 6], value: [1, 6]}
  reference: "subsets_with_sum(a, target)"
  seeds:
    practice: {start: 0, stop: 42}
    assessment: {start: 42, stop: 60}
distractors:
  - {rule: "count sums up to the target", misconception: exact-vs-at-least}
  - {rule: "miss the last element", misconception: subset-count-off-by-one}
  - {rule: "count all subsets", misconception: subsets-vs-elements}
items:
  - id: recognise-size
    band: 1
    format: mcq
    prompt: "Up to which n is trying every subset (2^n of them) usually fine in one second?"
    options: ["About 20–25", "About 1,000", "About 100", "Any n"]
    answer: 0
    misconceptions: [null, subsets-linear, subsets-linear, pattern-brute-force-default]
    explanation: "2^20 is about a million subsets; each also costs O(n) to read."
  - id: recognise-mask
    band: 1
    format: mcq
    prompt: "With 3 elements, which subset is mask 5 (binary 101)?"
    options: ["Elements 0 and 2", "Elements 1 and 2", "Element 5", "Elements 0 and 1"]
    answer: 0
    misconceptions: [null, bit-test-wrong, confuse-index-value, bit-test-wrong]
    explanation: "Bit 0 and bit 2 are set, so a[0] and a[2] are in the subset."
  - id: edge-empty-subset
    band: 5
    format: mcq
    prompt: "Counting subsets with sum 0 in a list of positive values: what is the answer, and which mask gives it?"
    options:
      - "1: mask 0, the empty subset"
      - "0: no element is 0"
      - "2^n"
      - "n"
    answer: 0
    misconceptions: [null, skip-empty-subset, subsets-vs-elements, subsets-linear]
    explanation: "The empty subset sums to 0; skipping mask 0 would miss it."
  - id: edge-reset-total
    band: 5
    format: mcq
    prompt: "In the mask loop, where must total = 0 go?"
    options:
      - "Inside the mask loop, before the bit loop"
      - "Before the mask loop"
      - "Inside the bit loop"
      - "After the comparison"
    answer: 0
    misconceptions: [null, missing-reset, reset-inside-loop, missing-reset]
    explanation: "Each subset needs its own fresh total."
  - id: transfer-apples
    band: 6
    format: classify
    prompt: "Split n ≤ 20 apples into two groups with the smallest weight difference. Which approach and cost?"
    options:
      - "Try every subset as group one: O(2^n · n)"
      - "Sort and alternate apples between groups"
      - "Greedy: put each apple in the lighter group"
      - "Binary search on the difference"
    answer: 0
    misconceptions: [null, pattern-sort-breaks-order, greedy-partition, pattern-search-vs-scan]
    explanation: "With n ≤ 20 every split can be checked; greedy splits can miss the best one."
  - id: transfer-meet-in-middle
    band: 6
    format: classify
    prompt: "Count subsets with sum x, but now n ≤ 40. What changes?"
    options:
      - "Enumerate each half (2^20 each) and combine the sums: meet in the middle"
      - "Plain bitmask enumeration still works"
      - "Use a sliding window"
      - "Fast power on 2^40"
    answer: 0
    misconceptions: [null, subsets-linear, pattern-fixed-vs-variable-window, power-as-multiply]
    explanation: "2^40 is too many; two halves of 2^20 are fine."
hint_ladder:
  - How many subsets does a list of n values have?
  - In mask, bit i says whether a[i] is chosen.
  - For every mask, add up the chosen values and compare with the target.
time_limit_s: 150
provenance:
  origin: original
