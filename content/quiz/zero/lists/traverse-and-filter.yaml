id: quiz:zero:lists:traverse-and-filter
family: traverse-and-filter
concept: zero:lists
pattern: zero:lists/traverse-and-filter
format: output_prediction  # generated items set their own format (predict, fill, fix)
tracks: [foundations]
languages: [python, cpp, java]
generator:
  template: traverse_and_filter
  params: {n: [5, 8], value: [1, 20]}
  reference: "total_above(values, limit)"
  seeds:
    practice: {start: 0, stop: 42}
    assessment: {start: 42, stop: 60}
distractors:
  - {rule: ">= instead of >", misconception: filter-boundary}
  - {rule: "count instead of total", misconception: count-not-sum}
  - {rule: "add every value", misconception: filter-ignored}
  - {rule: "keep the values below", misconception: filter-inverted}
items:
  - id: recognise-shape
    band: 1
    format: mcq
    prompt: "Which three parts does a traverse-and-filter loop need?"
    options:
      - "A starting result, a test per value, an update when it passes"
      - "Only a loop and a print"
      - "A sorted list and a binary search"
      - "A result reset to 0 inside the loop"
    answer: 0
    misconceptions: [null, filter-ignored, pattern-search-needs-sorted-input, reset-inside-loop]
    explanation: "Start the result once, test each value, and update only for values that pass."
  - id: recognise-reset
    band: 1
    format: mcq
    prompt: "A loop sets total = 0 as its first line inside the loop. What will it print?"
    options:
      - "Only the last passing value (or 0)"
      - "The correct total"
      - "Twice the total"
      - "Nothing: it crashes"
    answer: 0
    misconceptions: [null, reset-inside-loop, count-vs-sum, reset-inside-loop]
    explanation: "Each pass wipes what earlier passes added."
  - id: edge-empty
    band: 5
    format: mcq
    prompt: "The list is empty. What should 'total of values above 10' print, and does the loop need a special case?"
    options:
      - "0, and no special case: the loop body never runs"
      - "Nothing; empty lists crash the loop"
      - "10"
      - "-1 to signal no values"
    answer: 0
    misconceptions: [null, filter-empty-crash, bound-instead-of-variable, missing-unreachable-check]
    explanation: "The total starts at 0 and stays 0, which is the correct answer."
  - id: edge-average
    band: 5
    format: mcq
    prompt: "Count values above the average of 1 2 3 4 10. Why can't one loop do it?"
    options:
      - "The average (4) is only known after a first pass, so a second pass filters"
      - "One loop is enough if you sort first"
      - "Averages cannot be compared with values"
      - "It can: compare each value with the running average"
    answer: 0
    misconceptions: [null, pattern-sort-breaks-order, confuse-index-value, filter-running-average]
    explanation: "First compute the total and average, then traverse again to filter: only 10 is above 4."
  - id: transfer-passing
    band: 6
    format: classify
    prompt: "Print how many students scored at least 50. Which loop body?"
    options:
      - "if score >= 50: count += 1"
      - "if score > 50: count += 1"
      - "count += score"
      - "if score >= 50: count = 1"
    answer: 0
    misconceptions: [null, filter-boundary, count-vs-sum, overwrite-not-accumulate]
    explanation: "At least 50 includes 50, and the count goes up by one per student."
  - id: transfer-two-results
    band: 6
    format: classify
    prompt: "From a list of temperatures, find both how many were below 0 and their total. What do you keep?"
    options:
      - "Two results, both starting at 0, updated under the same test"
      - "One result for each temperature"
      - "Only the total; the count can be guessed"
      - "Sort the list first and use the middle value"
    answer: 0
    misconceptions: [null, filter-ignored, count-vs-sum, pattern-sort-breaks-order]
    explanation: "One traversal can update several results when the same test passes."
hint_ladder:
  - What should the result hold when the loop ends?
  - Which values pass the test? Check the ones equal to the limit.
  - Start at 0, test each value, and add only the values that pass.
time_limit_s: 90
provenance:
  origin: original
