id: quiz:zero:strings:frequency-count
family: frequency-count
concept: zero:strings
pattern: zero:strings/frequency-count
format: output_prediction  # generated items set their own format (predict, fill, fix)
tracks: [foundations]
languages: [python, cpp, java]
generator:
  template: frequency_count
  params: {alphabet: [3, 6], length: [6, 11]}
  reference: "most_common(text)"
  seeds:
    practice: {start: 0, stop: 42}
    assessment: {start: 42, stop: 60}
distractors:
  - {rule: "number of different letters", misconception: distinct-vs-frequency}
  - {rule: "length of the whole text", misconception: count-all-not-each}
  - {rule: "count of the first letter only", misconception: first-char-only}
items:
  - id: recognise-counter-per-letter
    band: 1
    format: mcq
    prompt: "Why does a letter-frequency program keep 26 counters instead of one?"
    options:
      - "Each letter needs its own count"
      - "One counter would overflow"
      - "26 counters make the loop faster"
      - "Only vowels are counted"
    answer: 0
    misconceptions: [null, frequency-single-bucket, frequency-single-bucket, first-char-only]
    explanation: "A single counter would only know how many letters there are in total."
  - id: recognise-index
    band: 1
    format: mcq
    prompt: "Which counter does the letter 'c' use when counts[0] is for 'a'?"
    options: ["counts[2]", "counts[3]", "counts[99]", "counts[0]"]
    answer: 0
    misconceptions: [null, off-by-one-output, confuse-index-value, frequency-single-bucket]
    explanation: "'c' − 'a' = 2: a → 0, b → 1, c → 2."
  - id: edge-capitals
    band: 5
    format: mcq
    prompt: "The text 'Banana' has a capital B. What goes wrong with counts[ch − 'a'] and how do you fix it?"
    options:
      - "'B' − 'a' is negative; lower-case each letter first"
      - "Nothing; capitals count as lower case"
      - "B lands in counts[1], which is fine"
      - "The loop skips capitals"
    answer: 0
    misconceptions: [null, case-insensitive-assumption, case-insensitive-assumption, first-char-only]
    explanation: "Capital letters come before lower case in character codes, so the index is out of range."
  - id: edge-ties
    band: 5
    format: mcq
    prompt: "In 'abab', which letter is most common, if ties go to the alphabetically first one?"
    options: ["a", "b", "Neither: there is no answer", "ab"]
    answer: 0
    misconceptions: [null, tie-break-ignored, missing-unreachable-check, distinct-vs-frequency]
    explanation: "Both appear twice; scanning counts from a to z and keeping only strictly larger counts keeps 'a'."
  - id: transfer-anagram
    band: 6
    format: classify
    prompt: "Are two words anagrams of each other? Which approach fits?"
    options:
      - "Count letters in both and compare the 26 counters"
      - "Compare the words letter by letter"
      - "Compare their lengths only"
      - "Count only the first letter of each"
    answer: 0
    misconceptions: [null, order-matters-assumption, count-all-not-each, first-char-only]
    explanation: "Anagrams have the same count for every letter, in any order."
  - id: transfer-ransom
    band: 6
    format: classify
    prompt: "Can a note be built from the letters of a magazine, each letter used once? Which check?"
    options:
      - "For every letter, note count ≤ magazine count"
      - "The note is shorter than the magazine"
      - "Every note letter appears somewhere in the magazine"
      - "The most common letters match"
    answer: 0
    misconceptions: [null, count-all-not-each, distinct-vs-frequency, frequency-max-only]
    explanation: "Each letter must be available often enough, not just once."
hint_ladder:
  - What does each counter stand for?
  - Walk through the text and add 1 to the counter of each letter you see.
  - After the loop, the largest counter is the answer.
time_limit_s: 90
provenance:
  origin: original
