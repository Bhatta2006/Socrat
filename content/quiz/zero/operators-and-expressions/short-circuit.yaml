  - short-circuit-order
  - boolean-logic-repair
  - short-circuit-order
  explanation: or stops at the first true.
- id: single-amp
  band: 3
  format: classify
  prompt: In Java, why is (d != 0 & n % d == 0) unsafe for d = 0?
  options:
  - '& evaluates both sides, so n % 0 still runs'
  - '& is not allowed on booleans'
  - It is safe
  - '& only checks the right side'
  answer: 0
