- id: or-stop
  band: 2
  format: trace
  prompt: x = 5. In x > 3 or y > 10, is y > 10 evaluated?
  options:
  - No; the left side is already true
  - Yes, always
  - Only if y exists
  - It raises an error
  answer: 0
  misconceptions:
