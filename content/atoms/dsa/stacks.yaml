- objective: Last-in-first-out and first-in-first-out containers, and the monotonic stack trick for "next
    greater" questions.
  seconds: 20
  id: hook
  kind: hook
  title: Why this matters
  body: In an interview, explain the invariant before reaching for a template. A stack reverses the order
    in which values become available.
- objective: Last-in-first-out and first-in-first-out containers, and the monotonic stack trick for "next
    greater" questions.
  seconds: 60
  id: concept
  kind: concept
  title: Stacks, queues and monotonic stacks
  body: A stack reverses the order in which values become available. After pushing 2 then 5, the next
    value removed is 5.
  why: Stack = LIFO, queue = FIFO; both O(1) per operation with the right container. A stack holds the
    most recent unfinished item — perfect for matching brackets.
- objective: Last-in-first-out and first-in-first-out containers, and the monotonic stack trick for "next
    greater" questions.
  seconds: 60
  id: worked
  kind: worked
  title: One worked example
  body: A stack reverses the order in which values become available. After pushing 2 then 5, the next
    value removed is 5.
  why: The last value pushed is the first removed.
  adapters:
    python:
      code: 'stack=[2,5]

        print(stack.pop())

        '
      expected: '5

        '
    cpp:
      code: "#include <bits/stdc++.h>\nusing namespace std;\nint main() {\n    vector<int> stack={2,5};\
        \ cout << stack.back() << \"\\n\"; stack.pop_back();\n}\n"
      expected: '5

        '
    java:
      code: "import java.util.*;\npublic class Solution {\n  public static void main(String[] args) {\n\
        \    Deque<Integer> stack=new ArrayDeque<>(); stack.push(2); stack.push(5); System.out.println(stack.pop());\n\
        \  }\n}\n"
      expected: '5

        '
