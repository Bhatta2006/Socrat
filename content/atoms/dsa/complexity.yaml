  title: Recognise the strategy
  body: One visit per record gives linear work. Count the cost of the operation inside a loop as well
    as the loop iterations. A linear membership scan repeated n times is quadratic work.
  why: Apply this reasoning to a fresh problem; an earlier worked example is not independent evidence.
