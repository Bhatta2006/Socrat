- objective: Predict how running time and memory grow with input size using Big-O, before you write a
    line.
  seconds: 20
  id: hook
  kind: hook
  title: Why this matters
  body: In an interview, explain the invariant before reaching for a template. A loop touching each of
    four records performs four visits.
- objective: Predict how running time and memory grow with input size using Big-O, before you write a
    line.
  seconds: 60
  id: concept
  kind: concept
  title: Time and space complexity
  body: A loop touching each of four records performs four visits. Doubling the records doubles this loop
    work.
  why: Big-O describes growth with input size, ignoring constants and lower terms. Sequential code adds,
    nested loops multiply, halving gives log n.
- objective: Predict how running time and memory grow with input size using Big-O, before you write a
    line.
  seconds: 60
  id: worked
  kind: worked
  title: One worked example
  body: A loop touching each of four records performs four visits. Doubling the records doubles this loop
    work.
  why: One visit per record gives linear work.
  adapters:
    python:
      code: "visits=0\nfor _ in range(4):\n    visits+=1\nprint(visits)\n"
      expected: '4

        '
    cpp:
      code: "#include <bits/stdc++.h>\nusing namespace std;\nint main() {\n    int visits=0; for(int i=0;i<4;++i)\
        \ ++visits; cout << visits << \"\\n\";\n}\n"
      expected: '4

        '
    java:
      code: "import java.util.*;\npublic class Solution {\n  public static void main(String[] args) {\n\
        \    int visits=0; for(int i=0;i<4;++i) ++visits; System.out.println(visits);\n  }\n}\n"
      expected: '4

        '
