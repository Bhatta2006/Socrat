  seconds: 60
  id: micro
  kind: micro
  title: 'Repair: Time and space complexity'
  body: Count the cost of the operation inside a loop as well as the loop iterations. A linear membership
    scan repeated n times is quadratic work.
  misconception: complexity-repair
- objective: Predict how running time and memory grow with input size using Big-O, before you write a
