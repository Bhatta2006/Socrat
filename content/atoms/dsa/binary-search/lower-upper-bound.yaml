status: draft
provenance:
  origin: original
atoms:
  - id: bounds-worked
    kind: worked
    title: "Worked: lower bound of 4 in 2 4 4 4 7"
    objective: Keep the answer inside the half-open range [lo, hi) at every step.
    seconds: 90
    body: >-
      lo = 0, hi = 5. mid = 2: a[2] = 4 is not less than 4, so the answer is mid or left of it:
      hi = 2. mid = 1: a[1] = 4, again hi = 1. mid = 0: a[0] = 2 is less than 4, so the answer
      is right of it: lo = 1. Now lo == hi == 1: the first 4 is at index 1. For the upper bound,
      search for 5 the same way and get 4. There are 4 − 1 = 3 fours.
    why: hi = mid keeps a possible answer; lo = mid + 1 discards one that is too small.
  - id: bounds-faded
    kind: faded
    title: "Your turn: lower bound of 6"
    objective: Choose each update yourself.
    seconds: 90
    body: Array 1 3 5 7 9, x = 6. Start with lo = 0, hi = 5.
    steps:
      - state: "lo = 0, hi = 5, mid = 2, a[2] = 5."
        prompt: "Which update?"
        options: ["lo = 3", "hi = 2", "lo = 2"]
        answer: 0
        explanation: "5 < 6, so the answer is right of mid: lo = mid + 1 = 3."
      - state: "lo = 3, hi = 5, mid = 4, a[4] = 9."
        prompt: "Which update?"
        options: ["hi = 4", "lo = 5", "hi = 3"]
        answer: 0
        explanation: "9 is at least 6 and may be the answer: hi = mid = 4."
      - state: "lo = 3, hi = 4, mid = 3, a[3] = 7."
        prompt: "What does the search return?"
        options: ["3", "4", "2"]
        answer: 0
        explanation: "7 is at least 6: hi = 3, and lo == hi == 3."
  - id: bounds-visualizer
    kind: visualizer
    title: "Step through: x larger than everything"
    objective: See the search return n when nothing qualifies.
    seconds: 100
    body: Array 2 4 6, x = 10. Predict each step.
    steps:
      - state: "lo = 0, hi = 3."
        prompt: "mid = 1, a[1] = 4. Next range?"
        options: ["lo = 2, hi = 3", "lo = 0, hi = 1", "lo = 1, hi = 3"]
        answer: 0
        explanation: "4 < 10, so lo = mid + 1 = 2."
      - state: "lo = 2, hi = 3."
        prompt: "mid = 2, a[2] = 6. Next range?"
        options: ["lo = 3, hi = 3", "lo = 2, hi = 2", "lo = 2, hi = 3"]
        answer: 0
        explanation: "6 < 10, so lo = 3; the loop stops."
      - state: "lo = hi = 3."
        prompt: "What does 3 mean here?"
        options: ["No value is at least 10", "The last index", "x is at index 3"]
        answer: 0
        explanation: "3 is one past the end: nothing qualifies, and inserting 10 would go there."
      - state: "Same search with hi = n − 1 = 2."
        prompt: "What would it return?"
        options: ["2, which wrongly points at 6", "3", "It loops forever"]
        answer: 0
        explanation: "With a closed hi the search can never return n."
  - id: bounds-micro
    kind: micro
    title: "Pitfall: < versus <="
    objective: Know which comparison gives the lower bound and which the upper.
    seconds: 75
    misconception: lower-vs-upper-bound
    body: >-
      if a[mid] < x moves past values smaller than x, so it stops at the first value at least x:
      the lower bound. if a[mid] <= x also moves past values equal to x, so it stops at the first
      value greater than x: the upper bound. In 2 4 4 4 7 with x = 4, the first gives 1 and the
      second gives 4. Pick the comparison from the question: at least, or greater than?
    why: One character decides which side of the equal values the search ends on.
  - id: bounds-classify
    kind: classify
    title: "Which bound?"
    objective: Map questions to lower bound, upper bound or both.
    seconds: 90
    body: For each question about a sorted array, choose the tool.
    steps:
      - state: "First score of at least 60."
        prompt: "Which tool?"
        options: ["Lower bound of 60", "Upper bound of 60", "Linear scan"]
        answer: 0
        explanation: "At least means the lower bound."
      - state: "How many scores equal 60?"
        prompt: "Which tool?"
        options: ["upper_bound(60) − lower_bound(60)", "lower_bound(60) − 1", "Binary search for 60 once"]
        answer: 0
        explanation: "The equal values sit between the two bounds."
      - state: "Last score below 60."
        prompt: "Which tool?"
        options: ["lower_bound(60) − 1", "upper_bound(60)", "lower_bound(59)"]
        answer: 0
        explanation: "Everything before the first score of at least 60 is below 60."
