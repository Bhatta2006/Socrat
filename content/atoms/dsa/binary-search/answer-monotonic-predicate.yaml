status: draft
provenance:
  origin: original
atoms:
  - id: answer-search-worked
    kind: worked
    title: "Worked: piles 3 6 7 11 in 8 hours"
    objective: Search the answer range with a monotone feasibility check.
    seconds: 100
    body: >-
      A speed s eats a pile p in ceil(p / s) hours. Speeds run from 1 to 11. Try 6: 1 + 1 + 2 + 2
      = 6 hours, fits, so keep it: hi = 6. Try 3: 1 + 2 + 3 + 4 = 10, too slow: lo = 4. Try 5:
      1 + 2 + 2 + 3 = 8, fits: hi = 5. Try 4: 1 + 2 + 2 + 3 = 8, fits: hi = 4. lo == hi == 4,
      so the slowest speed that fits is 4.
    why: Faster never needs more hours, so the fitting speeds form one block at the top of the range.
  - id: answer-search-faded
    kind: faded
    title: "Your turn: piles 4 9 in 5 hours"
    objective: Run the check and choose each update.
    seconds: 90
    body: Speeds run from 1 to 9.
    steps:
      - state: "lo = 1, hi = 9, mid = 5. Hours: ceil(4/5) + ceil(9/5) = 1 + 2 = 3."
        prompt: "Which update?"
        options: ["hi = 5", "lo = 6", "hi = 4"]
        answer: 0
        explanation: "3 hours fits within 5, so 5 may be the answer: keep it."
      - state: "lo = 1, hi = 5, mid = 3. Hours: 2 + 3 = 5."
        prompt: "Which update?"
        options: ["hi = 3", "lo = 4", "hi = 2"]
        answer: 0
        explanation: "Exactly 5 hours is allowed, so 3 works: hi = 3."
      - state: "lo = 1, hi = 3, mid = 2. Hours: 2 + 5 = 7."
        prompt: "What is the final answer?"
        options: ["3", "2", "4"]
        answer: 0
        explanation: "7 is too slow: lo = 3, and lo == hi == 3."
  - id: answer-search-visualizer
    kind: visualizer
    title: "Step through: the yes/no line"
    objective: See the check as false … false true … true over the range.
    seconds: 100
    body: Piles 5 5, 4 hours. The check is ceil(5/s) + ceil(5/s) <= 4.
    steps:
      - state: "Speeds 1 to 5. Check at 1: 10 hours."
        prompt: "Is speed 1 feasible?"
        options: ["No", "Yes"]
        answer: 0
        explanation: "10 hours is more than 4."
      - state: "Check at 2: 3 + 3 = 6 hours."
        prompt: "Feasible?"
        options: ["No", "Yes"]
        answer: 0
        explanation: "6 is more than 4."
      - state: "Check at 3: 2 + 2 = 4 hours."
        prompt: "Feasible, and what about 4 and 5?"
        options: ["Yes, and they are too", "Yes, but 4 and 5 are not", "No"]
        answer: 0
        explanation: "Faster speeds never need more hours: the line reads no, no, yes, yes, yes."
      - state: "The search looks for the first yes."
        prompt: "What does it return?"
        options: ["3", "5", "2"]
        answer: 0
        explanation: "The first feasible speed is 3."
  - id: answer-search-micro
    kind: micro
    title: "Pitfall: a check that is not monotone"
    objective: Prove the check flips only once before searching.
    seconds: 80
    misconception: predicate-not-monotone
    body: >-
      Binary search throws away half the range after one check. That is only safe if the
      answers form one block: all no, then all yes. "Finishes within H hours" is safe, because a
      faster speed never needs more hours. "Takes exactly H hours" is not: with piles 5 5 and
      H = 4, speeds 1 to 5 need 10, 6, 4, 4 and 2 hours, so the answers read no, no, yes, yes,
      no. Before searching, say in one sentence why a larger value can never turn a yes into a no.
    why: Without monotonicity, the discarded half may hold the answer.
  - id: answer-search-classify
    kind: classify
    title: "Search the answer?"
    objective: Spot problems where the answer itself is searched.
    seconds: 90
    body: For each problem, choose the best-fitting approach.
    steps:
      - state: "Smallest daily reading pace to finish a book list within 30 days, books in order."
        prompt: "Which approach?"
        options: ["Binary search on the pace", "Sort the books", "Sliding window"]
        answer: 0
        explanation: "A faster pace never needs more days: monotone check over the pace."
      - state: "First index in a sorted list with value at least 50."
        prompt: "Which approach?"
        options: ["Lower bound on the array", "Binary search on the answer value", "Two pointers"]
        answer: 0
        explanation: "The search is over positions in the array, not over a range of answers."
      - state: "Longest run of days with total rain at most 40 mm."
        prompt: "Which approach?"
        options: ["Variable-size window", "Binary search on the answer", "Heap"]
        answer: 0
        explanation: "A window over positive values solves it in O(n); no answer search is needed."
