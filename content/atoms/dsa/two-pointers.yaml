  body: In an interview, explain the invariant before reaching for a template. For sorted values 1, 4
    and 8, the outer pair sums to 9.
- objective: Move two indexes through sorted or structured data to replace an O(n²) pair search with one
    O(n) sweep.
  seconds: 60
  id: concept
  kind: concept
  title: Two pointers
  body: For sorted values 1, 4 and 8, the outer pair sums to 9. Ordering tells us which endpoint can improve
    a sum.
  why: Two indexes, each moving at most n times, give an O(n) sweep. Opposite ends on sorted data — move
    the pointer that cannot be part of an answer.
- objective: Move two indexes through sorted or structured data to replace an O(n²) pair search with one
    O(n) sweep.
  seconds: 60
  id: worked
  kind: worked
  title: One worked example
  body: For sorted values 1, 4 and 8, the outer pair sums to 9. Ordering tells us which endpoint can improve
    a sum.
  why: Sorted order is what justifies discarding an endpoint.
  adapters:
    python:
      code: 'values=[1,4,8]

        print(values[0]+values[-1])

        '
      expected: '9

        '
    cpp:
      code: "#include <bits/stdc++.h>\nusing namespace std;\nint main() {\n    vector<int> a={1,4,8};\
        \ cout << a.front()+a.back() << \"\\n\";\n}\n"
      expected: '9

        '
    java:
      code: "import java.util.*;\npublic class Solution {\n  public static void main(String[] args) {\n\
        \    int[] a={1,4,8}; System.out.println(a[0]+a[a.length-1]);\n  }\n}\n"
      expected: '9

        '
