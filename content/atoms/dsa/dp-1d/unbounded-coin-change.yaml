  origin: original
atoms:
  - id: coin-change-worked
    kind: worked
    title: "Worked: coins 1 3 4, amount 6"
    objective: Fill dp from 0 upward, trying each coin as the last one.
    seconds: 100
    body: >-
      dp[0] = 0. dp[1] = dp[0] + 1 = 1. dp[2] = dp[1] + 1 = 2. dp[3]: via 1, dp[2] + 1 = 3; via
      3, dp[0] + 1 = 1; so 1. dp[4]: via 4, dp[0] + 1 = 1. dp[5]: via 1, dp[4] + 1 = 2; via 4,
      dp[1] + 1 = 2; so 2. dp[6]: via 1, 3; via 3, dp[3] + 1 = 2; via 4, dp[2] + 1 = 3; so 2.
      Answer: 2 coins (3 + 3). Greedy would take 4 + 1 + 1 = 3 coins.
    why: Each dp[a] only looks at smaller amounts, which are already final.
  - id: coin-change-faded
    kind: faded
    title: "Your turn: coins 2 5, amount 9"
    objective: Apply the transition and handle unreachable amounts.
    seconds: 90
    body: INF marks amounts no mix reaches yet.
    steps:
      - state: "dp[0] = 0, dp[1] = INF, dp[2] = 1, dp[3] = INF, dp[4] = 2."
        prompt: "What is dp[5]?"
        options: ["1", "INF", "3"]
        answer: 0
        explanation: "Via 5: dp[0] + 1 = 1. Via 2: dp[3] is INF."
      - state: "dp[5] = 1, dp[6] = 3, dp[7] = 2."
        prompt: "What is dp[9]? (dp[8] = 4)"
        options: ["3", "5", "INF"]
        answer: 0
        explanation: "Via 2: dp[7] + 1 = 3. Via 5: dp[4] + 1 = 3. Both give 3."
      - state: "Same coins, amount 3."
        prompt: "What should the program print?"
        options: ["-1", "INF", "2"]
        answer: 0
        explanation: "dp[3] stays INF: no mix of 2 and 5 makes 3, so print -1."
  - id: coin-change-visualizer
    kind: visualizer
    title: "Step through: one cell at a time"
    objective: Predict each dp cell for coins 1 and 4.
    seconds: 100
    body: Coins 1 and 4, amounts 0 to 8.
    steps:
      - state: "dp = 0 1 2 3 _ (amounts 0 to 4)."
        prompt: "dp[4]?"
        options: ["1", "4", "2"]
        answer: 0
        explanation: "Coin 4 from dp[0]: one coin."
      - state: "dp = 0 1 2 3 1 _."
        prompt: "dp[5]?"
        options: ["2", "5", "1"]
        answer: 0
        explanation: "Via 4: dp[1] + 1 = 2."
      - state: "dp = 0 1 2 3 1 2 3 4 _."
        prompt: "dp[8]?"
        options: ["2", "5", "3"]
        answer: 0
        explanation: "Via 4: dp[4] + 1 = 2 (4 + 4)."
      - state: "Every cell used only cells to its left."
        prompt: "In what order must the amounts be filled?"
        options: ["Small to large", "Large to small", "Any order"]
        answer: 0
        explanation: "dp[a] reads dp[a − c], so smaller amounts must be ready first."
  - id: coin-change-micro
    kind: micro
    title: "Pitfall: greedy coins"
    objective: Know why largest-first can fail.
    seconds: 70
    misconception: greedy-coin-change
    body: >-
      Taking the largest coin that fits feels right, and it works for 1, 5, 10, 25. It fails for
      1, 3, 4 and amount 6: greedy takes 4, then 1 and 1, three coins, but 3 + 3 uses two. A big
      coin early can leave an awkward remainder. The DP tries every coin as the last one, so it
      never commits too early.
    why: Greedy is only safe for special coin systems; DP is safe for all.
  - id: coin-change-classify
    kind: classify
    title: "Which pattern?"
    objective: Separate unbounded coin change from its neighbours.
    seconds: 90
    body: For each problem, choose the best-fitting approach.
    steps:
      - state: "Fewest stamps (values 2, 5, 7, unlimited) to post a 23-cent letter."
        prompt: "Which approach?"
        options: ["Unbounded coin change DP", "Greedy largest stamp", "0/1 knapsack"]
        answer: 0
        explanation: "Unlimited supply and an exact total: fewest-coins DP."
      - state: "Choose some of 10 items, each at most once, to maximise value within weight 50."
        prompt: "Which approach?"
        options: ["0/1 knapsack", "Unbounded coin change DP", "Sliding window"]
        answer: 0
        explanation: "Each item at most once is 0/1, not unbounded."
      - state: "Number of different ways to climb n stairs taking 1 or 2 steps."
        prompt: "Which approach?"
        options: ["Counting DP over ordered steps", "Fewest-coins DP", "Greedy"]
        answer: 0
        explanation: "It counts ordered ways rather than minimising pieces."
