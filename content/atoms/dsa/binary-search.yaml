- objective: Halve the search space each step — on sorted arrays and on the answer itself.
  seconds: 60
  id: micro
  kind: micro
  title: 'Repair: Binary search'
  body: Choose one interval convention and keep it throughout. In [lo,hi), a false midpoint moves lo to
    mid+1; a true midpoint sets hi=mid.
