- objective: Halve the search space each step — on sorted arrays and on the answer itself.
  seconds: 60
  id: concept
  kind: concept
  title: Binary search
  body: Search sorted values 2, 5 and 9 for the first value at least 6. Keeping only the half that can
    contain the boundary gives index 2.
  why: Binary search halves the range each step — O(log n). Use one template - the first index where a
    monotonic condition becomes true.
- objective: Halve the search space each step — on sorted arrays and on the answer itself.
  seconds: 60
  id: worked
  kind: worked
  title: One worked example
  body: Search sorted values 2, 5 and 9 for the first value at least 6. Keeping only the half that can
    contain the boundary gives index 2.
  why: Each update preserves the boundary and shrinks the remaining interval.
  adapters:
    python:
      code: "a=[2,5,9]\nlo,hi=0,len(a)\nwhile lo<hi:\n    mid=(lo+hi)//2\n    if a[mid]>=6: hi=mid\n \
        \   else: lo=mid+1\nprint(lo)\n"
      expected: '2

        '
    cpp:
      code: "#include <bits/stdc++.h>\nusing namespace std;\nint main() {\n    vector<int> a={2,5,9};\
        \ int lo=0,hi=a.size(); while(lo<hi){int mid=lo+(hi-lo)/2; if(a[mid]>=6) hi=mid; else lo=mid+1;}\
        \ cout << lo << \"\\n\";\n}\n"
      expected: '2

        '
    java:
      code: "import java.util.*;\npublic class Solution {\n  public static void main(String[] args) {\n\
        \    int[] a={2,5,9}; int lo=0,hi=a.length; while(lo<hi){int mid=lo+(hi-lo)/2; if(a[mid]>=6) hi=mid;\
        \ else lo=mid+1;} System.out.println(lo);\n  }\n}\n"
      expected: '2

        '
