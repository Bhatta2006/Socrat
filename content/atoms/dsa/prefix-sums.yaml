  seconds: 60
  id: worked
  kind: worked
  title: One worked example
  body: A prefix total includes everything before a boundary. Subtracting two boundaries leaves only the
    requested range.
  why: Subtracting the prefix before the range removes earlier values.
  adapters:
    python:
      code: 'p=[0,2,7,10]

        print(p[3]-p[1])

        '
      expected: '8

        '
    cpp:
      code: "#include <bits/stdc++.h>\nusing namespace std;\nint main() {\n    vector<int> p={0,2,7,10};\
        \ cout << p[3]-p[1] << \"\\n\";\n}\n"
      expected: '8

        '
    java:
      code: "import java.util.*;\npublic class Solution {\n  public static void main(String[] args) {\n\
        \    int[] p={0,2,7,10}; System.out.println(p[3]-p[1]);\n  }\n}\n"
      expected: '8

        '
