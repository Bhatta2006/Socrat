- objective: Precompute running totals once so any range sum costs O(1), and count subarrays with hash
    maps.
  seconds: 60
  id: concept
  kind: concept
  title: Prefix sums
  body: A prefix total includes everything before a boundary. Subtracting two boundaries leaves only the
    requested range.
  why: p[i] holds the sum of the first i elements; sum(l..r) = p[r+1] − p[l]. One O(n) precomputation
    makes every range query O(1).
- objective: Precompute running totals once so any range sum costs O(1), and count subarrays with hash
