- objective: Sort intervals by start, then sweep once to merge, insert, or detect overlaps.
  seconds: 60
  id: micro
  kind: micro
  title: 'Repair: Intervals'
  body: Sort by the left endpoint, then extend the current right endpoint with max(current,next). Replacing
    it directly can shrink a nested merge.
  misconception: intervals-repair
