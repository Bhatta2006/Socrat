- objective: Sort intervals by start, then sweep once to merge, insert, or detect overlaps.
  seconds: 20
  id: hook
  kind: hook
  title: Why this matters
  body: In an interview, explain the invariant before reaching for a template. An interval [1,8] contains
    [3,4].
- objective: Sort intervals by start, then sweep once to merge, insert, or detect overlaps.
  seconds: 60
  id: concept
  kind: concept
  title: Intervals
  body: An interval [1,8] contains [3,4]. Merging them must preserve the farther right endpoint, 8.
  why: Sort by start; then overlaps involve only neighbours in the sweep. Overlap of [a, b] and [c, d]
    ⇔ a ≤ d and c ≤ b — clarify whether touching counts.
- objective: Sort intervals by start, then sweep once to merge, insert, or detect overlaps.
  seconds: 60
  id: worked
  kind: worked
  title: One worked example
  body: An interval [1,8] contains [3,4]. Merging them must preserve the farther right endpoint, 8.
  why: The merged interval must cover both original intervals.
  adapters:
    python:
      code: 'right=max(8,4)

        print(right)

        '
      expected: '8

        '
    cpp:
      code: "#include <bits/stdc++.h>\nusing namespace std;\nint main() {\n    cout << max(8,4) << \"\\\
        n\";\n}\n"
      expected: '8

        '
    java:
      code: "import java.util.*;\npublic class Solution {\n  public static void main(String[] args) {\n\
        \    System.out.println(Math.max(8,4));\n  }\n}\n"
      expected: '8

        '
