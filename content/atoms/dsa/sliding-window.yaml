- objective: Maintain a contiguous window and its summary as it slides, instead of recomputing every subarray.
  seconds: 20
  id: hook
  kind: hook
  title: Why this matters
  body: In an interview, explain the invariant before reaching for a template. A three-value window over
    2, 3 and 4 totals 9.
- objective: Maintain a contiguous window and its summary as it slides, instead of recomputing every subarray.
  seconds: 60
  id: concept
  kind: concept
  title: Sliding window
  body: A three-value window over 2, 3 and 4 totals 9. Keeping a window state avoids recomputing every
    member when the window moves.
  why: A window [left, right] plus a running summary avoids recomputing every subarray. Fixed-size windows
    add the entering element and remove the leaving one.
- objective: Maintain a contiguous window and its summary as it slides, instead of recomputing every subarray.
  seconds: 60
  id: worked
  kind: worked
  title: One worked example
  body: A three-value window over 2, 3 and 4 totals 9. Keeping a window state avoids recomputing every
    member when the window moves.
  why: A window state must exactly describe the values currently inside it.
  adapters:
    python:
      code: 'a=[2,3,4]

        print(sum(a))

        '
      expected: '9

        '
    cpp:
      code: "#include <bits/stdc++.h>\nusing namespace std;\nint main() {\n    vector<int> a={2,3,4};\
        \ cout << accumulate(a.begin(),a.end(),0) << \"\\n\";\n}\n"
      expected: '9

        '
    java:
      code: "import java.util.*;\npublic class Solution {\n  public static void main(String[] args) {\n\
        \    int[] a={2,3,4}; int sum=0; for(int x:a) sum+=x; System.out.println(sum);\n  }\n}\n"
      expected: '9

        '
