- objective: Make the locally best choice at each step — and learn to prove when that is globally optimal.
  seconds: 20
  id: hook
  kind: hook
  title: Why this matters
  body: In an interview, explain the invariant before reaching for a template. The meetings [0,2] and
    [2,3] fit without overlap.
- objective: Make the locally best choice at each step — and learn to prove when that is globally optimal.
  seconds: 60
  id: concept
  kind: concept
  title: Greedy algorithms
  body: The meetings [0,2] and [2,3] fit without overlap. Earliest finishing time preserves room for later
    choices.
  why: Greedy takes the locally best choice and never reconsiders. Usually - sort by the right key, then
    one pass.
- objective: Make the locally best choice at each step — and learn to prove when that is globally optimal.
  seconds: 60
  id: worked
  kind: worked
  title: One worked example
  body: The meetings [0,2] and [2,3] fit without overlap. Earliest finishing time preserves room for later
    choices.
  why: An exchange argument is needed to justify the greedy choice.
  adapters:
    python:
      code: "meetings=[(0,2),(2,3)]\nend=-1\ncount=0\nfor start,finish in meetings:\n    if start>=end:\n\
        \        count+=1\n        end=finish\nprint(count)\n"
      expected: '2

        '
    cpp:
      code: "#include <bits/stdc++.h>\nusing namespace std;\nint main() {\n    vector<pair<int,int>> a={{0,2},{2,3}};\
        \ int end=-1,count=0; for(auto [start,finish]:a) if(start>=end){++count; end=finish;} cout <<\
        \ count << \"\\n\";\n}\n"
      expected: '2

        '
    java:
      code: "import java.util.*;\npublic class Solution {\n  public static void main(String[] args) {\n\
        \    int[][] a={{0,2},{2,3}}; int end=-1,count=0; for(int[] m:a) if(m[0]>=end){++count; end=m[1];}\
        \ System.out.println(count);\n  }\n}\n"
      expected: '2

        '
