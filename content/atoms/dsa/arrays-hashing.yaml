- objective: Use hash maps and sets to turn repeated searching into instant lookups — the
  seconds: 60
  id: concept
  kind: concept
  title: Arrays and hashing
  body: A collection contains 2, 2 and 3. A set stores two distinct values, so duplicates do not increase
    its size.
  why: Hash maps/sets give O(1) average lookup, turning repeated searches into one pass. Complement lookup
    — store what you've seen, look for target − x.
- objective: Use hash maps and sets to turn repeated searching into instant lookups — the
  seconds: 60
  id: worked
  kind: worked
  title: One worked example
  body: A collection contains 2, 2 and 3. A set stores two distinct values, so duplicates do not increase
    its size.
  why: A set represents distinct values rather than every occurrence.
  adapters:
    python:
      code: 'seen=set([2,2,3])

        print(len(seen))

        '
      expected: '2

        '
    cpp:
      code: "#include <bits/stdc++.h>\nusing namespace std;\nint main() {\n    set<int> seen={2,2,3};\
        \ cout << seen.size() << \"\\n\";\n}\n"
      expected: '2

        '
    java:
      code: "import java.util.*;\npublic class Solution {\n  public static void main(String[] args) {\n\
        \    Set<Integer> seen=new HashSet<>(Arrays.asList(2,2,3)); System.out.println(seen.size());\n\
        \  }\n}\n"
      expected: '2

        '
