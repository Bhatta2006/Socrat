atoms:
  - id: top-k-worked
    kind: worked
    title: "Worked: 2nd largest of 3 2 1 5 6 4"
    objective: Keep only the k largest values, with the weakest on top.
    seconds: 90
    body: >-
      k = 2, min-heap. Push 3: {3}. Push 2: {2, 3}. Push 1: {1, 2, 3} is too big, pop 1. Push 5:
      {2, 3, 5}, pop 2. Push 6: {3, 5, 6}, pop 3. Push 4: {4, 5, 6}, pop 4. The heap is {5, 6};
      its top, 5, is the 2nd largest. The heap never held more than three values.
    why: The value to evict is always the smallest of the current top k, so it must be on top.
  - id: top-k-faded
    kind: faded
    title: "Your turn: 3rd largest of 7 1 9 4 8"
    objective: Track the heap yourself.
    seconds: 90
    body: k = 3, min-heap.
    steps:
      - state: "After 7, 1, 9 the heap is {1, 7, 9}."
        prompt: "Push 4. What is evicted?"
        options: ["1", "4", "9"]
        answer: 0
        explanation: "The heap holds four values; the smallest, 1, leaves."
      - state: "Heap {4, 7, 9}. Push 8."
        prompt: "What is evicted, and what remains?"
        options: ["4; {7, 8, 9}", "9; {4, 7, 8}", "8; {4, 7, 9}"]
        answer: 0
        explanation: "4 is the smallest of the four."
      - state: "Heap {7, 8, 9}."
        prompt: "What is the 3rd largest?"
        options: ["7", "9", "8"]
        answer: 0
        explanation: "The top of the min-heap is the 3rd largest."
  - id: top-k-visualizer
    kind: visualizer
    title: "Step through: the top of the heap"
    objective: Predict the heap top as values arrive.
    seconds: 100
    body: k = 2, values 10 4 12 8 15.
    steps:
      - state: "Heap {4, 10} after 10 and 4."
        prompt: "Top of the heap?"
        options: ["4", "10", "14"]
        answer: 0
        explanation: "A min-heap shows its smallest value on top."
      - state: "Push 12."
        prompt: "Which value leaves, and what is the new top?"
        options: ["4 leaves; top 10", "12 leaves; top 4", "10 leaves; top 4"]
        answer: 0
        explanation: "{4, 10, 12} drops 4, leaving {10, 12}."
      - state: "Heap {10, 12}. Push 8."
        prompt: "What happens?"
        options: ["8 enters and is popped at once", "10 leaves", "Nothing is popped"]
        answer: 0
        explanation: "8 is the smallest of {8, 10, 12}, so it leaves straight away."
      - state: "Heap {10, 12}. Push 15."
        prompt: "What is the final answer?"
        options: ["12", "10", "15"]
        answer: 0
        explanation: "{12, 15} remain; the 2nd largest is 12."
  - id: top-k-micro
    kind: micro
    title: "Pitfall: the wrong kind of heap"
    objective: Choose the heap by what must be evicted.
    seconds: 70
    misconception: top-k-direction
    body: >-
      For the k largest values, a max-heap feels natural, but its top is the largest value, the
      one you most want to keep. Evicting from a max-heap removes the wrong value. Keep a
      min-heap instead: its top is the smallest of your current k, exactly the one to drop. For
      the k smallest values, flip it: a max-heap of size k.
    why: The top of the heap must be the value you would evict next.
  - id: top-k-classify
    kind: classify
    title: "Which tool?"
    objective: Tell top-k heaps apart from sorting and windows.
    seconds: 90
    body: For each problem, choose the best-fitting approach.
    steps:
      - state: "A live feed of prices: after each one, report the 10th highest so far."
        prompt: "Which approach?"
        options: ["Size-10 min-heap", "Sort after every price", "Fixed window of 10"]
        answer: 0
        explanation: "A stream and a fixed k: keep the top 10 in a min-heap."
      - state: "The highest price in every run of 5 consecutive days."
        prompt: "Which approach?"
        options: ["Sliding window with a deque", "Size-5 heap over all prices", "Binary search"]
        answer: 0
        explanation: "The answer is per window of consecutive days, so it is a window problem."
      - state: "Sort 20 numbers once, then print them."
        prompt: "Which approach?"
        options: ["Just sort", "Size-k heap", "Two heaps"]
        answer: 0
        explanation: "All values are needed in order; a plain sort is simplest."
