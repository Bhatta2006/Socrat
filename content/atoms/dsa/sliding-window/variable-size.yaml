provenance:
  origin: original
atoms:
  - id: variable-size-worked
    kind: worked
    title: "Worked: longest run with sum at most 8"
    objective: See the window grow on every step and shrink only while the rule is broken.
    seconds: 90
    body: >-
      Array 3 1 2 7 4 2 1, limit 8. Take 3, 1, 2: sum 6, length 3. Take 7: sum 13 is too big,
      so drop 3 (10), drop 1 (9), drop 2 (7). Now the window is just 7. Take 4: 11, drop 7 to
      get 4. Take 2 and 1: sum 7, window 4 2 1, length 3. The best length is 3. Each number
      entered once and left at most once.
    why: The window always describes exactly what is inside it, so every measured window is valid.
  - id: variable-size-faded
    kind: faded
    title: "Your turn: finish the walk"
    objective: Decide when to shrink and when to measure.
    seconds: 90
    body: Same idea on a new array. Choose each next move.
    steps:
      - state: "Array 2 5 1 3, limit 6. Window 2 5 has sum 7."
        prompt: "What happens next?"
        options:
          - "Drop 2: the sum is over 6"
          - "Take 1: the window must grow first"
          - "Measure the length: it is 2"
        answer: 0
        explanation: "The rule is broken, so shrink before measuring."
      - state: "Window 5 after dropping 2 (sum 5). Next number is 1."
        prompt: "Take 1. Is the window valid, and how long is it?"
        options:
          - "Valid, length 2"
          - "Broken, drop 5"
          - "Valid, length 1"
        answer: 0
        explanation: "5 + 1 = 6 is at most 6; the window holds two numbers."
      - state: "Window 5 1 (sum 6). Next number is 3."
        prompt: "After taking 3, what is left once the rule holds again?"
        options:
          - "1 3, sum 4"
          - "5 1 3, sum 9"
          - "3, sum 3"
        answer: 0
        explanation: "Sum 9 is too big; dropping 5 gives 4, which fits, so shrinking stops."
  - id: variable-size-visualizer
    kind: visualizer
    title: "Step through: grow and shrink"
    objective: Predict each move of left and right before it happens.
    seconds: 120
    body: Predict the next state, then reveal it.
    steps:
      - state: "a = 4 2 1 6 1, limit 7. left = 0, right = 0, window 4, sum 4."
        prompt: "right moves to 1. What is the sum?"
        options: ["6", "2", "4"]
        answer: 0
        explanation: "Take 2: 4 + 2 = 6, still at most 7."
      - state: "Window 4 2, sum 6, best = 2."
        prompt: "right moves to 2 (value 1). Shrink?"
        options: ["No, sum 7 fits", "Yes, drop 4", "Yes, drop 1"]
        answer: 0
        explanation: "7 is at most 7, so the window 4 2 1 is valid; best becomes 3."
      - state: "Window 4 2 1, sum 7, best = 3."
        prompt: "right moves to 3 (value 6). Sum is 13. What does the while loop do?"
        options: ["Drops 4 and 2", "Drops only 4", "Drops 4, 2 and 1"]
        answer: 0
        explanation: "13 -> 9 -> 7: it stops as soon as the sum is at most 7, leaving 1 6."
      - state: "Window 1 6, sum 7, best = 3."
        prompt: "right moves to 4 (value 1). Sum is 8. What is the window after shrinking?"
        options: ["6 1", "1 6 1", "1"]
        answer: 0
        explanation: "Drop the 1 on the left: 8 -> 7 fits. Length 2, so best stays 3."
      - state: "Loop finished, best = 3."
        prompt: "How many times did left move in total?"
        options: ["3", "5", "1"]
        answer: 0
        explanation: "left moved 0 -> 2, then 2 -> 3: three steps, never backwards."
  - id: variable-size-micro
    kind: micro
    title: "Pitfall: negative numbers"
    objective: Know when the grow-and-shrink rule stops being safe.
    seconds: 75
    misconception: window-with-negatives
    body: >-
      Shrinking is safe only if a broken window can never be repaired by growing. Negative
      numbers break that. In 3 −5 4 with limit 2, the window 3 is too big, so the method drops
      3. But 3 −5 4 sums to 2 and is valid: a later negative number would have repaired the
      window, and the method never sees it. For runs with negatives, use prefix sums: the run
      i..j sums to P[j + 1] − P[i].
    why: The window method needs a monotone rule; negative values break that guarantee.
  - id: variable-size-classify
    kind: classify
    title: "Which pattern?"
    objective: Tell variable windows apart from fixed windows and prefix sums.
    seconds: 90
    body: For each problem, choose the best-fitting approach.
    steps:
      - state: "Longest stretch of a string with at most two distinct letters."
        prompt: "Which approach?"
        options: ["Variable-size window", "Fixed-size window", "Prefix sums"]
        answer: 0
        explanation: "The length is free and the rule (at most two letters) breaks only by adding."
      - state: "Largest sum of any 5 consecutive temperatures."
        prompt: "Which approach?"
        options: ["Fixed-size window", "Variable-size window", "Binary search"]
        answer: 0
        explanation: "The window length is given, so the window slides without shrinking."
      - state: "Number of subarrays summing to exactly k, values may be negative."
        prompt: "Which approach?"
        options: ["Prefix sums with a hash map", "Variable-size window", "Fixed-size window"]
        answer: 0
        explanation: "Negative values break the shrink rule; prefix sums count exact totals."
