atoms:
  - id: at-most-k-worked
    kind: worked
    title: "Worked: at most 2 kinds in 1 2 1 3 3"
    objective: Keep a count per value and shrink only when a third kind enters.
    seconds: 90
    body: >-
      k = 2. Take 1, 2, 1: counts {1: 2, 2: 1}, two kinds, length 3. Take 3: three kinds, so
      shrink. Drop 1: {1: 1, 2: 1, 3: 1}, still three. Drop 2: its count hits 0, so remove it:
      {1: 1, 3: 1}. Two kinds again; the window is 1 3. Take 3: {1: 1, 3: 2}, window 1 3 3,
      length 3. The best length is 3.
    why: The number of kinds is the size of the map, so a value must leave the map when its count reaches 0.
  - id: at-most-k-faded
    kind: faded
    title: "Your turn: track the map"
    objective: Update the counts and decide when to shrink.
    seconds: 90
    body: k = 2 on the values 4 4 5 6 5.
    steps:
      - state: "Window 4 4 5, counts {4: 2, 5: 1}."
        prompt: "6 enters. What must happen?"
        options:
          - "Shrink: three kinds are inside"
          - "Nothing: the window is still short"
          - "Remove 5, the newest old value"
        answer: 0
        explanation: "Three different values break the rule, so shrink from the left."
      - state: "Counts {4: 2, 5: 1, 6: 1}. Drop the first 4."
        prompt: "What are the counts now?"
        options:
          - "{4: 1, 5: 1, 6: 1}: still three kinds"
          - "{5: 1, 6: 1}"
          - "{4: 2, 5: 1}"
        answer: 0
        explanation: "One 4 is still inside, so 4 stays in the map."
      - state: "Drop the second 4; its count reaches 0."
        prompt: "What is the window now, and how long is it after 5 enters next?"
        options:
          - "5 6, then 5 6 5 with length 3"
          - "6, then 6 5 with length 2"
          - "4 5 6, then length 4"
        answer: 0
        explanation: "Removing 4 leaves two kinds; 5 is already inside, so 5 6 5 stays valid."
  - id: at-most-k-visualizer
    kind: visualizer
    title: "Step through: the count map"
    objective: Predict the map and the window at each step.
    seconds: 120
    body: k = 1 on the values 2 2 3 3 3 2.
    steps:
      - state: "Window 2 2, counts {2: 2}, best = 2."
        prompt: "3 enters. How many values does the loop drop?"
        options: ["2", "1", "3"]
        answer: 0
        explanation: "Both 2s must go before only one kind is left."
      - state: "Window 3, counts {3: 1}, best = 2."
        prompt: "Two more 3s enter. What is best?"
        options: ["3", "2", "5"]
        answer: 0
        explanation: "Window 3 3 3 has one kind and length 3."
      - state: "Window 3 3 3, best = 3."
        prompt: "2 enters. What is the window after shrinking?"
        options: ["2", "3 2", "3 3 2"]
        answer: 0
        explanation: "All three 3s must leave before only one kind remains."
      - state: "Loop finished."
        prompt: "How many times did left move in total?"
        options: ["5", "6", "3"]
        answer: 0
        explanation: "left went 0 -> 2 -> 5: five steps for six values, never backwards."
  - id: at-most-k-micro
    kind: micro
    title: "Pitfall: stale zero counts"
    objective: Remove a value from the map when its count reaches zero.
    seconds: 75
    misconception: stale-zero-count
    body: >-
      The map's size counts the different values inside. If a count drops to 0 and the entry
      stays, that value still looks present. With k = 2 and window 1 2 after dropping a 3, a map
      {1: 1, 2: 1, 3: 0} has size 3, so the window keeps shrinking for no reason. Delete the
      entry the moment its count hits 0.
    why: The rule is about values inside the window; a zero entry describes a value that has left.
  - id: at-most-k-classify
    kind: classify
    title: "Which pattern?"
    objective: Spot at-most-k windows and their exactly-k cousins.
    seconds: 90
    body: For each problem, choose the best-fitting approach.
    steps:
      - state: "Longest substring using at most 3 different letters."
        prompt: "Which approach?"
        options: ["At most k distinct window", "Fixed-size window", "Sorting"]
        answer: 0
        explanation: "Distinct values with a limit k, contiguous, longest: an at-most-k window."
      - state: "Number of subarrays with exactly 2 odd numbers."
        prompt: "Which approach?"
        options: ["atMost(2) − atMost(1) with windows", "One window that shrinks at 2", "Binary search"]
        answer: 0
        explanation: "Exactly k is two at-most counts subtracted."
      - state: "Largest sum of 4 consecutive values."
        prompt: "Which approach?"
        options: ["Fixed-size window", "At most k distinct window", "Prefix sums with a map"]
        answer: 0
        explanation: "The length is fixed at 4; nothing about distinct values."
