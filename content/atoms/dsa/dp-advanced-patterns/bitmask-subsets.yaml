atoms:
- id: bm-worked
  kind: worked
  title: 'Worked: costs 9 2 7 / 6 4 3 / 5 8 1'
  objective: Push from each mask and read the answer.
  seconds: 100
  body: 'From mask 000, worker 0 sets dp[001] = 9, dp[010] = 2, dp[100] = 7. From 010 (cost 2), worker
    1 gives dp[011] = 2 + 6 = 8 and dp[110] = 2 + 3 = 5. From 011, worker 2 takes job 2: 8 + 1 = 9. From
    110, worker 2 takes job 0: 5 + 5 = 10, which does not beat 9. The full mask holds 9.'
  why: Each mask keeps the cheapest way to cover exactly those jobs, whatever order got there.
- id: bm-faded
  kind: faded
  title: 'Your turn: costs 1 4 / 2 3'
  objective: Fill the four masks yourself.
  seconds: 90
  body: Two workers, two jobs. dp[00] = 0.
  steps:
  - state: Worker 0 takes job 0 from mask 00.
    prompt: What is dp[01]?
    options:
    - '1'
    - '4'
    - '2'
    answer: 0
    explanation: cost[0][0] = 1.
  - state: Worker 0 takes job 1 from mask 00.
    prompt: What is dp[10]?
    options:
    - '4'
    - '1'
    - '3'
    answer: 0
    explanation: cost[0][1] = 4.
  - state: dp[11] = min(dp[01] + cost[1][1], dp[10] + cost[1][0]).
    prompt: What is dp[11]?
    options:
    - '4'
    - '6'
    - '5'
    answer: 0
    explanation: min(1 + 3, 4 + 2) = 4.
- id: bm-visualizer
  kind: visualizer
  title: 'Step through: reading a mask'
  objective: Connect bits, workers and jobs.
  seconds: 110
  body: Four jobs. mask = 1010 in binary (jobs 1 and 3 taken).
  steps:
  - state: popcount(1010) is 2.
    prompt: Which worker moves next?
    options:
    - Worker 2
    - Worker 1
    - Worker 3
    answer: 0
    explanation: Workers 0 and 1 already have jobs.
  - state: The free jobs are the 0 bits.
    prompt: Which jobs can worker 2 take?
    options:
    - Jobs 0 and 2
    - Jobs 1 and 3
    - Any job
    answer: 0
    explanation: Bits 0 and 2 are clear.
  - state: Worker 2 takes job 2.
    prompt: Which mask does it reach?
    options:
    - '1110'
    - '1011'
    - '0100'
    answer: 0
    explanation: mask | (1 << 2) sets bit 2.
- id: bm-micro
  kind: micro
  title: 'Pitfall: the cheapest free job'
  objective: Know why greedy assignment fails.
  seconds: 80
  misconception: bitmask-greedy-assign
  body: 'Letting each worker take the cheapest job still free looks sensible, but a cheap choice for an
    early worker can take the only cheap job of a later one. With costs 9 2 7 / 6 4 3 / 5 8 1, worker 1
    grabs job 2 for 3, and worker 2 must pay 5 instead of 1: 10 instead of 9. The mask DP compares every
    set of jobs.'
  why: Jobs interact, so the state has to remember which ones are used.
- id: bm-classify
  kind: classify
  title: Which pattern?
  objective: Separate bitmask DP from its neighbours.
  seconds: 90
  body: For each problem, choose the best-fitting approach.
  steps:
  - state: 15 cities; shortest route visiting each city exactly once.
    prompt: Which approach?
    options:
    - dp[mask][last city]
    - Greedy nearest city
    - Knapsack over distance
    answer: 0
    explanation: Which cities are visited, and where you are, both matter.
  - state: 100 items; pick some with total weight at most 1000, maximising value.
    prompt: Which approach?
    options:
    - 0/1 knapsack over weight
    - Bitmask over the items
    - Interval DP
    answer: 0
    explanation: Only the total weight matters, and 2^100 sets are impossible.
  - state: Two players take numbers from either end of a row.
    prompt: Which approach?
    options:
    - Interval DP storing the mover's best difference
    - Bitmask DP
    - Greedy larger end
    answer: 0
    explanation: The remaining row is always a range.
