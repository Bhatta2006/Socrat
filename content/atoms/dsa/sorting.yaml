- objective: How merge sort and quicksort reach O(n log n), how to sort by custom rules, and why sorting
    first simplifies problems.
  seconds: 60
  id: concept
  kind: concept
  title: Sorting
  body: Sorting the priorities 4, 1 and 3 places 1 first. A comparator must describe a consistent strict
    order.
  why: Comparison sorting is O(n log n) at best; library sorts already achieve it. Merge sort - split,
    recurse, merge — stable, O(n log n), O(n) space; counts inversions.
- objective: How merge sort and quicksort reach O(n log n), how to sort by custom rules, and why sorting
    first simplifies problems.
  seconds: 60
  id: worked
  kind: worked
  title: One worked example
  body: Sorting the priorities 4, 1 and 3 places 1 first. A comparator must describe a consistent strict
    order.
  why: Sorting arranges values according to the comparator order.
  adapters:
    python:
      code: 'a=[4,1,3]

        a.sort()

        print(a[0])

        '
      expected: '1

        '
    cpp:
      code: "#include <bits/stdc++.h>\nusing namespace std;\nint main() {\n    vector<int> a={4,1,3};\
        \ sort(a.begin(),a.end()); cout << a[0] << \"\\n\";\n}\n"
      expected: '1

        '
    java:
      code: "import java.util.*;\npublic class Solution {\n  public static void main(String[] args) {\n\
        \    int[] a={4,1,3}; Arrays.sort(a); System.out.println(a[0]);\n  }\n}\n"
      expected: '1

        '
