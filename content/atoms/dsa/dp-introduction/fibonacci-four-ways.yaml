atoms:
- id: fib-worked
  kind: worked
  title: 'Worked: F(6) bottom-up'
  objective: Fill the table from the base cases upward.
  seconds: 80
  body: Start with dp[0] = 0 and dp[1] = 1. Then dp[2] = 1 + 0 = 1, dp[3] = 1 + 1 = 2, dp[4] = 2 + 1 =
    3, dp[5] = 3 + 2 = 5, dp[6] = 5 + 3 = 8. Each cell reads two cells that are already final, so one
    pass from left to right is enough. Plain recursion for the same answer makes 25 calls.
  why: Tabulation fills cells in an order where their inputs are ready.
- id: fib-faded
  kind: faded
  title: 'Your turn: climbing 5 stairs'
  objective: Apply ways(i) = ways(i − 1) + ways(i − 2) with the right base cases.
  seconds: 90
  body: 'Steps of 1 or 2. ways(0) = 1: standing still at the bottom is one way.'
  steps:
  - state: ways(0) = 1, ways(1) = 1.
    prompt: What is ways(2)?
    options:
    - '2'
    - '1'
    - '3'
    answer: 0
    explanation: '1 + 1 = 2: either 1 + 1 or 2.'
  - state: ways(2) = 2, ways(3) = 3.
    prompt: What is ways(4)?
    options:
    - '5'
    - '4'
    - '6'
    answer: 0
    explanation: ways(3) + ways(2) = 3 + 2 = 5.
  - state: ways(4) = 5.
    prompt: What is ways(5)?
    options:
    - '8'
    - '7'
    - '10'
    answer: 0
    explanation: ways(4) + ways(3) = 5 + 3 = 8.
- id: fib-visualizer
  kind: visualizer
  title: 'Step through: the memo fills up'
  objective: See which calls are solved and which are looked up.
  seconds: 100
  body: fib(5) with a memo. Follow the first time each n is solved.
  steps:
  - state: fib(5) → fib(4) → fib(3) → fib(2). fib(1) = 1, fib(0) = 0.
    prompt: What does fib(2) store?
    options:
    - '1'
    - '2'
    - '0'
    answer: 0
    explanation: 1 + 0 = 1, so memo[2] = 1.
  - state: 'Back in fib(3): memo[2] = 1, fib(1) = 1.'
    prompt: What does fib(3) store?
    options:
    - '2'
    - '3'
    - '1'
    answer: 0
    explanation: 1 + 1 = 2.
  - state: 'Back in fib(4): it needs fib(3) and fib(2).'
    prompt: Does fib(4) recompute fib(2)?
    options:
    - No, it reads memo[2]
    - Yes, from scratch
    - Only fib(1)
    answer: 0
    explanation: fib(2) was stored on the way down, so it is a lookup.
  - state: memo[3] = 2, memo[4] = 3.
    prompt: What is fib(5)?
    options:
    - '5'
    - '8'
    - '3'
    answer: 0
    explanation: memo[4] + memo[3] = 3 + 2 = 5.
- id: fib-micro
  kind: micro
  title: 'Pitfall: solving the same call again'
  objective: Recognise exponential recomputation.
  seconds: 75
  misconception: dp-recompute-subproblems
  body: Plain recursive fib(30) makes about 2.7 million calls, and fib(50) about 4 × 10^10. The answers
    are right, but fib(48) is solved twice, fib(47) three times, and the repeats grow like the Fibonacci
    numbers. One dictionary or array that stores each answer cuts the work to about 2n calls.
  why: Overlapping subproblems are exactly what DP removes.
- id: fib-classify
  kind: classify
  title: Which pattern?
  objective: Tell a Fibonacci-style recurrence from its neighbours.
  seconds: 90
  body: For each problem, choose the best-fitting approach.
  steps:
  - state: Number of ways to tile a 2 × n board with 1 × 2 dominoes.
    prompt: Which approach?
    options:
    - A two-term recurrence, filled bottom-up
    - Greedy
    - Binary search
    answer: 0
    explanation: 'The last column is either one vertical or two horizontal tiles: f(n) = f(n − 1) + f(n
      − 2).'
  - state: Number of ways to write n as a sum of 1s and 2s, where order does not matter.
    prompt: Which approach?
    options:
    - Coin change II with coins as the outer loop
    - The climbing stairs recurrence
    - Sorting
    answer: 0
    explanation: Unordered sums are combinations, not ordered stair climbs.
  - state: Sort an array by splitting it in half and merging.
    prompt: Which approach?
    options:
    - 'Divide and conquer: nothing repeats'
    - Memoized DP
    - Two-term recurrence
    answer: 0
    explanation: Merge sort's halves never repeat, so a memo saves nothing.
