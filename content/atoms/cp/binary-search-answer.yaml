- objective: Turn "find the optimum" into "is this value feasible?" and binary search the boundary.
  seconds: 60
  id: concept
  kind: concept
  title: Binary search on the answer
  body: A machine makes one item every 3 seconds. Producing at least 4 items takes a minimum of 12 seconds.
  why: Optimisation → feasibility check + binary search, when feasibility is monotonic. Each check is
    usually a greedy O(n) scan; total O(n log range).
- objective: Turn "find the optimum" into "is this value feasible?" and binary search the boundary.
  seconds: 60
  id: worked
  kind: worked
  title: One worked example
  body: A machine makes one item every 3 seconds. Producing at least 4 items takes a minimum of 12 seconds.
  why: A monotone feasibility test permits a boundary search.
  adapters:
    python:
      code: "lo,hi=0,20\nwhile lo<hi:\n    mid=(lo+hi)//2\n    if mid//3>=4: hi=mid\n    else: lo=mid+1\n\
        print(lo)\n"
      expected: '12

        '
    cpp:
      code: "#include <bits/stdc++.h>\nusing namespace std;\nint main() {\n    int lo=0,hi=20; while(lo<hi){int\
        \ mid=lo+(hi-lo)/2; if(mid/3>=4) hi=mid; else lo=mid+1;} cout << lo << \"\\n\";\n}\n"
      expected: '12

        '
    java:
      code: "import java.util.*;\npublic class Solution {\n  public static void main(String[] args) {\n\
        \    int lo=0,hi=20; while(lo<hi){int mid=lo+(hi-lo)/2; if(mid/3>=4) hi=mid; else lo=mid+1;} System.out.println(lo);\n\
        \  }\n}\n"
      expected: '12

        '
