  seconds: 60
  id: concept
  kind: concept
  title: Number theory essentials
  body: The greatest common divisor of 18 and 12 is 6. Euclid repeatedly replaces the larger problem with
    a remainder problem.
  why: gcd by Euclid in O(log); lcm = a / gcd · b. Trial division up to √n tests primality and factorizes.
- objective: GCD, primes, the sieve of Eratosthenes and factorization — the math that appears in nearly
    every contest.
  seconds: 60
  id: worked
  kind: worked
  title: One worked example
  body: The greatest common divisor of 18 and 12 is 6. Euclid repeatedly replaces the larger problem with
    a remainder problem.
  why: Taking a remainder preserves the common divisors.
  adapters:
    python:
      code: 'import math

        print(math.gcd(18,12))

        '
      expected: '6

        '
    cpp:
      code: "#include <bits/stdc++.h>\nusing namespace std;\nint main() {\n    cout << gcd(18,12) << \"\
        \\n\";\n}\n"
      expected: '6

        '
    java:
      code: "import java.util.*;\npublic class Solution {\n  public static void main(String[] args) {\n\
        \    int a=18,b=12; while(b!=0){int r=a%b; a=b; b=r;} System.out.println(a);\n  }\n}\n"
      expected: '6

        '
