  seconds: 60
  id: micro
  kind: micro
  title: 'Repair: Number theory essentials'
  body: For a sieve, begin crossing out at p*p only after checking multiplication fits the integer type.
    Smaller multiples were handled by smaller primes.
  misconception: number-theory-repair
