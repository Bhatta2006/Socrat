- objective: The contest basics that silently cost points — slow input, 32-bit overflow, and solutions
    that cannot fit the time limit.
  seconds: 60
  id: concept
  kind: concept
  title: Fast I/O, overflow and operation budgets
  body: Batching input must preserve the arithmetic. Reading three values together still gives the sum
    6.
  why: Read input in bulk and write output once; avoid Scanner (Java) and endl (C++). Use 64-bit integers
    for sums and products; cast before multiplying.
- objective: The contest basics that silently cost points — slow input, 32-bit overflow, and solutions
    that cannot fit the time limit.
  seconds: 60
  id: worked
  kind: worked
  title: One worked example
  body: Batching input must preserve the arithmetic. Reading three values together still gives the sum
    6.
  why: Faster input changes overhead, not the required result.
  adapters:
    python:
      code: 'values=list(map(int,"1 2 3".split()))

        print(sum(values))

        '
      expected: '6

        '
    cpp:
      code: "#include <bits/stdc++.h>\nusing namespace std;\nint main() {\n    istringstream input(\"\
        1 2 3\"); int x,total=0; while(input>>x) total+=x; cout << total << \"\\n\";\n}\n"
      expected: '6

        '
    java:
      code: "import java.util.*;\npublic class Solution {\n  public static void main(String[] args) {\n\
        \    Scanner input=new Scanner(\"1 2 3\"); int total=0; while(input.hasNextInt()) total+=input.nextInt();\
        \ System.out.println(total);\n  }\n}\n"
      expected: '6

        '
