- objective: O(1) range queries with prefix sums, O(1) range updates with difference arrays, and their
    2D versions.
  seconds: 60
  id: concept
  kind: concept
  title: Prefix sums and difference arrays
  body: Add 3 to positions 1 through 2. A difference array places +3 at the start and -3 just after the
    end.
  why: Prefix sums - O(1) range-sum queries on a static array. Difference arrays - O(1) range additions,
    one final prefix pass.
- objective: O(1) range queries with prefix sums, O(1) range updates with difference arrays, and their
    2D versions.
  seconds: 60
  id: worked
  kind: worked
  title: One worked example
  body: Add 3 to positions 1 through 2. A difference array places +3 at the start and -3 just after the
    end.
  why: A prefix accumulation reconstructs the value at the queried position.
  adapters:
    python:
      code: 'diff=[0,3,0,-3]

        print(sum(diff[:3]))

        '
      expected: '3

        '
    cpp:
      code: "#include <bits/stdc++.h>\nusing namespace std;\nint main() {\n    vector<int> d={0,3,0,-3};\
        \ cout << accumulate(d.begin(),d.begin()+3,0) << \"\\n\";\n}\n"
      expected: '3

        '
    java:
      code: "import java.util.*;\npublic class Solution {\n  public static void main(String[] args) {\n\
        \    int[] d={0,3,0,-3}; System.out.println(d[0]+d[1]+d[2]);\n  }\n}\n"
      expected: '3

        '
