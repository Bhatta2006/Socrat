  seconds: 60
  id: micro
  kind: micro
  title: 'Repair: Prefix sums and difference arrays'
  body: Reserve space for the cancellation at r+1, including when r is the last real position. Reconstruct
    by prefix accumulation, then ignore the sentinel.
