  seconds: 60
  id: visualizer
  kind: visualizer
  title: Predict, then reveal
  body: Commit to a prediction. The result and explanation appear only after you answer.
  adapters:
    python:
      code: 'print(1<<3)

        '
      expected: '8

        '
    cpp:
      code: "#include <bits/stdc++.h>\nusing namespace std;\nint main() {\n    cout << (1<<3) << \"\\\
        n\";\n}\n"
