- objective: When the input is small, try everything — systematically, and with an operation count that
    fits.
  seconds: 60
  id: micro
  kind: micro
  title: 'Repair: Complete search'
  body: List the entire candidate space before filtering. Include the empty choice when it is valid, and
    start permutation enumeration from sorted order.
  misconception: complete-search-repair
- objective: When the input is small, try everything — systematically, and with an operation count that
    fits.
  seconds: 60
  id: syntax-repair
  kind: micro
  title: Separate syntax from strategy
  body: A compile error is feedback about how the program is written. Match quotes, brackets and braces,
    then read the first compiler diagnostic. Make one small repair and run again. This alone does not
    show a misconception about the algorithm.
  misconception: syntax-delimiters
- objective: When the input is small, try everything — systematically, and with an operation count that
    fits.
  seconds: 60
  id: pattern
  kind: pattern
  title: Recognise the strategy
  body: Each of the three binary choices doubles the number of subsets. List the entire candidate space
    before filtering. Include the empty choice when it is valid, and start permutation enumeration from
    sorted order.
  why: Apply this reasoning to a fresh problem; an earlier worked example is not independent evidence.
- objective: When the input is small, try everything — systematically, and with an operation count that
    fits.
  seconds: 60
  id: explanation
  kind: explanation
  title: Explain your reasoning
  body: Choose the statement that explains why the strategy is valid. This is a structured explanation
    check, not a grade for writing style.
  steps:
  - state: Three independent yes/no choices have eight subsets, including the empty subset. Enumerating
      all candidates gives a small-case correctness oracle.
    prompt: Which statement is a valid explanation, rather than a guess from the sample?
    options: *id001
    answer: 0
    explanation: Each of the three binary choices doubles the number of subsets.
  misconception: complete-search-repair
