  seconds: 60
  id: faded
  kind: faded
  title: Complete the reasoning
  body: Fill the missing reasoning step before attempting a fresh problem.
  steps:
  - state: Three independent yes/no choices have eight subsets, including the empty subset. Enumerating
      all candidates gives a small-case correctness oracle.
    prompt: Which reasoning makes this example work?
    options: &id001
    - Each of the three binary choices doubles the number of subsets.
    - The empty subset never belongs to a complete search.
    - There are only three possible subsets.
    answer: 0
    explanation: Each of the three binary choices doubles the number of subsets.
  misconception: complete-search-repair
