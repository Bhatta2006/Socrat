atoms:
- objective: When the input is small, try everything — systematically, and with an operation count that
    fits.
  seconds: 20
  id: hook
  kind: hook
  title: Why this matters
  body: Before submitting in a contest, test the invariant on one small case. Three independent yes/no
    choices have eight subsets, including the empty subset.
- objective: When the input is small, try everything — systematically, and with an operation count that
    fits.
  seconds: 60
  id: concept
  kind: concept
  title: Complete search
  body: Three independent yes/no choices have eight subsets, including the empty subset. Enumerating all
    candidates gives a small-case correctness oracle.
  why: Small constraints signal complete search - n ≤ 8 permutations, n ≤ 20 subsets. Count the work (n!
    · n, 2^n · n) against the time limit before writing.
- objective: When the input is small, try everything — systematically, and with an operation count that
    fits.
  seconds: 60
  id: worked
  kind: worked
  title: One worked example
  body: Three independent yes/no choices have eight subsets, including the empty subset. Enumerating all
    candidates gives a small-case correctness oracle.
  why: Each of the three binary choices doubles the number of subsets.
  adapters:
    python:
      code: 'print(1<<3)

        '
      expected: '8

        '
    cpp:
      code: "#include <bits/stdc++.h>\nusing namespace std;\nint main() {\n    cout << (1<<3) << \"\\\
        n\";\n}\n"
      expected: '8

        '
    java:
      code: "import java.util.*;\npublic class Solution {\n  public static void main(String[] args) {\n\
        \    System.out.println(1<<3);\n  }\n}\n"
      expected: '8

        '
- objective: When the input is small, try everything — systematically, and with an operation count that
