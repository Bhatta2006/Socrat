- objective: Use integers as sets, iterate submasks, and exploit XOR's algebra in contest problems.
  seconds: 60
  id: micro
  kind: micro
  title: 'Repair: Bitmasks and XOR tricks'
  body: In submask enumeration, handle zero explicitly if the empty subset is valid. After (s-1)&mask
    reaches zero, another update can restart the sequence.
  misconception: bitmasks-repair
