- objective: Use integers as sets, iterate submasks, and exploit XOR's algebra in contest problems.
  seconds: 60
  id: pattern
  kind: pattern
  title: Recognise the strategy
  body: Shift selects the bit position and AND isolates its low bit. In submask enumeration, handle zero
    explicitly if the empty subset is valid. After (s-1)&mask reaches zero, another update can restart
    the sequence.
  why: Apply this reasoning to a fresh problem; an earlier worked example is not independent evidence.
