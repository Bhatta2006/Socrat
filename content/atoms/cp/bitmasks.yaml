- objective: Use integers as sets, iterate submasks, and exploit XOR's algebra in contest problems.
  seconds: 60
  id: concept
  kind: concept
  title: Bitmasks and XOR tricks
  body: The mask 5 has bits zero and two set. Testing bit two gives one; each bit represents one independent
    membership decision.
  why: Masks are sets - |, &, & ~ and shifts are O(1) set operations. sub = (sub − 1) & mask enumerates
    all submasks; all-masks-all-submasks is O(3^n).
- objective: Use integers as sets, iterate submasks, and exploit XOR's algebra in contest problems.
  seconds: 60
  id: worked
  kind: worked
  title: One worked example
  body: The mask 5 has bits zero and two set. Testing bit two gives one; each bit represents one independent
    membership decision.
  why: Shift selects the bit position and AND isolates its low bit.
  adapters:
    python:
      code: 'mask=5

        print((mask>>2)&1)

        '
      expected: '1

        '
    cpp:
      code: "#include <bits/stdc++.h>\nusing namespace std;\nint main() {\n    int mask=5; cout << ((mask>>2)&1)\
        \ << \"\\n\";\n}\n"
      expected: '1

        '
    java:
      code: "import java.util.*;\npublic class Solution {\n  public static void main(String[] args) {\n\
        \    int mask=5; System.out.println((mask>>2)&1);\n  }\n}\n"
      expected: '1

        '
