  title: Greedy in contests
  body: Match a budget of 6 to tickets priced 2, 5 and 8. The best affordable ticket costs 5.
  why: Greedy = right sort order + safe local choice + exchange-argument proof. Pair extremes with two
    pointers; best-available matches with a sorted multiset.
- objective: Find the sort key, make the safe choice, prove it with an exchange — and use a multiset when
    choices interact.
  seconds: 60
  id: worked
  kind: worked
  title: One worked example
  body: Match a budget of 6 to tickets priced 2, 5 and 8. The best affordable ticket costs 5.
  why: Choosing the largest affordable item preserves cheaper items for tighter budgets.
  adapters:
    python:
      code: 'prices=[2,5,8]

        print(max(p for p in prices if p<=6))

        '
      expected: '5

        '
    cpp:
      code: "#include <bits/stdc++.h>\nusing namespace std;\nint main() {\n    vector<int> p={2,5,8};\
        \ auto it=upper_bound(p.begin(),p.end(),6); cout << *prev(it) << \"\\n\";\n}\n"
      expected: '5

        '
    java:
      code: "import java.util.*;\npublic class Solution {\n  public static void main(String[] args) {\n\
        \    TreeSet<Integer> p=new TreeSet<>(Arrays.asList(2,5,8)); System.out.println(p.floor(6));\n\
        \  }\n}\n"
      expected: '5

        '
