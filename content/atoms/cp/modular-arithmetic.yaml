  kind: pattern
  title: Recognise the strategy
  body: Adding the modulus before a final remainder normalises a negative residue. Use ((x % m) + m) %
    m when a negative x is possible and m is positive. Reduce intermediate products in a type that cannot
    overflow first.
  why: Apply this reasoning to a fresh problem; an earlier worked example is not independent evidence.
