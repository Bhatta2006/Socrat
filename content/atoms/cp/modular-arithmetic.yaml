- objective: Keep huge answers small with mod 1e9+7, fast exponentiation, and modular inverses.
  seconds: 60
  id: concept
  kind: concept
  title: Modular arithmetic
  body: A remainder class should have one canonical representative. Normalising -1 modulo 5 gives 4 in
    all three languages.
  why: Reduce after every addition, subtraction and multiplication. Subtraction - add m before taking
    mod to stay non-negative.
- objective: Keep huge answers small with mod 1e9+7, fast exponentiation, and modular inverses.
  seconds: 60
  id: worked
  kind: worked
  title: One worked example
  body: A remainder class should have one canonical representative. Normalising -1 modulo 5 gives 4 in
    all three languages.
  why: Adding the modulus before a final remainder normalises a negative residue.
  adapters:
    python:
      code: 'print((-1%5+5)%5)

        '
      expected: '4

        '
    cpp:
      code: "#include <bits/stdc++.h>\nusing namespace std;\nint main() {\n    cout << ((-1%5+5)%5) <<\
        \ \"\\n\";\n}\n"
      expected: '4

