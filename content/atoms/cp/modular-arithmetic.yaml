- objective: Keep huge answers small with mod 1e9+7, fast exponentiation, and modular inverses.
  seconds: 60
  id: micro
  kind: micro
  title: 'Repair: Modular arithmetic'
  body: Use ((x % m) + m) % m when a negative x is possible and m is positive. Reduce intermediate products
    in a type that cannot overflow first.
  misconception: modular-arithmetic-repair
- objective: Keep huge answers small with mod 1e9+7, fast exponentiation, and modular inverses.
