rollback: remove content/atoms/cp/prefix-difference/difference-array.yaml
status: draft
provenance:
  origin: original
atoms:
  - id: difference-worked
    kind: worked
    title: "Worked: three updates on 5 positions"
    objective: Turn each range addition into two marks, then rebuild with one running sum.
    seconds: 100
    body: >-
      Updates: add 1 to 0..2, add 2 to 1..4, add 5 to 3..3. Marks: +1 at 0 and −1 at 3; +2 at 1
      and −2 at 5; +5 at 3 and −5 at 4. diff = 1 2 0 4 −5 −2. Running sums: 1, 3, 3, 7, 2. Check
      position 3: covered by the second update (2) and the third (5), total 7. Each update cost
      two cell changes, however long its range.
    why: A mark at l starts adding x for every later position; the mark at r + 1 stops it.
  - id: difference-faded
    kind: faded
    title: "Your turn: two updates on 4 positions"
    objective: Place the marks and run the sum.
    seconds: 90
    body: Add 3 to 1..2, then add 1 to 0..3. diff has 5 cells.
    steps:
      - state: "First update: add 3 to positions 1..2."
        prompt: "Which marks?"
        options: ["+3 at 1, −3 at 3", "+3 at 1, −3 at 2", "+3 at 2, −3 at 3"]
        answer: 0
        explanation: "Start at 1, stop just after 2."
      - state: "Second update: add 1 to 0..3."
        prompt: "Which marks?"
        options: ["+1 at 0, −1 at 4", "+1 at 0, −1 at 3", "+1 at 0 only"]
        answer: 0
        explanation: "r + 1 = 4 uses the spare cell."
      - state: "diff = 1 3 0 −3 −1."
        prompt: "What is the final array?"
        options: ["1 4 4 1", "1 3 0 −3", "1 4 4 4"]
        answer: 0
        explanation: "Running sums: 1, 4, 4, 1 (the fourth cell drops back to 1)."
  - id: difference-visualizer
    kind: visualizer
    title: "Step through: the running sum"
    objective: Watch marks become values.
    seconds: 90
    body: diff = 2 0 −2 3 0 −3 (one update of +2 on 0..1 and one of +3 on 3..4).
    steps:
      - state: "running = 0. Read diff[0] = 2."
        prompt: "value[0]?"
        options: ["2", "0", "−2"]
        answer: 0
        explanation: "0 + 2 = 2."
      - state: "Read diff[1] = 0."
        prompt: "value[1]?"
        options: ["2", "0", "1"]
        answer: 0
        explanation: "Still inside the first range: 2."
      - state: "Read diff[2] = −2."
        prompt: "value[2]?"
        options: ["0", "−2", "2"]
        answer: 0
        explanation: "The cancel mark ends the first range."
      - state: "Read diff[3] = 3, then diff[4] = 0."
        prompt: "value[3] and value[4]?"
        options: ["3 and 3", "3 and 0", "1 and 1"]
        answer: 0
        explanation: "The second range starts at 3 and covers 4."
  - id: difference-micro
    kind: micro
    title: "Pitfall: cancelling at r"
    objective: Put the cancel mark one past the range.
    seconds: 70
    misconception: diff-end-off-by-one
    body: >-
      The mark at l means "from here on, add x". The cancel mark means "from here on, stop". If
      you cancel at r, position r itself loses the addition. Adding 4 to 1..2 with marks +4 at 1
      and −4 at 2 gives 0 4 0 instead of 0 4 4. Cancel at r + 1, which is why diff needs one
      spare cell.
    why: The cancel takes effect at its own position, so it must sit after the last covered position.
  - id: difference-classify
    kind: classify
    title: "Difference array or not?"
    objective: Know when range updates should become marks.
    seconds: 90
    body: For each problem, choose the best-fitting approach.
    steps:
      - state: "200,000 updates 'add x to l..r', then print the final array."
        prompt: "Which approach?"
        options: ["Difference array", "Update every position", "Prefix sums of the input only"]
        answer: 0
        explanation: "All updates come before any reading."
      - state: "Updates and 'what is position i now?' questions are mixed together."
        prompt: "Which approach?"
        options: ["A Fenwick tree over the difference array", "Plain difference array", "Sorting"]
        answer: 0
        explanation: "Reading between updates needs prefix sums that can change: a Fenwick tree."
      - state: "Many questions: sum of positions l..r of a fixed array."
        prompt: "Which approach?"
        options: ["Prefix sums", "Difference array", "Heap"]
        answer: 0
        explanation: "No updates, only range sums: plain prefix sums."
