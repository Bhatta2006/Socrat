  kind: worked
  title: One worked example
  body: Choose two of four people without order. There are six unordered pairs, not twelve ordered ones.
  why: An unordered choice counts each pair once.
  adapters:
    python:
      code: 'import math

        print(math.comb(4,2))

        '
      expected: '6

        '
    cpp:
      code: "#include <bits/stdc++.h>\nusing namespace std;\nint main() {\n    cout << 4*3/2 << \"\\n\"\
        ;\n}\n"
      expected: '6

        '
    java:
      code: "import java.util.*;\npublic class Solution {\n  public static void main(String[] args) {\n\
        \    System.out.println(4*3/2);\n  }\n}\n"
      expected: '6

        '
