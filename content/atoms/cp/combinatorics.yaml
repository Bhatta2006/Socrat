- objective: Count arrangements with factorials, nCr modulo a prime, and the classic counting principles.
  seconds: 60
  id: concept
  kind: concept
  title: Counting and binomial coefficients
  body: Choose two of four people without order. There are six unordered pairs, not twelve ordered ones.
  why: Product rule for independent choices; sum rule for disjoint cases. C(n, k) = n! / (k!(n − k)!);
    precompute factorials and inverse factorials for O(1) queries.
- objective: Count arrangements with factorials, nCr modulo a prime, and the classic counting principles.
  seconds: 60
