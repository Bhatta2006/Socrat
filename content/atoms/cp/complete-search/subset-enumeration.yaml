atoms:
  - id: subsets-worked
    kind: worked
    title: "Worked: subsets of 3 1 4 with sum 4"
    objective: Turn every number from 0 to 2^n − 1 into a subset.
    seconds: 100
    body: >-
      n = 3, so masks 0 to 7. Bit 0 is 3, bit 1 is 1, bit 2 is 4. Mask 0 (000): {} sum 0. 1 (001):
      {3} 3. 2 (010): {1} 1. 3 (011): {3, 1} 4. 4 (100): {4} 4. 5 (101): {3, 4} 7. 6 (110):
      {1, 4} 5. 7 (111): all, 8. Two subsets sum to 4: masks 3 and 4. Every subset appeared
      exactly once.
    why: Counting from 0 to 2^n − 1 runs through every pattern of n bits, so every subset is visited.
  - id: subsets-faded
    kind: faded
    title: "Your turn: read the masks"
    objective: Decode masks for the values 5 2 6 (bits 0, 1, 2).
    seconds: 80
    body: Values 5 2 6.
    steps:
      - state: "mask = 6 (binary 110)."
        prompt: "Which subset, and its sum?"
        options: ["{2, 6}, 8", "{5, 2}, 7", "{6}, 6"]
        answer: 0
        explanation: "Bits 1 and 2 are set: a[1] = 2 and a[2] = 6."
      - state: "We want sum 11."
        prompt: "Which mask?"
        options: ["5 (101)", "3 (011)", "6 (110)"]
        answer: 0
        explanation: "5 + 6 = 11: bits 0 and 2."
      - state: "How many masks does the loop visit?"
        prompt: "Count?"
        options: ["8", "3", "6"]
        answer: 0
        explanation: "2^3 = 8, from 0 to 7."
  - id: subsets-visualizer
    kind: visualizer
    title: "Step through: testing bits"
    objective: Predict which items mask 13 picks from 6 values.
    seconds: 90
    body: mask = 13, binary 001101 for items 0..5.
    steps:
      - state: "i = 0: (13 >> 0) & 1."
        prompt: "Is item 0 chosen?"
        options: ["Yes (1)", "No (0)"]
        answer: 0
        explanation: "13 is odd, so bit 0 is 1."
      - state: "i = 1: (13 >> 1) & 1 = 6 & 1."
        prompt: "Is item 1 chosen?"
        options: ["No (0)", "Yes (1)"]
        answer: 0
        explanation: "6 is even."
      - state: "i = 2 and i = 3: 3 & 1 and 1 & 1."
        prompt: "Are items 2 and 3 chosen?"
        options: ["Both yes", "Only 2", "Neither"]
        answer: 0
        explanation: "13 = 8 + 4 + 1: bits 3, 2 and 0."
      - state: "The chosen items."
        prompt: "Which set?"
        options: ["{0, 2, 3}", "{1, 3}", "{0, 1, 3}"]
        answer: 0
        explanation: "Bits 0, 2 and 3 are set."
  - id: subsets-micro
    kind: micro
    title: "Pitfall: a total that is never reset"
    objective: Give every subset a fresh total.
    seconds: 70
    misconception: missing-reset
    body: >-
      If total = 0 sits before the mask loop, the total of mask 1 is still there when mask 2
      starts, and every later subset adds on top. With values 3 1, masks give 0, 3, then 3 + 1 = 4
      instead of 1, then 4 + 4 = 8 instead of 4. Put total = 0 inside the mask loop, before
      the bit loop, so each subset starts from zero.
    why: Each mask is a separate subset; its sum must not carry anything from the previous one.
  - id: subsets-classify
    kind: classify
    title: "Enumerate subsets?"
    objective: Decide when 2^n is affordable.
    seconds: 90
    body: For each problem, choose the best-fitting approach.
    steps:
      - state: "18 items; choose some so their weights sum exactly to W."
        prompt: "Which approach?"
        options: ["Bitmask over all subsets", "Sort and take the smallest", "Sliding window"]
        answer: 0
        explanation: "2^18 ≈ 260,000 subsets: easily checked."
      - state: "100,000 items; count subsets with sum W (W ≤ 1000)."
        prompt: "Which approach?"
        options: ["DP over sums", "Bitmask over all subsets", "Fast power"]
        answer: 0
        explanation: "2^100000 is impossible; a DP over the sum range works."
      - state: "8 people; try every seating order around a table."
        prompt: "Which approach?"
        options: ["Enumerate permutations (8! = 40,320)", "Enumerate subsets", "Binary search"]
        answer: 0
        explanation: "Orders, not choices: permutations rather than subsets."
