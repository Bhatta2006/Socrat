atoms:
  - id: fast-power-worked
    kind: worked
    title: "Worked: 3^13 mod 100"
    objective: Read the exponent's bits from the lowest up, squaring as you go.
    seconds: 100
    body: >-
      13 is 1101 in binary. result = 1, b = 3. Bit 1: result = 3; b = 9. Bit 0: skip; b = 81.
      Bit 1: result = 3 · 81 = 243 → 43; b = 81² = 6561 → 61. Bit 1: result = 43 · 61 = 2623 →
      23; b squared, no longer needed. Answer: 23. Check: 3^13 = 1594323, which ends in 23. Four
      steps instead of twelve multiplications.
    why: b always holds 3^(2^k) for the bit being read, so each 1 bit multiplies in exactly its power.
  - id: fast-power-faded
    kind: faded
    title: "Your turn: 2^10 mod 1000"
    objective: Run the loop on 10 = 1010 in binary.
    seconds: 90
    body: result = 1, b = 2, e = 10.
    steps:
      - state: "e = 10 is even."
        prompt: "What happens this step?"
        options: ["Skip the multiply; b = 4, e = 5", "result = 2; b = 4, e = 5", "result = 2; b = 4, e = 9"]
        answer: 0
        explanation: "Even e: no factor; square b and halve e."
      - state: "e = 5 is odd, b = 4."
        prompt: "What happens?"
        options: ["result = 4; b = 16, e = 2", "result = 16; b = 16, e = 2", "Skip; b = 16, e = 2"]
        answer: 0
        explanation: "Odd e: multiply b into result."
      - state: "e = 2 (skip, b = 256, e = 1), then e = 1 with b = 256."
        prompt: "Final result?"
        options: ["24", "1024", "256"]
        answer: 0
        explanation: "4 · 256 = 1024 → 24 mod 1000."
  - id: fast-power-visualizer
    kind: visualizer
    title: "Step through: b and e"
    objective: Predict b and e after each step for 5^6 mod 7.
    seconds: 90
    body: result = 1, b = 5, e = 6 (binary 110).
    steps:
      - state: "e = 6, even."
        prompt: "After the step: b and e?"
        options: ["b = 4, e = 3", "b = 25, e = 3", "b = 4, e = 5"]
        answer: 0
        explanation: "25 mod 7 = 4; e halves to 3."
      - state: "e = 3, odd, b = 4."
        prompt: "result, then b and e?"
        options: ["result 4; b = 2, e = 1", "result 1; b = 2, e = 1", "result 4; b = 16, e = 1"]
        answer: 0
        explanation: "result = 4; b = 16 mod 7 = 2."
      - state: "e = 1, odd, b = 2."
        prompt: "Final result?"
        options: ["1", "8", "2"]
        answer: 0
        explanation: "4 · 2 = 8 → 1 mod 7. Indeed 5^6 ≡ 1 (mod 7)."
  - id: fast-power-micro
    kind: micro
    title: "Pitfall: reducing only at the end"
    objective: Take the remainder after every multiplication.
    seconds: 70
    misconception: mod-only-at-end
    body: >-
      (a · b) mod m equals ((a mod m) · (b mod m)) mod m, so you may reduce at every step. You
      must, in C++ and Java: 3^200 has 96 digits and overflows any built-in integer long before the
      final % runs. Even with every value below m ≈ 10^9, one product can reach 10^18, so keep
      64-bit types and reduce right after each multiply.
    why: Reducing early keeps every number small without changing the remainder.
  - id: fast-power-classify
    kind: classify
    title: "Fast power or not?"
    objective: Recognise exponent problems in disguise.
    seconds: 90
    body: For each problem, choose the best-fitting approach.
    steps:
      - state: "A password has n characters, each one of 26 letters. How many passwords, mod 10^9 + 7, for n = 10^18?"
        prompt: "Which approach?"
        options: ["26^n with fast power", "A loop of n multiplications", "Generate them"]
        answer: 0
        explanation: "n is far too large for a loop: log2(10^18) ≈ 60 steps."
      - state: "Compute n! mod 10^9 + 7 for n = 10^6."
        prompt: "Which approach?"
        options: ["A loop multiplying 1..n with % each step", "Fast power", "Binary search"]
        answer: 0
        explanation: "A factorial has different factors, not a repeated one."
      - state: "a / b mod p, where p is prime."
        prompt: "Which approach?"
        options: ["a · b^(p − 2) mod p", "Integer division a / b", "Sort a and b"]
        answer: 0
        explanation: "Division mod p multiplies by the inverse, found with fast power."
