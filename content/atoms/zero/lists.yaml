- objective: Store many values in order under one name, and process them with loops.
  seconds: 60
  id: concept
  kind: concept
  title: Lists and arrays
  body: The first value is stored at index zero. Three readings of 2, 4 and 6 put 2 at the first position.
  why: Lists keep values in order; indexes run from 0 to n − 1. Loop over values for items, over indexes
    when position matters.
- objective: Store many values in order under one name, and process them with loops.
  seconds: 60
  id: worked
  kind: worked
  title: One worked example
  body: The first value is stored at index zero. Three readings of 2, 4 and 6 put 2 at the first position.
  why: Zero is the first index in these three languages.
  adapters:
    python:
      code: 'readings=[2,4,6]

        print(readings[0])

        '
      expected: '2

        '
    cpp:
      code: "#include <bits/stdc++.h>\nusing namespace std;\nint main() {\n    vector<int> readings={2,4,6};\
        \ cout << readings[0] << \"\\n\";\n}\n"
      expected: '2

        '
    java:
      code: "import java.util.*;\npublic class Solution {\n  public static void main(String[] args) {\n\
        \    int[] readings={2,4,6}; System.out.println(readings[0]);\n  }\n}\n"
      expected: '2

        '
