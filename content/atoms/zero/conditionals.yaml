atoms:
- objective: Use if, else if and else to run different code depending on the situation.
  seconds: 20
  id: hook
  kind: hook
  title: Why this matters
  body: Think about a small everyday task. An account balance of 7 covers a purchase of 5.
- objective: Use if, else if and else to run different code depending on the situation.
  seconds: 60
  id: concept
  kind: concept
  title: Making decisions with if
  body: An account balance of 7 covers a purchase of 5. Only the affordable branch runs.
  why: '`if` runs a block only when its condition is true. In an if / else-if / else chain, only the first
    true branch runs.'
- objective: Use if, else if and else to run different code depending on the situation.
  seconds: 60
  id: worked
  kind: worked
  title: One worked example
  body: An account balance of 7 covers a purchase of 5. Only the affordable branch runs.
  why: The chosen branch follows whether the condition is true.
  adapters:
    python:
      code: 'balance=7

        print("yes" if balance>=5 else "no")

        '
      expected: 'yes

        '
    cpp:
      code: "#include <bits/stdc++.h>\nusing namespace std;\nint main() {\n    int balance=7; cout <<\
        \ (balance>=5 ? \"yes\" : \"no\") << \"\\n\";\n}\n"
      expected: 'yes

        '
    java:
      code: "import java.util.*;\npublic class Solution {\n  public static void main(String[] args) {\n\
        \    int balance=7; System.out.println(balance>=5 ? \"yes\" : \"no\");\n  }\n}\n"
      expected: 'yes

        '
