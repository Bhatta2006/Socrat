atoms:
  - id: accumulator-worked
    kind: worked
    title: "Worked: total of 1 to 4"
    objective: Start at a neutral value, then add the current value on every pass.
    seconds: 70
    body: >-
      total = 0 before the loop. i = 1: total becomes 1. i = 2: 3. i = 3: 6. i = 4: 10. The loop
      stops after 4, because range(1, 5) excludes 5 (in C++ and Java, i <= 4). It prints 10.
      Starting at 0 means the first value is added once and nothing extra sneaks in.
    why: The accumulator lives outside the loop and grows by one value per pass.
  - id: accumulator-faded
    kind: faded
    title: "Your turn: multiply 1 to 4"
    objective: Pick the start value and the update for a product.
    seconds: 70
    body: Compute 1 × 2 × 3 × 4.
    steps:
      - state: "product = ? before the loop."
        prompt: "Which start value?"
        options: ["1", "0", "4"]
        answer: 0
        explanation: "Multiplying by 1 changes nothing; 0 would make everything 0."
      - state: "Inside the loop, with the current value i."
        prompt: "Which update?"
        options: ["product *= i", "product += i", "product = i"]
        answer: 0
        explanation: "A product multiplies in each value."
      - state: "The loop has finished."
        prompt: "What does it print?"
        options: ["24", "10", "0"]
        answer: 0
        explanation: "1 × 2 × 3 × 4 = 24."
  - id: accumulator-visualizer
    kind: visualizer
    title: "Step through: every third number"
    objective: Track total and i together.
    seconds: 80
    body: total = 0; for i in range(2, 12, 3), add i.
    steps:
      - state: "i = 2."
        prompt: "total after this pass?"
        options: ["2", "0", "3"]
        answer: 0
        explanation: "0 + 2 = 2."
      - state: "Next i."
        prompt: "What is i now, and total?"
        options: ["i = 5, total 7", "i = 3, total 5", "i = 5, total 5"]
        answer: 0
        explanation: "The step is 3: i = 5, total 2 + 5 = 7."
      - state: "i = 8."
        prompt: "total after this pass?"
        options: ["15", "8", "13"]
        answer: 0
        explanation: "7 + 8 = 15."
      - state: "Next i would be 11."
        prompt: "Does the loop run for 11, and what is printed?"
        options: ["Yes; 26", "No; 15", "Yes; 11"]
        answer: 0
        explanation: "11 is below the stop value 12, so it runs: 15 + 11 = 26."
  - id: accumulator-micro
    kind: micro
    title: "Pitfall: the wrong start value"
    objective: Choose the neutral start for the operation.
    seconds: 60
    misconception: accumulator-init-one
    body: >-
      A sum must start at 0 and a product at 1: those are the values that change nothing. Start
      a sum at 1 and every answer is one too big. Start a product at 0 and every answer is 0. Ask:
      what result is right if the loop runs zero times? For "sum of nothing" that is 0; for
      "product of nothing" it is 1.
    why: The start value is the answer for an empty loop.
  - id: accumulator-classify
    kind: classify
    title: "Which accumulator?"
    objective: Match the task to the start value and update.
    seconds: 70
    body: For each task, choose start and update.
    steps:
      - state: "How many numbers from 1 to 50 are multiples of 7?"
        prompt: "Start and update?"
        options: ["0; count += 1 when i % 7 == 0", "1; count *= i", "0; count += i"]
        answer: 0
        explanation: "A count starts at 0 and goes up by one per match."
      - state: "The product of the digits of 432."
        prompt: "Start and update?"
        options: ["1; product *= digit", "0; product *= digit", "0; product += digit"]
        answer: 0
        explanation: "A product starts at 1: 4 × 3 × 2 = 24."
      - state: "The total of all prices in a basket."
        prompt: "Start and update?"
        options: ["0; total += price", "1; total += price", "0; total = price"]
        answer: 0
        explanation: "A sum starts at 0 and adds each price."
