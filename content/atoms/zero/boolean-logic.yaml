- objective: Use and, or and not to express exact rules, and reason about them precisely.
  seconds: 60
  id: micro
  kind: micro
  title: 'Repair: Combining conditions'
  body: Write each comparison separately and join it with AND. A chained comparison is not a portable
    C++ or Java range check.
  misconception: boolean-logic-repair
- objective: Use and, or and not to express exact rules, and reason about them precisely.
  seconds: 60
  id: syntax-repair
  kind: micro
  title: Separate syntax from strategy
  body: A compile error is feedback about how the program is written. Match quotes, brackets and braces,
    then read the first compiler diagnostic. Make one small repair and run again. This alone does not
    show a misconception about the algorithm.
  misconception: syntax-delimiters
- objective: Use and, or and not to express exact rules, and reason about them precisely.
  seconds: 60
  id: pattern
  kind: pattern
  title: Recognise the strategy
  body: AND requires both comparisons to be true. Write each comparison separately and join it with AND.
    A chained comparison is not a portable C++ or Java range check.
  why: Apply this reasoning to a fresh problem; an earlier worked example is not independent evidence.
- objective: Use and, or and not to express exact rules, and reason about them precisely.
