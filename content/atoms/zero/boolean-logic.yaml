atoms:
- objective: Use and, or and not to express exact rules, and reason about them precisely.
  seconds: 20
  id: hook
  kind: hook
  title: Why this matters
  body: Think about a small everyday task. A ticket is valid only when a score lies between 1 and 10.
- objective: Use and, or and not to express exact rules, and reason about them precisely.
  seconds: 60
  id: concept
  kind: concept
  title: Combining conditions
  body: A ticket is valid only when a score lies between 1 and 10. Both comparisons must hold.
  why: and/&& needs both sides true; or/|| needs at least one; not/! flips. Express ranges as two comparisons
    joined by and.
- objective: Use and, or and not to express exact rules, and reason about them precisely.
  seconds: 60
  id: worked
  kind: worked
  title: One worked example
  body: A ticket is valid only when a score lies between 1 and 10. Both comparisons must hold.
  why: AND requires both comparisons to be true.
  adapters:
    python:
      code: 'score=7

        print(int(score>=1 and score<=10))

        '
      expected: '1

        '
    cpp:
      code: "#include <bits/stdc++.h>\nusing namespace std;\nint main() {\n    int score=7; cout << (score>=1\
        \ && score<=10) << \"\\n\";\n}\n"
      expected: '1

        '
    java:
      code: "import java.util.*;\npublic class Solution {\n  public static void main(String[] args) {\n\
        \    int score=7; System.out.println(score>=1 && score<=10 ? 1 : 0);\n  }\n}\n"
      expected: '1

        '
