- objective: Text is a sequence of characters — index it, loop over it, compare it and build new text.
  seconds: 60
  id: micro
  kind: micro
  title: 'Repair: Strings'
  body: In Java use equals for text content, not == for object identity. Python and C++ string == compare
    contents.
  misconception: strings-repair
