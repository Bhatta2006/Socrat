- objective: Text is a sequence of characters — index it, loop over it, compare it and build new text.
  seconds: 60
  id: concept
  kind: concept
  title: Strings
  body: A search box compares text by its characters. Two separately created strings can contain the same
    letters.
  why: Strings behave like lists of characters with indexes from 0. Python and Java strings are immutable;
    build text with join or StringBuilder.
- objective: Text is a sequence of characters — index it, loop over it, compare it and build new text.
  seconds: 60
  id: worked
  kind: worked
  title: One worked example
  body: A search box compares text by its characters. Two separately created strings can contain the same
    letters.
  why: Text equality compares the character sequence.
  adapters:
    python:
      code: 'a="cat"

        b="c"+"at"

        print(int(a==b))

        '
      expected: '1

        '
    cpp:
      code: "#include <bits/stdc++.h>\nusing namespace std;\nint main() {\n    string a=\"cat\",b=\"c\"\
        +string(\"at\"); cout << (a==b) << \"\\n\";\n}\n"
      expected: '1

        '
    java:
      code: "import java.util.*;\npublic class Solution {\n  public static void main(String[] args) {\n\
        \    String a=\"cat\",b=new String(\"cat\"); System.out.println(a.equals(b) ? 1 : 0);\n  }\n}\n"
      expected: '1

        '
