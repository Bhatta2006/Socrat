provenance:
  origin: original
atoms:
  - id: filter-worked
    kind: worked
    title: "Worked: total of values above 5"
    objective: Start once, test each value, update only when the test passes.
    seconds: 80
    body: >-
      Values 4 9 5 7 2, limit 5. total starts at 0, before the loop. 4: not above 5, skip. 9:
      above, total 9. 5: equal, not above, skip. 7: above, total 16. 2: skip. The loop prints
      16. Notice 5 was skipped: "above" means strictly greater.
    why: The result lives outside the loop so every pass can add to it.
  - id: filter-faded
    kind: faded
    title: "Your turn: count the even values"
    objective: Choose the test and the update.
    seconds: 80
    body: Values 3 8 6 1 4. Count the even ones.
    steps:
      - state: "count = 0 before the loop."
        prompt: "Which test picks even values?"
        options: ["v % 2 == 0", "v % 2 == 1", "v > 2"]
        answer: 0
        explanation: "Even numbers leave remainder 0 when divided by 2."
      - state: "The test passes for 8."
        prompt: "Which update?"
        options: ["count += 1", "count += v", "count = 1"]
        answer: 0
        explanation: "Counting adds one per passing value."
      - state: "The loop has finished."
        prompt: "What does it print?"
        options: ["3", "18", "1"]
        answer: 0
        explanation: "8, 6 and 4 are even."
  - id: filter-visualizer
    kind: visualizer
    title: "Step through: count and total together"
    objective: Track two results under one test.
    seconds: 90
    body: Temperatures -3 4 -1 0 2. Count and add the ones below 0.
    steps:
      - state: "count = 0, total = 0. Visit -3."
        prompt: "After -3?"
        options: ["count 1, total -3", "count 0, total 0", "count 1, total 3"]
        answer: 0
        explanation: "-3 is below 0: one more, and add -3."
      - state: "Visit 4, then -1."
        prompt: "After -1?"
        options: ["count 2, total -4", "count 3, total 0", "count 2, total 4"]
        answer: 0
        explanation: "4 is skipped; -1 passes: count 2, total -3 + -1 = -4."
      - state: "Visit 0."
        prompt: "Does 0 pass 'below 0'?"
        options: ["No", "Yes"]
        answer: 0
        explanation: "0 is not below 0."
      - state: "Visit 2. The loop ends."
        prompt: "What are the results?"
        options: ["count 2, total -4", "count 3, total -4", "count 2, total 2"]
        answer: 0
        explanation: "Only -3 and -1 passed."
  - id: filter-micro
    kind: micro
    title: "Pitfall: resetting inside the loop"
    objective: Put the starting value before the loop.
    seconds: 60
    misconception: reset-inside-loop
    body: >-
      If total = 0 sits inside the loop, every pass wipes the total before it can grow. With
      values 9 7 and limit 5, the loop sets 0, adds 9, sets 0 again, adds 7, and prints 7. The
      starting value belongs before the loop: it runs once, and every pass builds on it.
    why: Code inside the loop runs once per item; setup must run once in total.
  - id: filter-classify
    kind: classify
    title: "Which result?"
    objective: Pick what the loop should build.
    seconds: 80
    body: For each task, choose what the loop keeps.
    steps:
      - state: "How many words in a list are longer than 5 letters?"
        prompt: "What does the loop keep?"
        options: ["A count", "A total of lengths", "The longest word"]
        answer: 0
        explanation: "'How many' means a count."
      - state: "The total price of all items under 10 euros."
        prompt: "What does the loop keep?"
        options: ["A total of passing prices", "A count", "The cheapest price"]
        answer: 0
        explanation: "'Total price' means adding the passing values."
      - state: "A new list of the names that start with A."
        prompt: "What does the loop keep?"
        options: ["A list it appends to", "A count", "A total"]
        answer: 0
        explanation: "The answer is the passing items themselves."
