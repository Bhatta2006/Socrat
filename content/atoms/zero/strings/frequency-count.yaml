atoms:
  - id: frequency-worked
    kind: worked
    title: "Worked: letters in 'banana'"
    objective: Give each letter its own counter and fill them in one pass.
    seconds: 80
    body: >-
      Start with 26 counters at 0. b: counts[1] = 1. a: counts[0] = 1. n: counts[13] = 1. a:
      counts[0] = 2. n: counts[13] = 2. a: counts[0] = 3. One pass, six letters. Now a = 3,
      n = 2, b = 1: the most common letter is a, three times.
    why: The letter itself picks its counter (ch − 'a'), so no search is needed.
  - id: frequency-faded
    kind: faded
    title: "Your turn: letters in 'level'"
    objective: Fill the counters and read the answer.
    seconds: 80
    body: Count each letter of 'level'.
    steps:
      - state: "After 'l', 'e', 'v' the counters for l, e, v are 1, 1, 1."
        prompt: "After the fourth letter, 'e'?"
        options: ["e = 2", "e = 1", "v = 2"]
        answer: 0
        explanation: "The second e adds 1 to e's counter."
      - state: "After the last letter, 'l'."
        prompt: "What are the counts?"
        options: ["l 2, e 2, v 1", "l 1, e 2, v 1", "l 2, e 1, v 2"]
        answer: 0
        explanation: "l and e each appear twice."
      - state: "Ties go to the earlier letter of the alphabet."
        prompt: "Which letter is most common?"
        options: ["e", "l", "v"]
        answer: 0
        explanation: "e and l tie at 2; e comes first."
  - id: frequency-visualizer
    kind: visualizer
    title: "Step through: index arithmetic"
    objective: Predict which counter each letter updates.
    seconds: 80
    body: Text 'cab'.
    steps:
      - state: "Letter 'c'."
        prompt: "Which counter goes up?"
        options: ["counts[2]", "counts[3]", "counts[0]"]
        answer: 0
        explanation: "'c' − 'a' = 2."
      - state: "Letter 'a'."
        prompt: "Which counter goes up?"
        options: ["counts[0]", "counts[1]", "counts[97]"]
        answer: 0
        explanation: "'a' − 'a' = 0."
      - state: "Letter 'b'."
        prompt: "Which counter goes up?"
        options: ["counts[1]", "counts[2]", "counts[0]"]
        answer: 0
        explanation: "'b' − 'a' = 1."
      - state: "All three counters are 1."
        prompt: "How many different letters does 'cab' have?"
        options: ["3", "1", "6"]
        answer: 0
        explanation: "Three counters are above 0."
  - id: frequency-micro
    kind: micro
    title: "Pitfall: one counter for everything"
    objective: Index the counter by the item itself.
    seconds: 60
    misconception: frequency-single-bucket
    body: >-
      Writing counts[0] += 1 for every letter adds everything to a's counter, so 'banana' gives
      a = 6 and every other letter 0. That only counts the letters in total. Each letter must pick
      its own slot: counts[ch − 'a'] += 1. The item decides where it is counted.
    why: A frequency table answers "how many of each", which needs one counter per kind.
  - id: frequency-classify
    kind: classify
    title: "Count or not?"
    objective: Spot tasks that need a frequency table.
    seconds: 80
    body: For each task, choose the approach.
    steps:
      - state: "Does any letter appear more than twice in a word?"
        prompt: "Which approach?"
        options: ["Count each letter", "Check the length", "Compare first and last letters"]
        answer: 0
        explanation: "'More than twice' needs per-letter counts."
      - state: "How many letters does a word have?"
        prompt: "Which approach?"
        options: ["Its length", "Count each letter", "Sort the letters"]
        answer: 0
        explanation: "Only the total is asked; no table is needed."
      - state: "Do two words use exactly the same letters, the same number of times?"
        prompt: "Which approach?"
        options: ["Count letters in both and compare", "Compare lengths", "Compare the first letters"]
        answer: 0
        explanation: "Equal counts for every letter is the definition of an anagram."
