  seconds: 20
  id: hook
  kind: hook
  title: Why this matters
  body: Think about a small everyday task. A delivery log must show its messages in the order they happened.
- objective: A program is a precise list of instructions the computer runs top to bottom. Printing is
    how it talks back.
  seconds: 60
  id: concept
  kind: concept
  title: Programs and output
  body: A delivery log must show its messages in the order they happened. Run two print instructions and
    read the two lines from top to bottom.
  why: A program runs its instructions in order, top to bottom. Printing shows output; the order of print
    statements is the order of output.
- objective: A program is a precise list of instructions the computer runs top to bottom. Printing is
    how it talks back.
  seconds: 60
  id: worked
  kind: worked
  title: One worked example
  body: A delivery log must show its messages in the order they happened. Run two print instructions and
    read the two lines from top to bottom.
  why: Instructions run from top to bottom.
  adapters:
    python:
      code: 'print("Start")

        print("Done")

        '
      expected: 'Start

        Done

        '
    cpp:
      code: "#include <bits/stdc++.h>\nusing namespace std;\nint main() {\n    cout << \"Start\\nDone\\\
        n\";\n}\n"
      expected: 'Start

        Done

        '
    java:
      code: "import java.util.*;\npublic class Solution {\n  public static void main(String[] args) {\n\
        \    System.out.println(\"Start\"); System.out.println(\"Done\");\n  }\n}\n"
      expected: 'Start

        Done

        '
