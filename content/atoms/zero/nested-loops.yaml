- objective: Put a loop inside a loop to handle rows and columns, pairs, and patterns.
  seconds: 20
  id: hook
  kind: hook
  title: Why this matters
  body: Think about a small everyday task. Two shelves each hold three books.
- objective: Put a loop inside a loop to handle rows and columns, pairs, and patterns.
  seconds: 60
  id: concept
  kind: concept
  title: Nested loops
  body: Two shelves each hold three books. The inner loop visits all three positions for each shelf.
  why: For every outer round, the inner loop runs completely. Total work is the product of the loop sizes.
- objective: Put a loop inside a loop to handle rows and columns, pairs, and patterns.
  seconds: 60
  id: worked
  kind: worked
  title: One worked example
  body: Two shelves each hold three books. The inner loop visits all three positions for each shelf.
  why: Every outer iteration runs the full inner loop.
  adapters:
    python:
      code: "count=0\nfor shelf in range(2):\n    for book in range(3):\n        count+=1\nprint(count)\n"
      expected: '6

        '
    cpp:
      code: "#include <bits/stdc++.h>\nusing namespace std;\nint main() {\n    int count=0; for(int s=0;s<2;++s)\
        \ for(int b=0;b<3;++b) ++count; cout << count << \"\\n\";\n}\n"
      expected: '6

        '
    java:
      code: "import java.util.*;\npublic class Solution {\n  public static void main(String[] args) {\n\
        \    int count=0; for(int s=0;s<2;++s) for(int b=0;b<3;++b) ++count; System.out.println(count);\n\
        \  }\n}\n"
      expected: '6

        '
