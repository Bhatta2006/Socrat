- objective: Variables are named boxes that hold values; every value has a type that decides what you
    can do with it.
  seconds: 60
  id: concept
  kind: concept
  title: Variables and types
  body: A counter begins at 4. One new visit updates it to 5. Assignment stores a new value; it does not
    assert an equation.
  why: A variable is a named place that stores one value at a time. `=` evaluates the right side, then
    stores the result on the left.
- objective: Variables are named boxes that hold values; every value has a type that decides what you
