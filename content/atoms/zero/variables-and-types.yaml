  kind: worked
  title: One worked example
  body: A counter begins at 4. One new visit updates it to 5. Assignment stores a new value; it does not
    assert an equation.
  why: The right side is evaluated before the new value is stored.
  adapters:
    python:
      code: 'visits=4

        visits=visits+1

        print(visits)

        '
      expected: '5

        '
    cpp:
      code: "#include <bits/stdc++.h>\nusing namespace std;\nint main() {\n    int visits=4; visits=visits+1;\
        \ cout << visits << \"\\n\";\n}\n"
      expected: '5

        '
    java:
      code: "import java.util.*;\npublic class Solution {\n  public static void main(String[] args) {\n\
        \    int visits=4; visits=visits+1; System.out.println(visits);\n  }\n}\n"
      expected: '5

        '
