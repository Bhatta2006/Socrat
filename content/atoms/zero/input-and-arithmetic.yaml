  title: Input and arithmetic
  body: A 125-second recording contains two full minutes and five seconds. Integer division gives the
    whole units and remainder gives what is left.
  why: 'Input arrives as text; convert it before doing arithmetic. Whole-number division: `//` in Python,
    `/` between ints in C++ and Java.'
- objective: Read values the user gives your program, convert them to numbers, and compute with + - *
