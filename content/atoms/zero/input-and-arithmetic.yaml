  seconds: 60
  id: worked
  kind: worked
  title: One worked example
  body: A 125-second recording contains two full minutes and five seconds. Integer division gives the
    whole units and remainder gives what is left.
  why: Whole-unit division and remainder answer different questions.
  adapters:
    python:
      code: 'seconds=125

        print(seconds//60,seconds%60)

        '
      expected: '2 5

        '
    cpp:
      code: "#include <bits/stdc++.h>\nusing namespace std;\nint main() {\n    int seconds=125; cout <<\
        \ seconds/60 << \" \" << seconds%60 << \"\\n\";\n}\n"
      expected: '2 5

        '
    java:
      code: "import java.util.*;\npublic class Solution {\n  public static void main(String[] args) {\n\
        \    int seconds=125; System.out.println(seconds/60+\" \"+seconds%60);\n  }\n}\n"
      expected: '2 5

        '
