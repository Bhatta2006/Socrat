- objective: Repeat a block a known number of times, or once for each item — the everyday loop.
  seconds: 60
  id: micro
  kind: micro
  title: 'Repair: For loops'
  body: Write the intended first and last values before coding the bounds. Python range excludes its stop;
    an inclusive 1..n range stops at n+1.
  misconception: for-loops-repair
