- objective: Repeat a block a known number of times, or once for each item — the everyday loop.
  seconds: 60
  id: concept
  kind: concept
  title: For loops
  body: Count the three lockers numbered 1 through 3. An inclusive upper end must appear in the iteration
    range.
  why: A for loop bundles start, condition and progress for counting loops. Python's range(a, b) stops
    before b; C++/Java conditions decide inclusion explicitly.
- objective: Repeat a block a known number of times, or once for each item — the everyday loop.
  seconds: 60
  id: worked
  kind: worked
  title: One worked example
  body: Count the three lockers numbered 1 through 3. An inclusive upper end must appear in the iteration
    range.
  why: The loop visits 1, 2 and 3 exactly once.
  adapters:
    python:
      code: "total=0\nfor i in range(1,4):\n    total+=i\nprint(total)\n"
      expected: '6

        '
    cpp:
      code: "#include <bits/stdc++.h>\nusing namespace std;\nint main() {\n    int total=0; for(int i=1;i<=3;++i)\
        \ total+=i; cout << total << \"\\n\";\n}\n"
      expected: '6

        '
    java:
      code: "import java.util.*;\npublic class Solution {\n  public static void main(String[] args) {\n\
        \    int total=0; for(int i=1;i<=3;++i) total+=i; System.out.println(total);\n  }\n}\n"
      expected: '6

        '
