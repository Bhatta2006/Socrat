- objective: Repeat a block for as long as a condition stays true — the tool for "keep going until...".
  seconds: 20
  id: hook
  kind: hook
  title: Why this matters
  body: Think about a small everyday task. A countdown must change its state on every iteration.
- objective: Repeat a block for as long as a condition stays true — the tool for "keep going until...".
  seconds: 60
  id: concept
  kind: concept
  title: While loops
  body: A countdown must change its state on every iteration. Subtracting one eventually makes the loop
    condition false.
  why: while repeats its body as long as the condition is true, checking before each round. Every loop
    needs a start, a condition, and progress toward stopping.
- objective: Repeat a block for as long as a condition stays true — the tool for "keep going until...".
  seconds: 60
  id: worked
  kind: worked
  title: One worked example
  body: A countdown must change its state on every iteration. Subtracting one eventually makes the loop
    condition false.
  why: Each iteration moves the state toward a false condition.
  adapters:
    python:
      code: "left=3\nwhile left>0:\n    left-=1\nprint(left)\n"
      expected: '0

        '
    cpp:
      code: "#include <bits/stdc++.h>\nusing namespace std;\nint main() {\n    int left=3; while(left>0)\
        \ { --left; } cout << left << \"\\n\";\n}\n"
      expected: '0

        '
    java:
      code: "import java.util.*;\npublic class Solution {\n  public static void main(String[] args) {\n\
        \    int left=3; while(left>0) { --left; } System.out.println(left);\n  }\n}\n"
      expected: '0

        '
