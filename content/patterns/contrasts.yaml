# Side-by-side contrast cards for the "confuses two similar patterns" trigger (§9.4).
# Keyed by a pattern-confusion misconception. Original, provisional, not reviewed.
pattern-fixed-vs-variable-window:
  title: "Fixed or variable window?"
  body: >-
    Fixed window: the problem gives the length k; slide by adding one value and dropping one.
    Variable window: the length is what you are looking for; grow while the rule holds and
    shrink when it breaks. Ask first: is the length given, or is it the answer?
pattern-window-vs-prefix-sums:
  title: "Window or prefix sums?"
  body: >-
    Use a window when every value is positive, so adding can only break the rule and dropping
    can only repair it. Use prefix sums with a hash map when values can be negative or the
    total must be hit exactly: a run i..j sums to P[j + 1] − P[i].
pattern-window-vs-two-pointers:
  title: "Window or two pointers?"
  body: >-
    A window keeps a summary of everything between left and right, because the answer is about
    the whole run. Two pointers on a sorted array compare just the two ends, such as a pair
    sum, and move whichever end gets closer to the target.
pattern-window-for-single-item:
  title: "A run, or a single item?"
  body: >-
    Windows answer questions about consecutive runs: longest, shortest, best total. A question
    about one item, such as the largest value or the first value above x, needs only a scan
    or a search, not a window.
pattern-brute-force-default:
  title: "Brute force, or the pattern?"
  body: >-
    Brute force is the right first idea and a good checker. Estimate its cost against the
    limits: n = 10^5 rules out O(n²). If it is too slow, look for the structure that lets you
    reuse work: a running summary, a monotone rule, or sorted order.
pattern-sort-breaks-order:
  title: "Can you sort?"
  body: >-
    Sorting helps when only the set of values matters. When the answer depends on positions,
    such as consecutive runs, deliveries in order or neighbours, sorting destroys the
    information you need. Check whether the problem says "consecutive" or "in order".
pattern-search-vs-scan:
  title: "Search, or scan once?"
  body: >-
    Binary search fits when a yes/no rule over sorted positions or over the answer flips only
    once. A single pass fits when every element must be visited anyway, such as totals, runs
    and counts. If you would check every candidate in order, ask whether the rule is monotone.
pattern-search-needs-sorted-input:
  title: "Does binary search need sorted input?"
  body: >-
    Searching an array needs it sorted. Searching on the answer does not: it needs a check
    that is monotone in the answer, such as "can finish within H hours at speed s". The input
    can be in any order.
pattern-ordered-vs-unordered-ways:
  title: "Ordered ways or unordered sums?"
  body: >-
    Climbing stairs counts orders: 1 + 2 and 2 + 1 are different climbs, so the recurrence adds
    the last step. Counting sums where order does not matter is coin change II: loop over the
    pieces in the outer loop so each collection is counted once. Ask whether reordering the
    pieces gives a new answer.
pattern-dp-vs-greedy:
  title: "Greedy or DP?"
  body: >-
    Greedy commits to the choice that looks best now and never looks back. That is safe only
    when you can prove the choice never blocks a better future, as with farthest reach in jump
    game. If a small counterexample exists, as with stair costs 1 2 100 3, try every choice with
    DP.
pattern-value-vs-choice:
  title: "Best value, or the choices behind it?"
  body: >-
    If the output is only the best value, keep as few dp cells as the transition reads. If it
    must show the path, items or sequence, keep a record of which option won at every cell, then
    walk back from the answer and reverse.
pattern-01-vs-unbounded-knapsack:
  title: "Once per item, or unlimited?"
  body: >-
    0/1 knapsack: each item exists once, so the one-row loop runs capacity from W down and never
    reads a cell that already contains the item. Unbounded knapsack: items repeat, so the loop
    runs upwards on purpose. Fractional knapsack: items can be split, so sort by value per
    weight and take greedily.
pattern-subset-vs-subarray:
  title: "Subset or subarray?"
  body: >-
    A subset may skip elements and ignores order: use the subset-sum table. A subarray is a
    contiguous run: use prefix sums or a sliding window. Look for the word contiguous, or for
    examples where the chosen numbers are next to each other.
pattern-partition-greedy-vs-dp:
  title: "Greedy balancing or reachable sums?"
  body: >-
    Putting each number into the lighter pile is fast but can be wrong: 3 3 2 2 2 ends with a
    difference of 2 when 0 is possible. When the total is small, mark every reachable sum up to
    half and take the closest one.
pattern-count-vs-exists:
  title: "Count, exists, or best?"
  body: >-
    The table is identical; only the combine step changes. Use or to ask whether a total is
    reachable, + to count the ways, and max or min for the best value. A yes/no table cannot be
    turned into counts afterwards.
pattern-two-budgets-vs-two-bags:
  title: "Two budgets or two bags?"
  body: >-
    Two budgets: every item spends from two limits at once, so the state is both remaining
    budgets. Two bags: each item goes into one of two places or nowhere, a three-way choice. Ask
    whether one item uses two resources, or one resource in one of two places.
pattern-exact-vs-at-most-capacity:
  title: "Exactly the budget, or at most?"
  body: >-
    "At most W" lets every cell start at 0, because taking nothing always fits. "Exactly W"
    means only dp[0] starts reachable: every other cell starts at infinity for a minimum, or
    minus infinity for a maximum, and the answer must be checked for still unreachable.
pattern-subsequence-vs-substring:
  title: "Subsequence or substring?"
  body: >-
    A subsequence may skip characters, so an LCS cell keeps the better of up and left on a
    mismatch. A substring is contiguous, so a common-substring cell resets to 0 on a mismatch
    and the answer is the largest cell anywhere. Look for the words contiguous, consecutive or
    block.
pattern-two-pointers-vs-lcs:
  title: "Two pointers or an LCS table?"
  body: >-
    If all of one string must appear in the other, match each character as early as possible
    with two pointers; there is nothing to choose. If you choose which characters to keep from
    both strings, an early match can block better ones, so fill the LCS table.
pattern-palindrome-subsequence-vs-substring:
  title: "Palindromic subsequence or substring?"
  body: >-
    A palindromic subsequence may skip characters, so on unequal ends keep the better of
    dropping either end. A palindromic substring must be contiguous, so s[i..j] counts only if
    the ends match and the inside is itself a palindrome; expanding around centres is simpler.
pattern-edit-vs-lcs-deletions:
  title: "Edit distance or LCS deletions?"
  body: >-
    If replacing a character is allowed, a wrong character costs one step, so take 1 plus the
    minimum of delete, insert and replace. If only inserts and deletes are allowed, it costs
    two, and n + m − 2·LCS is exact. Read which operations the statement allows.
pattern-wildcard-vs-regex-star:
  title: "Wildcard star or regex star?"
  body: >-
    A wildcard star stands alone and matches any sequence, so it either matches nothing (j − 1)
    or eats one more character (i − 1). A regex star belongs to the character before it, so x*
    is skipped as a pair (j − 2) or eats one more x.
pattern-stock-unlimited-vs-limited:
  title: "Unlimited trades or limited?"
  body: >-
    With unlimited trades and no fee or cooldown, every daily rise can be its own trade, so
    summing the rises is correct. Once trades are limited by a count, a cooldown or a fee,
    merging or skipping rises changes the answer, so run the cash and hold state machine.
pattern-strict-vs-nondecreasing-lis:
  title: "Strictly increasing or non-decreasing?"
  body: >-
    For a strictly increasing subsequence, compare with < and, in patience sorting, replace the
    first tail that is at least x (lower bound), so equal values never extend each other. For
    non-decreasing, use <= and the first tail greater than x (upper bound). Test with repeated
    values.
pattern-sort-then-lis:
  title: "Sort first, or keep the order?"
  body: >-
    If the input is a sequence, its order is part of the problem, so never sort; sorting makes
    every array its own increasing subsequence. If the input is a set of items such as boxes,
    pairs or numbers to choose, sort by one key so a chain only moves forwards, then run LIS on
    the other key.
pattern-interval-vs-front-partition:
  title: "Interval DP or front partition?"
  body: >-
    If a split leaves two pieces that both still need solving, and the cost of joining depends
    on both, the state is a range i..j, filled by length in O(n³). If only the last piece
    matters once the prefix before it is solved, as with palindrome cuts or word breaks, a
    prefix state is enough and costs O(n²).
pattern-bitmask-vs-knapsack:
  title: "Bitmask DP or knapsack?"
  body: >-
    If only a total matters, such as a weight or a sum, the state is that number and the item
    count can be large. If which items are used matters, because they interact like jobs and
    workers or cities on a route, the state must be the set itself, so n has to be about 20 or
    less.
pattern-game-greedy-vs-minimax:
  title: "Greedy move or minimax?"
  body: >-
    Greedy takes the move that looks best now. In a two-player game the opponent then replies
    with their best move, so value each position for the player to move, as the best score
    difference, and take the move that leaves the opponent the worst position.
pattern-state-remembers-rules:
  title: "What must the state remember?"
  body: >-
    Exactly the part of the past that a rule can look back at, such as the last character, the
    length of the current run, or a count capped at its limit. Remember less and forbidden
    sequences slip through; remember more and the table only grows.
pattern-digit-dp-vs-brute-force:
  title: "Loop over the numbers, or over their digits?"
  body: >-
    Up to about ten million numbers, a plain loop is simple and safe. Beyond that, count by
    digits from the left, with the position, what the property needs so far, and a tight flag
    that keeps the prefix from exceeding the limit.
