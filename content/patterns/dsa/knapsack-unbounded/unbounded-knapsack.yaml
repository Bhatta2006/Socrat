id: dsa:knapsack-unbounded/unbounded-knapsack
concept: dsa:knapsack-unbounded
title: 'Unbounded knapsack: reuse items as often as you like'
tracks:
- interview
- competitive
recognise:
- Items come in unlimited copies, under a length, weight or amount budget
- Maximise value, minimise a count, or count ways to reach the budget
- The budget is small enough to index; listing every multiset is too slow
state: dp[c] = best value within capacity c, any number of copies of each item
transition: 'for each item, c from w up to W: dp[c] = max(dp[c], dp[c − w] + v)'
base_cases:
- dp[c] = 0 for every c before any item
complexity:
  time: O(n · W)
  space: O(W) with one row
template:
  python: |
    n, W = map(int, input().split())
    w = list(map(int, input().split()))
    v = list(map(int, input().split()))
    dp = [0] * (W + 1)  # dp[c]: best value within capacity c, items reusable
    for i in range(n):
        for c in range(w[i], W + 1):  # forwards, so item i can be taken again
            dp[c] = max(dp[c], dp[c - w[i]] + v[i])
    print(dp[W])
  cpp: |
    #include <algorithm>
    #include <iostream>
    #include <vector>
    using namespace std;

    int main() {
        int n, W;
        cin >> n >> W;
        vector<int> w(n);
        vector<long long> v(n), dp(W + 1, 0);  // dp[c]: best value within capacity c
        for (auto& x : w) cin >> x;
        for (auto& x : v) cin >> x;
        for (int i = 0; i < n; i++)
            for (int c = w[i]; c <= W; c++)  // forwards, so item i can be taken again
                dp[c] = max(dp[c], dp[c - w[i]] + v[i]);
        cout << dp[W] << "\n";
    }
  java: |
    import java.util.Scanner;

    public class Solution {
        public static void main(String[] args) {
            Scanner in = new Scanner(System.in);
            int n = in.nextInt(), W = in.nextInt();
            int[] w = new int[n];
            long[] v = new long[n], dp = new long[W + 1];  // dp[c]: best value within capacity c
            for (int i = 0; i < n; i++) w[i] = in.nextInt();
            for (int i = 0; i < n; i++) v[i] = in.nextLong();
            for (int i = 0; i < n; i++)
                for (int c = w[i]; c <= W; c++)  // forwards, so item i can be taken again
                    dp[c] = Math.max(dp[c], dp[c - w[i]] + v[i]);
            System.out.println(dp[W]);
        }
    }
