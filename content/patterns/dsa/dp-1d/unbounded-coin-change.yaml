id: dsa:dp-1d/unbounded-coin-change
concept: dsa:dp-1d
title: Unbounded coin change (fewest pieces, unlimited supply)
tracks: [interview, competitive]
recognise:
  - Make an exact total from pieces you may reuse without limit
  - Fewest pieces or cheapest mix, where greedy picks can fail
  - The best total for a depends on totals a − c for each piece c
state: "dp[a] = fewest coins whose values add up to exactly a"
transition: "dp[a] = min over coins c <= a of dp[a - c] + 1"
base_cases: ["dp[0] = 0", "dp[a] = INF (unreachable) until some coin reaches it"]
complexity: {time: "O(amount · coins)", space: "O(amount)"}
template:
  python: |
    import sys

    data = sys.stdin.read().split()
    n, amount = int(data[0]), int(data[1])
    coins = list(map(int, data[2 : 2 + n]))
    INF = float("inf")
    dp = [0] + [INF] * amount  # dp[a] = fewest coins that make exactly a
    for a in range(1, amount + 1):
        for c in coins:
            if c <= a:
                dp[a] = min(dp[a], dp[a - c] + 1)  # last coin is c
    print(dp[amount] if dp[amount] != INF else -1)  # INF: unreachable
  cpp: |
    #include <bits/stdc++.h>
    using namespace std;

    int main() {
        int n, amount;
        cin >> n >> amount;
        vector<int> coins(n);
        for (int& c : coins) cin >> c;
        const int INF = INT_MAX / 2;
        vector<int> dp(amount + 1, INF);  // fewest coins for exactly a
        dp[0] = 0;
        for (int a = 1; a <= amount; a++)
            for (int c : coins)
                if (c <= a) dp[a] = min(dp[a], dp[a - c] + 1);  // last coin is c
        cout << (dp[amount] >= INF ? -1 : dp[amount]) << "\n";
    }
  java: |
    import java.util.*;

    public class Solution {
        public static void main(String[] args) {
            Scanner in = new Scanner(System.in);
            int n = in.nextInt(), amount = in.nextInt();
            int[] coins = new int[n];
            for (int i = 0; i < n; i++) coins[i] = in.nextInt();
            final int INF = Integer.MAX_VALUE / 2;
            int[] dp = new int[amount + 1];  // fewest coins for exactly a
            Arrays.fill(dp, INF);
            dp[0] = 0;
            for (int a = 1; a <= amount; a++)
                for (int c : coins)
                    if (c <= a) dp[a] = Math.min(dp[a], dp[a - c] + 1);  // last coin is c
            System.out.println(dp[amount] >= INF ? -1 : dp[amount]);
        }
    }
