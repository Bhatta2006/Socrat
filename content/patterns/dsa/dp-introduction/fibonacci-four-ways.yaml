id: dsa:dp-introduction/fibonacci-four-ways
concept: dsa:dp-introduction
title: 'Fibonacci four ways: recursion, memo, table, two variables'
tracks:
- interview
- competitive
recognise:
- The answer for n is a fixed mix of answers for a few smaller sizes
- Asks for the n-th term or the number of ways, with large n
- The recursion tree repeats the same calls many times
state: F(i) = the i-th term; keep only F(i − 1) and F(i − 2)
transition: F(i) = F(i − 1) + F(i − 2), filled for i increasing
base_cases:
- F(0) = 0
- F(1) = 1
complexity:
  time: O(n)
  space: O(1) with two variables
template:
  python: |
    n = int(input())
    prev, cur = 0, 1  # F(0) and F(1)
    for _ in range(n):
        prev, cur = cur, prev + cur  # slide the two-number window forward
    print(prev)
  cpp: |
    #include <iostream>
    using namespace std;

    int main() {
        int n;
        cin >> n;
        long long prev = 0, cur = 1;  // F(0) and F(1)
        for (int i = 0; i < n; i++) {
            long long next = prev + cur;
            prev = cur;
            cur = next;
        }
        cout << prev << "\n";
    }
  java: |
    import java.util.Scanner;

    public class Solution {
        public static void main(String[] args) {
            int n = new Scanner(System.in).nextInt();
            long prev = 0, cur = 1;  // F(0) and F(1)
            for (int i = 0; i < n; i++) {
                long next = prev + cur;
                prev = cur;
                cur = next;
            }
            System.out.println(prev);
        }
    }
