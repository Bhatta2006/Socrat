id: dsa:dp-lcs/lcs
concept: dsa:dp-lcs
title: 'Longest common subsequence: compare two prefixes'
tracks:
- interview
- competitive
recognise:
- Two strings or arrays; keep characters in order but not necessarily adjacent
- Longest common part, fewest deletions to make equal, or unchanged lines
- Lengths up to a few thousand, so an n by m table fits
state: dp[i][j] = LCS length of a[:i] and b[:j]
transition: 'match: dp[i−1][j−1] + 1; mismatch: max(dp[i−1][j], dp[i][j−1])'
base_cases:
- dp[0][j] = dp[i][0] = 0
complexity:
  time: O(n · m)
  space: O(m) with two rows
template:
  python: |
    a = input().strip()
    b = input().strip()
    n, m = len(a), len(b)
    prev = [0] * (m + 1)  # prev[j]: LCS of a[:i-1] and b[:j]
    for i in range(1, n + 1):
        cur = [0] * (m + 1)
        for j in range(1, m + 1):
            if a[i - 1] == b[j - 1]:
                cur[j] = prev[j - 1] + 1  # extend the LCS of both shorter prefixes
            else:
                cur[j] = max(prev[j], cur[j - 1])  # drop the last char of a or of b
        prev = cur
    print(prev[m])
  cpp: |
    #include <algorithm>
    #include <iostream>
    #include <string>
    #include <vector>
    using namespace std;

    int main() {
        string a, b;
        cin >> a >> b;
        int n = a.size(), m = b.size();
        vector<int> prev(m + 1, 0), cur(m + 1, 0);  // prev[j]: LCS of a[:i-1] and b[:j]
        for (int i = 1; i <= n; i++) {
            for (int j = 1; j <= m; j++)
                cur[j] = a[i - 1] == b[j - 1] ? prev[j - 1] + 1  // extend both prefixes
                                              : max(prev[j], cur[j - 1]);  // drop one char
            swap(prev, cur);
        }
        cout << prev[m] << "\n";
    }
  java: |
    import java.util.Scanner;

    public class Solution {
        public static void main(String[] args) {
            Scanner in = new Scanner(System.in);
            String a = in.next(), b = in.next();
            int n = a.length(), m = b.length();
            int[] prev = new int[m + 1], cur = new int[m + 1];  // prev[j]: LCS of a[:i-1], b[:j]
            for (int i = 1; i <= n; i++) {
                for (int j = 1; j <= m; j++)
                    cur[j] = a.charAt(i - 1) == b.charAt(j - 1) ? prev[j - 1] + 1  // extend both
                                                               : Math.max(prev[j], cur[j - 1]);
                int[] t = prev; prev = cur; cur = t;
            }
            System.out.println(prev[m]);
        }
    }
