id: dsa:sliding-window/variable-size
concept: dsa:sliding-window
title: Variable-size window (grow, then shrink)
tracks: [interview, competitive]
recognise:
  - Asks for the longest or shortest contiguous run that obeys a rule
  - Adding an element can only break the rule; removing one can only repair it
  - Brute force would check every subarray in O(n²)
state: "window [left, right] plus a summary (sum or counts) of exactly what is inside"
transition: "take a[right]; while the rule is broken, drop a[left] and move left; then measure"
base_cases: ["left = 0 with an empty summary", "best = 0 before any window is valid"]
complexity: {time: "O(n): each index enters and leaves once", space: "O(k) for the summary"}
template:
  python: |
    import sys

    s = sys.stdin.readline().strip()
    count = {}  # summary: how often each character is inside the window
    left = best = 0
    for right, ch in enumerate(s):
        count[ch] = count.get(ch, 0) + 1  # grow: take s[right]
        while count[ch] > 1:  # rule broken: a repeat inside
            count[s[left]] -= 1  # shrink: drop s[left]
            left += 1
        best = max(best, right - left + 1)  # the window is valid here
    print(best)
  cpp: |
    #include <bits/stdc++.h>
    using namespace std;

    int main() {
        string s;
        cin >> s;
        map<char, int> count;  // summary of the window
        int left = 0, best = 0;
        for (int right = 0; right < (int)s.size(); right++) {
            count[s[right]]++;              // grow
            while (count[s[right]] > 1) {   // rule broken
                count[s[left]]--;           // shrink
                left++;
            }
            best = max(best, right - left + 1);
        }
        cout << best << "\n";
    }
  java: |
    import java.util.*;

    public class Solution {
        public static void main(String[] args) {
            String s = new Scanner(System.in).next();
            Map<Character, Integer> count = new HashMap<>();  // summary of the window
            int left = 0, best = 0;
            for (int right = 0; right < s.length(); right++) {
                count.merge(s.charAt(right), 1, Integer::sum);  // grow
                while (count.get(s.charAt(right)) > 1) {         // rule broken
                    count.merge(s.charAt(left), -1, Integer::sum);  // shrink
                    left++;
                }
                best = Math.max(best, right - left + 1);
            }
            System.out.println(best);
        }
    }
template_io: {stdin: "abcabcbb\n", expected: "3"}
