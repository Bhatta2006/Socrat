id: dsa:sliding-window/at-most-k-distinct
concept: dsa:sliding-window
title: At most k distinct values in a window
tracks: [interview, competitive]
recognise:
  - A contiguous run may hold at most k different values or kinds
  - The window keeps a count per value; a value leaves when its count hits zero
  - Exactly k is solved as at most k minus at most k − 1
state: "window [left, right] with a count map; the map's size is the number of distinct values"
transition: "count a[right]; while the map holds more than k values, uncount a[left] and move left"
base_cases: ["empty map, left = 0", "best = 0"]
complexity: {time: "O(n) map operations", space: "O(k) for the map"}
template:
  python: |
    import sys

    s, k = sys.stdin.read().split()
    k = int(k)
    count = {}  # value -> occurrences inside the window
    left = best = 0
    for right, ch in enumerate(s):
        count[ch] = count.get(ch, 0) + 1
        while len(count) > k:  # too many different values
            count[s[left]] -= 1
            if count[s[left]] == 0:
                del count[s[left]]  # it is gone from the window
            left += 1
        best = max(best, right - left + 1)
    print(best)
  cpp: |
    #include <bits/stdc++.h>
    using namespace std;

    int main() {
        string s;
        int k;
        cin >> s >> k;
        map<char, int> count;  // value -> occurrences inside the window
        int left = 0, best = 0;
        for (int right = 0; right < (int)s.size(); right++) {
            count[s[right]]++;
            while ((int)count.size() > k) {  // too many different values
                if (--count[s[left]] == 0) count.erase(s[left]);
                left++;
            }
            best = max(best, right - left + 1);
        }
        cout << best << "\n";
    }
  java: |
    import java.util.*;

    public class Solution {
        public static void main(String[] args) {
            Scanner in = new Scanner(System.in);
            String s = in.next();
            int k = in.nextInt();
            Map<Character, Integer> count = new HashMap<>();
            int left = 0, best = 0;
            for (int right = 0; right < s.length(); right++) {
                count.merge(s.charAt(right), 1, Integer::sum);
                while (count.size() > k) {  // too many different values
                    char out = s.charAt(left++);
                    if (count.merge(out, -1, Integer::sum) == 0) count.remove(out);
                }
                best = Math.max(best, right - left + 1);
            }
            System.out.println(best);
        }
    }
