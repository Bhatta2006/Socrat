id: dsa:dp-lis/lis-quadratic
concept: dsa:dp-lis
title: 'Longest increasing subsequence: best chain ending at each element'
tracks:
- interview
- competitive
recognise:
- Keep a subsequence (order kept, gaps allowed) that strictly rises
- Longest chain, number of longest chains, or fewest removals to make it rise
- n up to a few thousand for O(n²); larger n needs patience sorting
state: dp[i] = longest strictly increasing subsequence ending at a[i]
transition: dp[i] = 1 + max(dp[j]) over j < i with a[j] < a[i]
base_cases:
- dp[i] = 1 (the element alone)
complexity:
  time: O(n²)
  space: O(n)
template:
  python: |
    n = int(input())
    a = list(map(int, input().split()))
    dp = [1] * n  # dp[i]: longest increasing subsequence ending at a[i]
    for i in range(n):
        for j in range(i):
            if a[j] < a[i]:  # a[i] can extend the chain ending at a[j]
                dp[i] = max(dp[i], dp[j] + 1)
    print(max(dp))  # the best chain can end anywhere
  cpp: |
    #include <algorithm>
    #include <iostream>
    #include <vector>
    using namespace std;

    int main() {
        int n;
        cin >> n;
        vector<int> a(n), dp(n, 1);  // dp[i]: longest increasing subsequence ending at a[i]
        for (auto& x : a) cin >> x;
        for (int i = 0; i < n; i++)
            for (int j = 0; j < i; j++)
                if (a[j] < a[i]) dp[i] = max(dp[i], dp[j] + 1);  // extend the chain ending at a[j]
        cout << *max_element(dp.begin(), dp.end()) << "\n";  // the best chain can end anywhere
    }
  java: |
    import java.util.Scanner;

    public class Solution {
        public static void main(String[] args) {
            Scanner in = new Scanner(System.in);
            int n = in.nextInt();
            int[] a = new int[n], dp = new int[n];  // dp[i]: longest increasing subsequence ending at a[i]
            for (int i = 0; i < n; i++) a[i] = in.nextInt();
            int best = 0;
            for (int i = 0; i < n; i++) {
                dp[i] = 1;
                for (int j = 0; j < i; j++)
                    if (a[j] < a[i]) dp[i] = Math.max(dp[i], dp[j] + 1);  // extend the chain at a[j]
                best = Math.max(best, dp[i]);  // the best chain can end anywhere
            }
            System.out.println(best);
        }
    }
