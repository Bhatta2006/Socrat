id: dsa:hashing/prefix-sum-hashmap
concept: dsa:hashing
title: 'Prefix state hash map: an earlier prefix equal to total − k'
tracks:
- interview
- competitive
recognise:
- Contiguous subarrays with a condition on their sum, or on a count turned into a sum
- The array may hold negative numbers, so a sliding window cannot decide when to shrink
- Asked for the longest, the shortest or the number of such subarrays
state: first[s] = the first index at which the running prefix sum equals s; the empty prefix is 0 at −1
transition: at index i, total += a[i]; if total − k is stored, a[first[total − k] + 1 .. i] sums to k;
  then keep the first index of total
base_cases:
- the empty prefix, sum 0, ends at index −1
complexity:
  time: O(n) expected
  space: O(n)
template:
  python: |
    import sys

    data = sys.stdin.read().split()
    n, k = int(data[0]), int(data[1])
    a = [int(x) for x in data[2:2 + n]]
    first = {0: -1}  # prefix sum -> first index where it ends; the empty prefix ends at -1
    total = best = 0
    for i, x in enumerate(a):
        total += x
        if total - k in first:  # a[first[total - k] + 1 .. i] sums to k
            best = max(best, i - first[total - k])
        first.setdefault(total, i)  # keep the FIRST index: it gives the longest subarray
    print(best)
  cpp: |
    #include <algorithm>
    #include <iostream>
    #include <unordered_map>
    using namespace std;

    int main() {
        int n;
        long long k, total = 0;
        cin >> n >> k;
        unordered_map<long long, int> first = {{0, -1}};  // prefix sum -> first index; empty prefix: -1
        int best = 0;
        for (int i = 0; i < n; i++) {
            long long x;
            cin >> x;
            total += x;
            auto it = first.find(total - k);
            if (it != first.end()) best = max(best, i - it->second);  // a[it->second + 1 .. i] sums to k
            first.insert({total, i});  // insert never overwrites: the FIRST index is kept
        }
        cout << best << "\n";
    }
  java: |
    import java.util.*;

    public class Solution {
        public static void main(String[] args) {
            Scanner in = new Scanner(System.in);
            int n = in.nextInt();
            long k = in.nextLong(), total = 0;
            Map<Long, Integer> first = new HashMap<>();  // prefix sum -> first index where it ends
            first.put(0L, -1);  // the empty prefix ends at -1
            int best = 0;
            for (int i = 0; i < n; i++) {
                total += in.nextLong();
                Integer j = first.get(total - k);
                if (j != null) best = Math.max(best, i - j);  // a[j + 1 .. i] sums to k
                first.putIfAbsent(total, i);  // keep the FIRST index: it gives the longest subarray
            }
            System.out.println(best);
        }
    }
template_io:
  stdin: |
    5 3
    1 -1 5 -2 3
  expected: '4'
