id: dsa:dp-squares/maximal-square
concept: dsa:dp-squares
title: 'Maximal square: the largest square ending at each cell'
tracks:
- interview
- competitive
recognise:
- A 0/1 grid and the largest or the number of all-ones squares
- One size parameter, so one number per cell can describe it
- r · c up to about a million cells
state: dp[i][j] = side of the largest all-ones square with bottom-right corner (i, j)
transition: 'cell 1: dp[i][j] = 1 + min(up, left, up-left); cell 0: 0'
base_cases:
- the padded row 0 and column 0 are 0
complexity:
  time: O(r · c)
  space: O(c) with one row
template:
  python: |
    r, c = map(int, input().split())
    grid = [input().strip() for _ in range(r)]
    dp = [0] * (c + 1)  # dp[j]: side of the largest square ending at column j of the current row
    best = 0
    for i in range(r):
        diag = 0  # dp of the cell up-left, from the previous row
        for j in range(1, c + 1):
            up = dp[j]  # still the previous row's value
            dp[j] = 1 + min(up, dp[j - 1], diag) if grid[i][j - 1] == "1" else 0
            diag = up
            best = max(best, dp[j])
    print(best * best)
  cpp: |
    #include <algorithm>
    #include <iostream>
    #include <string>
    #include <vector>
    using namespace std;

    int main() {
        int r, c;
        cin >> r >> c;
        vector<int> dp(c + 1, 0);  // dp[j]: side of the largest square ending at column j of this row
        int best = 0;
        for (int i = 0; i < r; i++) {
            string row;
            cin >> row;
            int diag = 0;  // dp of the cell up-left, from the previous row
            for (int j = 1; j <= c; j++) {
                int up = dp[j];  // still the previous row's value
                dp[j] = row[j - 1] == '1' ? 1 + min({up, dp[j - 1], diag}) : 0;
                diag = up;
                best = max(best, dp[j]);
            }
        }
        cout << (long long)best * best << "\n";
    }
  java: |
    import java.util.Scanner;

    public class Solution {
        public static void main(String[] args) {
            Scanner in = new Scanner(System.in);
            int r = in.nextInt(), c = in.nextInt();
            int[] dp = new int[c + 1];  // dp[j]: side of the largest square ending at column j of this row
            int best = 0;
            for (int i = 0; i < r; i++) {
                String row = in.next();
                int diag = 0;  // dp of the cell up-left, from the previous row
                for (int j = 1; j <= c; j++) {
                    int up = dp[j];  // still the previous row's value
                    dp[j] = row.charAt(j - 1) == '1' ? 1 + Math.min(up, Math.min(dp[j - 1], diag)) : 0;
                    diag = up;
                    best = Math.max(best, dp[j]);
                }
            }
            System.out.println((long) best * best);
        }
    }
