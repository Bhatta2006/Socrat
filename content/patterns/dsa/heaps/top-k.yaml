id: dsa:heaps/top-k
concept: dsa:heaps
title: Top k with a size-k heap
tracks: [interview, competitive]
recognise:
  - Asks for the k largest, smallest, closest or most frequent items
  - Values arrive in a stream, or n is far larger than k
  - Sorting everything would work but costs O(n log n)
state: "a heap holding the best k items so far, with the weakest of them on top"
transition: "push the new item; if the heap holds k + 1 items, pop the top"
base_cases: ["empty heap", "fewer than k items: no k-th answer yet"]
complexity: {time: "O(n log k)", space: "O(k)"}
template:
  python: |
    import heapq
    import sys

    data = sys.stdin.read().split()
    n, k = int(data[0]), int(data[1])
    heap = []  # min-heap of the k largest values so far
    for x in map(int, data[2 : 2 + n]):
        heapq.heappush(heap, x)
        if len(heap) > k:
            heapq.heappop(heap)  # evict the weakest of the top k + 1
    print(heap[0])  # the k-th largest
  cpp: |
    #include <bits/stdc++.h>
    using namespace std;

    int main() {
        int n, k;
        cin >> n >> k;
        priority_queue<int, vector<int>, greater<int>> heap;  // min-heap of the k largest
        for (int i = 0; i < n; i++) {
            int x;
            cin >> x;
            heap.push(x);
            if ((int)heap.size() > k) heap.pop();  // evict the weakest
        }
        cout << heap.top() << "\n";  // the k-th largest
    }
  java: |
    import java.util.*;

    public class Solution {
        public static void main(String[] args) {
            Scanner in = new Scanner(System.in);
            int n = in.nextInt(), k = in.nextInt();
            PriorityQueue<Integer> heap = new PriorityQueue<>();  // min-heap of the k largest
            for (int i = 0; i < n; i++) {
                heap.add(in.nextInt());
                if (heap.size() > k) heap.poll();  // evict the weakest
            }
            System.out.println(heap.peek());  // the k-th largest
        }
    }
template_io: {stdin: "6 2\n3 2 1 5 6 4\n", expected: "5"}
