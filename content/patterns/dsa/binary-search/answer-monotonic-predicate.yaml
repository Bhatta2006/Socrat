id: dsa:binary-search/answer-monotonic-predicate
concept: dsa:binary-search
title: Binary search on the answer (monotone predicate)
tracks: [interview, competitive]
recognise:
  - Minimise or maximise a number subject to a yes/no feasibility check
  - The check only gets easier (or only harder) as the number grows
  - Trying every value is too slow, but one check is O(n)
state: "range [lo, hi] of candidate answers that still contains the best one"
transition: "if feasible(mid) then hi = mid (keep it) else lo = mid + 1"
base_cases: ["lo = smallest possible answer", "hi = a value that surely works"]
complexity: {time: "O(cost of check · log(range))", space: "O(1) beyond the check"}
template:
  python: |
    import sys

    data = sys.stdin.read().split()
    n, hours = int(data[0]), int(data[1])
    piles = list(map(int, data[2 : 2 + n]))

    def feasible(speed):  # monotone: true for every speed above the answer
        return sum((p + speed - 1) // speed for p in piles) <= hours

    lo, hi = 1, max(piles)  # hi surely works: one hour per pile
    while lo < hi:
        mid = (lo + hi) // 2
        if feasible(mid):
            hi = mid  # mid works; maybe something smaller does too
        else:
            lo = mid + 1  # mid fails, and so does everything below it
    print(lo)
  cpp: |
    #include <bits/stdc++.h>
    using namespace std;

    int main() {
        int n;
        long long hours;
        cin >> n >> hours;
        vector<long long> piles(n);
        for (auto& p : piles) cin >> p;
        auto feasible = [&](long long speed) {  // monotone in speed
            long long need = 0;
            for (long long p : piles) need += (p + speed - 1) / speed;
            return need <= hours;
        };
        long long lo = 1, hi = *max_element(piles.begin(), piles.end());
        while (lo < hi) {
            long long mid = lo + (hi - lo) / 2;
            if (feasible(mid)) hi = mid;  // keep a working speed
            else lo = mid + 1;            // discard a failing one
        }
        cout << lo << "\n";
    }
  java: |
    import java.util.*;

    public class Solution {
        public static void main(String[] args) {
            Scanner in = new Scanner(System.in);
            int n = in.nextInt();
            long hours = in.nextLong();
            long[] piles = new long[n];
            for (int i = 0; i < n; i++) piles[i] = in.nextLong();
            long lo = 1, hi = Arrays.stream(piles).max().getAsLong();
            while (lo < hi) {
                long mid = lo + (hi - lo) / 2, need = 0;
                for (long p : piles) need += (p + mid - 1) / mid;  // hours at speed mid
                if (need <= hours) hi = mid;  // keep a working speed
                else lo = mid + 1;            // discard a failing one
            }
            System.out.println(lo);
        }
    }
