id: dsa:binary-search/lower-upper-bound
concept: dsa:binary-search
title: Lower and upper bound (first index at least / greater than x)
tracks: [interview, competitive]
recognise:
  - Sorted data and a question about the first or last position of a value
  - Counting how many values fall in a range [a, b]
  - The answer may be "one past the end" when nothing qualifies
state: "half-open range [lo, hi): the answer is always inside it"
transition: "mid = (lo + hi) // 2; if a[mid] < x then lo = mid + 1 else hi = mid"
base_cases: ["lo = 0, hi = n", "stop when lo == hi: that is the answer"]
complexity: {time: "O(log n) per search", space: "O(1)"}
template:
  python: |
    import sys

    def lower_bound(a, x):  # first index with a[i] >= x
        lo, hi = 0, len(a)  # half-open: the answer is in [lo, hi]
        while lo < hi:
            mid = (lo + hi) // 2
            if a[mid] < x:
                lo = mid + 1  # mid is too small: the answer is right of it
            else:
                hi = mid  # mid may be the answer: keep it
        return lo

    data = sys.stdin.read().split()
    n, x = int(data[0]), int(data[1])
    a = list(map(int, data[2 : 2 + n]))
    low = lower_bound(a, x)
    high = lower_bound(a, x + 1)  # upper bound of x for integers
    print(low, high, high - low)
  cpp: |
    #include <bits/stdc++.h>
    using namespace std;

    int lowerBound(const vector<int>& a, int x) {  // first a[i] >= x
        int lo = 0, hi = (int)a.size();  // half-open range
        while (lo < hi) {
            int mid = lo + (hi - lo) / 2;
            if (a[mid] < x) lo = mid + 1;  // answer is right of mid
            else hi = mid;                 // mid may be the answer
        }
        return lo;
    }

    int main() {
        int n, x;
        cin >> n >> x;
        vector<int> a(n);
        for (int& v : a) cin >> v;
        int low = lowerBound(a, x), high = lowerBound(a, x + 1);
        cout << low << " " << high << " " << high - low << "\n";
    }
  java: |
    import java.util.*;

    public class Solution {
        static int lowerBound(int[] a, int x) {  // first a[i] >= x
            int lo = 0, hi = a.length;  // half-open range
            while (lo < hi) {
                int mid = lo + (hi - lo) / 2;
                if (a[mid] < x) lo = mid + 1;  // answer is right of mid
                else hi = mid;                 // mid may be the answer
            }
            return lo;
        }

        public static void main(String[] args) {
            Scanner in = new Scanner(System.in);
            int n = in.nextInt(), x = in.nextInt();
            int[] a = new int[n];
            for (int i = 0; i < n; i++) a[i] = in.nextInt();
            int low = lowerBound(a, x), high = lowerBound(a, x + 1);
            System.out.println(low + " " + high + " " + (high - low));
        }
    }
