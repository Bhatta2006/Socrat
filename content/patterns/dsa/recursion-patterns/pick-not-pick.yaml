id: dsa:recursion-patterns/pick-not-pick
concept: dsa:recursion-patterns
title: 'Pick or not pick: two branches per index, decide every index'
tracks:
- interview
- competitive
recognise:
- Subsequences, subsets or "choose some elements", where every element is in or out
- Count, list or optimise the choices under a condition such as a sum or a size
- n is small, around 20, because there are 2^n choices
state: ways(i, total) = the number of ways to finish choosing from index i, given the sum chosen so far
transition: ways(i, total) = ways(i + 1, total + a[i]) + ways(i + 1, total)
base_cases:
- i = n, every index decided; count 1 if total = k, else 0
complexity:
  time: O(2^n)
  space: O(n) recursion depth
template:
  python: |
    import sys

    data = sys.stdin.read().split()
    n, k = int(data[0]), int(data[1])
    a = [int(x) for x in data[2:2 + n]]


    def ways(i, total):  # ways to finish from index i, given the sum chosen so far
        if i == n:  # every element decided: is this one choice a hit?
            return 1 if total == k else 0
        take = ways(i + 1, total + a[i])  # pick a[i]
        skip = ways(i + 1, total)  # do not pick a[i]
        return take + skip


    print(ways(0, 0))
  cpp: |
    #include <iostream>
    #include <vector>
    using namespace std;

    int n;
    long long k;
    vector<long long> a;

    long long ways(int i, long long total) {  // ways to finish from index i, given the sum so far
        if (i == n) return total == k ? 1 : 0;  // every element decided: is this one choice a hit?
        long long take = ways(i + 1, total + a[i]);  // pick a[i]
        long long skip = ways(i + 1, total);  // do not pick a[i]
        return take + skip;
    }

    int main() {
        cin >> n >> k;
        a.resize(n);
        for (auto& x : a) cin >> x;
        cout << ways(0, 0) << "\n";
    }
  java: |
    import java.util.Scanner;

    public class Solution {
        static int n;
        static long k;
        static long[] a;

        static long ways(int i, long total) {  // ways to finish from index i, given the sum so far
            if (i == n) return total == k ? 1 : 0;  // every element decided: is this one choice a hit?
            long take = ways(i + 1, total + a[i]);  // pick a[i]
            long skip = ways(i + 1, total);  // do not pick a[i]
            return take + skip;
        }

        public static void main(String[] args) {
            Scanner in = new Scanner(System.in);
            n = in.nextInt();
            k = in.nextLong();
            a = new long[n];
            for (int i = 0; i < n; i++) a[i] = in.nextLong();
            System.out.println(ways(0, 0));
        }
    }
