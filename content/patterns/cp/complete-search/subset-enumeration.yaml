id: cp:complete-search/subset-enumeration
concept: cp:complete-search
title: Subset enumeration with bitmasks
tracks: [competitive, interview]
recognise:
  - Small n (about 20 or less) and a choice of which items to take
  - Every subset could be checked, and no smarter rule is obvious
  - Each item is either in or out, so one bit per item
state: "mask: bit i is 1 when item i is chosen"
transition: "for mask in 0..2^n − 1: build the subset from its bits and test it"
base_cases: ["mask 0 is the empty subset", "mask 2^n − 1 takes everything"]
complexity: {time: "O(2^n · n)", space: "O(1) beyond the input"}
template:
  python: |
    import sys

    data = list(map(int, sys.stdin.read().split()))
    n, weights = data[0], data[1 : 1 + data[0]]
    total = sum(weights)
    best = total
    for mask in range(1 << n):  # every subset is one mask
        group = 0
        for i in range(n):
            if mask >> i & 1:  # bit i set: apple i is in group one
                group += weights[i]
        best = min(best, abs(total - 2 * group))  # difference between the groups
    print(best)
  cpp: |
    #include <bits/stdc++.h>
    using namespace std;

    int main() {
        int n;
        cin >> n;
        vector<long long> w(n);
        long long total = 0;
        for (auto& x : w) { cin >> x; total += x; }
        long long best = total;
        for (int mask = 0; mask < (1 << n); mask++) {  // every subset
            long long group = 0;
            for (int i = 0; i < n; i++)
                if (mask >> i & 1) group += w[i];  // bit i: apple i in group one
            best = min(best, llabs(total - 2 * group));
        }
        cout << best << "\n";
    }
  java: |
    import java.util.*;

    public class Solution {
        public static void main(String[] args) {
            Scanner in = new Scanner(System.in);
            int n = in.nextInt();
            long[] w = new long[n];
            long total = 0;
            for (int i = 0; i < n; i++) { w[i] = in.nextLong(); total += w[i]; }
            long best = total;
            for (int mask = 0; mask < (1 << n); mask++) {  // every subset
                long group = 0;
                for (int i = 0; i < n; i++)
                    if ((mask >> i & 1) == 1) group += w[i];  // apple i in group one
                best = Math.min(best, Math.abs(total - 2 * group));
            }
            System.out.println(best);
        }
    }
template_io: {stdin: "5\n3 2 7 4 1\n", expected: "1"}
