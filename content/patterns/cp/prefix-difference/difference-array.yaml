id: cp:prefix-difference/difference-array
concept: cp:prefix-difference
title: Difference array (range additions, read at the end)
tracks: [competitive, interview]
recognise:
  - Many updates each add a value to a whole range of positions
  - Values are only needed after all updates are done
  - Updating every position would cost O(n) per update
state: "diff[i] = value[i] − value[i − 1]; a range addition changes only two cells"
transition: "add x to l..r: diff[l] += x, diff[r + 1] −= x; finally value[i] = running sum of diff"
base_cases: ["diff has n + 1 cells, all 0", "the running sum starts at 0"]
complexity: {time: "O(1) per update, O(n) to rebuild", space: "O(n)"}
template:
  python: |
    import sys

    data = list(map(int, sys.stdin.read().split()))
    n, q = data[0], data[1]
    diff = [0] * (n + 1)  # one spare cell for marks at r + 1 = n
    for j in range(q):
        l, r, x = data[2 + 3 * j : 5 + 3 * j]  # add x to positions l..r (0-based)
        diff[l] += x
        diff[r + 1] -= x  # cancel just after the range
    running, values = 0, []
    for i in range(n):
        running += diff[i]  # prefix sum turns marks into values
        values.append(running)
    print(*values)
  cpp: |
    #include <bits/stdc++.h>
    using namespace std;

    int main() {
        int n, q;
        cin >> n >> q;
        vector<long long> diff(n + 1, 0);  // spare cell for r + 1 = n
        while (q--) {
            int l, r;
            long long x;
            cin >> l >> r >> x;  // add x to positions l..r
            diff[l] += x;
            diff[r + 1] -= x;  // cancel just after the range
        }
        long long running = 0;
        for (int i = 0; i < n; i++) {
            running += diff[i];  // prefix sum
            cout << running << (i + 1 < n ? " " : "\n");
        }
    }
  java: |
    import java.util.*;

    public class Solution {
        public static void main(String[] args) {
            Scanner in = new Scanner(System.in);
            int n = in.nextInt(), q = in.nextInt();
            long[] diff = new long[n + 1];  // spare cell for r + 1 = n
            for (int j = 0; j < q; j++) {
                int l = in.nextInt(), r = in.nextInt();
                long x = in.nextLong();
                diff[l] += x;
                diff[r + 1] -= x;  // cancel just after the range
            }
            StringBuilder out = new StringBuilder();
            long running = 0;
            for (int i = 0; i < n; i++) {
                running += diff[i];  // prefix sum
                out.append(running).append(i + 1 < n ? " " : "");
            }
            System.out.println(out);
        }
    }
