id: cp:modular-arithmetic/fast-power
concept: cp:modular-arithmetic
title: Fast power (repeated squaring, mod m)
tracks: [competitive, interview]
recognise:
  - A huge exponent, often with the answer taken mod a prime
  - Counting where every one of n steps has the same number of choices
  - Division mod a prime, which needs b^(p − 2)
state: "result so far, b = base^(2^k) for the bit being read, e = bits not yet read"
transition: "if e is odd: result *= b; then b *= b, e //= 2 (all mod m)"
base_cases: ["result = 1", "b = base mod m"]
complexity: {time: "O(log e) multiplications", space: "O(1)"}
template:
  python: |
    import sys

    def power(base, e, mod):
        result, b = 1, base % mod  # b = base^(2^k) for the current bit
        while e > 0:
            if e & 1:  # this bit is 1: multiply its power in
                result = result * b % mod
            b = b * b % mod  # next bit: square
            e >>= 1
        return result

    base, e, mod = map(int, sys.stdin.read().split())
    print(power(base, e, mod))
  cpp: |
    #include <bits/stdc++.h>
    using namespace std;

    long long power(long long base, long long e, long long mod) {
        long long result = 1, b = base % mod;  // b = base^(2^k)
        while (e > 0) {
            if (e & 1) result = result * b % mod;  // bit is 1
            b = b * b % mod;  // next bit: square
            e >>= 1;
        }
        return result;
    }

    int main() {
        long long base, e, mod;
        cin >> base >> e >> mod;
        cout << power(base, e, mod) << "\n";
    }
  java: |
    import java.util.*;

    public class Solution {
        static long power(long base, long e, long mod) {
            long result = 1, b = base % mod;  // b = base^(2^k)
            while (e > 0) {
                if ((e & 1) == 1) result = result * b % mod;  // bit is 1
                b = b * b % mod;  // next bit: square
                e >>= 1;
            }
            return result;
        }

        public static void main(String[] args) {
            Scanner in = new Scanner(System.in);
            long base = in.nextLong(), e = in.nextLong(), mod = in.nextLong();
            System.out.println(power(base, e, mod));
        }
    }
