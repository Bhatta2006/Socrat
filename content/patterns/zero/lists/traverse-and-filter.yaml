id: zero:lists/traverse-and-filter
concept: zero:lists
title: Traverse and filter
tracks: [foundations]
recognise:
  - Visit every item of a list and keep only the ones that pass a test
  - The answer is a count, a total or a new list of the passing items
  - The test compares each item with a fixed value or a value known beforehand
state: "a result (count, total or list) built up as the loop visits each item"
transition: "for each item: if it passes the test, update the result"
base_cases: ["result starts at 0 (or an empty list) before the loop"]
complexity: {time: "O(n): one visit per item", space: "O(1), or O(k) for a list of k results"}
template:
  python: |
    import sys

    data = sys.stdin.read().split()
    n = int(data[0])
    values = list(map(int, data[1 : 1 + n]))
    total = sum(values)  # first pass: what is the average?
    count = 0
    for v in values:  # second pass: filter
        if v * n > total:  # v > average, without fractions
            count += 1
    print(count)
  cpp: |
    #include <bits/stdc++.h>
    using namespace std;

    int main() {
        int n;
        cin >> n;
        vector<long long> values(n);
        long long total = 0;
        for (auto& v : values) {  // first pass: read and add up
            cin >> v;
            total += v;
        }
        int count = 0;
        for (long long v : values)  // second pass: filter
            if (v * n > total) count++;  // v > average, without fractions
        cout << count << "\n";
    }
  java: |
    import java.util.*;

    public class Solution {
        public static void main(String[] args) {
            Scanner in = new Scanner(System.in);
            int n = in.nextInt();
            long[] values = new long[n];
            long total = 0;
            for (int i = 0; i < n; i++) {  // first pass: read and add up
                values[i] = in.nextLong();
                total += values[i];
            }
            int count = 0;
            for (long v : values)  // second pass: filter
                if (v * n > total) count++;  // v > average, without fractions
            System.out.println(count);
        }
    }
template_io: {stdin: "5\n1 2 3 4 10\n", expected: "1"}
