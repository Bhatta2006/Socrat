id: zero:for-loops/accumulator
concept: zero:for-loops
title: Accumulator loop
tracks: [foundations]
recognise:
  - Combine many values into one result, such as a total, count or product
  - The result starts at a neutral value before the loop
  - Every pass updates the result with the current value
state: "an accumulator that holds the combined result of the values seen so far"
transition: "total = total + current (or *, or +1 for a count)"
base_cases: ["sum and count start at 0", "product starts at 1"]
complexity: {time: "O(n) for n values", space: "O(1)"}
template:
  python: |
    import sys

    n = int(sys.stdin.readline())
    total = 0  # neutral start for a sum
    product = 1  # neutral start for a product
    for i in range(1, n + 1):  # n + 1: the stop value is excluded
        total += i  # add the current value
        product *= i
    print(total, product)
  cpp: |
    #include <bits/stdc++.h>
    using namespace std;

    int main() {
        int n;
        cin >> n;
        long long total = 0;    // neutral start for a sum
        long long product = 1;  // neutral start for a product
        for (int i = 1; i <= n; i++) {  // <= n: include n itself
            total += i;
            product *= i;
        }
        cout << total << " " << product << "\n";
    }
  java: |
    import java.util.*;

    public class Solution {
        public static void main(String[] args) {
            int n = new Scanner(System.in).nextInt();
            long total = 0;    // neutral start for a sum
            long product = 1;  // neutral start for a product
            for (int i = 1; i <= n; i++) {  // <= n: include n itself
                total += i;
                product *= i;
            }
            System.out.println(total + " " + product);
        }
    }
template_io: {stdin: "5\n", expected: "15 120"}
variants:
  - {id: running-sum, band: 1, title: "Running sum of a list", problem: "leetcode:running-sum-of-1d-array"}
  - {id: sum-of-multiples, band: 2, title: "Sum of multiples (native)", problem: sum-of-multiples}
  - {id: highest-altitude, band: 2, title: "Highest point of a hike", problem: "leetcode:find-the-highest-altitude"}
  - {id: digit-sum, band: 3, title: "Sum of digits (native)", problem: digit-sum}
  - {id: product-minus-sum, band: 3, title: "Product minus sum of digits", problem: "leetcode:subtract-the-product-and-sum-of-digits-of-an-integer"}
  - {id: leetcode-bank, band: 4, title: "Weekly savings plan", problem: "leetcode:calculate-money-in-leetcode-bank"}
pitfalls: [accumulator-init-one, overwrite-not-accumulate, loop-bound-off-by-one]
