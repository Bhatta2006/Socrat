id: zero:operators-and-expressions/division-and-modulo
concept: zero:operators-and-expressions
title: 'Division and modulo: whole groups, then what is left'
tracks:
- foundations
recognise:
- Convert a total into bigger and smaller units, such as seconds into hours, minutes and seconds
- How many whole groups is division; how many are left over is the remainder
- Anything that repeats in cycles, such as days of the week or even and odd
state: what is left of the total after the bigger units have been taken out
transition: unit count = left // unit size; left = left % unit size
base_cases:
- the smallest unit is simply what is left at the end
complexity:
  time: O(1) per unit
  space: O(1)
template:
  python: |
    t = int(input())
    h = t // 3600  # whole hours
    m = t % 3600 // 60  # whole minutes in what is left after the hours
    s = t % 60  # seconds left over
    print(h, m, s)
  cpp: |
    #include <iostream>
    using namespace std;

    int main() {
        long long t;
        cin >> t;
        long long h = t / 3600;  // whole hours (whole-number division between integers)
        long long m = t % 3600 / 60;  // whole minutes in what is left after the hours
        long long s = t % 60;  // seconds left over
        cout << h << " " << m << " " << s << "\n";
    }
  java: |
    import java.util.Scanner;

    public class Solution {
        public static void main(String[] args) {
            long t = new Scanner(System.in).nextLong();
            long h = t / 3600;  // whole hours (whole-number division between integers)
            long m = t % 3600 / 60;  // whole minutes in what is left after the hours
            long s = t % 60;  // seconds left over
            System.out.println(h + " " + m + " " + s);
        }
    }
