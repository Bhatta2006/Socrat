id: zero:strings/frequency-count
concept: zero:strings
title: Frequency count (one counter per kind)
tracks: [foundations]
recognise:
  - Asks how often each letter, word or value occurs
  - Answers like most common, appears once, or same counts in both
  - Each kind of item needs its own counter, filled in one pass
state: "counts[kind] = how many times that kind has been seen so far"
transition: "for each item: counts[its kind] += 1"
base_cases: ["every counter starts at 0"]
complexity: {time: "O(n) for n items", space: "O(k) for k kinds (26 letters)"}
template:
  python: |
    import sys

    text = sys.stdin.readline().strip()
    counts = [0] * 26  # counts[i] = how often letter chr(ord('a') + i) appears
    for ch in text:
        counts[ord(ch) - ord("a")] += 1
    best = 0
    for i in range(26):  # a to z, so ties go to the earlier letter
        if counts[i] > counts[best]:
            best = i
    print(chr(ord("a") + best), counts[best])
  cpp: |
    #include <bits/stdc++.h>
    using namespace std;

    int main() {
        string text;
        cin >> text;
        int counts[26] = {0};  // one counter per letter
        for (char ch : text) counts[ch - 'a']++;
        int best = 0;
        for (int i = 0; i < 26; i++)  // a to z: ties go to the earlier letter
            if (counts[i] > counts[best]) best = i;
        cout << char('a' + best) << " " << counts[best] << "\n";
    }
  java: |
    import java.util.*;

    public class Solution {
        public static void main(String[] args) {
            String text = new Scanner(System.in).next();
            int[] counts = new int[26];  // one counter per letter
            for (char ch : text.toCharArray()) counts[ch - 'a']++;
            int best = 0;
            for (int i = 0; i < 26; i++)  // a to z: ties go to the earlier letter
                if (counts[i] > counts[best]) best = i;
            System.out.println((char) ('a' + best) + " " + counts[best]);
        }
    }
template_io: {stdin: "banana\n", expected: "a 3"}
