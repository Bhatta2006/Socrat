id: zero:searching-and-sorting/simple-sorts
concept: zero:searching-and-sorting
title: 'Bubble sort: passes of neighbour swaps until nothing moves'
tracks:
- foundations
recognise:
- Put the values in order, writing or tracing the sort yourself
- Questions such as "what does the list look like after two passes?" or "how many swaps?"
- Each pass swaps neighbours that are out of order
state: after p passes, the largest p values sit in their final places at the end
transition: one pass compares a[j] and a[j + 1] for j below n − 1 − p and swaps them when out of order
base_cases:
- a pass with no swaps means the list is sorted
complexity:
  time: O(n²) in the worst case, O(n) on a sorted list
  space: O(1)
template:
  python: |
    n = int(input())
    a = list(map(int, input().split()))
    for p in range(n - 1):  # after pass p, the last p + 1 values are in place
        swapped = False
        for j in range(n - 1 - p):
            if a[j] > a[j + 1]:  # neighbours out of order: swap them
                a[j], a[j + 1] = a[j + 1], a[j]
                swapped = True
        if not swapped:
            break  # a pass with no swaps means the list is sorted
    print(" ".join(map(str, a)))
  cpp: |
    #include <iostream>
    #include <vector>
    using namespace std;

    int main() {
        int n;
        cin >> n;
        vector<int> a(n);
        for (auto& v : a) cin >> v;
        for (int p = 0; p < n - 1; p++) {  // after pass p, the last p + 1 values are in place
            bool swapped = false;
            for (int j = 0; j < n - 1 - p; j++)
                if (a[j] > a[j + 1]) {  // neighbours out of order: swap them
                    swap(a[j], a[j + 1]);
                    swapped = true;
                }
            if (!swapped) break;  // a pass with no swaps means the list is sorted
        }
        for (int i = 0; i < n; i++) cout << a[i] << (i + 1 < n ? " " : "\n");
    }
  java: |
    import java.util.Scanner;

    public class Solution {
        public static void main(String[] args) {
            Scanner in = new Scanner(System.in);
            int n = in.nextInt();
            int[] a = new int[n];
            for (int i = 0; i < n; i++) a[i] = in.nextInt();
            for (int p = 0; p < n - 1; p++) {  // after pass p, the last p + 1 values are in place
                boolean swapped = false;
                for (int j = 0; j < n - 1 - p; j++)
                    if (a[j] > a[j + 1]) {  // neighbours out of order: swap them
                        int t = a[j]; a[j] = a[j + 1]; a[j + 1] = t;
                        swapped = true;
                    }
                if (!swapped) break;  // a pass with no swaps means the list is sorted
            }
            StringBuilder out = new StringBuilder();
            for (int i = 0; i < n; i++) out.append(a[i]).append(i + 1 < n ? " " : "\n");
            System.out.print(out);
        }
    }
