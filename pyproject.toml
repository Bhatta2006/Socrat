[project]
name = "socrat-platform"
version = "0.1.0"
requires-python = ">=3.12,<3.14"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn>=0.34,<1", "sqlalchemy>=2.0,<3",
  "alembic>=1.15,<2", "psycopg[binary]>=3.2,<4", "pydantic-settings>=2.8,<3",
  "authlib>=1.6,<2", "httpx>=0.28,<1", "itsdangerous>=2.2,<3",
  "prometheus-client>=0.21,<1", "tzdata>=2025.1"
]

[dependency-groups]
dev = [
    "pytest>=8,<10",
    "pytest-cov>=7.1.0,<8",
    "ruff>=0.11,<1",
    "mypy>=1.15,<2",
    "pip-audit>=2.8,<3",
    "pyyaml>=6.0.3,<7",
]

[tool.pytest.ini_options]
pythonpath = ["services/api/src"]
testpaths = ["services/api/tests"]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["services/api/src"]
exclude = ["skills", ".agents", "node_modules", ".venv"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501", "B008"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
check_untyped_defs = true

