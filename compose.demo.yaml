name: socrat-demo

x-environment: &environment
  SOCRAT_DATABASE_URL: postgresql+psycopg://socrat:demo-local-only@postgres:5432/socrat
  SOCRAT_ENVIRONMENT: development
  SOCRAT_DEMO_MODE: "true"
  SOCRAT_PUBLIC_ORIGIN: http://localhost:3000
  SOCRAT_DEV_LOGIN_ENABLED: "true"
  SOCRAT_ONBOARDING_ENABLED: "true"
  SOCRAT_DIAGNOSTICS_ENABLED: "true"
  SOCRAT_PLANNING_ENABLED: "true"
  SOCRAT_LEARNING_SESSIONS_ENABLED: "true"
  SOCRAT_ASSESSMENTS_ENABLED: "true"
  SOCRAT_DASHBOARD_ENABLED: "true"
  SOCRAT_REMINDERS_ENABLED: "true"
  SOCRAT_TUTOR_ENABLED: "true"
  SOCRAT_TUTOR_MODEL_ENABLED: "false"
  SOCRAT_EXECUTION_ENABLED: "true"
  SOCRAT_EXECUTION_BACKEND: demo_docker
  SOCRAT_EXECUTION_PROFILES: ${SOCRAT_EXECUTION_PROFILES:?Run npm run demo to build immutable local runtimes}
  SOCRAT_EXECUTION_SIGNING_SECRET: ${SOCRAT_EXECUTION_SIGNING_SECRET:?Generated by npm run demo}
  SOCRAT_EXECUTION_WORKER_SECRET: ${SOCRAT_EXECUTION_WORKER_SECRET:?Generated by npm run demo}
  PYTHONPATH: /app/services/api/src:/app/services/execution/src

services:
  postgres:
    profiles: [demo]
    image: postgres:17-alpine
    environment: { POSTGRES_DB: socrat, POSTGRES_USER: socrat, POSTGRES_PASSWORD: demo-local-only }
    volumes: [demo-data:/var/lib/postgresql/data]
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U socrat -d socrat"]
      interval: 3s
      timeout: 3s
      retries: 30
  migrate:
    profiles: [demo]
    build: { context: ., dockerfile: services/api/Dockerfile }
    environment: *environment
    command: [alembic, upgrade, head]
    depends_on: { postgres: { condition: service_healthy } }
  seed:
    profiles: [demo]
    build: { context: ., dockerfile: services/api/Dockerfile }
    environment: *environment
    command: [python, -m, socrat.demo.seed]
    depends_on: { migrate: { condition: service_completed_successfully } }
  api:
    profiles: [demo]
    build: { context: ., dockerfile: services/api/Dockerfile }
    environment: *environment
    depends_on: { seed: { condition: service_completed_successfully } }
    ports: [127.0.0.1:8000:8000]
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health/ready')"]
      interval: 3s
      timeout: 3s
      retries: 30
  worker:
    profiles: [demo]
    build: { context: ., dockerfile: services/api/Dockerfile }
    environment: *environment
    command: [python, -m, socrat.worker]
    depends_on: { api: { condition: service_healthy } }
  runner:
    profiles: [demo]
    build: { context: ., dockerfile: services/execution/Demo.Dockerfile }
    environment:
      <<: *environment
      SOCRAT_EXECUTION_API_URL: http://api:8000
      SOCRAT_EXECUTION_WORKER_ID: demo-desktop
    # The control worker talks to Docker. Learner containers created by it have
    # no socket, host mounts, network, writable root, capabilities, or host user.
    volumes: [/var/run/docker.sock:/var/run/docker.sock]
    command: [python, -m, runner.worker]
    depends_on: { api: { condition: service_healthy } }
    restart: on-failure
  web:
    profiles: [demo]
    build: { context: ., dockerfile: apps/web/Dockerfile }
    environment: { API_INTERNAL_URL: "http://api:8000" }
    ports: [127.0.0.1:3000:3000]
    depends_on: { api: { condition: service_healthy }, runner: { condition: service_started } }

volumes:
  demo-data:
