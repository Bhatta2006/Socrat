global:
  scrape_interval: 30s
  evaluation_interval: 30s
  external_labels:
    environment: staging

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: socrat-api
    metrics_path: /api/metrics
    authorization:
      type: Bearer
      credentials_file: /run/secrets/metrics_token
    static_configs:
      - targets: ["api:8000"]
