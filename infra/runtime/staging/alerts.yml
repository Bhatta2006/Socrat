groups:
  - name: socrat-api
    rules:
      - alert: SocratApiUnavailable
        expr: up{job="socrat-api"} == 0
        for: 2m
        labels:
          severity: page
        annotations:
          summary: Socrat staging API is unavailable
          runbook: docs/operations/m1-staging-runbook.md#api-unavailable

      - alert: SocratHighServerErrorRate
        expr: |
          sum(rate(socrat_http_requests_total{job="socrat-api",status=~"5.."}[5m]))
          /
          clamp_min(sum(rate(socrat_http_requests_total{job="socrat-api"}[5m])), 0.001)
          > 0.05
        for: 10m
        labels:
          severity: ticket
        annotations:
          summary: Socrat staging API 5xx ratio exceeds five percent
          runbook: docs/operations/m1-staging-runbook.md#high-server-error-rate

      - alert: SocratHighLatency
        expr: |
          histogram_quantile(
            0.95,
            sum by (le) (rate(socrat_http_duration_seconds_bucket{job="socrat-api"}[5m]))
          ) > 1
        for: 10m
        labels:
          severity: ticket
        annotations:
          summary: Socrat staging API p95 latency exceeds one second
          runbook: docs/operations/m1-staging-runbook.md#high-latency

      - alert: SocratDiagnosticContentBlocked
        expr: sum(socrat_diagnostic_sessions{status=~"blocked_content|blocked_runtime"}) > 0
        for: 10m
        labels:
          severity: ticket
        annotations:
          summary: A diagnostic needs content or runtime review
          runbook: docs/operations/m4-diagnostics.md#blocked-diagnostics

      - alert: SocratDiagnosticReviewBacklog
        expr: sum(socrat_diagnostic_sessions{status="pending_review"}) > 10
        for: 30m
        labels:
          severity: ticket
        annotations:
          summary: Diagnostic qualitative review backlog exceeds ten sessions
          runbook: docs/operations/m4-diagnostics.md#pending-review
