#cloud-config
package_update: true
package_upgrade: true
packages:
  - ca-certificates
  - curl
  - docker.io
  - docker-compose-v2
  - unattended-upgrades

write_files:
  - path: /etc/sysctl.d/60-learning-platform.conf
    permissions: "0644"
    content: |
      net.ipv4.conf.all.accept_redirects=0
      net.ipv4.conf.default.accept_redirects=0
      net.ipv4.conf.all.send_redirects=0
      net.ipv4.conf.default.send_redirects=0
      kernel.unprivileged_bpf_disabled=1
  - path: /etc/learning-platform/README
    permissions: "0600"
    content: |
      Runtime secrets and deployment manifests are installed by the protected deployment workflow.
      They are deliberately absent from Terraform state and instance metadata.

runcmd:
  - [mkdir, -p, /opt/learning-platform/releases, /opt/learning-platform/shared, /var/lib/learning-platform/postgres]
  - [chmod, "0700", /opt/learning-platform/shared, /var/lib/learning-platform/postgres]
  - [systemctl, enable, --now, docker]
  - [systemctl, enable, --now, unattended-upgrades]
  - [sysctl, --system]
  - [ufw, default, deny, incoming]
  - [ufw, default, allow, outgoing]
  - [ufw, allow, OpenSSH]
  - [ufw, allow, "80/tcp"]
  - [ufw, allow, "443/tcp"]
  - [ufw, --force, enable]

final_message: "Staging host baseline is ready. Application deployment remains a separate authenticated release step."
