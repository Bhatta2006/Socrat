name: e2e-nightly

# Repeats the browser journeys to surface flaky waits that a single CI run can hide.
on:
  schedule:
    - cron: "41 2 * * *"  # daily 02:41 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  repeat:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.12.20"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "24"
          cache: npm
      - run: uv sync --frozen
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      # No retries: a test that needs one is the flake this job exists to find.
      - run: npm run test:e2e -- --workers=1 --repeat-each=5 --retries=0 tests/e2e/learner-journey.spec.ts
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: failure()
        with:
          name: e2e-nightly-traces
          path: test-results/
