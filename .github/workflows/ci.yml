name: continuous-integration

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  verify:
    runs-on: ubuntu-latest
    env:
      POSTGRES_PASSWORD: ci-only-password
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          version: "0.12.20"
          enable-cache: true
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "24"
          cache: npm
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4
        with:
          terraform_version: "1.16.4"
      - run: uv sync --frozen
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Start the CI database
        run: docker compose up --detach --wait postgres
      - run: uv run ruff format --check services/api
      - run: uv run ruff check services/api
      - run: uv run mypy services/api/src
      - run: uv run pytest --cov=socrat --cov-report=term-missing --cov-fail-under=85
      - run: uv run alembic upgrade head
        env:
          SOCRAT_DATABASE_URL: postgresql+psycopg://socrat:ci-only-password@127.0.0.1:5432/socrat
      - name: Exercise PostgreSQL backup and restore
        shell: bash
        run: |
          archive="$(bash scripts/operations/backup-postgres.sh --output-directory .cache/ci-backups)"
          bash scripts/operations/restore-smoke.sh --archive "$archive"
      - run: npm run typecheck
      - run: npm run build
      - run: docker build --file services/api/Dockerfile --tag socrat-api:ci .
      - run: docker build --file apps/web/Dockerfile --tag socrat-web:ci .
      - run: npm run test:m0
      - shell: pwsh
        run: ./scripts/validation/test-m0-contracts.ps1
      - run: npm run test:e2e -- --workers=1
      - run: uv run pip-audit
      - run: npm audit --audit-level=high
      - name: Create non-secret staging validation fixtures
        shell: bash
        run: |
          mkdir -p "$GITHUB_WORKSPACE/.cache/ci-secrets"
          printf '%s' 'ci-database-password' > "$GITHUB_WORKSPACE/.cache/ci-secrets/postgres_password"
          printf '%s' 'ci-session-secret-at-least-thirty-two-characters' > "$GITHUB_WORKSPACE/.cache/ci-secrets/session_secret"
          printf '%s' 'ci-oidc-client-secret' > "$GITHUB_WORKSPACE/.cache/ci-secrets/oidc_client_secret"
          printf '%s' 'ci-metrics-token' > "$GITHUB_WORKSPACE/.cache/ci-secrets/metrics_token"
          printf '%s' 'ci-grafana-password' > "$GITHUB_WORKSPACE/.cache/ci-secrets/grafana_admin_password"
      - name: Validate the production Compose model
        env:
          SOCRAT_API_IMAGE: ghcr.io/bhatta2006/socrat-api@sha256:aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
          SOCRAT_WEB_IMAGE: ghcr.io/bhatta2006/socrat-web@sha256:bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb
          SOCRAT_SECRETS_DIR: ${{ github.workspace }}/.cache/ci-secrets
          STAGING_HOST: staging.example.test
          TLS_EMAIL: operations@example.test
          SOCRAT_OIDC_ISSUER: https://identity.example.test
          SOCRAT_OIDC_CLIENT_ID: ci-client
        run: docker compose -f infra/runtime/staging/compose.yaml config --quiet
      - name: Validate Prometheus configuration and alert rules
        shell: bash
        run: |
          docker run --rm \
            --entrypoint /bin/promtool \
            --volume "$PWD/infra/runtime/staging:/etc/prometheus:ro" \
            --volume "$PWD/.cache/ci-secrets:/run/secrets:ro" \
            prom/prometheus:v3.15.0@sha256:efd719c99d83b060d9daefdcf00360461adf279f45ef5391f8d111892118753e \
            check config /etc/prometheus/prometheus.yml
          docker run --rm \
            --entrypoint /bin/promtool \
            --volume "$PWD/infra/runtime/staging:/etc/prometheus:ro" \
            prom/prometheus:v3.15.0@sha256:efd719c99d83b060d9daefdcf00360461adf279f45ef5391f8d111892118753e \
            check rules /etc/prometheus/alerts.yml
      - name: Validate the TLS reverse-proxy configuration
        run: >-
          docker run --rm
          --env STAGING_HOST=staging.example.test
          --env TLS_EMAIL=operations@example.test
          --volume "${{ github.workspace }}/infra/runtime/staging/Caddyfile:/etc/caddy/Caddyfile:ro"
          caddy:2.11.4-alpine@sha256:6aeddd44c3078b0f9a35206472a11420648a79c184603ef95957d0a20044cb2b
          caddy validate --config /etc/caddy/Caddyfile --adapter caddyfile
      - run: terraform fmt -check -recursive infra/oci
      - run: terraform -chdir=infra/oci/environments/staging init -backend=false
      - run: terraform -chdir=infra/oci/environments/staging validate
      - run: terraform -chdir=infra/oci/modules/staging-foundation init -backend=false
      - run: terraform -chdir=infra/oci/modules/staging-foundation test
      - name: Stop the CI database
        if: always()
        run: docker compose down --volumes --remove-orphans

  publish-images:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [secret-scan, verify]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and publish API image
        id: api
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: services/api/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ghcr.io/bhatta2006/socrat-api:sha-${{ github.sha }}
      - name: Attest API image
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-name: ghcr.io/bhatta2006/socrat-api
          subject-digest: ${{ steps.api.outputs.digest }}
          push-to-registry: true
      - name: Build and publish web image
        id: web
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: apps/web/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ghcr.io/bhatta2006/socrat-web:sha-${{ github.sha }}
      - name: Attest web image
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-name: ghcr.io/bhatta2006/socrat-web
          subject-digest: ${{ steps.web.outputs.digest }}
          push-to-registry: true
