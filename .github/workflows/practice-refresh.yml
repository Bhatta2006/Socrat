name: practice-index-refresh

# Monthly re-import of the public practice index (metadata and links only). Opens a PR
# with a diff report so a human reviews additions, removals and rating changes first.
on:
  schedule:
    - cron: "23 3 2 * *"  # 2nd of each month, 03:23 UTC
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          version: "0.12.20"
      - run: uv sync --frozen
      - run: uv run python scripts/content/import_practice.py --fetch
      - name: Diff report
        run: uv run python scripts/content/practice_diff.py | tee .cache/practice-diff.md >> "$GITHUB_STEP_SUMMARY"
      - name: Open a review PR when the index changed
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if git diff --quiet -- content/practice; then
            echo "Practice index unchanged." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          branch="practice-refresh/$(date -u +%Y-%m)"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$branch"
          git add content/practice
          git commit -m "chore(practice): monthly index refresh $(date -u +%Y-%m)"
          git push --force origin "$branch"
          gh pr create --base "${{ github.event.repository.default_branch }}" --head "$branch" \
            --title "Practice index refresh $(date -u +%Y-%m)" --body-file .cache/practice-diff.md \
            || echo "A PR for $branch already exists; its branch was updated."
